name: Run OpenCode with NVIDIA retry
description: Run one bounded OpenCode/NVIDIA attempt, one 503 retry, and at most one evidence-format repair.

inputs:
  nvidia_api_key:
    description: NVIDIA API key
    required: true
  issue_number:
    description: GitHub issue number
    required: true
  prompt:
    description: Role-specific OpenCode prompt
    required: true
  model:
    description: OpenCode model selection
    required: false
    default: nvidia/nvidia/nemotron-3-super-120b-a12b
  retry_wait_seconds:
    description: Wait before the single NVIDIA 503 retry
    required: false
    default: "60"
  metrics_ledger_issue:
    description: Central GitHub issue used to anchor NVIDIA run identity and repair metrics
    required: false
    default: "79"

outputs:
  final_outcome:
    description: success or failure after the bounded primary/503 attempt
    value: ${{ steps.finish.outputs.final_outcome }}
  retry_used:
    description: true when the NVIDIA 503 retry was used
    value: ${{ steps.finish.outputs.retry_used }}
  evidence_repair_used:
    description: true when one bounded evidence-format repair was attempted
    value: ${{ steps.evidence_check.outputs.repair_needed }}
  evidence_repair_valid:
    description: true when the post-repair evidence passes local structural/source validation
    value: ${{ steps.repair_check.outputs.valid }}

runs:
  using: composite
  steps:
    - name: Select role safety mode
      id: role_mode
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        LABELS="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${{ inputs.issue_number }}" --jq '.labels[].name')"
        ROLE=""
        if printf '%s\n' "$LABELS" | grep -Fxq 'ai-role-reviewer'; then
          ROLE="reviewer"
        elif printf '%s\n' "$LABELS" | grep -Fxq 'ai-role-tester'; then
          ROLE="tester"
        else
          echo "Unsupported NVIDIA role: only Reviewer and Tester are executable." >&2
          exit 1
        fi

        echo "role=${ROLE}" >> "$GITHUB_OUTPUT"
        echo "agent=plan" >> "$GITHUB_OUTPUT"
        echo "use_github_token=true" >> "$GITHUB_OUTPUT"
        printf '%s\n' '/*' >> .git/info/exclude

    - name: Prepare isolated read-only verification worktree
      shell: bash
      run: |
        set -euo pipefail

        # Reviewers/Testers must be able to inspect exact historical candidate SHAs.
        if git rev-parse --is-shallow-repository 2>/dev/null | grep -Fxq true; then
          git fetch --unshallow --no-tags origin
        else
          git fetch --no-tags origin
        fi

        if [ -f package.json ]; then
          npm install --no-save --package-lock=false --ignore-scripts
        fi

        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "Read-only NVIDIA setup changed tracked repository content." >&2
          git status --short >&2
          exit 1
        fi

        git ls-files -z | xargs -0 -r git update-index --skip-worktree
        if [ -n "$(git status --porcelain)" ]; then
          echo "Read-only NVIDIA worktree is not clean before OpenCode execution." >&2
          git status --short >&2
          exit 1
        fi

    - name: Record first attempt start time
      id: attempt_start
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        echo "started_at=${STARTED_AT}" >> "$GITHUB_OUTPUT"
        RUN_MARKER="AI AUXILIARY RUN: run_id=${GITHUB_RUN_ID} run_attempt=${GITHUB_RUN_ATTEMPT} issue=${{ inputs.issue_number }} role=${{ steps.role_mode.outputs.role }} model=${{ inputs.model }} started_at=${STARTED_AT}"
        gh issue comment "${{ inputs.issue_number }}" --repo "${GITHUB_REPOSITORY}" --body "$RUN_MARKER" >/dev/null
        gh issue comment "${{ inputs.metrics_ledger_issue }}" --repo "${GITHUB_REPOSITORY}" --body "$RUN_MARKER" >/dev/null

    - name: Run OpenCode
      id: opencode_first
      continue-on-error: true
      uses: anomalyco/opencode/github@latest
      env:
        NVIDIA_API_KEY: ${{ inputs.nvidia_api_key }}
        GITHUB_TOKEN: ${{ github.token }}
      with:
        model: ${{ inputs.model }}
        agent: ${{ steps.role_mode.outputs.agent }}
        use_github_token: ${{ steps.role_mode.outputs.use_github_token }}
        prompt: |
          EVIDENCE CONTRACT — FIRST PRIORITY. Keep the terminal evidence compact and machine-checkable.
          Before any final PASS/FAIL/CHANGES REQUESTED, verify 1 to 3 exact repository sources.
          A successful terminal evidence comment must start with the role marker, contain 1 to 3 lines in the exact form `SOURCE: relative/path :: exact literal token`, contain exactly one `GROUNDING: VERIFIED`, contain exactly one role-valid `VERDICT:`, and must not use Markdown fences.
          If exact grounding is impossible, use `AI-HANDOFF:` instead of guessing.

          ${{ inputs.prompt }}

    - name: Check whether failure was NVIDIA 503
      id: retry_check
      if: steps.opencode_first.outcome == 'failure'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        COMMENTS_JSON="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${{ inputs.issue_number }}/comments?per_page=100" | jq -s 'add')"
        LAST_BOT_COMMENT="$(printf '%s' "$COMMENTS_JSON" | jq -r --arg start "${{ steps.attempt_start.outputs.started_at }}" '[.[] | select(.created_at >= $start) | select(.user.login == "opencode-agent[bot]" or .user.login == "github-actions[bot]")] | last | .body // ""')"
        if printf '%s' "$LAST_BOT_COMMENT" | grep -Eq 'Service temporarily overloaded|"code"[[:space:]]*:[[:space:]]*503|HTTP[[:space:]]+503'; then
          echo "retry_503=true" >> "$GITHUB_OUTPUT"
        else
          echo "retry_503=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Wait and reset before NVIDIA 503 retry
      if: steps.retry_check.outputs.retry_503 == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        gh issue comment "${{ inputs.issue_number }}" --repo "${GITHUB_REPOSITORY}" --body "AI AUXILIARY RETRY: run_id=${GITHUB_RUN_ID} run_attempt=${GITHUB_RUN_ATTEMPT} role=${{ steps.role_mode.outputs.role }} reason=nvidia-http-503" >/dev/null
        sleep "${{ inputs.retry_wait_seconds }}"
        git ls-files -z | xargs -0 -r git update-index --no-skip-worktree
        git reset --hard
        git clean -fd
        git checkout -B main origin/main
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "NVIDIA retry reset did not restore a clean tracked worktree." >&2
          exit 1
        fi
        git ls-files -z | xargs -0 -r git update-index --skip-worktree
        if [ -n "$(git status --porcelain)" ]; then
          echo "Read-only NVIDIA retry worktree is not clean." >&2
          exit 1
        fi

    - name: Retry OpenCode after NVIDIA 503
      id: opencode_retry
      if: steps.retry_check.outputs.retry_503 == 'true'
      continue-on-error: true
      uses: anomalyco/opencode/github@latest
      env:
        NVIDIA_API_KEY: ${{ inputs.nvidia_api_key }}
        GITHUB_TOKEN: ${{ github.token }}
      with:
        model: ${{ inputs.model }}
        agent: ${{ steps.role_mode.outputs.agent }}
        use_github_token: ${{ steps.role_mode.outputs.use_github_token }}
        prompt: |
          This is the single clean retry after NVIDIA HTTP 503 Service temporarily overloaded.

          ${{ inputs.prompt }}

    - name: Validate first terminal evidence and decide one repair
      id: evidence_check
      env:
        GH_TOKEN: ${{ github.token }}
        ROLE: ${{ steps.role_mode.outputs.role }}
        STARTED_AT: ${{ steps.attempt_start.outputs.started_at }}
        FIRST_OUTCOME: ${{ steps.opencode_first.outcome }}
        RETRY_503: ${{ steps.retry_check.outputs.retry_503 }}
        RETRY_OUTCOME: ${{ steps.opencode_retry.outcome }}
      shell: bash
      run: |
        set -euo pipefail
        echo "repair_needed=false" >> "$GITHUB_OUTPUT"
        echo "valid=false" >> "$GITHUB_OUTPUT"
        BASE_SUCCESS=false
        if [ "$FIRST_OUTCOME" = "success" ]; then BASE_SUCCESS=true; elif [ "$RETRY_503" = "true" ] && [ "$RETRY_OUTCOME" = "success" ]; then BASE_SUCCESS=true; fi
        [ "$BASE_SUCCESS" = true ] || exit 0
        case "$ROLE" in
          reviewer) PREFIX="AI REVIEW EVIDENCE:"; VERDICT_RE='^(PASS|CHANGES REQUESTED)$' ;;
          tester) PREFIX="AI TEST EVIDENCE:"; VERDICT_RE='^(PASS|FAIL)$' ;;
          *) exit 0 ;;
        esac
        COMMENTS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${{ inputs.issue_number }}/comments?per_page=100" | jq -s 'add')"
        LAST_BOT_BODY="$(printf '%s' "$COMMENTS" | jq -r --arg start "$STARTED_AT" '[.[] | select(.created_at >= $start) | select(.user.login == "opencode-agent[bot]" or .user.login == "github-actions[bot]")] | last | .body // ""')"
        if printf '%s\n' "$LAST_BOT_BODY" | grep -q '^AI-HANDOFF:'; then exit 0; fi
        validate_evidence() {
          local body="$1" source_count verdict source_line entry path needle
          printf '%s\n' "$body" | head -n 1 | grep -Fxq "$PREFIX" || return 1
          ! printf '%s\n' "$body" | grep -q '^```' || return 1
          [ "$(printf '%s\n' "$body" | grep -Fc 'GROUNDING: VERIFIED')" -eq 1 ] || return 1
          verdict="$(printf '%s\n' "$body" | sed -n 's/^VERDICT:[[:space:]]*//p')"
          [ "$(printf '%s\n' "$verdict" | wc -l)" -eq 1 ] || return 1
          printf '%s\n' "$verdict" | grep -Eq "$VERDICT_RE" || return 1
          source_count="$(printf '%s\n' "$body" | grep -c '^SOURCE: ' || true)"
          [ "$source_count" -ge 1 ] && [ "$source_count" -le 3 ] || return 1
          while IFS= read -r source_line; do
            [ -n "$source_line" ] || continue
            entry="${source_line#SOURCE: }"; path="${entry%% :: *}"; needle="${entry#* :: }"
            [ "$path" != "$entry" ] || return 1
            [ -n "$path" ] && [ -n "$needle" ] || return 1
            [ -f "$path" ] || return 1
            grep -Fq -- "$needle" "$path" || return 1
          done < <(printf '%s\n' "$body" | sed -n 's/^SOURCE: /SOURCE: /p')
        }
        if validate_evidence "$LAST_BOT_BODY"; then echo "valid=true" >> "$GITHUB_OUTPUT"; else echo "repair_needed=true" >> "$GITHUB_OUTPUT"; fi

    - name: Record bounded evidence repair start
      if: steps.evidence_check.outputs.repair_needed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        MARKER="AI AUXILIARY EVIDENCE REPAIR: {\"schema_version\":1,\"timestamp\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",\"run_id\":${GITHUB_RUN_ID},\"run_attempt\":${GITHUB_RUN_ATTEMPT},\"issue_number\":${{ inputs.issue_number }},\"role\":\"${{ steps.role_mode.outputs.role }}\",\"state\":\"started\"}"
        gh issue comment "${{ inputs.issue_number }}" --repo "${GITHUB_REPOSITORY}" --body "$MARKER" >/dev/null
        gh issue comment "${{ inputs.metrics_ledger_issue }}" --repo "${GITHUB_REPOSITORY}" --body "$MARKER" >/dev/null

    - name: Repair evidence format once
      id: opencode_repair
      if: steps.evidence_check.outputs.repair_needed == 'true'
      continue-on-error: true
      uses: anomalyco/opencode/github@latest
      env:
        NVIDIA_API_KEY: ${{ inputs.nvidia_api_key }}
        GITHUB_TOKEN: ${{ github.token }}
      with:
        model: ${{ inputs.model }}
        agent: ${{ steps.role_mode.outputs.agent }}
        use_github_token: ${{ steps.role_mode.outputs.use_github_token }}
        prompt: |
          EVIDENCE FORMAT REPAIR ONLY. Do not redo a broad review or test pass.
          The previous auxiliary ${{ steps.role_mode.outputs.role }} attempt completed, but its terminal evidence failed the machine-readable contract.
          Read README.md first, inspect the latest AI evidence comment on issue #${{ inputs.issue_number }}, and inspect only the minimum exact repository files needed to verify 1-3 literal source tokens.
          Stay READ-ONLY. Do not edit files, planning state, issues other than the required evidence comment, commits, branches, PRs, scope, AC, dependencies, phase or release state.
          Post exactly one replacement terminal comment. Do not wrap it in Markdown fences. Do not add prose before the first line.
          For reviewer use exactly:
          AI REVIEW EVIDENCE:
          TARGET: <exact SHA/PR/state actually inspected>
          SOURCE: <relative/path> :: <short exact literal token from that file>
          SOURCE: <optional second source>
          SOURCE: <optional third source>
          GROUNDING: VERIFIED
          VERDICT: PASS
          SUMMARY: <one concise sentence>
          RULE CONSISTENCY: <only if relevant>
          GAMEPLAY LOGIC: <only if relevant>
          REAL-WORLD PLAUSIBILITY: <only if relevant>
          INTENTIONAL ABSTRACTION: <only if relevant>
          Reviewer may replace PASS with CHANGES REQUESTED only for a grounded BLOCKING or MAJOR defect.
          For tester use the same structure beginning `AI TEST EVIDENCE:` and use only `VERDICT: PASS` or `VERDICT: FAIL`; omit gameplay categories unless objectively tested and relevant.
          You MUST include 1 to 3 SOURCE lines. Every path must exist in the current checkout and every token after `::` must occur verbatim in that file.
          If you cannot safely produce that exact grounded contract, post only:
          AI-HANDOFF: evidence-format repair could not be grounded safely.

    - name: Validate repaired evidence and record repair outcome
      id: repair_check
      if: steps.evidence_check.outputs.repair_needed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        ROLE: ${{ steps.role_mode.outputs.role }}
        STARTED_AT: ${{ steps.attempt_start.outputs.started_at }}
      shell: bash
      run: |
        set -euo pipefail
        echo "valid=false" >> "$GITHUB_OUTPUT"
        case "$ROLE" in
          reviewer) PREFIX="AI REVIEW EVIDENCE:"; VERDICT_RE='^(PASS|CHANGES REQUESTED)$' ;;
          tester) PREFIX="AI TEST EVIDENCE:"; VERDICT_RE='^(PASS|FAIL)$' ;;
          *) exit 0 ;;
        esac
        COMMENTS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${{ inputs.issue_number }}/comments?per_page=100" | jq -s 'add')"
        BODY="$(printf '%s' "$COMMENTS" | jq -r --arg start "$STARTED_AT" --arg prefix "$PREFIX" '[.[] | select(.created_at >= $start) | select(.user.login == "opencode-agent[bot]" or .user.login == "github-actions[bot]") | select((.body // "") | startswith($prefix))] | last | .body // ""')"
        VALID=true
        printf '%s\n' "$BODY" | head -n 1 | grep -Fxq "$PREFIX" || VALID=false
        if printf '%s\n' "$BODY" | grep -q '^```'; then VALID=false; fi
        [ "$(printf '%s\n' "$BODY" | grep -Fc 'GROUNDING: VERIFIED')" -eq 1 ] || VALID=false
        VERDICT="$(printf '%s\n' "$BODY" | sed -n 's/^VERDICT:[[:space:]]*//p')"
        if [ "$(printf '%s\n' "$VERDICT" | wc -l)" -ne 1 ] || ! printf '%s\n' "$VERDICT" | grep -Eq "$VERDICT_RE"; then VALID=false; fi
        SOURCE_COUNT="$(printf '%s\n' "$BODY" | grep -c '^SOURCE: ' || true)"
        if [ "$SOURCE_COUNT" -lt 1 ] || [ "$SOURCE_COUNT" -gt 3 ]; then VALID=false; fi
        while IFS= read -r source_line; do
          [ -n "$source_line" ] || continue
          entry="${source_line#SOURCE: }"; path="${entry%% :: *}"; needle="${entry#* :: }"
          if [ "$path" = "$entry" ] || [ -z "$path" ] || [ -z "$needle" ] || [ ! -f "$path" ] || ! grep -Fq -- "$needle" "$path"; then VALID=false; break; fi
        done < <(printf '%s\n' "$BODY" | sed -n 's/^SOURCE: /SOURCE: /p')
        if [ "$VALID" = true ]; then echo "valid=true" >> "$GITHUB_OUTPUT"; REPAIR_STATE="valid"; else REPAIR_STATE="invalid"; fi
        MARKER="AI AUXILIARY EVIDENCE REPAIR: {\"schema_version\":1,\"timestamp\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",\"run_id\":${GITHUB_RUN_ID},\"run_attempt\":${GITHUB_RUN_ATTEMPT},\"issue_number\":${{ inputs.issue_number }},\"role\":\"${ROLE}\",\"state\":\"${REPAIR_STATE}\"}"
        gh issue comment "${{ inputs.metrics_ledger_issue }}" --repo "${GITHUB_REPOSITORY}" --body "$MARKER" >/dev/null

    - name: Determine bounded final outcome
      id: finish
      env:
        FIRST_OUTCOME: ${{ steps.opencode_first.outcome }}
        RETRY_503: ${{ steps.retry_check.outputs.retry_503 }}
        RETRY_OUTCOME: ${{ steps.opencode_retry.outcome }}
      shell: bash
      run: |
        set -euo pipefail
        if [ "$FIRST_OUTCOME" = "success" ]; then
          echo "final_outcome=success" >> "$GITHUB_OUTPUT"; echo "retry_used=false" >> "$GITHUB_OUTPUT"
        elif [ "$RETRY_503" = "true" ] && [ "$RETRY_OUTCOME" = "success" ]; then
          echo "final_outcome=success" >> "$GITHUB_OUTPUT"; echo "retry_used=true" >> "$GITHUB_OUTPUT"
        else
          echo "final_outcome=failure" >> "$GITHUB_OUTPUT"
          if [ "$RETRY_503" = "true" ]; then echo "retry_used=true" >> "$GITHUB_OUTPUT"; else echo "retry_used=false" >> "$GITHUB_OUTPUT"; fi
        fi
