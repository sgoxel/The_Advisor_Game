name: Run OpenCode with NVIDIA retry
description: Run one bounded OpenCode/NVIDIA attempt with one clean retry only for NVIDIA HTTP 503 overload.

inputs:
  nvidia_api_key:
    description: NVIDIA API key
    required: true
  issue_number:
    description: GitHub issue number
    required: true
  prompt:
    description: Role-specific OpenCode prompt
    required: true
  model:
    description: OpenCode model selection
    required: false
    default: nvidia/nvidia/nemotron-3-super-120b-a12b
  retry_wait_seconds:
    description: Wait before the single NVIDIA 503 retry
    required: false
    default: "60"
  metrics_ledger_issue:
    description: Central GitHub issue used to anchor NVIDIA run identity for completion metrics
    required: false
    default: "79"

outputs:
  final_outcome:
    description: success or failure after the bounded attempt/retry
    value: ${{ steps.finish.outputs.final_outcome }}
  retry_used:
    description: true when the NVIDIA 503 retry was used
    value: ${{ steps.finish.outputs.retry_used }}

runs:
  using: composite
  steps:
    - name: Select role safety mode
      id: role_mode
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        LABELS="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${{ inputs.issue_number }}" --jq '.labels[].name')"
        ROLE=""
        if printf '%s\n' "$LABELS" | grep -Fxq 'ai-role-reviewer'; then
          ROLE="reviewer"
        elif printf '%s\n' "$LABELS" | grep -Fxq 'ai-role-tester'; then
          ROLE="tester"
        else
          echo "Unsupported NVIDIA role: only Reviewer and Tester are executable." >&2
          exit 1
        fi

        echo "role=${ROLE}" >> "$GITHUB_OUTPUT"
        echo "agent=plan" >> "$GITHUB_OUTPUT"
        echo "use_github_token=true" >> "$GITHUB_OUTPUT"
        # NVIDIA Reviewer/Tester work is evidence-only. All untracked local output is
        # disposable and must stay invisible to the upstream GitHub action's dirty-tree
        # auto-commit path. Tracked files are protected separately below.
        printf '%s\n' '/*' >> .git/info/exclude

    - name: Prepare isolated read-only verification worktree
      shell: bash
      run: |
        set -euo pipefail

        # Install declared test dependencies before OpenCode without changing the
        # manifest or creating a lockfile. The plan agent is not allowed to run
        # package-manager mutation commands itself.
        if [ -f package.json ]; then
          npm install --no-save --package-lock=false --ignore-scripts
        fi

        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "Read-only NVIDIA setup changed tracked repository content." >&2
          git status --short >&2
          exit 1
        fi

        # The upstream OpenCode GitHub wrapper auto-commits whenever `git status`
        # is dirty. Hide all disposable untracked output and mark tracked paths
        # skip-worktree so Reviewer/Tester-local side effects cannot enter that
        # implementation branch/commit path. Final grounding uses a separate clean
        # checkout, so this never changes repository authority or accepted evidence.
        git ls-files -z | xargs -0 -r git update-index --skip-worktree
        if [ -n "$(git status --porcelain)" ]; then
          echo "Read-only NVIDIA worktree is not clean before OpenCode execution." >&2
          git status --short >&2
          exit 1
        fi

    - name: Record first attempt start time
      id: attempt_start
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        echo "started_at=${STARTED_AT}" >> "$GITHUB_OUTPUT"
        RUN_MARKER="AI AUXILIARY RUN: run_id=${GITHUB_RUN_ID} run_attempt=${GITHUB_RUN_ATTEMPT} issue=${{ inputs.issue_number }} role=${{ steps.role_mode.outputs.role }} model=${{ inputs.model }} started_at=${STARTED_AT}"
        gh issue comment "${{ inputs.issue_number }}" --repo "${GITHUB_REPOSITORY}" \
          --body "$RUN_MARKER" >/dev/null
        gh issue comment "${{ inputs.metrics_ledger_issue }}" --repo "${GITHUB_REPOSITORY}" \
          --body "$RUN_MARKER" >/dev/null

    - name: Run OpenCode
      id: opencode_first
      continue-on-error: true
      uses: anomalyco/opencode/github@latest
      env:
        NVIDIA_API_KEY: ${{ inputs.nvidia_api_key }}
        GITHUB_TOKEN: ${{ github.token }}
      with:
        model: ${{ inputs.model }}
        agent: ${{ steps.role_mode.outputs.agent }}
        use_github_token: ${{ steps.role_mode.outputs.use_github_token }}
        prompt: ${{ inputs.prompt }}

    - name: Check whether failure was NVIDIA 503
      id: retry_check
      if: steps.opencode_first.outcome == 'failure'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail

        COMMENTS_JSON="$(
          gh api "repos/${GITHUB_REPOSITORY}/issues/${{ inputs.issue_number }}/comments?per_page=100"
        )"

        LAST_BOT_COMMENT="$(
          printf '%s' "$COMMENTS_JSON" |
            jq -r --arg start "${{ steps.attempt_start.outputs.started_at }}" \
              '[.[] | select(.created_at >= $start) |
                select(.user.login == "opencode-agent[bot]" or .user.login == "github-actions[bot]")
               ] | last | .body // ""'
        )"

        if printf '%s' "$LAST_BOT_COMMENT" |
          grep -Eq 'Service temporarily overloaded|"code"[[:space:]]*:[[:space:]]*503|HTTP[[:space:]]+503'; then
          echo "retry_503=true" >> "$GITHUB_OUTPUT"
        else
          echo "retry_503=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Wait and reset before NVIDIA 503 retry
      if: steps.retry_check.outputs.retry_503 == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        gh issue comment "${{ inputs.issue_number }}" --repo "${GITHUB_REPOSITORY}" \
          --body "AI AUXILIARY RETRY: run_id=${GITHUB_RUN_ID} run_attempt=${GITHUB_RUN_ATTEMPT} role=${{ steps.role_mode.outputs.role }} reason=nvidia-http-503" >/dev/null
        sleep "${{ inputs.retry_wait_seconds }}"
        git ls-files -z | xargs -0 -r git update-index --no-skip-worktree
        git reset --hard
        git clean -fd
        git checkout -B main origin/main
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "NVIDIA retry reset did not restore a clean tracked worktree." >&2
          exit 1
        fi
        git ls-files -z | xargs -0 -r git update-index --skip-worktree
        if [ -n "$(git status --porcelain)" ]; then
          echo "Read-only NVIDIA retry worktree is not clean." >&2
          exit 1
        fi

    - name: Retry OpenCode after NVIDIA 503
      id: opencode_retry
      if: steps.retry_check.outputs.retry_503 == 'true'
      continue-on-error: true
      uses: anomalyco/opencode/github@latest
      env:
        NVIDIA_API_KEY: ${{ inputs.nvidia_api_key }}
        GITHUB_TOKEN: ${{ github.token }}
      with:
        model: ${{ inputs.model }}
        agent: ${{ steps.role_mode.outputs.agent }}
        use_github_token: ${{ steps.role_mode.outputs.use_github_token }}
        prompt: |
          This is the single clean retry after NVIDIA HTTP 503 Service temporarily overloaded.

          ${{ inputs.prompt }}

    - name: Determine bounded final outcome
      id: finish
      env:
        FIRST_OUTCOME: ${{ steps.opencode_first.outcome }}
        RETRY_503: ${{ steps.retry_check.outputs.retry_503 }}
        RETRY_OUTCOME: ${{ steps.opencode_retry.outcome }}
      shell: bash
      run: |
        set -euo pipefail

        if [ "$FIRST_OUTCOME" = "success" ]; then
          echo "final_outcome=success" >> "$GITHUB_OUTPUT"
          echo "retry_used=false" >> "$GITHUB_OUTPUT"
        elif [ "$RETRY_503" = "true" ] && [ "$RETRY_OUTCOME" = "success" ]; then
          echo "final_outcome=success" >> "$GITHUB_OUTPUT"
          echo "retry_used=true" >> "$GITHUB_OUTPUT"
        else
          echo "final_outcome=failure" >> "$GITHUB_OUTPUT"
          if [ "$RETRY_503" = "true" ]; then
            echo "retry_used=true" >> "$GITHUB_OUTPUT"
          else
            echo "retry_used=false" >> "$GITHUB_OUTPUT"
          fi
        fi
