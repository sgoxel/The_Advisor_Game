name: R04 Materialize Road Tile Exports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r04-materialize-road-exports.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r04-materialize-road-exports
  cancel-in-progress: false

jobs:
  materialize-road-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize canonical road exports
        run: >-
          node tools/split_tile_atlas.mjs
          --atlas design/source/road/road_canonical_1024.png
          --manifest design/source/road/road_canonical_1024.cells.json
          --output textures/tiles/road

      - name: Verify production exports and idempotence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/road-export-check"
          node tools/split_tile_atlas.mjs \
            --atlas design/source/road/road_canonical_1024.png \
            --manifest design/source/road/road_canonical_1024.cells.json \
            --output "$RUNNER_TEMP/road-export-check"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { decodeRgbaPng } from './tools/split_tile_atlas.mjs';

          const production = 'textures/tiles/road';
          const comparison = process.env.RUNNER_TEMP + '/road-export-check';
          const manifestName = 'road_tiles.manifest.json';
          const expectedTypes = new Set([
            'straight_vertical',
            'straight_horizontal',
            'cross',
            'turn_ne',
            'turn_es',
            'turn_sw',
            'turn_wn',
            't_junction'
          ]);
          const sha256 = (buffer) => crypto.createHash('sha256').update(buffer).digest('hex');
          const listPng = (dir) => fs.readdirSync(dir).filter((name) => name.endsWith('_256px.png')).sort();

          const productionPng = listPng(production);
          const comparisonPng = listPng(comparison);
          if (productionPng.length !== 8) throw new Error(`Expected exactly 8 production road PNGs; found ${productionPng.length}.`);
          if (JSON.stringify(productionPng) !== JSON.stringify(comparisonPng)) throw new Error('Repeated export changed the output filename set.');

          const manifest = JSON.parse(fs.readFileSync(path.join(production, manifestName), 'utf8'));
          if (manifest.family !== 'road' || manifest.tiles?.length !== 8) throw new Error('Production road manifest must describe exactly 8 road tiles.');
          const actualTypes = new Set(manifest.tiles.map((tile) => tile.type));
          if (actualTypes.size !== expectedTypes.size || [...expectedTypes].some((type) => !actualTypes.has(type))) {
            throw new Error('Production road manifest semantic set does not match the verified eight-tile road family.');
          }

          for (const tile of manifest.tiles) {
            const expectedName = `road_${tile.type}_256px.png`;
            if (tile.filename !== expectedName || !productionPng.includes(expectedName)) {
              throw new Error(`Unexpected production filename for ${tile.type}: ${tile.filename}`);
            }
            const prod = fs.readFileSync(path.join(production, expectedName));
            const repeat = fs.readFileSync(path.join(comparison, expectedName));
            const decoded = decodeRgbaPng(prod);
            if (decoded.width !== 256 || decoded.height !== 256 || decoded.rgba.length !== 256 * 256 * 4) {
              throw new Error(`${expectedName} is not a 256x256 RGBA export.`);
            }
            const digest = sha256(prod);
            if (digest !== tile.sha256) throw new Error(`${expectedName} does not match its manifest SHA-256.`);
            if (digest !== sha256(repeat)) throw new Error(`${expectedName} is not byte-deterministic across repeated export.`);
          }

          const prodManifest = fs.readFileSync(path.join(production, manifestName));
          const repeatManifest = fs.readFileSync(path.join(comparison, manifestName));
          if (sha256(prodManifest) !== sha256(repeatManifest)) throw new Error('Road export manifest is not byte-deterministic.');
          console.log('Verified exactly eight deterministic 256x256 RGBA semantic road exports plus manifest.');
          NODE

      - name: Commit production road tile exports
        shell: bash
        run: |
          set -euo pipefail
          git add textures/tiles/road
          if git diff --cached --quiet; then
            echo 'Production road exports already match the verified atlas/splitter output.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Commit canonical road tile exports (#296)'
          git push
