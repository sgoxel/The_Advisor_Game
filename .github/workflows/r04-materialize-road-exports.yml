name: R04 Materialize Road Tile Exports

# #339: this workflow is the canonical materialization path for committed semantic road assets.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r04-materialize-road-exports.yml'
      - 'design/source/road/generate_admin_road_atlas.mjs'
      - 'design/source/main_road/generate_main_road_atlas.py'
      - 'design/source/main_road/main_road_canonical_1024.png'
      - 'design/source/main_road/main_road_canonical_1024.cells.json'
      - 'tools/split_tile_atlas.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r04-materialize-road-exports
  cancel-in-progress: false

jobs:
  materialize-road-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install canonical atlas generator dependency
        run: python -m pip install 'Pillow==11.3.0'

      - name: Generate Admin-priority canonical road atlas
        run: node design/source/road/generate_admin_road_atlas.mjs

      - name: Regenerate verified canonical main-road atlas
        run: python design/source/main_road/generate_main_road_atlas.py

      - name: Materialize semantic road exports
        run: >-
          node tools/split_tile_atlas.mjs
          --atlas design/source/road/road_admin_generated_1024.png
          --manifest design/source/road/road_admin_generated_1024.cells.json
          --output textures/tiles/road

      - name: Materialize semantic main-road exports
        run: >-
          node tools/split_tile_atlas.mjs
          --atlas design/source/main_road/main_road_canonical_1024.png
          --manifest design/source/main_road/main_road_canonical_1024.cells.json
          --output textures/tiles/main_road

      - name: Verify canonical sources, exports and idempotence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/road-export-check" "$RUNNER_TEMP/main-road-export-check"
          node tools/split_tile_atlas.mjs \
            --atlas design/source/road/road_admin_generated_1024.png \
            --manifest design/source/road/road_admin_generated_1024.cells.json \
            --output "$RUNNER_TEMP/road-export-check"
          node tools/split_tile_atlas.mjs \
            --atlas design/source/main_road/main_road_canonical_1024.png \
            --manifest design/source/main_road/main_road_canonical_1024.cells.json \
            --output "$RUNNER_TEMP/main-road-export-check"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { decodeRgbaPng } from './tools/split_tile_atlas.mjs';

          const sha256 = (buffer) => crypto.createHash('sha256').update(buffer).digest('hex');
          const listPng = (dir) => fs.readdirSync(dir).filter((name) => name.endsWith('_256px.png')).sort();

          function verifyFamily({ sourcePath, production, comparison, manifestName, family, expectedTypes }) {
            const source = decodeRgbaPng(fs.readFileSync(sourcePath));
            if (source.width !== 1024 || source.height !== 1024 || source.rgba.length !== 1024 * 1024 * 4) {
              throw new Error(`${family} source is not canonical 1024x1024 RGBA.`);
            }
            const productionPng = listPng(production);
            const comparisonPng = listPng(comparison);
            if (productionPng.length !== expectedTypes.size) {
              throw new Error(`Expected exactly ${expectedTypes.size} ${family} PNGs; found ${productionPng.length}.`);
            }
            if (JSON.stringify(productionPng) !== JSON.stringify(comparisonPng)) {
              throw new Error(`${family} repeated export changed output filenames.`);
            }
            const manifest = JSON.parse(fs.readFileSync(path.join(production, manifestName), 'utf8'));
            if (manifest.family !== family || manifest.tiles?.length !== expectedTypes.size) {
              throw new Error(`${family} manifest has unexpected family/count.`);
            }
            const actualTypes = new Set(manifest.tiles.map((tile) => tile.type));
            if (actualTypes.size !== expectedTypes.size || [...expectedTypes].some((type) => !actualTypes.has(type))) {
              throw new Error(`${family} manifest semantic set is incomplete.`);
            }
            for (const tile of manifest.tiles) {
              const expectedName = `${family}_${tile.type}_256px.png`;
              if (tile.filename !== expectedName || !productionPng.includes(expectedName)) {
                throw new Error(`Unexpected ${family} filename for ${tile.type}.`);
              }
              const prod = fs.readFileSync(path.join(production, expectedName));
              const repeat = fs.readFileSync(path.join(comparison, expectedName));
              const decoded = decodeRgbaPng(prod);
              if (decoded.width !== 256 || decoded.height !== 256 || decoded.rgba.length !== 256 * 256 * 4) {
                throw new Error(`${expectedName} is not 256x256 RGBA.`);
              }
              const digest = sha256(prod);
              if (digest !== tile.sha256 || digest !== sha256(repeat)) throw new Error(`${expectedName} is not deterministic.`);
            }
          }

          verifyFamily({
            sourcePath: 'design/source/road/road_admin_generated_1024.png',
            production: 'textures/tiles/road',
            comparison: process.env.RUNNER_TEMP + '/road-export-check',
            manifestName: 'road_tiles.manifest.json',
            family: 'road',
            expectedTypes: new Set(['straight_vertical','straight_horizontal','cross','turn_ne','turn_es','turn_sw','turn_wn','t_junction'])
          });

          verifyFamily({
            sourcePath: 'design/source/main_road/main_road_canonical_1024.png',
            production: 'textures/tiles/main_road',
            comparison: process.env.RUNNER_TEMP + '/main-road-export-check',
            manifestName: 'main_road_tiles.manifest.json',
            family: 'main_road',
            expectedTypes: new Set([
              'main_straight_vertical_left','main_straight_vertical_right',
              'main_straight_horizontal_top','main_straight_horizontal_bottom',
              'main_turn_ne_inner','main_turn_ne_outer','main_turn_es_inner','main_turn_es_outer',
              'main_turn_sw_inner','main_turn_sw_outer','main_turn_wn_inner','main_turn_wn_outer',
              'main_transition_vertical','main_transition_horizontal','main_intersection_cross'
            ])
          });
          console.log('Verified deterministic ordinary-road and main-road semantic exports.');
          NODE

      - name: Commit generated source and production road tiles
        shell: bash
        run: |
          set -euo pipefail
          git add design/source/road/road_admin_generated_1024.png \
                  design/source/road/road_admin_generated_1024.cells.json \
                  design/source/main_road/main_road_canonical_1024.png \
                  design/source/main_road/main_road_canonical_1024.cells.json \
                  textures/tiles/road \
                  textures/tiles/main_road
          if git diff --cached --quiet; then
            echo 'Road and main-road production exports already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize semantic road tile exports (#339)'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
