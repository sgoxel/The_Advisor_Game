name: R04 Activity Log Quality Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/activity_log_runtime.js'
      - 'js/activity_log_quality.js'
      - 'js/utils.js'
      - 'tests/browser/r04-activity-log-quality.spec.mjs'
      - '.github/workflows/r04-activity-log-quality-verification.yml'
  pull_request:
    paths:
      - 'js/activity_log_runtime.js'
      - 'js/activity_log_quality.js'
      - 'js/utils.js'
      - 'tests/browser/r04-activity-log-quality.spec.mjs'
      - '.github/workflows/r04-activity-log-quality-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activity-log-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4

      - name: Record exact candidate SHA
        run: git rev-parse HEAD

      - name: Validate quality bridge syntax
        run: node --check js/activity_log_quality.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify structured log deduplication and diagnostic-noise handling
        run: npx playwright test tests/browser/r04-activity-log-quality.spec.mjs --project=desktop

      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-activity-log-quality-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
