name: WP15 AGENT1 corrective patch
on:
  push:
    branches:
      - agent1/wp-s002-004-005-uv-final2
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-uv-final2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply attempt 2 bounded presentation correction
        run: |
          if grep -q 'WP15_ATTEMPT2_PRESENTATION' src/terrain-refine.ts; then
            echo 'Attempt 2 correction already applied.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('src/terrain-refine.ts')
          text = p.read_text()
          old = '  if (surface.cliff) return [91, 98, 97];'
          new = '''  // WP15_ATTEMPT2_PRESENTATION: cliff remains canonical traversal truth, while\n  // presentation uses a slope-weighted rock blend instead of a binary dark mask.\n  if (surface.cliff) {\n    const detail = naturalDetail(x, z),\n      severity = smooth01((surface.slope - 0.72) / 1.1),\n      shoulder: RGB = [118 + detail * 8, 123 + detail * 7, 109 + detail * 6],\n      rock: RGB = [92 + detail * 5, 98 + detail * 5, 96 + detail * 4];\n    return blend(shoulder, rock, 0.28 + severity * 0.34);\n  }'''
          if text.count(old) != 1:
              raise SystemExit('cliff tint anchor mismatch')
          text = text.replace(old, new, 1)
          old = '''    targetResolution = coastal\n      ? tile.size <= 512\n        ? 88\n        : 72\n      : tile.size <= 128\n        ? 72\n        : tile.size <= 512\n          ? rugged\n            ? 64\n            : 44\n          : rugged\n            ? 52\n            : 32,\n    resolution = Math.max(1, Math.min(targetResolution, Math.floor(tile.size / 2))),'''
          new = '''    targetResolution = coastal\n      ? tile.size <= 128\n        ? 96\n        : tile.size <= 512\n          ? 128\n          : 112\n      : tile.size <= 128\n        ? rugged\n          ? 96\n          : 72\n        : tile.size <= 512\n          ? rugged\n            ? 72\n            : 44\n          : rugged\n            ? 60\n            : 32,\n    // One-metre sampling is reserved for close rugged/coastal silhouettes; wider\n    // tiles retain a two-metre-or-coarser cap to protect phone streaming budgets.\n    resolutionCap =\n      tile.size <= 128 && (coastal || rugged)\n        ? Math.max(1, Math.floor(tile.size))\n        : Math.max(1, Math.floor(tile.size / 2)),\n    resolution = Math.max(1, Math.min(targetResolution, resolutionCap)),'''
          if text.count(old) != 1:
              raise SystemExit('resolution anchor mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - name: Refresh zoom anchors from current deterministic climate truth
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { climateSampleAt } from './src/climate.ts';
          import { macroSampleAt } from './src/macro-geography.ts';
          import { CANONICAL_PLANET_RADIUS } from './src/planet.ts';

          const toRad = d => d * Math.PI / 180;
          const targets = {
            forest: 'terrain/conifer-forest',
            coast: 'terrain/beach',
            grassland: 'terrain/grassland',
            desert: 'terrain/desert',
            snow: 'terrain/snowy-mountain',
          };
          const previous = JSON.parse(fs.readFileSync('tests/zoom-fixtures.json','utf8'));
          const result = {};
          const stable = (lon,lat,id,delta=0.00004) => {
            for (const dx of [-delta,0,delta]) for (const dy of [-delta,0,delta])
              if (climateSampleAt({lon:lon+dx,lat:lat+dy}).materialId !== id) return false;
            return true;
          };
          for (const [name,id] of Object.entries(targets)) {
            const prior = previous[name];
            if (prior && stable(prior.lon,prior.lat,id)) result[name] = prior;
          }

          const remaining = new Set(Object.keys(targets).filter(name => name !== 'coast' && !result[name]));
          outer: for (let latDeg=-80; latDeg<=80; latDeg+=1) {
            const lat = toRad(latDeg);
            for (let lonDeg=-179; lonDeg<=179; lonDeg+=1) {
              const lon = toRad(lonDeg), sample = climateSampleAt({lon,lat});
              for (const name of [...remaining]) {
                if (sample.materialId === targets[name] && stable(lon,lat,targets[name],0.00008)) {
                  result[name] = {lon,lat,materialId:targets[name]};
                  remaining.delete(name);
                }
              }
              if (!remaining.size) break outer;
            }
          }
          if (remaining.size) throw new Error(`Could not deterministically locate zoom anchors: ${[...remaining].join(', ')}`);

          if (!result.coast) {
            const step = 2;
            let beach = null;
            for (let latDeg=-76; latDeg<=76 && !beach; latDeg+=step) {
              for (let lonDeg=-176; lonDeg<=176 && !beach; lonDeg+=step) {
                const starts = [
                  [{lon:toRad(lonDeg),lat:toRad(latDeg)},{lon:toRad(lonDeg+step),lat:toRad(latDeg)}],
                  [{lon:toRad(lonDeg),lat:toRad(latDeg)},{lon:toRad(lonDeg),lat:toRad(latDeg+step)}],
                ];
                for (const [a0,b0] of starts) {
                  const ma = macroSampleAt(a0), mb = macroSampleAt(b0);
                  if (ma.land === mb.land) continue;
                  const landBase = ma.land ? a0 : b0;
                  let land = {...landBase}, water = {...(ma.land ? b0 : a0)};
                  for (let i=0;i<28;i++) {
                    const mid = {lon:(land.lon+water.lon)/2,lat:(land.lat+water.lat)/2};
                    if (macroSampleAt(mid).land) land = mid; else water = mid;
                  }
                  const boundary = {lon:(land.lon+water.lon)/2,lat:(land.lat+water.lat)/2};
                  let vx = landBase.lon-boundary.lon, vy = landBase.lat-boundary.lat;
                  const length = Math.hypot(vx*Math.cos(boundary.lat),vy) || 1;
                  vx /= length; vy /= length;
                  for (const metres of [30,70,130,220,360]) {
                    const d = metres / CANONICAL_PLANET_RADIUS;
                    const candidate = {
                      lon: boundary.lon + vx*d,
                      lat: boundary.lat + vy*d,
                    };
                    if (stable(candidate.lon,candidate.lat,targets.coast,0.000003)) {
                      beach = {lon:candidate.lon,lat:candidate.lat,materialId:targets.coast};
                      break;
                    }
                  }
                  if (beach) break;
                }
              }
            }
            if (!beach) throw new Error('Could not deterministically locate stable beach zoom anchor');
            result.coast = beach;
          }

          const ordered = Object.fromEntries(Object.keys(targets).map(name => [name,result[name]]));
          for (const [name,fixture] of Object.entries(ordered)) {
            const actual = climateSampleAt({lon:fixture.lon,lat:fixture.lat}).materialId;
            if (actual !== fixture.materialId) throw new Error(`${name}: ${actual} != ${fixture.materialId}`);
          }
          fs.writeFileSync('tests/zoom-fixtures.json', JSON.stringify(ordered,null,2)+'\n');
          console.log(JSON.stringify(ordered,null,2));
          NODE
      - name: Focused deterministic regression gate
        run: node --experimental-strip-types --test tests/hydrology.test.ts tests/surface-authority.test.ts tests/terrain-refine.test.ts tests/surface-presentation.test.ts tests/climate.test.ts
      - run: npm run build
      - name: Commit attempt 2 correction
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/terrain-refine.ts tests/zoom-fixtures.json
          git commit -m "agent1: refine WP15 terrain silhouettes"
          git push origin HEAD:agent1/wp-s002-004-005-uv-final2
