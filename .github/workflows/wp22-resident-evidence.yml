name: WP22 resident evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  resident-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture living-resident inspector evidence
        run: |
          python -m pip install playwright==1.63.0
          npm run preview -- --port 4174 > /tmp/advisor-wp22-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          RESIDENT_STEPS='eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.villages[0].canonicalPosition);eval:window.advisorWorld.setHalfHeight(70);settle;click:#open-travel;visible:#travel-panel;visible:#resident-inspector;visible:#resident-name;visible:#resident-home-inspect;click:#resident-home-inspect;visible:#resident-house-details;shot:resident-inspector'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp22-residents-webgl2 --name residents --profile desktop,phone --renderer webgl2 --timeout 240 --steps "$RESIDENT_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp22-residents-webgpu --name residents --profile desktop,phone --renderer webgpu --timeout 240 --steps "$RESIDENT_STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp22-resident-evidence
          path: test-results/
