name: WP15 final bounded component patch

on:
  push:
    branches:
      - agent1/wp-s002-004-005-current-main
    paths:
      - ".github/workflows/wp15-final-component-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-current-main
          fetch-depth: 0
      - name: Apply bounded final-surface component repair
        run: |
          echo '' | base64 -d > /tmp/wp15_patch.py
          python /tmp/wp15_patch.py
      - name: Commit and push
        run: |
          if git diff --quiet -- src/village-routes.ts; then
            exit 0
          fi
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/village-routes.ts
          git commit -m "WP-S002-004-005: add bounded catchment dry-component repair"
          git push origin HEAD:agent1/wp-s002-004-005-current-main
