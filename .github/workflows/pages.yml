name: Build and deploy world atlas
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - name: Apply AGENT #1 runtime patch once
        if: github.event_name == 'pull_request'
        run: |
          python tools/apply_wp_s002_003_003.py
          if git diff --quiet; then
            echo 'Runtime patch already applied.'
          else
            git config user.name 'AGENT #1'
            git config user.email '163722426+sgoxel@users.noreply.github.com'
            git add src/main.ts tools/screenshot_tool.py tests/browser/navigation.spec.js
            git commit -m 'Integrate bounded canonical streaming runtime'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:webgpu
      - run: xvfb-run -a npx playwright test --config playwright.fallback.config.js
      - run: xvfb-run -a npx playwright test --config playwright.navigation.config.js
      - name: Capture handoff, canonical inspector, wrap/pole and ENU rebase evidence
        run: |
          python -m pip install playwright==1.63.0
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/handoff-capture-webgl2 --scenario handoff --profile desktop,phone,phone-landscape --renderer webgl2 --timeout 180
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/handoff-capture-webgpu --scenario handoff --profile desktop,phone,phone-landscape --renderer webgpu --timeout 180
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/canonical-inspector-webgl2 --scenario cell,wrap-pole --profile desktop,phone --renderer webgl2 --timeout 180
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/canonical-inspector-webgpu --scenario cell,wrap-pole --profile desktop,phone --renderer webgpu --timeout 180
          ENU_STEPS='eval:window.advisorWorld.navigation.setFocus(window.advisorWorld.state.navigation.focus.lon+0.001,window.advisorWorld.state.navigation.focus.lat);eval:window.advisorWorld.setHalfHeight(70);settle;tap;visible:#cell-panel;shot:before-rebase;eval:window.advisorWorld.navigation.forceRebase();settle;shot:after-rebase;click:#close-cell;eval:window.advisorWorld.navigation.setFocus(window.advisorWorld.geography.villages.reduce((a,b)=>Math.hypot(b.x,b.z)>Math.hypot(a.x,a.z)?b:a).canonicalPosition.lon,window.advisorWorld.geography.villages.reduce((a,b)=>Math.hypot(b.x,b.z)>Math.hypot(a.x,a.z)?b:a).canonicalPosition.lat);settle;tap;visible:#cell-panel;shot:farthest-settlement'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/enu-rebase-webgl2 --name enu-rebase --steps "$ENU_STEPS" --profile desktop,phone --renderer webgl2 --timeout 180
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/enu-rebase-webgpu --name enu-rebase --steps "$ENU_STEPS" --profile desktop,phone --renderer webgpu --timeout 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgpu-evidence
          path: test-results/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
