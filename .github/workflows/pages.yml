name: Build and deploy world atlas
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Closing a PR cancels its obsolete long checks; main deploys independently.
  # PR close events must not cancel a still-running original PNG capture.
  # Ordinary new pushes/synchronizations still cancel superseded active runs.
  group: github-pages-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'closed' && 'closed' || 'active' }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # Build <=45m plus deploy <=10m, leaving room before the one-hour ceiling.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: timeout --signal=TERM --kill-after=10s 30m npm run test:release
        if: github.event_name != 'workflow_dispatch'
      - run: npm test
        if: github.event_name == 'workflow_dispatch'
      - run: npm run build
      # WP #550 only: each geography opens a fresh real-game page and captures
      # original WebGL2 Hero/Close PNGs. A capture failure stays visible in the
      # artifact without blocking a safe gameplay build/deploy.
      - name: Capture WP #550 real Hero/Close relief
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent1-wp550-')
        continue-on-error: true
        run: |
          python -m pip install playwright==1.63.0
          npx playwright install --with-deps chromium
          npm run preview -- --port 4174 > /tmp/advisor-wp550-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          timeout --signal=TERM --kill-after=10s 14m python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp550-webgl2 --scenario s003-hero-close-village,s003-hero-close-slope,s003-hero-close-cliff --profile fullhd-landscape,fullhd-portrait --renderer webgl2 --timeout 180
      - name: Archive original WP #550 screenshots and failure diagnostics
        if: always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent1-wp550-')
        uses: actions/upload-artifact@v4
        with:
          name: wp550-hero-close-${{ github.sha }}
          path: test-results/wp550-webgl2
          if-no-files-found: warn
      - run: npx playwright install --with-deps chromium
        if: github.event_name == 'workflow_dispatch'
      - run: xvfb-run -a npm run test:webgpu
        if: github.event_name == 'workflow_dispatch'
      - run: xvfb-run -a npx playwright test --config playwright.fallback.config.js
        if: github.event_name == 'workflow_dispatch'
      - run: xvfb-run -a npx playwright test --config playwright.navigation.config.js
        if: github.event_name == 'workflow_dispatch'
      - name: Capture handoff, canonical inspector, ENU rebase, travel, route, macro geography and final-surface evidence
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install playwright==1.63.0
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/handoff-capture-webgl2 --scenario handoff --profile desktop,phone,phone-landscape --renderer webgl2 --timeout 180
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/handoff-capture-webgpu --scenario handoff --profile desktop,phone,phone-landscape --renderer webgpu --timeout 180
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/canonical-inspector-webgl2 --scenario cell --profile desktop,phone --renderer webgl2 --timeout 180
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/canonical-inspector-webgpu --scenario cell --profile desktop,phone --renderer webgpu --timeout 180
          ENU_STEPS='eval:window.advisorWorld.navigation.setFocus(window.advisorWorld.state.navigation.focus.lon+0.001,window.advisorWorld.state.navigation.focus.lat);eval:window.advisorWorld.setHalfHeight(70);settle;tap;visible:#cell-panel;shot:before-rebase;eval:window.advisorWorld.navigation.forceRebase();settle;shot:after-rebase;click:#close-cell;eval:window.advisorWorld.navigation.setFocus(window.advisorWorld.geography.villages.reduce((a,b)=>Math.hypot(b.x,b.z)>Math.hypot(a.x,a.z)?b:a).canonicalPosition.lon,window.advisorWorld.geography.villages.reduce((a,b)=>Math.hypot(b.x,b.z)>Math.hypot(a.x,a.z)?b:a).canonicalPosition.lat);settle;tap;visible:#cell-panel;shot:farthest-settlement'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/enu-rebase-webgl2 --name enu-rebase --steps "$ENU_STEPS" --profile desktop,phone --renderer webgl2 --timeout 360
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/enu-rebase-webgpu --name enu-rebase --steps "$ENU_STEPS" --profile desktop,phone --renderer webgpu --timeout 360
          TRAVEL_STEPS='click:#open-travel;visible:#travel-panel;visible:#travel-summary;shot:travel'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp12-travel-webgl2 --name travel --profile desktop,phone --renderer webgl2 --timeout 180 --steps "$TRAVEL_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp12-travel-webgpu --name travel --profile desktop,phone --renderer webgpu --timeout 180 --steps "$TRAVEL_STEPS"
          ROUTE_STEPS='click:#open-travel;visible:#route-list .route-row[data-state=ready];click:#route-list .route-row;settle;shot:road;eval:window.advisorRoutes.select("1/8/0/2","1/8/1/2");settle;shot:mountain;eval:window.advisorRoutes.select("1/0/0/0","1/7/2/2");settle;shot:water'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp18-routes-webgl2 --name routes --profile desktop,phone --renderer webgl2 --timeout 300 --steps "$ROUTE_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp18-routes-webgpu --name routes --profile desktop,phone --renderer webgpu --timeout 300 --steps "$ROUTE_STEPS"
          MACRO_STEPS='click:#overview;settle;shot:realm-home;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.continents[1].canonicalPosition);settle;shot:realm-westreach;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.continents[2].canonicalPosition);settle;shot:realm-dawnlands;eval:(m=>window.advisorWorld.navigation.setFocus(m.center.lon,m.center.lat))(window.advisorWorld.geography.mountainSystems.find(m=>m.kind==="low-highlands"));eval:window.advisorWorld.setHalfHeight(3000);settle;shot:low-highlands-local;eval:(m=>window.advisorWorld.navigation.setFocus(m.center.lon,m.center.lat))(window.advisorWorld.geography.mountainSystems.find(m=>m.kind==="long-chain"));settle;shot:long-chain-local;eval:(m=>window.advisorWorld.navigation.setFocus(m.center.lon,m.center.lat))(window.advisorWorld.geography.mountainSystems.find(m=>m.kind==="dominant-spine"));settle;shot:dominant-spine-local;eval:(m=>window.advisorWorld.navigation.setFocus(m.center.lon,m.center.lat))(window.advisorWorld.geography.mountainSystems.find(m=>m.kind==="hooked-range"));settle;shot:hooked-range-local;eval:(m=>window.advisorWorld.navigation.setFocus(m.center.lon,m.center.lat))(window.advisorWorld.geography.mountainSystems.find(m=>m.kind==="volcano"));eval:window.advisorWorld.setHalfHeight(1400);settle;shot:volcano-local'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp13-macro-webgl2 --name macro --profile desktop,phone,phone-landscape --renderer webgl2 --timeout 360 --steps "$MACRO_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp13-macro-webgpu --name macro --profile desktop,phone,phone-landscape --renderer webgpu --timeout 360 --steps "$MACRO_STEPS"
          SURFACE_STEPS='eval:window.__s003Bridge=(r=>({x:(r.fromX+r.toX)/2,z:(r.fromZ+r.toZ)/2}))(window.advisorWorld.geography.roads[0]);eval:(a=>(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.planet.sourceToLonLat(a.x,a.z)))(window.__s003Bridge);eval:window.advisorWorld.setHalfHeight(35);settle;shot:bridge-geometry;tap;visible:#cell-panel;shot:bridge-inspector;click:#close-cell;eval:window.__s003Cut=window.advisorWorld.geography.roads.slice(0,24).flatMap(r=>Array.from({length:9},(_,i)=>((t)=>({r,x:r.fromX+(r.toX-r.fromX)*t,z:r.fromZ+(r.toZ-r.fromZ)*t}))((i+1)/10))).map(p=>({...p,d:window.advisorWorld.surface.debugAtSource(p.x,p.z)})).filter(p=>p.d.base.water.kind==="none"&&p.d.modifiers.some(m=>m.id===p.r.code)).sort((a,b)=>(a.d.final.groundHeight-a.d.base.groundHeight)-(b.d.final.groundHeight-b.d.base.groundHeight))[0];eval:(a=>(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.planet.sourceToLonLat(a.x,a.z)))(window.__s003Cut);eval:window.advisorWorld.setHalfHeight(35);settle;shot:road-cut-geometry;tap;visible:#cell-panel;shot:road-cut-inspector;click:#close-cell;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.villages[0].canonicalPosition);eval:window.advisorWorld.setHalfHeight(80);settle;shot:house-terrace;tap;visible:#cell-panel;shot:terrace-inspector;click:#close-cell;eval:window.__s003Veg=window.advisorWorld.geography.villages.find(v=>window.advisorWorld.surface.debugAtSource(v.x+180,v.z).base.material==="Woodland")||window.advisorWorld.geography.villages[0];eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__s003Veg.canonicalPosition);eval:window.advisorWorld.setHalfHeight(230);settle;shot:vegetation-clearance;tap;visible:#cell-panel;shot:vegetation-inspector'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp23-final-surface-webgl2 --name final-surface --profile desktop --renderer webgl2 --timeout 360 --steps "$SURFACE_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp23-final-surface-webgpu --name final-surface --profile desktop --renderer webgpu --timeout 360 --steps "$SURFACE_STEPS"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && always()
        with:
          name: webgpu-evidence
          path: test-results/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
