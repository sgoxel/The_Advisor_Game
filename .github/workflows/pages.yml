name: Build and deploy world atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:webgpu
      - run: xvfb-run -a npx playwright test --config playwright.fallback.config.js
      - name: Capture WP-S002-002-002 handoff evidence
        run: |
          python -m pip install playwright==1.63.0
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/handoff-capture --scenario handoff --profile desktop,phone,phone-landscape --renderer webgl2 --timeout 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgpu-evidence
          path: test-results/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
