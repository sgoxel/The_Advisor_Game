name: R04 NPC Relevance Performance Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/frame_budget_scheduler.js'
      - 'js/npc_relevance_runtime.js'
      - 'js/npc_runtime_bridge.js'
      - 'js/npc_spatial_runtime.js'
      - 'tests/browser/r04-npc-relevance-performance.spec.mjs'
      - '.github/workflows/r04-npc-relevance-performance-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r04-npc-relevance-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record exact candidate
        run: |
          echo "candidate=${GITHUB_SHA}"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deterministic relevance tiers and lazy NPC scheduling
        run: npx playwright test tests/browser/r04-npc-relevance-performance.spec.mjs --project=desktop
      - name: Preserve authoritative GameTime NPC pacing
        run: npx playwright test tests/browser/r04-npc-authoritative-game-time.spec.mjs --project=desktop
      - name: Preserve 100x100 occupancy and adjacent-dialogue behavior
        run: npx playwright test tests/browser/r04-spatial-world-100.spec.mjs --project=desktop
      - name: Preserve indoor work-anchor legality
        run: npx playwright test tests/browser/r04-npc-indoor-work-anchors.spec.mjs --project=desktop
      - name: Preserve R01 cumulative browser compatibility
        run: npx playwright test tests/browser/r01-cumulative.spec.mjs --project=desktop
      - name: Prepare exact-SHA evidence
        if: always()
        run: |
          mkdir -p r04-npc-relevance-performance-evidence
          printf 'candidate=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > r04-npc-relevance-performance-evidence/candidate.txt
          if [ -d playwright-report ]; then cp -R playwright-report r04-npc-relevance-performance-evidence/; fi
          if [ -d test-results ]; then cp -R test-results r04-npc-relevance-performance-evidence/; fi
      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-npc-relevance-performance-${{ github.sha }}
          path: r04-npc-relevance-performance-evidence
          if-no-files-found: error
          retention-days: 14
