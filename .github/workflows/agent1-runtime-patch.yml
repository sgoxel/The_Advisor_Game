name: Agent1 temporary runtime patch
on:
  push:
    branches: [agent1/wp-s002-003-003]
    paths:
      - tools/wp-s002-003-003-runtime-patch.mjs
      - .github/workflows/agent1-runtime-patch.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-003-003
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Correct helper match for current state getter
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/wp-s002-003-003-runtime-patch.mjs')
          s = p.read_text()
          old = '`              : handoffPreparationWaitMs;\\n        return {`'
          new = '`            : handoffPreparationWaitMs;\\n        return {`'
          if old not in s:
              raise SystemExit('ready-byte helper target not found')
          p.write_text(s.replace(old, new))
          PY
      - run: node tools/wp-s002-003-003-runtime-patch.mjs
      - name: Commit generated runtime edit
        run: |
          if git diff --quiet -- src/main.ts; then
            echo "Runtime patch already applied"
            exit 0
          fi
          git config user.name "AGENT #1"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.ts
          git commit -m "WP-S002-003-003 apply runtime streaming budgets"
          git push origin HEAD:agent1/wp-s002-003-003
