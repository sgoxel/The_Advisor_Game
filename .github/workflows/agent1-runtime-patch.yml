name: Agent1 temporary runtime patch
# retrigger after workflow exists on branch
on:
  push:
    branches: [agent1/wp-s002-003-003]
    paths:
      - tools/wp-s002-003-003-runtime-patch.mjs
      - .github/workflows/agent1-runtime-patch.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-003-003
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/wp-s002-003-003-runtime-patch.mjs
      - name: Commit generated runtime edit
        run: |
          if git diff --quiet -- src/main.ts; then
            echo "Runtime patch already applied"
            exit 0
          fi
          git config user.name "AGENT #1"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.ts
          git commit -m "WP-S002-003-003 apply runtime streaming budgets"
          git push origin HEAD:agent1/wp-s002-003-003
