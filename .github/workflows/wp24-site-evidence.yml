name: WP24 critical-site evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify deterministic site authority
        run: node --experimental-strip-types --test tests/sites.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify site UX on WebGL2
        run: xvfb-run -a npx playwright test tests/browser/site.spec.js --config playwright.config.js
      - name: Verify site UX on WebGPU
        run: xvfb-run -a npx playwright test tests/webgpu/site.spec.js --config playwright.webgpu.config.js
  evidence:
    needs: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install playwright==1.63.0
      - name: Capture ruin and critical-place evidence
        run: |
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          RUIN='eval:window.wpSite=window.advisorSites.sites.find(s=>s.kind==="ruin"&&s.visibility==="public");eval:window.advisorWorld.navigation.setFocus(window.wpSite.canonicalPosition.lon,window.wpSite.canonicalPosition.lat);select:#map-scale=1000;settle;visible:.critical-site-marker.ruin:not([hidden]);eval:(()=>{const e=[...document.querySelectorAll(".critical-site-marker.ruin")].find(e=>e.dataset.code===window.wpSite.code&&!e.hidden);if(!e||e.dataset.mode!=="semantic")throw new Error("Exact ruin semantic icon missing")})();shot:ruin-1000;select:#map-scale=100;settle;eval:(()=>{const e=[...document.querySelectorAll(".critical-site-marker.ruin")].find(e=>e.dataset.code===window.wpSite.code&&!e.hidden);if(!e||e.dataset.mode!=="detailed")throw new Error("Exact ruin detail missing");e.click()})();visible:#critical-site-panel;shot:ruin-inspection'
          CRITICAL='eval:window.wpSite=window.advisorSites.sites.find(s=>s.kind==="critical-place"&&s.visibility==="public");eval:window.advisorWorld.navigation.setFocus(window.wpSite.canonicalPosition.lon,window.wpSite.canonicalPosition.lat);select:#map-scale=1000;settle;visible:.critical-site-marker.critical-place:not([hidden]);eval:(()=>{const e=[...document.querySelectorAll(".critical-site-marker.critical-place")].find(e=>e.dataset.code===window.wpSite.code&&!e.hidden);if(!e||e.dataset.mode!=="semantic")throw new Error("Exact critical-place semantic icon missing")})();shot:critical-1000;select:#map-scale=100;settle;eval:(()=>{const e=[...document.querySelectorAll(".critical-site-marker.critical-place")].find(e=>e.dataset.code===window.wpSite.code&&!e.hidden);if(!e||e.dataset.mode!=="detailed")throw new Error("Exact critical-place detail missing");e.click()})();visible:#critical-site-panel;shot:critical-inspection'
          for renderer in webgl2 webgpu; do
            python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp24-ruin-$renderer --name ruin --profile desktop,phone,phone-landscape --renderer $renderer --timeout 240 --steps "$RUIN"
            python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp24-critical-$renderer --name critical --profile desktop,phone,phone-landscape --renderer $renderer --timeout 240 --steps "$CRITICAL"
          done
      - name: Record canonical acceptance summary
        run: node --experimental-strip-types -e 'import("./src/sites.ts").then(m=>console.log(JSON.stringify(m.siteAcceptanceSummary(),null,2)))' | tee test-results/wp24-site-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp24-site-evidence
          path: test-results/
