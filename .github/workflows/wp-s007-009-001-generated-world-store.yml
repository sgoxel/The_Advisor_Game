name: WP-S007-009-001 Generated World Store Evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wp-s007-009-001-generated-world-store.yml
      - scripts/world/generated-world-store.js
      - scripts/world/place-naming.js
      - scripts/world/country-profile.js
      - scripts/world/region-profile.js
      - scripts/world/settlement-archetypes.js
      - scripts/world/world-road-graph.js
      - scripts/world/world-destinations.js
      - scripts/world/campaign-persistence.js
      - scripts/world/planet-stage.js
      - index.html
      - tools/tests/wp-s007-009-001-generated-world-store.test.js
      - tools/tests/wp-s007-009-001-browser-harness.html
      - tools/tests/wp-s007-009-001-indexeddb-browser.py
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  evidence:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/wp-s007-009-001-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser evidence dependencies
        run: python -m pip install selenium

      - name: Verify Chrome
        run: google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Syntax
        run: |
          node --check scripts/world/generated-world-store.js
          node --check scripts/world/place-naming.js
          node --check scripts/world/country-profile.js
          node --check scripts/world/region-profile.js
          node --check scripts/world/settlement-archetypes.js
          node --check scripts/world/world-road-graph.js
          node --check scripts/world/world-destinations.js
          node --check scripts/world/campaign-persistence.js
          node --check scripts/world/planet-stage.js
          node --check tools/tests/wp-s007-009-001-generated-world-store.test.js
          python -m py_compile tools/tests/wp-s007-009-001-indexeddb-browser.py

      - name: Durable cache incremental resume acceptance
        run: node tools/tests/wp-s007-009-001-generated-world-store.test.js

      - name: Real IndexedDB browser restart acceptance
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/wp-s007-009-001-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          python tools/tests/wp-s007-009-001-indexeddb-browser.py

      - name: Comment run link on Issue
        if: github.event_name == 'issue_comment' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `WP-S007-009-001 evidence completed. [Open workflow run](${url}).`
                : `WP-S007-009-001 evidence FAILED. [Open workflow run and logs](${url}).`
            });
