name: AGENT1 WP15 type patch
on:
  push:
    branches: [agent1/wp-s003-003-001-natural-authority]
    paths: [.github/workflows/agent1-wp15-type-patch.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s003-003-001-natural-authority
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Narrow SurfaceWater literals
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/hydrology.ts')
          s=p.read_text()
          pairs={
            'water: { kind: "ocean", level: 0, flowX: 0, flowZ: 0 },':'water: { kind: "ocean", level: 0, flowX: 0, flowZ: 0 } as SurfaceWater,',
            'water: { kind: "lake", level: 0, flowX: 0, flowZ: 0 },':'water: { kind: "lake", level: 0, flowX: 0, flowZ: 0 } as SurfaceWater,',
            'water: { kind: "river", level: Math.max(0, bed + 0.24), flowX: dx / length, flowZ: dz / length },':'water: { kind: "river", level: Math.max(0, bed + 0.24), flowX: dx / length, flowZ: dz / length } as SurfaceWater,',
            'water: { kind: "none", level: -Infinity, flowX: 0, flowZ: 0 },':'water: { kind: "none", level: -Infinity, flowX: 0, flowZ: 0 } as SurfaceWater,',
          }
          for old,new in pairs.items():
              if old not in s:
                  raise RuntimeError(f'missing literal: {old}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name "GPT-5.6 Sol (AGENT #1)"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/hydrology.ts
          git commit -m "WP-S003-003-001 narrow hydrology water types"
          git push origin HEAD:agent1/wp-s003-003-001-natural-authority
