name: Agent6 WP007 Finalize Accepted Reveal

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp007-patch.yml"

permissions:
  contents: write

concurrency:
  group: agent6-wp007-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Finalize accepted WP007 records and cleanup helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path

          changelog = Path('docs/changelog.txt')
          text = changelog.read_text(encoding='utf-8')
          old = '2026-10-03 06:51 +03:00 | Copilot CLI | WP-S003-010-003-007 | Anchored canonical settlement reveal scale to the visible viewport footprint and enlarged early footprint/route/coarse cues to improve readability across terrain LOD changes.\n'
          new = '2026-10-03 07:23 +03:00 | AGENT #6 | WP-S003-010-003-007 | MIXED ACCEPTED — Progressive Local/Settlement World Reveal Before Ground passed final attempt 3/3 on product commit cf6fb8d62b70d7c0884e4c2c14665cc1afd20714; visual-evidence run 37095623760 / artifact 11264466727 was directly inspected at VISUAL 8.1/10 PASS. Resource-relative footprint/route sizing now stays stable through LOD handoffs, the coarse tier exposes all 13 canonical Starting Village building masses and the full canonical road network before refined facade/dressing detail, and all ten fixed-focus checkpoints preserve settlement HSET|VILLAGE|1FDAD1E9 / plan SAF-9A40D1B1 with pendingPreparationCount=0, blockingZoomBuilds=0 and bounded presentation cost. The accepted renderer tree is deployed in descendant 028f0f1406495bdc23a130947342ed9f9c68cae0 via GitHub Pages run 37096181763.\n'
          if old not in text:
              raise SystemExit('expected provisional WP007 changelog line missing')
          changelog.write_text(text.replace(old, new, 1), encoding='utf-8')

          suggest = Path('docs/suggest_log.txt')
          text = suggest.read_text(encoding='utf-8')
          old = '2026-10-03 06:51 +03:00 | WP-S003-010-003-007 | Phase 2 | FUTURE — Add a viewport-tolerant screenshot check for settlement occupied-area coverage at each fixed zoom checkpoint so future terrain LOD handoffs cannot silently shrink the visible canonical settlement. Preserve the current SEED authority, canonical coordinates, and bounded draw-call budgets. Do not implement unless explicitly requested.\n'
          new = '2026-10-03 07:23 +03:00 | WP-S003-010-003-007 | Phase 3 | FUTURE — Reduce coarse-terrain softness and settlement-label crowding during the final approach without changing the accepted resource-relative reveal sizing, canonical 13-building footprint, road authority, SEED identity, fixed focus, or bounded presentation budgets. Require fresh screenshots before any presentation threshold change. Do not implement unless explicitly requested.\n'
          if old not in text:
              raise SystemExit('expected provisional WP007 suggestion line missing')
          suggest.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm -f tools/agent6_wp007_runtime_patch.py tools/agent6_wp007_patch.py .github/workflows/agent6-wp007-patch.yml
          git add docs/changelog.txt docs/suggest_log.txt
          git diff --cached --check
          git commit -m "chore(WP-S003-010-003-007): finalize accepted reveal evidence"
          git pull --rebase origin main
          git push origin HEAD:main
