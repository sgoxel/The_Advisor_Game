name: Agent6 WP007 Harness Patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp007-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp007-harness-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore dedicated WP007 evidence harness
        run: |
          python tools/agent6_wp007_patch.py
          python -m py_compile tools/screenshot_tool.py
          git diff --check
          rm -rf tools/__pycache__
      - name: Commit harness repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/screenshot_tool.py
          if git diff --cached --quiet; then
            echo "WP007 harness already current"
            exit 0
          fi
          git commit -m "test(WP-S003-010-003-007): restore settlement reveal evidence"
          git pull --rebase origin main
          git push origin HEAD:main
