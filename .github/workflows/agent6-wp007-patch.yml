name: Agent6 WP007 Runtime Patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp007-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp007-runtime-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply WP007 runtime continuity fix
        run: |
          python tools/agent6_wp007_runtime_patch.py
          node --check scripts/world/planet-stage.js
          git diff --check
      - name: Commit runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world/planet-stage.js
          if git diff --cached --quiet; then
            echo "WP007 runtime already current"
            exit 0
          fi
          git commit -m "fix(WP-S003-010-003-007): smooth progressive settlement reveal"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main

