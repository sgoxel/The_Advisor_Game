name: WP-S004-006 Social Encounter Evidence

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wp-s004-006-evidence-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  evidence:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/wp-s004-006-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Verify browser
        run: google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Run deterministic social encounter unit test
        run: node tools/tests/wp-s004-006-social-encounters.test.js

      - name: Start local repository server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-wp-s004-006-http.log 2>&1 &
          echo $! >/tmp/advisor-wp-s004-006-http.pid
          sleep 1

      - name: Capture live evidence
        env:
          TARGET: http://127.0.0.1:8000/
        run: python tools/wp_s004_006_evidence.py

      - name: Upload fresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s004-006-evidence-${{ github.run_id }}
          path: tools/screenshots/wp-s004-006/
          if-no-files-found: error
          retention-days: 14

      - name: Comment run link
        if: github.event_name == 'issue_comment' && always()
        uses: actions/github-script@v7
        env:
          RUN_STATUS: ${{ job.status }}
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = process.env.RUN_STATUS === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `WP-S004-006 fresh functional + visual evidence completed. [Open workflow run and artifact](${url}).`
                : `WP-S004-006 fresh evidence FAILED. [Open workflow run and logs](${url}).`
            });
