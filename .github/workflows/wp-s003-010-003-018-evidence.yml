name: WP-S003-010-003-018 Evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wp-s003-010-003-018-evidence.yml
      - tools/test_wp_s003_010_003_018.py
      - scripts/world/planet-stage.js
      - styles/main.css
      - index.html
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  evidence:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       (github.event.comment.user.login == github.repository_owner ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       startsWith(github.event.comment.body, '/wp018-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Verify browser
        run: google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Start local game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! >/tmp/advisor-http.pid
          sleep 1

      - name: Harden same-task zoom command probe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/test_wp_s003_010_003_018.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''def assert_bounded_first_progress(start_scalar, current_scalar, target_scalar, label):
              total = target_scalar - start_scalar
              if abs(total) <= 1e-7:
                  return
              progress = (current_scalar - start_scalar) / total
              # Selenium can yield to one or more rAF ticks between dispatching the input
              # and reading the next snapshot. A valid smooth zoom may therefore have
              # advanced slightly; reject only a backwards jump or an effectively
              # instantaneous arrival near the target.
              if progress < -0.03 or progress >= 0.80:
                  raise AssertionError(
                      f"{label}: rendered scalar jumped too far on command "
                      f"(start={start_scalar}, current={current_scalar}, target={target_scalar}, progress={progress})"
                  )
          ''',
              '''def assert_command_continuity(start_scalar, current_scalar, target_scalar, label):
              delta = abs(current_scalar - start_scalar)
              if delta > 1e-7:
                  raise AssertionError(
                      f"{label}: rendered scalar changed in the same command task "
                      f"(start={start_scalar}, current={current_scalar}, target={target_scalar}, delta={delta})"
                  )
          ''',
              'continuity helper',
          )

          replace_once(
              '''    before = snap(driver)
              before_scalar = float(before["zoom"]["scalar"])
              driver.execute_script("window.PlanetStage.setAnimatedScaleIndex(arguments[0],arguments[1]);", int(index), tag)
              commanded = snap(driver)
          ''',
              '''    command_probe = driver.execute_script("""
              const before=window.PlanetStage.snapshot();
              window.PlanetStage.setAnimatedScaleIndex(arguments[0],arguments[1]);
              const commanded=window.PlanetStage.snapshot();
              return {before,commanded};
            """, int(index), tag)
              before = command_probe["before"]
              before_scalar = float(before["zoom"]["scalar"])
              commanded = command_probe["commanded"]
          ''',
              'transition atomic probe',
          )
          text = text.replace('assert_bounded_first_progress(', 'assert_command_continuity(')

          replace_once(
              '''        wheel_before = snap(driver)
              driver.execute_script("arguments[0].dispatchEvent(new WheelEvent('wheel',{deltaY:-100,bubbles:true,cancelable:true}));", canvas)
              wheel_commanded = snap(driver)
          ''',
              '''        wheel_probe = driver.execute_script("""
                const before=window.PlanetStage.snapshot();
                arguments[0].dispatchEvent(new WheelEvent('wheel',{deltaY:-100,bubbles:true,cancelable:true}));
                const commanded=window.PlanetStage.snapshot();
                return {before,commanded};
              """, canvas)
              wheel_before = wheel_probe["before"]
              wheel_commanded = wheel_probe["commanded"]
          ''',
              'wheel atomic probe',
          )

          replace_once(
              '''        mid = snap(driver)
              scalar_mid = float(mid["zoom"]["scalar"])
              driver.execute_script("window.PlanetStage.setAnimatedScaleIndex(3,'retarget-reverse');")
              immediately = snap(driver)
          ''',
              '''        retarget_probe = driver.execute_script("""
                const before=window.PlanetStage.snapshot();
                window.PlanetStage.setAnimatedScaleIndex(3,'retarget-reverse');
                const commanded=window.PlanetStage.snapshot();
                return {before,commanded};
              """)
              mid = retarget_probe["before"]
              scalar_mid = float(mid["zoom"]["scalar"])
              immediately = retarget_probe["commanded"]
          ''',
              'retarget atomic probe',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run smooth zoom evidence
        run: python tools/test_wp_s003_010_003_018.py "http://127.0.0.1:8000/?evidence_fast_start=1" tools/wp_s003_010_003_018_artifact

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-010-003-018-evidence-${{ github.run_id }}
          path: tools/wp_s003_010_003_018_artifact/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment run link on Issue
        if: github.event_name == 'issue_comment' && always()
        uses: actions/github-script@v7
        env:
          RUN_STATUS: ${{ job.status }}
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.RUN_STATUS === 'success'
                ? `WP-S003-010-003-018 evidence completed. [Open workflow run and artifact](${url}).`
                : `WP-S003-010-003-018 evidence FAILED. [Open workflow run and logs](${url}).`
            });