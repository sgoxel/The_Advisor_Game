name: WP-S008-006 Conversation Transactions

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/world/conversation-transactions.js"
      - "scripts/tests/wp-s008-006-conversation-transactions.test.js"
      - ".github/workflows/wp-s008-006-conversation-transactions.yml"
      - "scripts/world/world-state.js"
      - "scripts/world/campaign-persistence.js"
      - "scripts/world/protagonist-command-evaluator.js"
      - "index.html"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"

permissions:
  contents: read
  issues: write

jobs:
  conversation-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run prerequisite Stage 8 authority regression
        run: node scripts/tests/wp-s008-005-protagonist-command-evaluator.test.js
      - name: Run WP-S008-006 bounded persistence evidence
        run: node scripts/tests/wp-s008-006-conversation-transactions.test.js
      - name: Verify current WP state deployed to GitHub Pages
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE=product
          if grep -q 'WP-S008-006.*COMPLETED' docs/ROADMAP.md; then
            MODE=completed
          elif grep -q 'WP-S008-006 | FUNCTIONAL ACCEPTED' docs/changelog.txt; then
            MODE=accepted
          fi
          for attempt in $(seq 1 24); do
            bust="${GITHUB_SHA}-${attempt}"
            curl -fsSL "${BASE}/scripts/world/conversation-transactions.js?rev=${bust}" -o /tmp/live-transactions.js || true
            curl -fsSL "${BASE}/index.html?rev=${bust}" -o /tmp/live-index.html || true
            curl -fsSL "${BASE}/docs/ROADMAP.md?rev=${bust}" -o /tmp/live-roadmap.md || true
            curl -fsSL "${BASE}/docs/changelog.txt?rev=${bust}" -o /tmp/live-changelog.txt || true
            curl -fsSL "${BASE}/docs/suggest_log.txt?rev=${bust}" -o /tmp/live-suggest.txt || true
            product_ok=0
            state_ok=0
            grep -q 'VERSION="conversation-transactions-v1"' /tmp/live-transactions.js 2>/dev/null && \
              grep -q 'scripts/world/conversation-transactions.js?v=conversation-transactions-v1' /tmp/live-index.html 2>/dev/null && product_ok=1 || true
            if [ "${MODE}" = completed ]; then
              grep -q 'WP-S008-006.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state_ok=1 || true
            elif [ "${MODE}" = accepted ]; then
              if grep -q 'WP-S008-006 | FUNCTIONAL ACCEPTED' /tmp/live-changelog.txt 2>/dev/null && \
                 grep -q 'WP-S008-006 | Phase 1 | Future improvement after accepted implementation' /tmp/live-suggest.txt 2>/dev/null; then
                state_ok=1
              fi
            else
              state_ok=1
            fi
            if [ "${product_ok}" -eq 1 ] && [ "${state_ok}" -eq 1 ]; then
              echo "GitHub Pages verified for WP-S008-006 ${MODE} state on attempt ${attempt}."
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not expose the expected WP-S008-006 ${MODE} markers in time." >&2
          exit 1
      - name: Comment exact run on Issue 183
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const sha = context.sha;
            const url = 'https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId;
            const body = [
              'AGENT #6 WP-S008-006 exact-head workflow: **'+status.toUpperCase()+'**',
              'Commit: '+sha,
              'Run: '+url,
              status === 'success'
                ? 'Conversation persistence evidence passed and the current product/documentation state was verified on GitHub Pages.'
                : 'Workflow or GitHub Pages verification failed; WP remains incomplete.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 183,
              body
            });
