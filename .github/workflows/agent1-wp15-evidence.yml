name: AGENT1 WP-S004 settlement acceptance
on:
  workflow_dispatch:
  push:
    branches: [agent1/wp-s004-001-001-20261015]
    paths: [.github/workflows/agent1-wp15-evidence.yml]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s004-001-001-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply deterministic settlement acceptance patches
        run: |
          node tools/agent1-wp-s004-patch-v2.mjs
          node tools/agent1-wp-s004-patch-v3.mjs
      - run: npm ci
      - name: Focused settlement acceptance tests
        run: node --experimental-strip-types --test tests/settlement-exterior.test.ts tests/world.test.ts
      - run: npm run build
      - name: Commit validated settlement implementation
        run: |
          git config user.name "AGENT #1"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/geography.ts src/settlement-exterior.ts src/world.ts src/geometry.ts tests/world.test.ts
          if git diff --cached --quiet; then
            echo "Settlement implementation already committed"
          else
            git commit -m "feat: finalize deterministic settlement morphology runtime"
            git push origin HEAD:agent1/wp-s004-001-001-20261015
          fi
