name: AGENT1 WP-S004 settlement patch
on:
  push:
    branches: [agent1/wp-s004-001-001-20261015]
    paths: [tools/agent1-wp-s004-patch.mjs, .github/workflows/agent1-wp15-evidence.yml]
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s004-001-001-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply deterministic runtime patch
        run: node tools/agent1-wp-s004-patch.mjs
      - run: npm ci
      - name: Targeted settlement and surface tests
        run: node --experimental-strip-types --test tests/settlement-exterior.test.ts tests/world.test.ts tests/final-surface-integration.test.ts tests/political-atlas.test.ts
      - run: npm run build
      - name: Commit validated runtime wiring
        run: |
          git config user.name "AGENT #1"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world.ts src/geometry.ts tests/world.test.ts tests/final-surface-integration.test.ts
          if git diff --cached --quiet; then
            echo "Runtime patch already applied"
          else
            git commit -m "feat: wire deterministic settlement exteriors"
            git push origin HEAD:agent1/wp-s004-001-001-20261015
          fi
