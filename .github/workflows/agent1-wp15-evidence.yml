name: AGENT1 WP15 canonical containment patch
on:
  push:
    branches:
      - agent1/wp-s003-003-001-natural-authority
    paths:
      - .github/workflows/agent1-wp15-evidence.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical containment correction
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/agent1_patch.py
          python /tmp/agent1_patch.py
          python -c 'from pathlib import Path; p=Path("tests/hydrology.test.ts"); p.write_text(p.read_text().rstrip()+"\n")'
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/hydrology.ts tests/hydrology.test.ts
          git diff --cached --check
          git commit -m "Contain canonical river profiles between stations"
          git push origin HEAD:agent1/wp-s003-003-001-natural-authority
