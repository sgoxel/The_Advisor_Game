name: AGENT1 WP15 canonical containment patch
on:
  push:
    branches: [agent1/wp-s003-003-001-natural-authority]
    paths: [.github/workflows/agent1-wp15-evidence.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic canonical containment correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          hydrology = Path('src/hydrology.ts')
          text = hydrology.read_text()
          start = text.index('function profileMainChannel(')
          end = text.index('\n\nfunction traceRiver(', start)
          replacement = r'''const PROFILE_MAX_DROP_M = 2.4;
function profileMainChannel(points: readonly DrainagePoint[]) {
  const segmentCeilings = points.slice(0, -1).map((point, index) => {
    const next = points[index + 1],
      dx = wrapSourceX(next.x - point.x),
      dz = next.z - point.z,
      length = Math.hypot(dx, dz),
      steps = Math.max(2, Math.ceil(length / SAMPLE_STEP_SOURCE));
    let minimum = Infinity;
    for (let sampleIndex = 0; sampleIndex <= steps; sampleIndex++) {
      const t = sampleIndex / steps,
        x = wrapSourceX(point.x + dx * t),
        z = point.z + dz * t,
        macro = macroSampleAt(sourceToLonLat(x, z));
      if (!macro.land) continue;
      const progress = (index + t) / Math.max(1, points.length - 1),
        terrain = naturalElevationAt(x, z),
        incision = 0.55 + progress * 0.45;
      minimum = Math.min(minimum, terrain - incision);
    }
    return minimum;
  }),
    ceilings = points.map((point, index) => {
      const outlet =
          index === points.length - 1 &&
          !macroSampleAt(sourceToLonLat(point.x, point.z)).land,
        progress = index / Math.max(1, points.length - 1),
        terrain = outlet ? 0.05 : naturalElevationAt(point.x, point.z),
        incision = 0.55 + progress * 0.45,
        own = outlet ? 0.05 : terrain - incision;
      return Math.min(
        own,
        index > 0 ? segmentCeilings[index - 1] : Infinity,
        index < segmentCeilings.length ? segmentCeilings[index] : Infinity,
      );
    }),
    beds = new Array<number>(points.length);
  let previous = Infinity;
  for (let index = 0; index < points.length; index++) {
    const bed = Math.min(
      ceilings[index],
      index === 0 ? Infinity : previous - 0.015,
    );
    beds[index] = bed;
    previous = bed;
  }
  // Interior terrain support changes the canonical profile before interpolation.
  // Spread large drops upstream deterministically so containment does not create
  // serrated query-time clamps or visibly abrupt trench walls.
  for (let index = beds.length - 2; index >= 0; index--)
    beds[index] = Math.min(beds[index], beds[index + 1] + PROFILE_MAX_DROP_M);
  for (let index = 1; index < beds.length; index++)
    beds[index] = Math.min(beds[index], beds[index - 1] - 0.015);
  return points.map((point, index) =>
    Object.freeze({ x: point.x, z: point.z, bed: beds[index] }),
  );
}'''
          hydrology.write_text(text[:start] + replacement + text[end:])

          tests = Path('tests/hydrology.test.ts')
          test_text = tests.read_text()
          if '  naturalElevationAt,\n' not in test_text:
            test_text = test_text.replace(
              '  hydrologyTelemetry,\n  naturalSurfaceAt,\n',
              '  hydrologyTelemetry,\n  naturalElevationAt,\n  naturalSurfaceAt,\n',
              1,
            )
          marker = 'main-channel water remains incised below natural terrain support between stations'
          if marker not in test_text:
            test_text = test_text.rstrip() + r'''


test("main-channel water remains incised below natural terrain support between stations", () => {
  let samples = 0;
  for (const recipe of drainageRecipes)
    for (let index = 1; index < recipe.points.length; index++) {
      const a = recipe.points[index - 1],
        b = recipe.points[index],
        dx = wrapSourceX(b.x - a.x),
        dz = b.z - a.z;
      for (let sampleIndex = 1; sampleIndex <= 16; sampleIndex++) {
        const t = sampleIndex / 16,
          x = wrapSourceX(a.x + dx * t),
          z = a.z + dz * t,
          macro = macroSampleAt(sourceToLonLat(x, z));
        if (!macro.land) continue;
        const sample = naturalSurfaceAt(x, z);
        assert.equal(sample.water.kind, "river", `${recipe.code} interior channel is dry`);
        const naturalSupport = naturalElevationAt(x, z);
        assert.ok(
          sample.water.level <= naturalSupport + 1e-6,
          `${recipe.code} water exceeds natural support by ${(sample.water.level - naturalSupport).toFixed(6)}m`,
        );
        samples++;
      }
    }
  assert.ok(samples > 1000, `expected broad containment coverage, got ${samples}`);
});
''' + '\n'
          tests.write_text(test_text)
          PY
          git show d4f56f5c6291f295a96404d45bdf5292dc5fcc22:.github/workflows/agent1-wp15-evidence.yml > .github/workflows/agent1-wp15-evidence.yml
          sed -i 's/EVIDENCE_REVISION: "16"/EVIDENCE_REVISION: "17"/' .github/workflows/agent1-wp15-evidence.yml
          sed -i 's/name: wp15-attempt3-evidence/name: wp15-current-run-attempt1-evidence/' .github/workflows/agent1-wp15-evidence.yml
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/hydrology.ts tests/hydrology.test.ts .github/workflows/agent1-wp15-evidence.yml
          git diff --cached --check
          git commit -m "Contain canonical river profiles between stations"
          git push origin HEAD:agent1/wp-s003-003-001-natural-authority
