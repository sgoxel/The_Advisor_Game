name: Validate work package
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run unit tests
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          npm test 2>&1 | tee test-results/unit-test.log
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:webgpu
      - run: xvfb-run -a npx playwright test --config playwright.fallback.config.js
      - run: xvfb-run -a npx playwright test --config playwright.navigation.config.js
      - name: Capture canonical inspector and WP evidence
        run: |
          python -m pip install playwright==1.63.0
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/canonical-inspector-webgl2 --scenario cell --profile desktop,phone --renderer webgl2 --timeout 180
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/canonical-inspector-webgpu --scenario cell --profile desktop,phone --renderer webgpu --timeout 180
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp10-wrap-webgl2 --name wrap --profile desktop,phone --renderer webgl2 --timeout 240 --steps "eval:window.advisorWorld.setHalfHeight(97);eval:window.advisorWorld.navigation.setFocus(Math.PI-0.003,0.12);check:#grid;settle;shot:east;eval:window.advisorWorld.navigation.setFocus(-Math.PI+0.003,0.12);settle;shot:west"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp10-north-webgl2 --name north --profile desktop,phone --renderer webgl2 --timeout 240 --steps "eval:window.advisorWorld.setHalfHeight(97);eval:window.advisorWorld.navigation.setFocus(0.55,Math.PI);check:#grid;settle;shot:pole"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp10-south-webgl2 --name south --profile desktop,phone --renderer webgl2 --timeout 240 --steps "eval:window.advisorWorld.setHalfHeight(97);eval:window.advisorWorld.navigation.setFocus(-0.8,-Math.PI);check:#grid;settle;shot:pole"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp10-wrap-webgpu --name wrap --profile desktop,phone --renderer webgpu --timeout 240 --steps "eval:window.advisorWorld.setHalfHeight(97);eval:window.advisorWorld.navigation.setFocus(Math.PI-0.003,0.12);check:#grid;settle;shot:east;eval:window.advisorWorld.navigation.setFocus(-Math.PI+0.003,0.12);settle;shot:west"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp10-north-webgpu --name north --profile desktop,phone --renderer webgpu --timeout 240 --steps "eval:window.advisorWorld.setHalfHeight(97);eval:window.advisorWorld.navigation.setFocus(0.55,Math.PI);check:#grid;settle;shot:pole"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp10-south-webgpu --name south --profile desktop,phone --renderer webgpu --timeout 240 --steps "eval:window.advisorWorld.setHalfHeight(97);eval:window.advisorWorld.navigation.setFocus(-0.8,-Math.PI);check:#grid;settle;shot:pole"
          TRAVEL_STEPS='click:#open-travel;visible:#travel-panel;visible:#travel-summary;shot:travel'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp12-travel-webgl2 --name travel --profile desktop,phone --renderer webgl2 --timeout 180 --steps "$TRAVEL_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp12-travel-webgpu --name travel --profile desktop,phone --renderer webgpu --timeout 180 --steps "$TRAVEL_STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-validation-evidence
          path: test-results/
