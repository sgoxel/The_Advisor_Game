name: Validate work package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:webgpu
      - run: xvfb-run -a npx playwright test --config playwright.fallback.config.js
      - run: xvfb-run -a npx playwright test --config playwright.navigation.config.js
      - name: Capture canonical inspector and WP evidence
        run: |
          python -m pip install playwright==1.63.0
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/canonical-inspector-webgl2 --scenario cell --profile desktop,phone --renderer webgl2 --timeout 180
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/canonical-inspector-webgpu --scenario cell --profile desktop,phone --renderer webgpu --timeout 180
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp10-wrap-webgl2 --name wrap --profile desktop,phone --renderer webgl2 --timeout 240 --steps "eval:window.advisorWorld.setHalfHeight(97);eval:window.advisorWorld.navigation.setFocus(Math.PI-0.003,0.12);check:#grid;settle;shot:east;eval:window.advisorWorld.navigation.setFocus(-Math.PI+0.003,0.12);settle;shot:west"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp10-north-webgl2 --name north --profile desktop,phone --renderer webgl2 --timeout 240 --steps "eval:window.advisorWorld.setHalfHeight(97);eval:window.advisorWorld.navigation.setFocus(0.55,Math.PI);check:#grid;settle;shot:pole"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp10-south-webgl2 --name south --profile desktop,phone --renderer webgl2 --timeout 240 --steps "eval:window.advisorWorld.setHalfHeight(97);eval:window.advisorWorld.navigation.setFocus(-0.8,-Math.PI);check:#grid;settle;shot:pole"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp10-wrap-webgpu --name wrap --profile desktop,phone --renderer webgpu --timeout 240 --steps "eval:window.advisorWorld.setHalfHeight(97);eval:window.advisorWorld.navigation.setFocus(Math.PI-0.003,0.12);check:#grid;settle;shot:east;eval:window.advisorWorld.navigation.setFocus(-Math.PI+0.003,0.12);settle;shot:west"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp10-north-webgpu --name north --profile desktop,phone --renderer webgpu --timeout 240 --steps "eval:window.advisorWorld.setHalfHeight(97);eval:window.advisorWorld.navigation.setFocus(0.55,Math.PI);check:#grid;settle;shot:pole"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp10-south-webgpu --name south --profile desktop,phone --renderer webgpu --timeout 240 --steps "eval:window.advisorWorld.setHalfHeight(97);eval:window.advisorWorld.navigation.setFocus(-0.8,-Math.PI);check:#grid;settle;shot:pole"
          TRAVEL_STEPS='click:#open-travel;visible:#travel-panel;visible:#travel-summary;shot:travel'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp12-travel-webgl2 --name travel --profile desktop,phone --renderer webgl2 --timeout 180 --steps "$TRAVEL_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp12-travel-webgpu --name travel --profile desktop,phone --renderer webgpu --timeout 180 --steps "$TRAVEL_STEPS"
          MACRO_STEPS='click:#overview;settle;shot:realm-home;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.continents[1].canonicalPosition);settle;shot:realm-westreach;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.continents[2].canonicalPosition);settle;shot:realm-dawnlands;eval:(m=>window.advisorWorld.navigation.setFocus(m.center.lon,m.center.lat))(window.advisorWorld.geography.mountainSystems.find(m=>m.kind==="low-highlands"));eval:window.advisorWorld.setHalfHeight(3000);settle;shot:low-highlands-local;eval:(m=>window.advisorWorld.navigation.setFocus(m.center.lon,m.center.lat))(window.advisorWorld.geography.mountainSystems.find(m=>m.kind==="long-chain"));settle;shot:long-chain-local;eval:(m=>window.advisorWorld.navigation.setFocus(m.center.lon,m.center.lat))(window.advisorWorld.geography.mountainSystems.find(m=>m.kind==="dominant-spine"));settle;shot:dominant-spine-local;eval:(m=>window.advisorWorld.navigation.setFocus(m.center.lon,m.center.lat))(window.advisorWorld.geography.mountainSystems.find(m=>m.kind==="hooked-range"));settle;shot:hooked-range-local;eval:(m=>window.advisorWorld.navigation.setFocus(m.center.lon,m.center.lat))(window.advisorWorld.geography.mountainSystems.find(m=>m.kind==="volcano"));eval:window.advisorWorld.setHalfHeight(1400);settle;shot:volcano-local'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp13-macro-webgl2 --name macro --profile desktop,phone,phone-landscape --renderer webgl2 --timeout 360 --steps "$MACRO_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp13-macro-webgpu --name macro --profile desktop,phone,phone-landscape --renderer webgpu --timeout 360 --steps "$MACRO_STEPS"
          BIOME_STEPS='eval:window.__climateTargets=Array.from({length:72},(_,y)=>Array.from({length:144},(_,x)=>({lon:(x*2.5-178.75)*Math.PI/180,lat:(y*2.5-88.75)*Math.PI/180}))).flat().concat(window.advisorWorld.geography.mountainSystems.flatMap(m=>[m.center,...m.path])).reduce((a,p)=>(c=>a[c.terrainClass]?a:Object.assign(a,{[c.terrainClass]:p}))(window.advisorWorld.planet.climateSampleAt(p)),{});click:#overview;eval:window.advisorWorld.navigation.setFocus(0,Math.PI/2);settle;shot:north-pole-realm;eval:window.advisorWorld.navigation.setFocus(0,-Math.PI/2);settle;shot:south-pole-realm;eval:window.advisorWorld.setHalfHeight(1800);eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets.grassland);settle;shot:grassland;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets.desert);settle;shot:desert;eval:window.advisorWorld.setHalfHeight(700);eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets.beach);settle;shot:beach;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets.cliff);settle;shot:cliff;eval:window.advisorWorld.setHalfHeight(300);eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets["conifer-forest"]);settle;shot:conifer-forest-close;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets["temperate-forest"]);settle;shot:temperate-forest-close;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets["dry-woodland"]);settle;shot:dry-woodland-close;eval:window.advisorWorld.setHalfHeight(360);eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets["snowy-mountain"]);settle;shot:snowy-mountain;eval:window.advisorWorld.setHalfHeight(400);eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))((window.__climateTargets["polar-ice"]||window.__climateTargets.tundra||window.__climateTargets["sea-ice"]));settle;shot:frozen-local'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp14-biomes-webgl2 --name biomes --profile desktop,phone --renderer webgl2 --timeout 240 --steps "$BIOME_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp14-biomes-webgpu --name biomes --profile desktop,phone --renderer webgpu --timeout 240 --steps "$BIOME_STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-validation-evidence
          path: test-results/
