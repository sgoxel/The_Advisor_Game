name: Agent6 WP162 Attempt2 Terrain Patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp162-attempt2-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp162-attempt2-terrain-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch physically resolvable medium-context continuity
        run: |
          python tools/agent6_wp162_attempt2_patch.py
          node --check scripts/world/planet-stage.js
          git diff --check
      - name: Commit tested product patch and remove temporary patch helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world/planet-stage.js
          git rm tools/agent6_wp162_attempt2_patch.py .github/workflows/agent6-wp162-attempt2-patch.yml
          if git diff --cached --quiet; then
            echo "WP162 attempt 2 terrain patch already current"
            exit 0
          fi
          git commit -m "fix(WP-S003-010-003-005-002): harmonize near-ground parent detail"
          git pull --rebase origin main
          git push origin HEAD:main
