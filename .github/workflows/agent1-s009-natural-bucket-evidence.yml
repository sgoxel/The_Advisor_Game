name: S009 indexed settlement exact surface and cold resident performance
on:
  push:
    branches: [agent1/wp-s009-001-natural-bucket-evidence-20261028]
    paths: ['.github/workflows/agent1-s009-natural-bucket-evidence.yml']
permissions:
  contents: read
concurrency:
  group: s009-transport-metrics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  transport-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Exact byte-for-byte SEED natural mesh output versus parent main
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/.s009-vertex-signature.mjs <<'JS'
          import { createHash } from 'node:crypto';
          import { rebuildNaturalSurface } from '../src/natural-surface-mesh.ts';
          import { buildTile } from '../src/geometry.ts';
          import { villages } from '../src/geography.ts';
          import { tileForPosition, finalSurfaceEvidenceAnchors } from '../src/world.ts';
          import { drainageRecipes } from '../src/hydrology.ts';
          const bridge = finalSurfaceEvidenceAnchors().bridge;
          const stream = drainageRecipes[0].points[Math.floor(drainageRecipes[0].points.length * 0.55)];
          const points = [[villages[0].x,villages[0].z,10],[bridge.x,bridge.z,14],[stream.x,stream.z,13]];
          const result=[];
          for(const [x,z,level] of points){
            const tile=tileForPosition(x,z,level),
              mesh=rebuildNaturalSurface(tile,buildTile(tile).terrain),
              signature=createHash('sha256');
            for(const name of ['positions','normals','colors','indices','uvs']){
              const data=mesh.geometry[name];
              signature.update(name);
              signature.update(Buffer.from(data.buffer,data.byteOffset,data.byteLength));
            }
            result.push({tile:tile.key,hash:signature.digest('hex'),replaced:mesh.replaced,
              leaves:mesh.leaves,samples:mesh.samples,surfaceVertices:mesh.surfaceVertices,
              cpuScratchBytesEstimated:mesh.cpuScratchBytesEstimated,waterBoundary4:mesh.waterBoundary4});
          }
          console.log(JSON.stringify(result));
          JS
          node --experimental-strip-types tests/.s009-vertex-signature.mjs >/tmp/s009-after.json
          cp src/natural-surface-mesh.ts /tmp/s009-natural-bucket-new.ts
          git show ff372d712f3bed1cd54c40b908105360346a4b33:src/natural-surface-mesh.ts >src/natural-surface-mesh.ts
          node --experimental-strip-types tests/.s009-vertex-signature.mjs >/tmp/s009-before.json
          cp /tmp/s009-natural-bucket-new.ts src/natural-surface-mesh.ts
          rm tests/.s009-vertex-signature.mjs
          cat /tmp/s009-after.json
          cmp /tmp/s009-before.json /tmp/s009-after.json
          echo 'EXACT NATURAL MESH OUTPUT: IDENTICAL'
      - name: Focused canonical shoreline, road, skirt and mesh bounds
        run: timeout --signal=TERM --kill-after=10s 600s node --experimental-strip-types --test tests/natural-surface-mesh.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install playwright==1.63.0 mss==10.1.0 pillow==11.3.0
      - name: Capture actual cold and warm resident transport with original screenshot tool
        shell: bash
        run: |
          npm run preview -- --port 4174 >/tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          STEPS='eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.villages[0].canonicalPosition);eval:window.advisorWorld.setHalfHeight(18);wait:120000;shot:cold-facts;eval:window.advisorWorld.setHalfHeight(22);wait:15000;shot:warm-facts'
          xvfb-run -a -s '-screen 0 2560x2560x24' timeout --signal=TERM --kill-after=10s 960s python tools/screenshot_tool.py http://127.0.0.1:4174/ --headed --out test-results/s009-natural-bucket-evidence --name resident-transport --profile fullhd-landscape --renderer webgl2 --fixed-time-ms 1792874335750 --initial-ready-only --timeout 180 --steps "$STEPS"
      - name: Print bounded transport and worker samples
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          file=pathlib.Path('test-results/s009-natural-bucket-evidence/capture.json')
          if not file.exists():
              print('No complete capture; transport metrics PENDING')
          else:
              for entry in json.loads(file.read_text()):
                  perf=entry.get('performance') or {}
                  print('CAPTURE',entry.get('file'),'backend',entry.get('backend'),'viewport',entry.get('viewport'))
                  print('TRANSPORT',json.dumps(perf.get('residentQueryPhases'),separators=(',',':'))[:13000])
                  for key in ('workerMs','workerPhasesMs','uploadMs','firstResidentFactMs','residentFactStatus','maxGenerationReadyObserved','maxUploadsPerFrame'):
                      print(key, json.dumps(perf.get(key),separators=(',',':'))[:6000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s009-natural-bucket-source-metrics
          path: test-results/s009-natural-bucket-evidence/
          if-no-files-found: warn
