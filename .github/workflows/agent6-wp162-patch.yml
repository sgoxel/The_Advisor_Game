name: Agent6 WP162 parent-ring continuity patch

on:
  push:
    paths:
      - '.github/workflows/agent6-wp162-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message == 'chore(agent6): retry WP162 parent-ring continuity patch'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve continuous parent coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/world/planet-stage.js')
          text = path.read_text()
          targets = (
              '    carveNestedRingCenterAlpha(medium,LOCAL_MEDIUM_RING_SPAN_FACTOR);\n',
              '    carveNestedRingCenterAlpha(surround,LOCAL_SURROUND_SPAN_FACTOR/LOCAL_MEDIUM_RING_SPAN_FACTOR);\n',
          )
          for target in targets:
              count = text.count(target)
              if count != 1:
                  raise SystemExit(f'expected one exact carve call, found {count}: {target.strip()}')
              text = text.replace(target, '', 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- scripts/world/planet-stage.js
      - name: Commit product correction
        shell: bash
        run: |
          git config user.name 'AGENT #6'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scripts/world/planet-stage.js
          git commit -m 'WP-S003-010-003-005-002 preserve parent ring coverage'
          git pull --rebase origin main
          git push origin HEAD:main
