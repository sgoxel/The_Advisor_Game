name: Agent6 WP006 Attempt 3 Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent6-wp006-a3-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply radial continuation handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/world/planet-stage.js')
          text = path.read_text()
          old0 = '''const LOCAL_TEXTURE_HANDOFF_FEATHER=.12;
          function detailOctaveWeight(wavelengthMeters,metersPerTexel){return smoothstep01((wavelengthMeters/Math.max(1e-6,metersPerTexel)-2)/4);}'''
          new0 = '''const LOCAL_TEXTURE_HANDOFF_FEATHER=.12;
          // Medium continuation textures are presentation coverage, not canonical tile
          // boundaries. Fade them radially across most of their span so the prepared
          // parent remains continuous without exposing a rectangular streaming footprint.
          const LOCAL_CONTEXT_RING_RADIAL_FEATHER=.62;
          function localTextureHandoffCoverage(u,v,contextRing){
            if(contextRing){
              const radialDistance=Math.hypot((u-.5)*2,(v-.5)*2);
              return smoothstep01(clamp((1-radialDistance)/LOCAL_CONTEXT_RING_RADIAL_FEATHER,0,1));
            }
            const edgeDistance=Math.min(u,1-u,v,1-v);
            return smoothstep01(clamp(edgeDistance/LOCAL_TEXTURE_HANDOFF_FEATHER,0,1));
          }
          function detailOctaveWeight(wavelengthMeters,metersPerTexel){return smoothstep01((wavelengthMeters/Math.max(1e-6,metersPerTexel)-2)/4);}'''
          old1 = '''          const probeEdge=Math.min(ux,1-ux,vz,1-vz);
                    const probeAlpha=featherEdges?smoothstep01(clamp(probeEdge/LOCAL_TEXTURE_HANDOFF_FEATHER,0,1)):1;'''
          new1 = '''          const probeAlpha=featherEdges?localTextureHandoffCoverage(ux,vz,contextRing):1;'''
          old2 = '''      const edgeDistance=Math.min(ux,1-ux,vz,1-vz);
                const edgeCoverage=smoothstep01(clamp(edgeDistance/LOCAL_TEXTURE_HANDOFF_FEATHER,0,1));'''
          new2 = '''      const edgeCoverage=localTextureHandoffCoverage(ux,vz,contextRing);'''
          for label, old in [('helper',old0),('probe',old1),('coverage',old2)]:
              if text.count(old) != 1:
                  raise SystemExit(f'expected {label} block once, found {text.count(old)}')
          path.write_text(text.replace(old0,new0).replace(old1,new1).replace(old2,new2))
          PY
      - name: Commit patch and clean runner
        run: |
          rm .github/workflows/agent6-wp006-a3-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/world/planet-stage.js .github/workflows/agent6-wp006-a3-patch.yml
          git commit -m 'fix(wp-s003-010-003-006): radial blend continuation coverage'
          git pull --rebase origin main
          git push origin HEAD:main
