name: Agent6 WP006 Attempt 3 Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent6-wp006-a3-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply radial continuation handoff
        run: |
          echo '' | base64 -d > /tmp/wp006_a3_patch.py
          python /tmp/wp006_a3_patch.py
      - name: Commit patch and clean runner
        run: |
          rm .github/workflows/agent6-wp006-a3-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/world/planet-stage.js .github/workflows/agent6-wp006-a3-patch.yml
          git commit -m 'fix(wp-s003-010-003-006): radial blend continuation coverage'
          git pull --rebase origin main
          git push origin HEAD:main
