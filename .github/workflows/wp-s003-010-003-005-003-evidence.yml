name: WP-S003-010-003-005-003 Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - scripts/ui/protagonist-focus-ui.js
      - tools/wp_s003_010_003_005_003_evidence.py
      - .github/workflows/wp-s003-010-003-005-003-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp-s003-010-003-005-003-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser evidence dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Verify browser
        run: google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Start local game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-wp005003-http.log 2>&1 &
          echo $! >/tmp/advisor-wp005003-http.pid
          sleep 1

      - name: Run deterministic protagonist focus evidence
        env:
          TARGET: http://127.0.0.1:8000/
          OUT: tools/screenshots/wp-s003-010-003-005-003
        run: python tools/wp_s003_010_003_005_003_evidence.py

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-010-003-005-003-evidence
          path: tools/screenshots/wp-s003-010-003-005-003/
          if-no-files-found: warn
          retention-days: 14
