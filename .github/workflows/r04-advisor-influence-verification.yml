name: R04 Advisor Influence Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/advisor_conversation_contract.js'
      - 'js/local_bot_driver.js'
      - 'js/protagonist_driver_intent.js'
      - 'js/autonomous_action_execution.js'
      - 'js/autonomous_decision_loop.js'
      - 'tests/browser/r04-advisor-influence-local-bot.spec.mjs'
      - 'tests/browser/r04-advisor-conversation-contract.spec.mjs'
      - 'tests/browser/r04-local-bot-selection.spec.mjs'
      - 'tests/browser/r04-autonomous-action-execution.spec.mjs'
      - 'tests/browser/r04-autonomous-decision-loop.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r04-advisor-influence-verification.yml'
  pull_request:
    paths:
      - 'js/advisor_conversation_contract.js'
      - 'js/local_bot_driver.js'
      - 'js/protagonist_driver_intent.js'
      - 'js/autonomous_action_execution.js'
      - 'js/autonomous_decision_loop.js'
      - 'tests/browser/r04-advisor-influence-local-bot.spec.mjs'
      - 'tests/browser/r04-advisor-conversation-contract.spec.mjs'
      - 'tests/browser/r04-local-bot-selection.spec.mjs'
      - 'tests/browser/r04-autonomous-action-execution.spec.mjs'
      - 'tests/browser/r04-autonomous-decision-loop.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r04-advisor-influence-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-advisor-influence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: echo "R04 Advisor influence candidate ${GITHUB_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused Advisor influence regression
        run: npx playwright test tests/browser/r04-advisor-influence-local-bot.spec.mjs --project=desktop
      - name: Preserve Advisor conversation contract
        run: npx playwright test tests/browser/r04-advisor-conversation-contract.spec.mjs --project=desktop
      - name: Preserve deterministic Local BOT selection
        run: npx playwright test tests/browser/r04-local-bot-selection.spec.mjs --project=desktop
      - name: Preserve autonomous action execution authority
        run: npx playwright test tests/browser/r04-autonomous-action-execution.spec.mjs --project=desktop
      - name: Preserve bounded decision-loop stale-work safeguards
        run: npx playwright test tests/browser/r04-autonomous-decision-loop.spec.mjs --project=desktop
      - name: Upload focused R04 Advisor influence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-advisor-influence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
