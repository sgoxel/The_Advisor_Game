name: WP15 apply authority correction

on:
  pull_request:
    paths:
      - ".github/workflows/wp15-apply-attempt.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-current-main
          fetch-depth: 0
      - name: Apply correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/village-routes.ts")
          text = path.read_text()
          old = '    heightM: surface.elevation,\n    highland: surface.traversal === "difficult" ? 1 : 0,'
          new = '    // Final surface already owns cliff/slope legality. Repair search must not add a second cliff classifier.\n    heightM: 0,\n    highland: surface.traversal === "difficult" ? 1 : 0,'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("expected sampler block not found")
          PY
      - name: Commit and push
        run: |
          if git diff --quiet -- src/village-routes.ts; then
            exit 0
          fi
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/village-routes.ts
          git commit -m "WP-S002-004-005: honor final traversal authority in repair search"
          git push origin HEAD:agent1/wp-s002-004-005-current-main
