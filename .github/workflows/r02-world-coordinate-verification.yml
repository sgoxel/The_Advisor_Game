name: R02 World Coordinate Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/rng.js'
      - 'tests/browser/r02-world-coordinate-contract.spec.mjs'
      - '.github/workflows/r02-world-coordinate-verification.yml'
  pull_request:
    paths:
      - 'js/rng.js'
      - 'tests/browser/r02-world-coordinate-contract.spec.mjs'
      - '.github/workflows/r02-world-coordinate-verification.yml'

permissions:
  contents: read

jobs:
  world-coordinate-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: git rev-parse HEAD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused world-coordinate contract regression
        run: npx playwright test tests/browser/r02-world-coordinate-contract.spec.mjs --project=desktop
      - name: Re-run deterministic seed and world-state foundations
        run: npx playwright test tests/browser/r02-seed-rng.spec.mjs tests/browser/r02-authoritative-state.spec.mjs tests/browser/r02-world-initialization.spec.mjs --project=desktop
      - name: Run stabilized R01 browser regression
        run: npm run test:browser:r01
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r02-t12-world-coordinate-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
