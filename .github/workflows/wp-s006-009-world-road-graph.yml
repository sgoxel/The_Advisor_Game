name: WP-S006-009 World Road Graph Evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wp-s006-009-world-road-graph.yml
      - scripts/world/world-road-graph.js
      - scripts/world/settlement-archetypes.js
      - scripts/world/starting-village.js
      - scripts/world/geography.js
      - scripts/world/planet-geography.js
      - scripts/world/political-geography.js
      - scripts/world/region-profile.js
      - scripts/world/road-signposts.js
      - tools/tests/wp-s006-009-world-road-graph.test.js
      - tools/wp_s006_009_visual.py
      - world-road-graph-proof.html
      - index.html
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  evidence:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/wp-s006-009-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          node --check scripts/world/world-road-graph.js
          node --check tools/tests/wp-s006-009-world-road-graph.test.js
          python -m py_compile tools/wp_s006_009_visual.py

      - name: Deterministic hierarchical road graph acceptance
        run: node tools/tests/wp-s006-009-world-road-graph.test.js

      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Start local game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! > /tmp/advisor-http.pid

      - name: Fresh desktop and phone road-network evidence
        env:
          TARGET: http://127.0.0.1:8000/world-road-graph-proof.html
          EVIDENCE_DIR: tools/screenshots/wp-s006-009
        run: python tools/wp_s006_009_visual.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s006-009-road-graph-evidence
          path: tools/screenshots/wp-s006-009
          if-no-files-found: error
          retention-days: 14

      - name: Comment run link on Issue
        if: github.event_name == 'issue_comment' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `WP-S006-009 evidence completed. [Open workflow run and artifact](${url}).`
                : `WP-S006-009 evidence FAILED. [Open workflow run and logs](${url}).`
            });
