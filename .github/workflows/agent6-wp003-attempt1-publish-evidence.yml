name: Agent6 WP003 Attempt1 Publish Evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp003-attempt1-publish-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp003-attempt1-publish-evidence
  cancel-in-progress: false

jobs:
  capture-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Start local game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! >/tmp/advisor-http.pid
          sleep 1
      - name: Capture exact-product landscape and portrait evidence
        run: |
          set -euo pipefail
          rm -rf tools/screenshots/agent6-wp003-attempt1
          mkdir -p tools/screenshots/agent6-wp003-attempt1/landscape tools/screenshots/agent6-wp003-attempt1/portrait

          python tools/screenshot_tool.py http://127.0.0.1:8000/ visual-wp-s003-010-003 \
            --profile landscape --scenario wp-s003-010-003 --shots 1 --timestamp-names \
            --wait-min 1 --wait-max 1 --no-publish \
            --evidence-json evidence-wp-s003-010-003-attempt1-landscape.json
          find tools/screenshots -maxdepth 1 -type f \( -name '*.png' -o -name 'evidence-wp-s003-010-003-attempt1-landscape.json' \) \
            -exec mv {} tools/screenshots/agent6-wp003-attempt1/landscape/ \;

          python tools/screenshot_tool.py http://127.0.0.1:8000/ visual-wp-s003-010-003 \
            --profile portrait --scenario wp-s003-010-003 --shots 1 --timestamp-names \
            --wait-min 1 --wait-max 1 --no-publish \
            --evidence-json evidence-wp-s003-010-003-attempt1-portrait.json
          find tools/screenshots -maxdepth 1 -type f \( -name '*.png' -o -name 'evidence-wp-s003-010-003-attempt1-portrait.json' \) \
            -exec mv {} tools/screenshots/agent6-wp003-attempt1/portrait/ \;

          test "$(find tools/screenshots/agent6-wp003-attempt1/landscape -name '*.png' | wc -l)" -ge 1
          test "$(find tools/screenshots/agent6-wp003-attempt1/portrait -name '*.png' | wc -l)" -ge 1
          find tools/screenshots/agent6-wp003-attempt1 -type f -print | sort
      - name: Commit inspectable evidence only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/screenshots/agent6-wp003-attempt1
          git commit -m "test(WP-S003-010-003): publish attempt 1 screenshots"
          git pull --rebase origin main
          git push origin HEAD:main
