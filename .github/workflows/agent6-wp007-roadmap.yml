name: Agent6 WP007 Completion Bookkeeping

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp007-roadmap.yml"

permissions:
  contents: write

concurrency:
  group: agent6-wp007-completion
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Mark WP007 completed and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/ROADMAP.md')
          text = p.read_text(encoding='utf-8')
          old = '- `WP-S003-010-003-007` — Progressive Local/Settlement World Reveal Before Ground\n'
          new = '- `WP-S003-010-003-007` — Progressive Local/Settlement World Reveal Before Ground — COMPLETED\n'
          if text.count(old) != 1:
              raise SystemExit(f'WP007 roadmap anchor count={text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm -f .github/workflows/agent6-wp007-roadmap.yml
          git add docs/ROADMAP.md
          git diff --cached --check
          git commit -m "docs(WP-S003-010-003-007): mark completed"
          git pull --rebase origin main
          git push origin HEAD:main
