name: R04 NPC Conversation Guard Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/npc_indoor_work_anchors.js'
      - 'js/npc_contextual_activity.js'
      - 'tests/browser/r04-npc-conversation-guard.spec.mjs'
      - '.github/workflows/r04-npc-conversation-guard-verification.yml'
  pull_request:
    paths:
      - 'js/npc_indoor_work_anchors.js'
      - 'js/npc_contextual_activity.js'
      - 'tests/browser/r04-npc-conversation-guard.spec.mjs'
      - '.github/workflows/r04-npc-conversation-guard-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversation-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: git rev-parse HEAD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify partner-backed adjacent conversation lifecycle
        run: npx playwright test tests/browser/r04-npc-conversation-guard.spec.mjs --project=desktop
      - name: Run stabilized R01 browser regression
        if: always()
        run: npm run test:browser:r01
      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-npc-conversation-guard-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14