name: Agent Health Audit

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale-lock-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const staleMs = 3 * 60 * 60 * 1000;
            const now = Date.now();
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;
              const body = issue.body || '';
              const claim = body.match(/^Claim:\s*(.+)$/m)?.[1]?.trim();
              if (!claim || claim === 'NONE') continue;

              const at = claim.lastIndexOf('@');
              if (at < 1) continue;
              const timestamp = claim.slice(at + 1).trim();
              const claimedAt = Date.parse(timestamp);
              if (!Number.isFinite(claimedAt) || now - claimedAt <= staleMs) continue;

              const marker = `<!-- stale-lock-audit:${claim} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              if (comments.some(c => c.body?.includes(marker))) continue;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${marker}\n⚠️ **Stale lock audit:** \`${claim}\` is older than 3 hours. Audit only; no Issue fields were changed. A routine must recover the stale lock under \`AGENTS.md\`.`
              });
            }
