name: WP-S005 transport acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - src/transport-network.ts
      - src/transport-inspector.ts
      - src/transport-inspector.css
      - src/world.ts
      - src/village-routes.ts
      - tests/transport-network.test.ts
      - index.html
      - package.json
      - .github/workflows/wp-s005-evidence.yml

permissions:
  contents: read

jobs:
  transport-acceptance:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run deterministic transport tests
        run: |
          mkdir -p test-results
          set -o pipefail
          npm test 2>&1 | tee test-results/wp-s005-test.log
      - run: npm run build
      - run: npx playwright install chromium
      - run: python -m pip install playwright==1.63.0
      - name: Capture deterministic transport evidence
        run: |
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          TRANSPORT_STEPS='eval:window.advisorTransport.focusEvidence("bridge");settle;visible:#transport-panel;shot:river-bridge-1-100;eval:window.advisorTransport.focusEvidence("border-crossing");settle;shot:capital-border-crossing-1-100;eval:window.advisorTransport.focusEvidence("lake-detour");settle;shot:lake-detour-1-100;eval:window.advisorTransport.focusEvidence("mountain-pass");settle;shot:mountain-pass-1-100;eval:window.advisorTransport.focusEvidence("junction");settle;shot:shared-junction-1-100;eval:window.advisorTransport.focusEvidence("harbor");settle;shot:road-linked-harbor-1-100;eval:window.advisorTransport.focusEvidence("ferry");settle;shot:sea-link-semantics;eval:(s=>{s.value="250";s.dispatchEvent(new Event("change",{bubbles:true}))})(document.querySelector("#map-scale"));settle;shot:roads-hidden-1-250'
          PROFILES='desktop,laptop,tablet,phone,phone-landscape,phone-small,tablet-portrait'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp-s005-webgl2 --name transport --profile "$PROFILES" --renderer webgl2 --timeout 720 --steps "$TRANSPORT_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp-s005-webgpu --name transport --profile "$PROFILES" --renderer webgpu --timeout 720 --steps "$TRANSPORT_STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-s005-transport-evidence
          path: test-results/
