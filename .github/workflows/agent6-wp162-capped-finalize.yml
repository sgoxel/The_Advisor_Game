name: Agent6 WP162 Capped Finalize

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp162-capped-finalize.yml"
      - "tools/agent6_wp162_capped_finalize.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp162-capped-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update capped-run records
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python tools/agent6_wp162_capped_finalize.py
          git diff --check
          grep -F 'WP-S003-010-003-005-002' docs/ROADMAP.md
      - name: Commit docs and clean temporary Agent 6 helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+sgoxel@users.noreply.github.com"
          git add docs/ROADMAP.md docs/changelog.txt docs/suggest_log.txt
          git rm -f --ignore-unmatch \
            tools/agent6_wp020_attempt3_patch.py \
            .github/workflows/agent6-wp020-compositor-patch.yml \
            tools/agent6_wp162_capped_finalize.py \
            .github/workflows/agent6-wp162-capped-finalize.yml
          git commit -m "docs(WP-S003-010-003-005-002): record capped continuation"
          git pull --rebase origin main
          git push origin HEAD:main
