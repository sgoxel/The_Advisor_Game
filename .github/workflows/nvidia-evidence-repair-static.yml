name: NVIDIA Evidence Reliability Static Verification

on:
  push:
    branches: [main]
    paths:
      - 'opencode.json'
      - '.github/NVIDIA_RELIABILITY_POLICY.md'
      - '.github/actions/opencode-nvidia/action.yml'
      - '.github/workflows/nvidia-evidence-repair-static.yml'
  pull_request:
    paths:
      - 'opencode.json'
      - '.github/NVIDIA_RELIABILITY_POLICY.md'
      - '.github/actions/opencode-nvidia/action.yml'
      - '.github/workflows/nvidia-evidence-repair-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v6
      - name: Parse YAML and JSON
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/actions/opencode-nvidia/action.yml"); YAML.load_file(".github/workflows/nvidia-evidence-repair-static.yml")'
          python -m json.tool opencode.json >/dev/null
      - name: Verify bounded repair, history, strict evidence and role balance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          action = Path('.github/actions/opencode-nvidia/action.yml').read_text(encoding='utf-8')
          policy = Path('.github/NVIDIA_RELIABILITY_POLICY.md').read_text(encoding='utf-8')
          config = json.loads(Path('opencode.json').read_text(encoding='utf-8'))

          required_action = [
              'git fetch --unshallow --no-tags origin',
              'EVIDENCE CONTRACT — FIRST PRIORITY.',
              'Validate first terminal evidence and decide one repair',
              'EVIDENCE FORMAT REPAIR ONLY.',
              'AI AUXILIARY EVIDENCE REPAIR:',
              'id: opencode_repair',
              'REPAIR_STATE="valid"',
              'REPAIR_STATE="invalid"',
              'only Reviewer and Tester are executable',
              'npm install --no-save --package-lock=false --ignore-scripts',
              'git update-index --skip-worktree',
          ]
          missing = [x for x in required_action if x not in action]
          if missing:
              raise SystemExit(f'Missing NVIDIA reliability guard(s): {missing}')
          if action.count('id: opencode_repair') != 1:
              raise SystemExit('Evidence repair must be exactly one bounded OpenCode step.')

          required_policy = [
              'Reviewer** and **Tester** only',
              'one and only one',
              'below **25%**',
              'latest **four routed NVIDIA opportunities contain no Tester**',
              'This is not a quota',
              'AI AUXILIARY EVIDENCE REPAIR:',
              'RULE CONSISTENCY', 'GAMEPLAY LOGIC', 'REAL-WORLD PLAUSIBILITY', 'INTENTIONAL ABSTRACTION',
          ]
          missing = [x for x in required_policy if x not in policy]
          if missing:
              raise SystemExit(f'Missing NVIDIA reliability policy guard(s): {missing}')

          if config.get('model') != 'nvidia/nvidia/nemotron-3-super-120b-a12b':
              raise SystemExit('Nemotron Super must remain active.')
          plan = config.get('agent', {}).get('plan', {})
          if float(plan.get('temperature', 9)) > 0.3:
              raise SystemExit('Read-only plan temperature must remain <= 0.3.')
          if int(plan.get('max_tokens', 999999)) > 16000:
              raise SystemExit('Read-only plan max_tokens must remain <= 16000.')
          if plan.get('permission', {}).get('edit') != 'deny':
              raise SystemExit('NVIDIA plan edit permission must remain denied.')
          PY
