name: WP25 branch integration
on:
  push:
    branches: [agent1/wp-s005-001-001]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s005-001-001
      - name: Wire canonical transport authority
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  return
              p.write_text(text.replace(old, new, 1))

          replace("src/world.ts", 'import {', 'import "./transport-network.ts";\nimport {')
          replace("src/village-routes.ts", 'import {', 'import "./transport-network.ts";\nimport {')
          replace("src/transport-network.ts", 'function buildNetwork(): TransportNetwork {', 'export function buildTransportNetwork(): TransportNetwork {')
          replace("src/transport-network.ts", 'export const transportNetwork = buildNetwork();', 'export const transportNetwork = buildTransportNetwork();')
          replace("src/transport-network.ts", 'ferryCandidates.sort((a, b) => a.distanceM - b.distanceM || edgePairKey(a.code, a.code).localeCompare(edgePairKey(b.code, b.code)));', 'ferryCandidates.sort((a, b) => a.distanceM - b.distanceM || edgePairKey(a.a.code, a.b.code).localeCompare(edgePairKey(b.a.code, b.b.code)));')
          replace("package.json", 'tests/routing.test.ts tests/routing-final-surface.test.ts', 'tests/routing.test.ts tests/routing-final-surface.test.ts tests/transport-network.test.ts')

          replace("src/transport-network.ts",
              'import { freshwaterCrossingAt, naturalSurfaceAt } from "./hydrology.ts";',
              'import { freshwaterCrossingAt, freshwaterCrossingSpanMAt, naturalSurfaceAt } from "./hydrology.ts";')
          replace("src/transport-network.ts",
              'import { travelMetrics } from "./travel.ts";',
              'import { travelMetrics } from "./travel.ts";\nimport { planRoute } from "./routing.ts";')
          replace("src/transport-network.ts",
              '  requireBorder: boolean,\n): RouteBuild | undefined {\n  const controls = pathControls(from, to, candidate, roadCode), samples = samplePolyline(controls);',
              '  requireBorder: boolean,\n  overrideControls?: readonly { x: number; z: number }[],\n): RouteBuild | undefined {\n  const controls = overrideControls ?? pathControls(from, to, candidate, roadCode), samples = samplePolyline(controls);')
          replace("src/transport-network.ts",
              '  if (!best) throw new Error(`No legal deterministic transport route for ${roadCode}`);\n  return best;',
              '''  if (!best && greatCircleDistance(from.position, to.position) <= 120_000) {
    const planned = planRoute({
      from: from.position,
      to: to.position,
      terrain(position) {
        const source = lonLatToSource(position.lon, position.lat),
          natural = naturalSurfaceAt(source.x, source.z),
          macro = macroSampleAt(position),
          owner = countryAtPosition(position),
          outsideOwner = !owner || !allowedCountries.includes(owner.code),
          unbridgeableRiver = natural.water.kind === "river" &&
            freshwaterCrossingSpanMAt(source.x, source.z) > TRANSPORT_LIMITS.ruralBridgeMaxM;
        return {
          water: outsideOwner || natural.water.kind === "lake" || natural.water.kind === "ocean" || unbridgeableRiver,
          heightM: natural.groundHeight,
          highland: Math.max(macro.mountainIntensity, natural.cliff ? 1 : natural.slope),
        };
      },
    });
    if (planned.found && planned.points.length >= 2 && planned.points.length <= 96) {
      const controls = planned.points.map((point) => lonLatToSource(point.lon, point.lat));
      best = routeCandidate(
        roadCode,
        from,
        to,
        TRANSPORT_LIMITS.routeCandidates,
        allowedCountries,
        requireBorder,
        controls,
      );
    }
  }
  if (!best) throw new Error(`No legal deterministic transport route for ${roadCode}`);
  return best;''')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "AGENT #1"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/world.ts src/village-routes.ts src/transport-network.ts package.json
          git commit -m "WP-S005 use bounded deterministic planner fallback"
          git push origin HEAD:agent1/wp-s005-001-001
