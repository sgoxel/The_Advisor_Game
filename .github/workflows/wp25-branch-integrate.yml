name: WP25 branch integration
on:
  push:
    branches: [agent1/wp-s005-001-001]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s005-001-001
      - name: Apply deterministic source patch
        run: |
          python tools/wp25_patch.py
          python tools/wp25_bridge_patch.py
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "AGENT #1"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/transport-network.ts
          git commit -m "WP-S005 enforce legal deterministic bridge fallback"
          git push origin HEAD:agent1/wp-s005-001-001
