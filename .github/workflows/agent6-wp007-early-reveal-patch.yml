name: Agent6 WP007 Early Reveal Patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp007-early-reveal-patch.yml"
      - "tools/agent6_wp007_early_reveal_patch.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp007-early-reveal-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore bounded footprint and route preview eligibility
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python tools/agent6_wp007_early_reveal_patch.py
          node --check scripts/world/planet-stage.js
          git diff --check
      - name: Commit tested runtime correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+sgoxel@users.noreply.github.com"
          git add scripts/world/planet-stage.js
          if git diff --cached --quiet; then
            echo "WP007 early reveal correction already current"
            exit 0
          fi
          git commit -m "fix(WP-S003-010-003-007): restore bounded early reveal tiers"
          git push origin HEAD:main
