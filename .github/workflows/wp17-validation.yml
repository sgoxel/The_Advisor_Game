name: WP-S002-004-007 village evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  capture-wp17-villages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture two same-city villages on WebGL2 and WebGPU
        run: |
          python -m pip install playwright==1.63.0
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          VILLAGE_STEPS='eval:window.__wp17Villages=window.advisorWorld.geography.villages.filter(v=>v.continent===0&&v.country===0&&v.city===0);eval:window.advisorWorld.setHalfHeight(97);eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__wp17Villages[0].canonicalPosition);settle;shot:village-a;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__wp17Villages[1].canonicalPosition);settle;shot:village-b'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp17-villages-webgl2 --name villages --profile desktop,phone,phone-landscape --renderer webgl2 --timeout 300 --steps "$VILLAGE_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp17-villages-webgpu --name villages --profile desktop,phone,phone-landscape --renderer webgpu --timeout 300 --steps "$VILLAGE_STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp17-village-evidence
          path: test-results/
