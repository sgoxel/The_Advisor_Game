name: WP-S002-004-007 changelog cleanup
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  append-and-clean:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Append WP changelog and remove temporary workflow
        run: |
          set -euo pipefail
          ENTRY="$(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M') Europe/Istanbul — WP-S002-004-007, AGENT #1, phase 2 acceptance (MIXED): Final runtime implementation passes 109/109 unit tests, production build, WebGPU browser, WebGL2 fallback and navigation gates. Fresh political-atlas and same-city Village-detail WebGPU/WebGL2 desktop/portrait/landscape evidence was retrieved and actually inspected at VISUAL 8.5/10 with crisp borders, readable bounded labels, usable mobile layouts and no major terrain/projection/backend defect. Evidence runs: 38059252473 and 38060518769. Deployment and completion bookkeeping remain pending."
          grep -Fq "WP-S002-004-007, AGENT #1, phase 2 acceptance" docs/changelog.txt || printf '%s\n' "$ENTRY" >> docs/changelog.txt
          git rm .github/workflows/wp17-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.txt
          git commit -m "WP-S002-004-007 finalize acceptance logs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
