name: WP-S002-004-007 exact-head validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-wp17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Political atlas and settlement acceptance tests
        run: npm test -- --run tests/political-atlas.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npx playwright test --config playwright.fallback.config.js
      - name: Capture WP-S002-004-007 WebGL2 and WebGPU evidence
        run: |
          python -m pip install playwright==1.63.0
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          POLITICAL_STEPS='eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.countries.find(c=>c.continent===0).canonicalPosition);eval:window.advisorWorld.setHalfHeight(6000);settle;shot:country-border;eval:window.advisorWorld.setHalfHeight(3000);settle;shot:mixed-labels;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.countries.find(c=>c.continent===1).canonicalPosition);settle;shot:second-continent-labels'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp17-political-webgl2 --name political --profile desktop,phone,phone-landscape --renderer webgl2 --timeout 300 --steps "$POLITICAL_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp17-political-webgpu --name political --profile desktop,phone,phone-landscape --renderer webgpu --timeout 300 --steps "$POLITICAL_STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp17-exact-head-evidence
          path: test-results/
