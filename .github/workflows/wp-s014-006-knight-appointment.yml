name: WP-S014-006 Knight Appointment
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/world/protagonist-authority.js"
      - "scripts/world/protagonist-knight-appointment.js"
      - "scripts/tests/wp-s014-006-knight-appointment.test.js"
      - ".github/workflows/wp-s014-006-knight-appointment.yml"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: wp-s014-006-${{ github.sha }}
  cancel-in-progress: false
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Syntax + deterministic Knight appointment evidence
        run: |
          node --check scripts/world/protagonist-authority.js
          node --check scripts/world/protagonist-knight-appointment.js
          node --check scripts/tests/wp-s014-006-knight-appointment.test.js
          node scripts/tests/wp-s014-006-knight-appointment.test.js
      - name: Existing authority progression regressions
        run: |
          node scripts/tests/wp-s009-006-protagonist-authority.test.js
          node scripts/tests/wp-s013-001-protagonist-skills.test.js
          node scripts/tests/wp-s013-002-protagonist-standing.test.js
          node scripts/tests/wp-s013-004-protagonist-service-contracts.test.js
          node scripts/tests/wp-s013-005-protagonist-appointment-resolution.test.js
          node scripts/tests/wp-s013-006-protagonist-oath-allegiance.test.js
      - name: Verify exact product is live on GitHub Pages
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="accepted"; grep -q 'WP-S014-006.*COMPLETED' docs/ROADMAP.md && MODE="completed" || true
          for attempt in $(seq 1 72); do
            curl -fsSL --max-time 20 "$BASE/scripts/world/protagonist-knight-appointment.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-knight.js || true
            curl -fsSL --max-time 20 "$BASE/scripts/world/protagonist-authority.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-authority.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product=0; state=0
            grep -q 'VERSION="protagonist-knight-appointment-v1"' /tmp/live-knight.js 2>/dev/null && grep -q '"knight":Object.freeze' /tmp/live-authority.js 2>/dev/null && grep -q 'protagonist-knight-appointment.js?v=protagonist-knight-appointment-v1' /tmp/live-index.html 2>/dev/null && product=1 || true
            if [ "$MODE" = completed ]; then grep -q 'WP-S014-006.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state=1 || true; else state=1; fi
            [ "$product" -eq 1 ] && [ "$state" -eq 1 ] && exit 0
            sleep 5
          done
          exit 1
      - name: Comment Issue 282
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body='AGENT #6 WP-S014-006 exact-head workflow: **${{ job.status }}**\nCommit: '+context.sha+'\nRun: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId+'\nDeterministic Knight qualification/appointment evidence, Stage 9/13 authority regressions, and public Pages verification were attempted. VISUAL: N/A.';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:282,body});
