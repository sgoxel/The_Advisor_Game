name: Stop obsolete S005 candidate evidence
on:
  push:
    branches: [agent1/s005-bank-bridge-profile-20261023]
    paths: [.github/workflows/agent1-s005-obsolete-run-cleanup.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Cancel only closed PR 312 superseded evidence runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 40002349791 40002349740 40002327425 40002165285 40002165055; do
            echo "Cancellation requested for obsolete run ${run}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/cancel" --silent || echo "Run ${run} already completed, cancelling or unavailable"
          done
