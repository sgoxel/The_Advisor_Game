name: WP-S003-010-003-020 Navigation Performance Evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wp-s003-010-003-020-evidence.yml
      - tools/test_wp_s003_010_003_020.py
      - scripts/world/planet-stage.js
      - index.html
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  evidence:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/wp-s003-010-003-020-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Verify browser
        run: google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Start local game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! >/tmp/advisor-http.pid
          sleep 1

      - name: Run navigation benchmark
        run: python tools/test_wp_s003_010_003_020.py "http://127.0.0.1:8000/?evidence_fast_start=1" tools/wp_s003_010_003_020_artifact

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-010-003-020-evidence-${{ github.run_id }}
          path: tools/wp_s003_010_003_020_artifact/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment run link on Issue
        if: github.event_name == 'issue_comment' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `WP-S003-010-003-020 evidence completed. [Open workflow run and artifact](${url}).`
                : `WP-S003-010-003-020 evidence FAILED. [Open workflow run and logs](${url}).`
            });
