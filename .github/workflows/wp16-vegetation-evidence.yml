name: WP16 vegetation evidence
on:
  pull_request:
    branches: [main]
    paths:
      - "src/vegetation.ts"
      - "src/vegetation-render.ts"
      - "src/tile-worker.ts"
      - "tests/vegetation.test.ts"
      - "tests/vegetation-metrics.test.ts"
      - "tests/vegetation-budgets.test.ts"
      - "tests/vegetation-render.test.ts"
      - "tools/screenshot_tool.py"
      - ".github/workflows/wp16-vegetation-evidence.yml"
  workflow_dispatch:
concurrency:
  # v2 deliberately bypasses the pre-v2 run that became wedged while closing the
  # phone-landscape browser. Keep cancel-in-progress so only the newest v2 run
  # consumes a runner after branch updates.
  group: wp16-vegetation-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/vegetation.test.ts tests/vegetation-metrics.test.ts tests/vegetation-budgets.test.ts tests/vegetation-render.test.ts
      - run: npm run build
      - run: python -m py_compile tools/screenshot_tool.py
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install playwright==1.63.0
      - name: Capture WP16 vegetation evidence
        run: |
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          VEGETATION_TARGETS=$(node --experimental-strip-types --input-type=module <<'NODE'
          import { climateSampleAt } from "./src/climate.ts";
          const points = Array.from({ length: 72 }, (_, y) =>
            Array.from({ length: 144 }, (_, x) => ({
              lon: ((x * 2.5 - 178.75) * Math.PI) / 180,
              lat: ((y * 2.5 - 88.75) * Math.PI) / 180,
            })),
          ).flat();
          const forests = new Set(["conifer-forest", "temperate-forest", "dry-woodland"]);
          const open = new Set(["meadow", "grassland", "dryland", "bare-earth"]);
          const classified = points.map((point) => ({ point, sample: climateSampleAt(point) }));
          const forest =
            classified.find(({ sample }) => sample.terrainClass === "temperate-forest")?.point ||
            classified.find(({ sample }) => forests.has(sample.terrainClass))?.point;
          const meadow = classified.find(({ sample }) => open.has(sample.terrainClass))?.point;
          let edge;
          for (const { point, sample } of classified) {
            if (!forests.has(sample.terrainClass)) continue;
            for (const delta of [0.005, -0.005, 0.01, -0.01, 0.02, -0.02]) {
              const neighbour = { lon: point.lon + delta, lat: point.lat };
              if (open.has(climateSampleAt(neighbour).terrainClass)) {
                edge = {
                  lon: (point.lon + neighbour.lon) / 2,
                  lat: (point.lat + neighbour.lat) / 2,
                };
                break;
              }
            }
            if (edge) break;
          }
          if (!forest || !meadow || !edge) throw new Error("WP16 evidence fixture discovery failed");
          console.log(JSON.stringify({ forest, edge, meadow }));
          NODE
          )
          VEGETATION_STEPS="eval:window.__vegetationTargets=$VEGETATION_TARGETS;eval:window.advisorWorld.setHalfHeight(150);eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__vegetationTargets.forest);settle;shot:forest-core;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__vegetationTargets.edge);settle;shot:forest-edge;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__vegetationTargets.meadow);settle;shot:open-meadow;eval:window.advisorWorld.setHalfHeight(900);eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__vegetationTargets.edge);settle;shot:province-forest-outline"
          timeout --signal=TERM --kill-after=20s 12m python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp16-vegetation-webgl2 --name vegetation --profile desktop,phone --renderer webgl2 --timeout 240 --steps "$VEGETATION_STEPS"
          timeout --signal=TERM --kill-after=20s 12m python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp16-vegetation-webgpu --name vegetation --profile desktop,phone --renderer webgpu --timeout 240 --steps "$VEGETATION_STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp16-vegetation-evidence
          path: test-results/
