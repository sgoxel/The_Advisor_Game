name: WP19 AGENT1 mixed evaluation
on:
  push:
    branches: [agent1/wp-s002-004-009-living-settlements]
    paths: [.wp19-evaluate]
permissions:
  contents: read
concurrency:
  group: wp19-agent1-eval
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    needs: unit-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [webgpu, webgl2, navigation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run exact-head browser gate
        run: |
          case "${{ matrix.suite }}" in
            webgpu) xvfb-run -a npm run test:webgpu ;;
            webgl2) xvfb-run -a npx playwright test --config playwright.fallback.config.js ;;
            navigation) xvfb-run -a npx playwright test --config playwright.navigation.config.js ;;
          esac

  capture:
    needs: unit-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        renderer: [webgpu, webgl2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install playwright==1.63.0
      - name: Capture fresh WP009 evidence
        run: |
          npm run preview -- --port 4175 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then break; fi
            sleep 1
          done
          TARGETS="$(node --experimental-strip-types tools/wp19_targets.ts)"
          STEPS="eval:window.__wp19=${TARGETS};settle;eval:window.advisorWorld.navigation.setFocus(window.__wp19.villages[0].lon,window.__wp19.villages[0].lat);eval:window.advisorWorld.setHalfHeight(97);settle;shot:village-a;eval:window.advisorWorld.navigation.setFocus(window.__wp19.villages[1].lon,window.__wp19.villages[1].lat);settle;shot:village-b;eval:window.advisorWorld.navigation.setFocus(window.__wp19.villages[2].lon,window.__wp19.villages[2].lat);settle;shot:village-c;eval:window.advisorWorld.navigation.setFocus(window.__wp19.city.lon,window.__wp19.city.lat);eval:window.advisorWorld.setHalfHeight(760);settle;shot:city-province;eval:window.advisorWorld.setHalfHeight(55);settle;shot:city-street;eval:window.advisorSettlements.focus(window.__wp19.villages[0].id,'inn');settle;shot:inn-exterior;eval:window.advisorSettlements.focus(window.__wp19.villages[0].id,'market');settle;shot:market-exterior;eval:window.advisorSettlements.focus(window.__wp19.villages[0].id,'blacksmith');settle;shot:blacksmith-exterior;eval:window.advisorSettlements.focus(window.__wp19.villages[0].id,'farmstead');settle;shot:farmstead-exterior;eval:window.advisorSettlements.focus(window.__wp19.villages[0].id,'barn');settle;shot:barn-exterior;eval:window.advisorSettlements.focus(window.__wp19.villages[0].id,'butcher');settle;shot:butcher-exterior;eval:window.advisorSettlements.focus(window.__wp19.villages[0].id,'guard-office');settle;shot:guard-office-exterior;eval:window.advisorSettlements.focus(window.__wp19.villages[0].id,'home');settle;shot:home-exterior;eval:window.advisorSettlements.enter(window.__wp19.villages[0].inn);settle;shot:inn-interior;eval:window.advisorSettlements.exit();eval:window.advisorSettlements.enter(window.__wp19.villages[0].blacksmith);settle;shot:blacksmith-interior;eval:window.advisorSettlements.exit();eval:window.advisorSettlements.enter(window.__wp19.villages[0].home);settle;shot:home-interior;eval:window.advisorSettlements.exit()"
          python tools/screenshot_tool.py http://127.0.0.1:4175/ --out test-results/wp19-${{ matrix.renderer }} --name wp19 --profile desktop,phone,phone-landscape --renderer ${{ matrix.renderer }} --timeout 360 --steps "$STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp19-attempt1-${{ matrix.renderer }}-${{ github.sha }}
          path: test-results/wp19-${{ matrix.renderer }}
