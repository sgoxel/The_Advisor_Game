name: WP15 headwater diagnostic

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/wp15-head-connector-diagnostic.test.ts"
      - ".github/workflows/wp15-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/wp15-head-connector-diagnostic.test.ts
