name: WP15 diagnostic

on:
  push:
    branches:
      - agent1/wp-s002-004-005-current-main

jobs:
  unit-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture focused WP15 test output
        shell: bash
        run: |
          set +e
          node --experimental-strip-types --test tests/hydrology.test.ts tests/surface-authority.test.ts > wp15-test.log 2>&1
          code=$?
          echo "$code" > wp15-test-exit.txt
          tail -n 240 wp15-test.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: wp15-unit-diagnostic-${{ github.sha }}
          path: |
            wp15-test.log
            wp15-test-exit.txt
          retention-days: 1
