name: WP15 diagnostic

on:
  push:
    branches:
      - agent1/wp-s002-004-005-current-main

jobs:
  routing-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        file:
          - tests/routing.test.ts
          - tests/routing-final-surface.test.ts
          - tests/handoff.test.ts
          - tests/navigation.test.ts
          - tests/political-atlas.test.ts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture routing test output
        shell: bash
        run: |
          set +e
          node --experimental-strip-types --test ${{ matrix.file }} > wp15-test.log 2>&1
          code=$?
          echo "$code" > wp15-test-exit.txt
          tail -n 240 wp15-test.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: wp15-routing-${{ strategy.job-index }}-${{ github.sha }}
          path: |
            wp15-test.log
            wp15-test-exit.txt
          retention-days: 1
