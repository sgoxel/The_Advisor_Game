name: WP-S011-008 Advisor Tool Resolution

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/world/advisor-tool-resolution.js"
      - "scripts/tests/wp-s011-008-advisor-tool-resolution.test.js"
      - ".github/workflows/wp-s011-008-advisor-tool-resolution.yml"
      - "scripts/world/advisor-progression.js"
      - "scripts/world/advisor-insight.js"
      - "scripts/world/advisor-rhetoric.js"
      - "scripts/world/advisor-diplomacy.js"
      - "scripts/world/advisor-stewardship.js"
      - "scripts/world/advisor-command.js"
      - "scripts/world/advisor-intrigue.js"
      - "scripts/world/world-state.js"
      - "index.html"
  push:
    branches: [main]
    paths:
      - "scripts/world/advisor-tool-resolution.js"
      - "scripts/tests/wp-s011-008-advisor-tool-resolution.test.js"
      - ".github/workflows/wp-s011-008-advisor-tool-resolution.yml"
      - "scripts/world/advisor-progression.js"
      - "scripts/world/advisor-insight.js"
      - "scripts/world/advisor-rhetoric.js"
      - "scripts/world/advisor-diplomacy.js"
      - "scripts/world/advisor-stewardship.js"
      - "scripts/world/advisor-command.js"
      - "scripts/world/advisor-intrigue.js"
      - "scripts/world/world-state.js"
      - "index.html"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Advisor tool resolution evidence
        run: |
          node --check scripts/world/advisor-tool-resolution.js
          node --check scripts/tests/wp-s011-008-advisor-tool-resolution.test.js
          node scripts/tests/wp-s011-008-advisor-tool-resolution.test.js
      - name: Stage 11 tool and persistence regressions
        run: |
          node scripts/tests/wp-s011-001-advisor-progression.test.js
          node scripts/tests/wp-s011-002-advisor-insight.test.js
          node scripts/tests/wp-s011-003-advisor-rhetoric.test.js
          node scripts/tests/wp-s011-004-advisor-diplomacy.test.js
          node scripts/tests/wp-s011-005-advisor-stewardship.test.js
          node scripts/tests/wp-s011-006-advisor-command.test.js
          node scripts/tests/wp-s011-007-advisor-intrigue.test.js
          node tools/tests/wp-s007-009-campaign-persistence.test.js
      - name: Verify exact product is live on GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="accepted"
          if grep -q 'WP-S011-008.*COMPLETED' docs/ROADMAP.md; then MODE="completed"; fi
          for attempt in $(seq 1 72); do
            curl -fsSL --max-time 20 "$BASE/scripts/world/advisor-tool-resolution.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-resolution.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product_ok=0
            state_ok=0
            grep -q 'VERSION="advisor-tool-resolution-v1"' /tmp/live-resolution.js 2>/dev/null && grep -q 'scripts/world/advisor-tool-resolution.js?v=advisor-tool-resolution-v1' /tmp/live-index.html 2>/dev/null && product_ok=1 || true
            if [ "$MODE" = "completed" ]; then
              grep -q 'WP-S011-008.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state_ok=1 || true
            else
              state_ok=1
            fi
            if [ "$product_ok" -eq 1 ] && [ "$state_ok" -eq 1 ]; then
              echo "GitHub Pages exposes WP-S011-008 mode=$MODE for commit ${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not expose expected WP-S011-008 $MODE markers in time." >&2
          exit 1
      - name: Comment exact run on Issue 231
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const sha = context.sha;
            const url = 'https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId;
            const body = [
              'AGENT #6 WP-S011-008 exact-head workflow: **'+status.toUpperCase()+'**',
              'Commit: '+sha,
              'Run: '+url,
              status === 'success'
                ? 'Advisor resolution evidence, Stage 11 tool/persistence regressions, and GitHub Pages verification passed.'
                : 'Workflow, regression, or GitHub Pages verification failed; WP remains incomplete.'
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:231,body});
