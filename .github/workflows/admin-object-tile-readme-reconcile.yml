name: Admin Object Tile README Reconciliation

on:
  push:
    paths:
      - '.github/workflows/admin-object-tile-readme-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward to current main
        run: |
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main

      - name: Apply exact Admin-authorized README patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          old = '''This atlas contract applies when roads, paths, terrain or transitions, building parts, walls, floors, interiors, furniture, props or other visual families are intentionally produced as reusable tiles. It does not require unrelated non-tile assets such as full-body character art to use an atlas.

Exact manifest schemas, folder names, splitter implementation, validation tooling and runtime registration mechanics remain subordinate implementation decisions, but they must preserve the canonical **1024 × 1024 / 4 × 4 / 256px** contract, transparent unused cells, deterministic per-tile export and semantic tile identity.'''

          new = '''This atlas contract applies when roads, paths, terrain or transitions, building parts, walls, floors, interiors, furniture, props or other visual families are intentionally produced as reusable tiles. It does not require unrelated non-tile assets such as full-body character art to use an atlas.

Reusable transparent tile families may be **composed over the authoritative underlying terrain** rather than replacing it. Transparent pixels reveal the terrain or lower presentation layer beneath them. This allows terrain-neutral road/path pieces and reusable world-object families such as fences and gates, rock clusters, wells, flagpoles, carts or wagons, signs, field rows, rubble, walls, floors, furniture and similar local-world props to share one semantic production model without baking an unrelated grass, forest, beach, snow or other biome background into an asset that is intended to work across multiple terrain types.

A reusable visual object is not required to occupy exactly one logical tile merely because one exported source cell is 256 × 256 pixels. Small/static props may use a one-tile footprint where appropriate, while larger structures or props may use **multi-tile authoritative footprints**. Visible art may extend beyond the occupied footprint when anchoring, occlusion and depth ordering remain coherent with the local tile camera. Objects that move or require richer authoritative behavior, such as a moving wagon, may be represented as world-space entities using compatible transparent visual assets instead of being reduced to static decorative tiles.

Visual pixels never define gameplay authority by themselves. Collision, blocking, walkability, interaction, ownership, movement, inventory/state, damage and other gameplay facts come from Simulation-backed world/object data. The tile or sprite is the presentation of that state, and runtime composition must preserve the distinction between semantic visual identity and authoritative footprint/interaction/entity state.

Exact manifest schemas, folder names, splitter implementation, validation tooling and runtime registration mechanics remain subordinate implementation decisions, but they must preserve the canonical **1024 × 1024 / 4 × 4 / 256px** contract, transparent unused cells, deterministic per-tile export, semantic tile identity, terrain-layer composition where applicable, and separation between visual assets and Simulation authority.'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected canonical atlas target exactly once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          principle_old = '67. **Canonical tile atlases are fixed and semantically exportable.** Tile-based production uses transparent 1024 × 1024 atlases divided into a 4 × 4 grid of 256 × 256 cells; unused cells remain transparent, while occupied cells are deterministically exportable as individual semantically identifiable tiles.'
          principle_new = principle_old + '\n68. **Transparent world-object tiles compose over authoritative world state.** Reusable overlay/object art may reveal underlying terrain, larger props may use multi-tile footprints, and moving or interactive objects may materialize as world-space entities; pixels never replace Simulation-owned collision, interaction, movement or object state.'
          if text.count(principle_old) != 1:
              raise SystemExit(f'Expected principle 67 exactly once, found {text.count(principle_old)}')
          text = text.replace(principle_old, principle_new, 1)

          designer_old = 'Designer chooses suitable tools, formats, workflows, and export methods for approved visual work. When the approved work produces reusable tile-based visual families, Designer must preserve the canonical 1024 × 1024 transparent atlas, 4 × 4 grid and 256 × 256 cell contract defined by README; unused atlas cells remain transparent.'
          designer_new = designer_old + ' For transparent overlay/object families, Designer must also preserve terrain-neutral transparency where the asset is intended to compose across multiple terrain types and must not treat painted pixels as collision, interaction or other Simulation authority.'
          if text.count(designer_old) != 1:
              raise SystemExit(f'Expected Designer tile rule exactly once, found {text.count(designer_old)}')
          text = text.replace(designer_old, designer_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify scoped diff
        run: |
          git diff --check
          git diff -- README.md
          test "$(git diff --name-only | tr -d '\r')" = "README.md"

      - name: Commit README and remove one-shot workflow
        run: |
          git config user.name 'sgoxel'
          git config user.email '163722426+sgoxel@users.noreply.github.com'
          git add README.md
          git rm .github/workflows/admin-object-tile-readme-reconcile.yml
          git commit -m 'Generalize transparent world-object tile contract (#290)'
          git push origin main
