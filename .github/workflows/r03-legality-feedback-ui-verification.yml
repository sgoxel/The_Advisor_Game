name: R03 Legality Feedback UI Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/config.js'
      - 'js/legality_feedback.js'
      - 'css/legality-feedback.css'
      - 'js/action_legality.js'
      - 'js/interaction_target.js'
      - 'js/spatial_action_legality.js'
      - 'js/interaction_validation.js'
      - 'js/world_action_resolution.js'
      - 'tests/browser/r03-legality-feedback-ui.spec.mjs'
      - 'tests/browser/r03-world-action-resolution.spec.mjs'
      - 'tests/browser/r03-interaction-validation.spec.mjs'
      - 'tests/browser/r01-browser.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r03-legality-feedback-ui-verification.yml'
  pull_request:
    paths:
      - 'js/config.js'
      - 'js/legality_feedback.js'
      - 'css/legality-feedback.css'
      - 'js/action_legality.js'
      - 'js/interaction_target.js'
      - 'js/spatial_action_legality.js'
      - 'js/interaction_validation.js'
      - 'js/world_action_resolution.js'
      - 'tests/browser/r03-legality-feedback-ui.spec.mjs'
      - 'tests/browser/r03-world-action-resolution.spec.mjs'
      - 'tests/browser/r03-interaction-validation.spec.mjs'
      - 'tests/browser/r01-browser.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r03-legality-feedback-ui-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legality-feedback-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: echo "R03-T09 candidate ${GITHUB_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused R03 legality feedback UI checks
        run: npx playwright test tests/browser/r03-legality-feedback-ui.spec.mjs
      - name: Preserve R03 authoritative validation and resolution
        run: >-
          npx playwright test
          tests/browser/r03-interaction-validation.spec.mjs
          tests/browser/r03-world-action-resolution.spec.mjs
      - name: Preserve R01 responsive browser behavior
        run: npx playwright test tests/browser/r01-browser.spec.mjs
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03-t09-legality-feedback-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14