name: WP-S010-004 Protagonist Self Care

on:
  push:
    branches: [main]
    paths:
      - "scripts/world/protagonist-self-care.js"
      - "scripts/tests/wp-s010-004-protagonist-self-care.test.js"
      - ".github/workflows/wp-s010-004-protagonist-self-care.yml"
      - "scripts/world/protagonist-needs.js"
      - "scripts/world/protagonist-health.js"
      - "scripts/world/protagonist-inventory.js"
      - "scripts/world/protagonist-action-runtime.js"
      - "scripts/world/protagonist-command-evaluator.js"
      - "scripts/world/protagonist-interaction-pipeline.js"
      - "index.html"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Needs-driven self-care evidence
        run: node scripts/tests/wp-s010-004-protagonist-self-care.test.js
      - name: Stage 9 and Stage 10 authority regressions
        run: |
          node scripts/tests/wp-s009-002-protagonist-needs.test.js
          node scripts/tests/wp-s009-004-protagonist-inventory.test.js
          node scripts/tests/wp-s009-005-protagonist-health.test.js
          node scripts/tests/wp-s009-007-protagonist-decision-context.test.js
          node scripts/tests/wp-s010-001-protagonist-action-runtime.test.js
          node scripts/tests/wp-s010-002-protagonist-journey.test.js
          node scripts/tests/wp-s010-003-protagonist-interaction-pipeline.test.js
          node scripts/tests/wp-s008-005-protagonist-command-evaluator.test.js
      - name: Verify exact product is live on GitHub Pages
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="accepted"
          if grep -q 'WP-S010-004.*COMPLETED' docs/ROADMAP.md; then MODE="completed"; fi
          for attempt in $(seq 1 72); do
            curl -fsSL --max-time 20 "$BASE/scripts/world/protagonist-self-care.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-self-care.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product_ok=0
            state_ok=0
            grep -q 'VERSION="protagonist-self-care-v1"' /tmp/live-self-care.js 2>/dev/null && grep -q 'scripts/world/protagonist-self-care.js?v=protagonist-self-care-v1' /tmp/live-index.html 2>/dev/null && product_ok=1 || true
            if [ "$MODE" = "completed" ]; then
              grep -q 'WP-S010-004.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state_ok=1 || true
            else
              state_ok=1
            fi
            if [ "$product_ok" -eq 1 ] && [ "$state_ok" -eq 1 ]; then
              echo "GitHub Pages exposes WP-S010-004 mode=$MODE for commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not expose expected WP-S010-004 $MODE markers in time." >&2
          exit 1
      - name: Comment exact run on Issue 207
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status='${{ job.status }}';
            const body=[
              'AGENT #6 WP-S010-004 exact-head workflow: **'+status.toUpperCase()+'**',
              'Commit: '+context.sha,
              'Run: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId,
              status==='success'
                ? 'Needs-driven self-care evidence, Stage 9/10 authority regressions, and public Pages product verification passed. VISUAL: N/A — functional-only self-care selection/runtime handoff.'
                : 'Self-care evidence, regression, or public Pages verification failed; WP remains incomplete.'
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:207,body});
