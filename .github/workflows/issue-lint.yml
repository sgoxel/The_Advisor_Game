name: Issue Field Enforcer

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  lint-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const number = context.payload.issue.number;

            const REQUIRED = ['Role', 'Priority', 'Status', 'Claim', 'Dependency', 'Handoff'];
            const VALID = {
              Role:       /^(Coder|Designer|Tester|Reviewer)$/,
              Priority:   /^(P0|P1|P2|P3|P4)$/,
              Status:     /^(READY|ACTIVE|VERIFY|DELAYED|DONE)$/,
              Claim:      /^(NONE|.+@.+)$/,
              Dependency: /^(NONE|[\d, ]+)$/,
              Handoff:    /^(NONE|[A-Za-z]+( > [A-Za-z]+)*)$/,
            };

            const errors = [];

            for (const field of REQUIRED) {
              const match = body.match(new RegExp(`^${field}:\\s*(.+)$`, 'm'));
              if (!match) {
                errors.push(`Missing required field: \`${field}:\``);
                continue;
              }
              const val = match[1].trim();
              if (VALID[field] && !VALID[field].test(val)) {
                errors.push(`Invalid value for \`${field}:\` — got \`${val}\``);
              }
            }

            if (errors.length === 0) return;

            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
            });

            const BOT_TAG = '<!-- agent-issue-lint -->';
            const prev = existing.data.find(c => c.body.includes(BOT_TAG));

            const commentBody = `${BOT_TAG}\n⚠️ **Issue field validation failed:**\n\n${errors.map(e => `- ${e}`).join('\n')}\n\nPlease update the issue body to include all required \`AGENTS.md\` workflow fields.`;

            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body: commentBody,
              });
            }
