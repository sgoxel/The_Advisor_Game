name: R04 100x100 Spatial World Verification

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/config.js'
      - 'js/optional_map_script_guard.js'
      - 'js/spatial_world.js'
      - 'js/region_navigation.js'
      - 'js/npc_spatial_runtime.js'
      - 'js/npc_runtime_bridge.js'
      - 'js/npc_world.js'
      - 'js/npc_life.js'
      - 'js/utils.js'
      - 'tests/browser/r04-spatial-world-100.spec.mjs'
      - 'tests/browser/r04-npc-distribution.spec.mjs'
      - 'tests/browser/r04-npc-authoritative-game-time.spec.mjs'
      - 'tests/browser/r04-npc-public-startup.spec.mjs'
      - 'tests/browser/r02-origin-village.spec.mjs'
      - 'tests/browser/r02-multi-region-terrain.spec.mjs'
      - 'tests/browser/r02-region-navigation.spec.mjs'
      - 'tests/browser/r02-deterministic-roundtrip.spec.mjs'
      - '.github/workflows/r04-spatial-world-100-verification.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'js/config.js'
      - 'js/optional_map_script_guard.js'
      - 'js/spatial_world.js'
      - 'js/region_navigation.js'
      - 'js/npc_spatial_runtime.js'
      - 'js/npc_runtime_bridge.js'
      - 'js/npc_world.js'
      - 'js/npc_life.js'
      - 'js/utils.js'
      - 'tests/browser/r04-spatial-world-100.spec.mjs'
      - 'tests/browser/r04-npc-distribution.spec.mjs'
      - 'tests/browser/r04-npc-authoritative-game-time.spec.mjs'
      - 'tests/browser/r04-npc-public-startup.spec.mjs'
      - 'tests/browser/r02-origin-village.spec.mjs'
      - 'tests/browser/r02-multi-region-terrain.spec.mjs'
      - 'tests/browser/r02-region-navigation.spec.mjs'
      - 'tests/browser/r02-deterministic-roundtrip.spec.mjs'
      - '.github/workflows/r04-spatial-world-100-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spatial-world-and-npc-occupancy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4

      - name: Record exact candidate SHA
        run: git rev-parse HEAD

      - name: Validate NPC integration source syntax
        run: |
          node --check js/npc_spatial_runtime.js
          node --check js/npc_runtime_bridge.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify untouched production NPC startup persistence
        run: npx playwright test tests/browser/r04-npc-public-startup.spec.mjs --project=desktop

      - name: Run focused 100x100 spatial-world and NPC occupancy regression
        run: npx playwright test tests/browser/r04-spatial-world-100.spec.mjs --project=desktop

      - name: Verify distributed NPC daily-life destinations
        run: npx playwright test tests/browser/r04-npc-distribution.spec.mjs --project=desktop

      - name: Verify authoritative NPC GameTime pacing
        run: npx playwright test tests/browser/r04-npc-authoritative-game-time.spec.mjs --project=desktop

      - name: Re-run deterministic origin village regression
        run: npx playwright test tests/browser/r02-origin-village.spec.mjs

      - name: Re-run deterministic multi-region terrain regression
        run: npx playwright test tests/browser/r02-multi-region-terrain.spec.mjs

      - name: Re-run adjacent-region navigation regression
        run: npx playwright test tests/browser/r02-region-navigation.spec.mjs

      - name: Re-run deterministic save-load roundtrip regression
        run: npx playwright test tests/browser/r02-deterministic-roundtrip.spec.mjs

      - name: Run stabilized R01 browser regression
        run: npm run test:browser:r01

      - name: Prepare stable exact-SHA evidence payload
        if: always()
        run: |
          mkdir -p r04-spatial-world-100-evidence
          printf 'candidate_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > r04-spatial-world-100-evidence/candidate.txt
          if [ -d playwright-report ]; then cp -R playwright-report r04-spatial-world-100-evidence/; fi
          if [ -d test-results ]; then cp -R test-results r04-spatial-world-100-evidence/; fi

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-spatial-world-100-evidence-${{ github.sha }}
          path: r04-spatial-world-100-evidence/
          if-no-files-found: error
          retention-days: 14
