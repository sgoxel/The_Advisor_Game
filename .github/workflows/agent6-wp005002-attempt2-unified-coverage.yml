name: Agent6 WP005002 Attempt2 Unified Coverage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp005002-attempt2-unified-coverage.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp005002-attempt2-unified-coverage
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply deterministic unified-coverage correction
        run: |
          set -euo pipefail
          python tools/agent6_wp005002_attempt2_unified_coverage_patch.py
          node --check scripts/world/planet-stage.js
          git diff --check
      - name: Commit product correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world/planet-stage.js
          if git diff --cached --quiet; then
            echo "WP005002 attempt-2 unified coverage already current"
            exit 0
          fi
          git commit -m "fix(WP-S003-010-003-005-002): unify cross-LOD texture ownership"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
