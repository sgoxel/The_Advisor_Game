name: Create Backup Snapshot Once

on:
  push:
    paths:
      - '.github/workflows/backup-snapshot-once.yml'

permissions:
  contents: write

concurrency:
  group: backup-snapshot-once
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and verify exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='aeb69788700ef4dce31657f2fb5c4d59ba3d08ac'
          ZIP_PATH='backup/The_Advisor_Game_aeb69788700e.zip'

          git cat-file -e "${SOURCE_SHA}^{commit}"
          mkdir -p backup
          rm -f "$ZIP_PATH"
          git archive --format=zip --output="$ZIP_PATH" "$SOURCE_SHA"

          python - <<'PY'
          import hashlib
          import subprocess
          import zipfile
          from pathlib import Path

          source = 'aeb69788700ef4dce31657f2fb5c4d59ba3d08ac'
          path = Path('backup/The_Advisor_Game_aeb69788700e.zip')
          expected = subprocess.check_output(
              ['git', 'ls-tree', '-r', '--name-only', source], text=True
          ).splitlines()
          expected = sorted(p for p in expected if not p.startswith('backup/'))

          with zipfile.ZipFile(path, 'r') as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise SystemExit(f'ZIP CRC failure: {bad}')
              actual = sorted(i.filename for i in zf.infolist() if not i.is_dir())

          if actual != expected:
              missing = sorted(set(expected) - set(actual))
              extra = sorted(set(actual) - set(expected))
              raise SystemExit(f'Archive tree mismatch; missing={missing}; extra={extra}')

          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          print(f'ZIP_FILE_COUNT={len(actual)}')
          print(f'ZIP_SHA256={digest}')
          print(f'ZIP_SIZE={path.stat().st_size}')
          PY

      - name: Commit backup without overwriting newer work
        shell: bash
        run: |
          set -euo pipefail

          # Remove temporary bootstrap artifacts; the ZIP itself keeps /backup present.
          rm -f backup/.keep
          rm -f .github/workflows/backup-snapshot-once.yml

          git fetch origin main
          CURRENT_TRIGGER_SHA="$(git rev-parse HEAD)"
          REMOTE_MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$REMOTE_MAIN_SHA" != "$CURRENT_TRIGGER_SHA" ]; then
            echo "main advanced from $CURRENT_TRIGGER_SHA to $REMOTE_MAIN_SHA; refusing to overwrite newer work."
            exit 1
          fi

          git config user.name 'ChatGPT Coder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A backup .github/workflows/backup-snapshot-once.yml
          git commit -m 'Coder Worker #61: archive current main snapshot'
          git push origin HEAD:main
