name: Agent6 WP003 Attempt2 Product

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp003-attempt2-product.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp003-attempt2-product
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply deterministic close-frequency refinement
        run: |
          set -euo pipefail
          python tools/agent6_wp003_attempt2_close_frequency_patch.py
          node --check scripts/world/planet-stage.js
          git diff --check
          grep -F 'canonical-continuous-cross-lod-source-v41' scripts/world/planet-stage.js
          grep -F 'closeFrequencyContrastV2:true' scripts/world/planet-stage.js
          grep -F 'metersPerTexel<=1.25)detail+=surfaceStructuredNoise(worldEastMeters,worldNorthMeters,3,salt+163)*.020' scripts/world/planet-stage.js
      - name: Commit tested product through Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/world/planet-stage.js; then
            echo "Attempt 2 product already current"
            exit 0
          fi
          file_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/world/planet-stage.js?ref=main" --jq .sha)"
          python - "$file_sha" <<'PY'
          import base64,json,sys
          from pathlib import Path
          payload={
              "message":"fix(WP-S003-010-003): sharpen near-ground registered detail",
              "content":base64.b64encode(Path("scripts/world/planet-stage.js").read_bytes()).decode("ascii"),
              "sha":sys.argv[1],
              "branch":"main",
          }
          Path('/tmp/wp003-attempt2-product.json').write_text(json.dumps(payload),encoding='utf-8')
          PY
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/scripts/world/planet-stage.js" \
            --input /tmp/wp003-attempt2-product.json > /tmp/wp003-attempt2-result.json
          cat /tmp/wp003-attempt2-result.json
