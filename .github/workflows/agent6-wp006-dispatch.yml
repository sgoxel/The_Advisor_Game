name: Agent6 WP006 Attempt 2 Evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent6-wp006-dispatch.yml

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested implementation
        uses: actions/checkout@v4
        with:
          ref: e4744470f8405d89aad3cc551f338c7e6a970cb7
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Start local game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! >/tmp/advisor-http.pid
          sleep 1
      - name: Capture WP006 fixed-focus scale ladder
        run: |
          python tools/screenshot_tool.py \
            http://127.0.0.1:8000/ \
            visual-wp-s003-010-003-006 \
            --profile landscape \
            --scenario wp-s003-010-003-006 \
            --shots 13 \
            --timestamp-names \
            --wait-min 1 \
            --wait-max 1 \
            --evidence-json evidence-wp-s003-010-003-006-${GITHUB_RUN_ID}.json \
            --issue 158 \
            --no-publish
      - name: Upload attempt 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp006-attempt2-${{ github.run_id }}
          path: tools/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Checkout main for cleanup
        if: always()
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Clean temporary evidence runner
        if: always()
        run: |
          if [ -f .github/workflows/agent6-wp006-dispatch.yml ]; then
            rm .github/workflows/agent6-wp006-dispatch.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows/agent6-wp006-dispatch.yml
            git commit -m 'chore(agent6): clean WP006 attempt 2 runner'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
