name: WP-014 Branch Check

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/world/planet-stage.js
      - tools/screenshot_tool.py
      - .github/workflows/visual-evidence.yml
      - .github/workflows/wp-s003-014-branch-check.yml

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse PlanetStage JavaScript
        run: node --check scripts/world/planet-stage.js
      - name: Parse screenshot evidence tool
        run: python -m py_compile tools/screenshot_tool.py
      - name: Verify WP-014 evidence registration
        run: |
          grep -q '"wp-s003-014"' tools/screenshot_tool.py
          grep -q 'wp-s003-014' .github/workflows/visual-evidence.yml
