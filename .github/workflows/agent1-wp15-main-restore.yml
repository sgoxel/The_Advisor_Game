name: AGENT1 WP15 minimal main restore
on:
  push:
    branches: [agent1/wp-s003-003-001-natural-authority]
    paths: [.github/workflows/agent1-wp15-main-restore.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s003-003-001-natural-authority
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore base runtime and add only hydrology diagnostics
        run: |
          git show bbbe8b3e416a57ac0e3b461645d8819181fa87b0:src/main.ts > src/main.ts
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.ts')
          s=p.read_text()
          climate='import { climateSampleAt } from "./climate.ts";'
          hydro='import { drainageRecipes, hydrologyTelemetry, naturalSurfaceAt } from "./hydrology.ts";'
          if hydro not in s:
              s=s.replace(climate, climate+'\n'+hydro, 1)
          old='''  flatToLonLat,\n  lonLatToFlat,\n  wrapX,'''
          new='''  flatToLonLat,\n  lonLatToFlat,\n  sourceToLonLat,\n  wrapX,'''
          if 'sourceToLonLat,' not in s:
              if old not in s: raise RuntimeError('planet import anchor missing')
              s=s.replace(old,new,1)
          anchor='''      continuity: { inspect: inspectRegion, terrainQuery, telemetry: () => ({ ...continuityTelemetry(), worker: continuityWorkerState }), clearDetail: clearContinuityDetail, setOverlay: setContinuityOverlay },\n      clock,'''
          replacement='''      continuity: { inspect: inspectRegion, terrainQuery, telemetry: () => ({ ...continuityTelemetry(), worker: continuityWorkerState }), clearDetail: clearContinuityDetail, setOverlay: setContinuityOverlay },\n      hydrology: { recipes: drainageRecipes, sampleSource: naturalSurfaceAt, toLonLat: sourceToLonLat, telemetry: hydrologyTelemetry },\n      clock,'''
          if 'hydrology: { recipes: drainageRecipes' not in s:
              if anchor not in s: raise RuntimeError('advisorWorld anchor missing')
              s=s.replace(anchor,replacement,1)
          p.write_text(s)
          PY
          git config user.name "GPT-5.6 Sol (AGENT #1)"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/main.ts
          git commit -m "WP-S003-003-001 keep runtime changes diagnostic-only"
          git push origin HEAD:agent1/wp-s003-003-001-natural-authority
