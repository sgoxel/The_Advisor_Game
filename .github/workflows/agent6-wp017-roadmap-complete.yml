name: Agent6 WP017 final roadmap completion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent6-wp017-roadmap-complete.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark WP completed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/ROADMAP.md')
          s=p.read_text(encoding='utf-8')
          old='- `WP-S003-010-003-017` — TOP PRIORITY REGRESSION: Planet-Scale Semantic Cleanup + Explainable Marker Visibility\n'
          new='- `WP-S003-010-003-017` — TOP PRIORITY REGRESSION: Planet-Scale Semantic Cleanup + Explainable Marker Visibility — COMPLETED\n'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('WP-S003-010-003-017 ROADMAP line not found in expected state')
          p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/agent6-wp017-roadmap-complete.yml
          git add docs/ROADMAP.md
          git commit -m 'docs(WP-S003-010-003-017): mark completed'
          git pull --rebase origin main
          git push origin HEAD:main
