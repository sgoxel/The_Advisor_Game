name: R01 Browser Verification

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'locales/**'
      - 'textures/**'
      - 'assets/**'
      - 'tests/browser/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r01-browser-verification.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'locales/**'
      - 'textures/**'
      - 'assets/**'
      - 'tests/browser/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r01-browser-verification.yml'
  workflow_dispatch:

concurrency:
  group: verification-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  strategic-map-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run R01 responsive browser verification
        run: npm run test:browser:r01

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r01-browser-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
