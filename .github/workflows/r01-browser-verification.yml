name: R01 Browser Verification

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'locales/**'
      - 'textures/**'
      - 'assets/**'
      - 'tests/browser/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r01-browser-verification.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'locales/**'
      - 'textures/**'
      - 'assets/**'
      - 'tests/browser/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r01-browser-verification.yml'
  workflow_dispatch:

# Broad compatibility evidence follows the newest candidate on each ref.
# Target-specific focused workflows remain available for exact intermediate candidates.
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strategic-map-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run R01 responsive browser verification
        run: npm run test:browser:r01

      - name: Measure Playwright evidence contributors
        if: always()
        shell: bash
        run: |
          echo 'Top-level evidence sizes:'
          du -sh playwright-report test-results 2>/dev/null || true
          echo 'Largest evidence files:'
          find playwright-report test-results -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -n 20 || true

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r01-browser-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            !test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 14
