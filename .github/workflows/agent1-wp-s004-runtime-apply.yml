name: AGENT1 WP-S004 runtime integration
on:
  push:
    branches: [agent1/wp-s004-001-001-20261015]
    paths: [.github/workflows/agent1-wp-s004-runtime-apply.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s004-001-001-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply deterministic morphology and bounded-runtime patches
        run: |
          if ! grep -q "function settlementStreetAt" src/world.ts; then node tools/agent1-wp-s004-patch-v4.mjs; fi
          if ! grep -q "nearbyPlaces, places" src/world.ts; then node tools/agent1-wp-s004-patch-v5.mjs; fi
      - run: npm ci
      - name: Validate settlement runtime
        run: node --experimental-strip-types --test tests/settlement-exterior.test.ts tests/world.test.ts tests/final-surface-integration.test.ts tests/political-atlas.test.ts
      - run: npm run build
      - name: Commit validated source integration
        run: |
          git config user.name "AGENT #1"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/world.ts src/geometry.ts
          git commit -m "feat: integrate bounded settlement morphology runtime"
          git push origin HEAD:agent1/wp-s004-001-001-20261015
