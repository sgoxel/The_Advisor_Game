name: AGENT1 WP-S004 runtime integration
on:
  push:
    branches: [agent1/wp-s004-001-001-20261015]
    paths: [.github/workflows/agent1-wp-s004-runtime-apply.yml]
concurrency:
  group: agent1-wp-s004-runtime-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply deterministic village morphology completion
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          node tools/agent1-wp-s004-patch-v8.mjs
          node tools/agent1-wp-s004-patch-v9.mjs
          node tools/agent1-wp-s004-patch-v10.mjs
          grep -q '"merchant"' src/settlement-exterior.ts
          grep -q '"headman"' src/settlement-exterior.ts
          grep -q '"garden"' src/settlement-exterior.ts
          grep -q '"roadside-tree"' src/world.ts
          grep -q '"path"' src/world.ts
          grep -q '"pavement"' src/world.ts
      - run: npm ci
      - name: Validate completed settlement runtime
        run: node --experimental-strip-types --test tests/settlement-exterior.test.ts tests/world.test.ts tests/village-morphology-runtime.test.ts tests/final-surface-integration.test.ts tests/political-atlas.test.ts
      - name: Production build
        run: npm run build
      - name: Commit validated source integration
        run: |
          git config user.name "AGENT #1"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/settlement-exterior.ts src/world.ts src/geometry.ts tests/settlement-exterior.test.ts tests/world.test.ts tests/village-morphology-runtime.test.ts
          git commit -m "feat: complete deterministic village morphology roles"
          git push origin HEAD:agent1/wp-s004-001-001-20261015

