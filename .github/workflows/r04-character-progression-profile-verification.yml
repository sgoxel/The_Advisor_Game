name: R04 Character Progression Profile Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/character_progression_profile.js'
      - 'js/character_identity.js'
      - 'js/utils.js'
      - 'locales/en.js'
      - 'locales/en.json'
      - 'tests/browser/r04-character-progression-profile.spec.mjs'
      - '.github/workflows/r04-character-progression-profile-verification.yml'
  pull_request:
    paths:
      - 'js/character_progression_profile.js'
      - 'js/character_identity.js'
      - 'js/utils.js'
      - 'locales/en.js'
      - 'locales/en.json'
      - 'tests/browser/r04-character-progression-profile.spec.mjs'
      - '.github/workflows/r04-character-progression-profile-verification.yml'

permissions:
  contents: read

jobs:
  character-profile-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run authoritative starter character profile regression
        run: npx playwright test tests/browser/r04-character-progression-profile.spec.mjs
      - name: Re-run deterministic character identity regression
        run: npx playwright test tests/browser/r04-character-base-identity.spec.mjs --project=desktop
      - name: Run stabilized R01 browser regression
        run: npm run test:browser:r01
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-character-progression-profile-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
