name: Hourly Copilot Agent

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hourly-copilot-agent.yml"
  schedule:
    # Once per hour, offset from the other project agents.
    - cron: "6 * * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write
  copilot-requests: write

concurrency:
  group: hourly-copilot-agent
  cancel-in-progress: false

jobs:
  run-copilot-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Install latest GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run low-usage Auto Copilot agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          COPILOT_PROMPT: |-
            Keep instructions clear and understandable, and explanations simple. Do not delve deeply into every detail at once; always proceed step-by-step. Do not attempt to present everything simultaneously. Always consider the game's performance, stability, and logical integrity. Keep the GitHub repository organized at all times. Delete relevant test files and unnecessary files after an issue is closed. No agent is permitted to block or delay the completion of an issue, or to make its completion contingent upon other issues.
            
            PLANNING THE NEXT STAGE:
            Once all Work Packages (WPs) for the current STAGE in `docs/ROADMAP.md` are completed, review `README.md` and plan the next STAGE. For the new STAGE, list the WP Codes and ONLY their Titles in the ROADMAP. These must be created using the format WP-<STAGE No>-<Work Package No>-<Sub-Work Package No> (e.g., WP-S001-001-001).
            
            Create Work Packages (WPs) as GitHub Issues. Provide detailed information regarding the Objective, Scope, Rules, In-Game Evidence, and Success Criteria for each WP. Do not unnecessarily complicate any WP; each WP should be solvable in a single pass. If this is not possible, break the work package down into sub-work packages. Then, update the GitHub Issues accordingly, pause the process, and await the next command.
            
            DEVELOPMENT AND DESIGN:
            WP tracking will be conducted via GitHub Issues. Always address the issue with the lowest WP code. Check the issue content to see if it has been "CLAIMED." If an issue has been CLAIMED but not completed within 2 hours, you should proceed with that specific issue; otherwise, claim a different ISSUE that does not conflict with one already claimed. Record the exact time you claim the issue. Completed issues must be closed immediately. Once an issue is closed, mark it as COMPLETED in the `docs/ROADMAP.md` file, right next to its title.
            
            Before moving on to the next Issue/Work Package (WP), ensure there are no incomplete work packages remaining from previous stages based on the WP code sequence. If there are, complete the previous work package (WP) first, then pause and wait for the next command.
            
            Work on only one work package per command. Do not perform excessive actions; instead, analyze and verify that the work package is executed correctly and maintains logical consistency.
            
            TEXTURES:
            If a texture is required for a new object, create it as a high-detail, clean vector graphic (.svg) and apply it first (a .png version will be generated later).
            
            EVALUATION:
            First, check the result and assign a score between 1 and 10. If possible, use the `tools/screenshot_tool.py` tool for scoring. Improve the tool for future tests (by adding a pause function to wait for the next command). Before reporting the result to me and updating the relevant issue, the obtained score must be above 7. If the score is below 7, repeat the process up to three times. Update the `docs/ROADMAP.md` file even when making minor changes.
            Update the `changelog.txt` file (adding a timestamp) and write a brief description of the update performed. Following a successful update, propose a logical improvement if appropriate. Record these suggestions—along with the timestamp, work package, and phase number—in a file named `suggest_log.txt` located in the same directory as `changelog.txt`. However, unless you are explicitly asked to implement these suggestions, continue to follow the standard work package workflow.
            
            DEPLOYMENT:
            Always check the GitHub link first.
            All successfully tested new updates will be pushed to the GitHub main branch at https://github.com/sgoxel/The_Advisor_Game. All new versions must be ready for testing at https://sgoxel.github.io/The_Advisor_Game/.
        run: |
          copilot \
            --autopilot \
            --yolo \
            --max-autopilot-continues 2 \
            --max-ai-credits 30 \
            --model "auto" \
            --no-ask-user \
            -p "$COPILOT_PROMPT"

      - name: Persist Copilot changes to main
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "Copilot produced no repository file changes."
            exit 0
          fi

          echo "Copilot changed these repository files:"
          git status --short

          git add -A

          if git diff --cached --quiet; then
            echo "No staged changes to persist."
            exit 0
          fi

          git commit -m "Copilot hourly agent update"

          # Other project agents may update main while this run is active.
          # Rebase onto the newest main before publishing this run.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          echo "Copilot changes committed and pushed to main."
