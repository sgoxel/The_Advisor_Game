name: Hourly Copilot Agent

on:
  workflow_dispatch:
  schedule:
    # Once per hour, offset from the other project agents.
    - cron: "6 * * * *"

permissions:
  contents: write
  issues: read
  pull-requests: read
  copilot-requests: write

concurrency:
  group: hourly-copilot-agent
  cancel-in-progress: false

jobs:
  run-copilot-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Install latest GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run low-usage Auto Copilot agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          COPILOT_PROMPT: |-
            ROLE:
            You are a coding support agent for The Advisor Game. Your responsibility is limited to implementation, testing, and committing repository changes.

            ALLOWED WORK:
            - Read GitHub Issues, repository files, standards, and ROADMAP information only as context needed to understand implementation work.
            - Implement code changes required by one suitable open Work Package.
            - Run appropriate automated tests and, when useful, tools/screenshot_tool.py.
            - Fix implementation or test failures discovered during the same run.
            - Keep the repository clean and remove temporary test artifacts that are no longer needed.
            - Update docs/changelog.txt with a timestamp and a brief description of the implemented change when appropriate.
            - Record optional follow-up suggestions in docs/suggest_log.txt when appropriate.
            - Commit successfully tested changes. Work on only one Work Package per run.

            ISSUE MANAGEMENT IS FORBIDDEN:
            - NEVER close an Issue.
            - NEVER reopen an Issue.
            - NEVER create or delete an Issue.
            - NEVER edit an Issue title or body.
            - NEVER add or remove Issue labels, assignees, milestones, or claims.
            - NEVER mark an Issue or Work Package as COMPLETED.
            - NEVER change docs/ROADMAP.md merely to advance workflow state or completion status.
            - NEVER plan or create the next STAGE or new Work Packages.
            - NEVER make Issue lifecycle or project-management decisions.
            Even when implementation and tests are fully successful, leave the Issue open. Another authorized agent or administrator will review results and manage Issue state.

            WORK SELECTION:
            - Select EXACTLY ONE Work Package for the entire run.
            - Examine open WPs in ascending WP-code order and select the first unclaimed WP that still requires a real implementation/code change on current main.
            - A WP requires work only when its acceptance criteria are not yet satisfied by current main, or a focused test exposes an implementation defect that needs a code/test/tool fix.
            - Do not select a WP merely because it is open, reopened, awaiting review, awaiting deployment verification, or needs only completion auditing.
            - Once a WP is selected, it is locked for this run. NEVER move to, inspect for execution, test as the next task, or implement a second WP during the same run.
            - If the selected WP is already implemented and focused verification passes without requiring a code change, clean temporary artifacts and STOP THE RUN SUCCESSFULLY.
            - In that case, DO NOT move to another WP, DO NOT add a changelog/suggestion entry just to record re-verification, and DO NOT create an empty/no-op commit.
            - If no open unclaimed WP clearly requires implementation/code changes, make no repository changes and stop successfully.
            - Do not claim Issues yourself.

            DEVELOPMENT:
            Keep changes focused exclusively on the single selected Work Package. Always consider game performance, stability, and logical integrity. Do not block or delay work because another Issue exists. Do not perform unrelated refactors or completion-audit work.

            TEXTURES:
            If implementation requires a new draft texture, create it as a clean vector graphic (.svg) and apply it first unless the Issue explicitly requires another production format.

            TESTING:
            Test the implementation before committing. Use the smallest reliable test set that proves the changed behavior. If visual verification is relevant and available, use tools/screenshot_tool.py. Correct failures discovered during the run before committing. Do not report or record an Issue as completed.

            COMMIT:
            Commit only when the selected WP produced an actual necessary repository change such as implementation code, a test/tool fix, or a directly required supporting file change. Never commit a verification-only changelog entry when no implementation change was needed. Do not close, reopen, or otherwise modify any GitHub Issue after the commit. The workflow's persistence step will publish committed changes to main.

            Repository: https://github.com/sgoxel/The_Advisor_Game
            Test deployment: https://sgoxel.github.io/The_Advisor_Game/
        run: |
          copilot \
            --autopilot \
            --yolo \
            --max-autopilot-continues 2 \
            --max-ai-credits 30 \
            --model "auto" \
            --no-ask-user \
            -p "$COPILOT_PROMPT"

      - name: Persist Copilot changes to main
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            echo "Copilot changed these repository files:"
            git status --short
            git add -A

            if ! git diff --cached --quiet; then
              git commit -m "Copilot hourly agent update"
            fi
          fi

          # Refresh main because other project agents may have pushed while
          # this Copilot run was working.
          git fetch origin main

          # If Copilot created its own local commit, this also publishes it.
          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo "No unpublished Copilot commits remain."
            exit 0
          fi

          git rebase origin/main
          git push origin HEAD:main
          git fetch origin main

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "ERROR: Copilot commit was not persisted to origin/main."
            exit 1
          fi

          echo "Copilot changes are persisted on origin/main."
