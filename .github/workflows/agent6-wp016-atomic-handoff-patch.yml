name: Agent6 WP016 Atomic Handoff Patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp016-atomic-handoff-patch.yml"
      - "tools/agent6_wp016_atomic_handoff_patch.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp016-atomic-handoff-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply atomic terrain/static handoff and evidence scenario
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python tools/agent6_wp016_atomic_handoff_patch.py
          node --check scripts/world/planet-stage.js
          python -m py_compile tools/screenshot_tool.py
          git diff --check
      - name: Commit tested runtime and evidence patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world/planet-stage.js tools/screenshot_tool.py
          if git diff --cached --quiet; then
            echo "WP016 atomic handoff patch already current"
            exit 0
          fi
          git commit -m "fix(WP-S003-010-003-016): make local handoff paint-atomic"
          # Remove only transient runner changes after the intended commit is
          # safely in HEAD. This keeps rebase/push reproducible even if validation
          # tools generate bytecode or other local-only files.
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
