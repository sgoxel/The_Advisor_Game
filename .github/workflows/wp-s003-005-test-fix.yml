name: WP-S003-005 test assertion fix
on:
  push:
    paths:
      - '.github/workflows/wp-s003-005-test-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch qualified prepared-region assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/screenshot_tool.py')
          s=p.read_text()
          old='''            if gpu.get("visibleRegionKey") != cache.get("preparedRegionKey"):\n                raise RuntimeError(\n                    f"WP-S003-005 visible/prepared region mismatch in frame {index}: visible={gpu.get('visibleRegionKey')} cache={cache}"\n                )'''
          new='''            visible_region = str(gpu.get("visibleRegionKey") or "")\n            prepared_region = str(cache.get("preparedRegionKey") or "")\n            prepared_base = prepared_region.split("|", 1)[0]\n            if not visible_region or prepared_base != visible_region:\n                raise RuntimeError(\n                    f"WP-S003-005 visible/prepared region mismatch in frame {index}: visible={visible_region} prepared={prepared_region} cache={cache}"\n                )'''
          if old not in s:
              raise SystemExit('expected assertion block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git rm .github/workflows/wp-s003-005-test-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/screenshot_tool.py
          git commit -m 'test: accept resolution-qualified prepared region keys'
          git push origin HEAD:main
