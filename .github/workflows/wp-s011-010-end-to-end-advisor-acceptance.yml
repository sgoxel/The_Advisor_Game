name: WP-S011-010 End-to-End Advisor Acceptance

on:
  push:
    branches: [main]
    paths:
      - "scripts/ui/advisor-toolbelt-ui.js"
      - "scripts/tests/wp-s011-010-end-to-end-advisor-acceptance.test.js"
      - "tools/wp_s011_010_evidence.py"
      - ".github/workflows/wp-s011-010-end-to-end-advisor-acceptance.yml"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp-s011-010-${{ github.sha }}
  cancel-in-progress: false

jobs:
  functional:
    name: End-to-end authority acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Syntax checks
        run: |
          node --check scripts/ui/advisor-toolbelt-ui.js
          node --check scripts/tests/wp-s011-010-end-to-end-advisor-acceptance.test.js
          python -m py_compile tools/wp_s011_010_evidence.py
      - name: Stage 11 end-to-end acceptance
        run: |
          node scripts/tests/wp-s011-010-end-to-end-advisor-acceptance.test.js
          node scripts/tests/wp-s010-010-end-to-end-acceptance.test.js
          node scripts/tests/wp-s011-001-advisor-progression.test.js
          node scripts/tests/wp-s011-002-advisor-insight.test.js
          node scripts/tests/wp-s011-006-advisor-command.test.js
          node scripts/tests/wp-s011-008-advisor-tool-resolution.test.js
          node scripts/tests/wp-s011-009-advisor-toolbelt-ui.test.js

  visual:
    name: Fresh phone + desktop acceptance evidence
    needs: functional
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Verify browser
        run: google-chrome --version || google-chrome-stable --version || chromium --version
      - name: Start exact-head game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-wp-s011-010-http.log 2>&1 &
          echo $! >/tmp/advisor-wp-s011-010-http.pid
          sleep 1
      - name: Capture production acceptance evidence
        env:
          TARGET: http://127.0.0.1:8000/
          OUT: tools/screenshots/wp-s011-010
        run: python tools/wp_s011_010_evidence.py
      - name: Upload fresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s011-010-end-to-end-${{ github.sha }}
          path: tools/screenshots/wp-s011-010/
          if-no-files-found: error
          retention-days: 14
