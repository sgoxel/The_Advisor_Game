name: Admin 150 README Visual Direction Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-150-readme-visual-direction-patch.yml'

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply authorized README visual direction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = '''## 🎨 Visual Direction

The visual direction should support coherent isometric / near-isometric presentation, high-quality 2D and 3D assets, readable silhouettes and scale, character emotion and atmosphere, distinct settlements and environments, animals and creatures, environmental effects, day/night readability, and progressive improvement from early placeholders to polished visual assets.

A Worker acting in the **Designer** role chooses the appropriate tools, asset formats, modeling methods, export settings, optimization methods, and production pipeline for each approved task.

Visual assets never become simulation authority.
'''
          new = '''## 🎨 Visual Direction

The game should have an **original mature seinen-anime-inspired character-art direction** without copying any specific manga, anime, artist, protected character, costume, composition, or signature visual identity. Characters should favor grounded adult proportions, readable silhouettes, expressive but restrained faces, clear age/status/profession differentiation, believable medieval-fantasy costuming, and an emotionally serious tone appropriate to an adult-oriented fantasy world.

The wider presentation should evoke **old-school PC RPG visual character** while remaining its own original product: readable isometric or near-isometric world composition, hand-crafted, painterly, or pre-rendered-feeling environments and portraits where appropriate, grounded medieval-fantasy atmosphere, strong material and texture readability, restrained effects, and clear information-dense interface framing associated with classic computer roleplaying games.

Character portraits, in-world characters, UI illustration, environments, settlements, creatures, props, and later regional/realm/world strategic views should feel like one coherent product family rather than unrelated styles.

This art direction remains compatible with the game's mixed 2D/3D WebGL presentation, responsive desktop/tablet/phone support, accessibility, performance requirements, living strategic-map primacy, and Simulation authority. Nostalgic or detailed presentation must not justify unreadable UI, inaccessible interaction, excessive rendering cost, or presentation state becoming authoritative game truth.

Early placeholder assets may remain during development, but replacement and final visual work should progressively converge toward this direction rather than unrelated visual styles.

A Worker acting in the **Designer** role chooses the appropriate tools, asset formats, modeling methods, export settings, optimization methods, and production pipeline for each approved task.

Visual assets never become simulation authority.
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one current Visual Direction block, found {count}. Refusing to modify README.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- README.md
          git config user.name "The Advisor Game Worker"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && { echo 'No README change produced'; exit 1; }
          git commit -m "Define original mature RPG visual direction (#150)"
          git push origin HEAD:main
