name: Agent6 WP006 Final Attempt Documentation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp006-docs-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp006-docs-finalize
  cancel-in-progress: false

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record capped WP-006 evaluation and clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path

          changelog = Path('docs/changelog.txt')
          entry = "2026-10-03 03:59 +03:00 | AGENT #6 | WP-S003-010-003-006 | MIXED INCOMPLETE — Final capped visual attempt on deployed renderer tree 2ffdf5c4d0845254798353e6acc90fd1e13ab58d (product fix 59c9627e0081582d0bf5f0925d292e56a64b564d; evidence run 37083672119, artifact 11260300979). The presentation-only ownership gate keeps an undersized 1x focus terrain child from taking terrain ownership before viewport coverage while local settlement semantics remain active. Functional 13-checkpoint handoff evidence passed with blockingZoomBuilds=0, no blank frame or stand-in state, settled local pendingPreparationCount=0, and max observed swap 4.7 ms. All 13 fresh screenshots were directly inspected; VISUAL 7.3/10 because obvious soft rectangular continuation footprints remain at 10 km and 500 m. The 8/10 MIXED acceptance threshold is not met; ROADMAP remains unmarked and Issue #158 remains open.\n"
          text = changelog.read_text(encoding='utf-8')
          if 'evidence run 37083672119' not in text:
              changelog.write_text(entry + text, encoding='utf-8')

          suggest = Path('docs/suggest_log.txt')
          suggestion = "2026-10-03 03:59 +03:00 | WP-S003-010-003-006 | Phase 3 | FUTURE — Replace the finite rectangular medium/outer continuation ownership footprint with viewport-complete or shape-neutral world-matched coverage while preserving ready-before-swap semantics and bounded streaming; revalidate the 10 km and 500 m handoffs before acceptance.\n"
          stext = suggest.read_text(encoding='utf-8')
          if 'WP-S003-010-003-006 | Phase 3 | FUTURE' not in stext:
              suggest.write_text(suggestion + stext, encoding='utf-8')
          PY
          git rm .github/workflows/agent6-wp006-docs-finalize.yml
          git add docs/changelog.txt docs/suggest_log.txt
          git diff --check
          git commit -m "docs(WP-S003-010-003-006): record capped visual result"
          git pull --rebase origin main
          git push origin HEAD:main
