name: Emergency restore #351 spatial runtime
on:
  push:
    paths:
      - '.github/workflows/emergency-restore-351.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore prior file and apply focused fix
        run: |
          git checkout a04e7c3a09995abcdbae1a0441c8231574ad12a9 -- js/npc_spatial_runtime.js
          python - <<'PY'
          from pathlib import Path
          p=Path('js/npc_spatial_runtime.js')
          s=p.read_text()
          old="resolved.set(npc.id, { point: fixedPoint, decision: 'hold', collided: false });"
          new="resolved.set(npc.id, { point: fixedPoint, decision: npc.movementDecision || 'hold', collided: false });"
          if old not in s: raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'Worker #4'
          git config user.email '163722426+sgoxel@users.noreply.github.com'
          git add js/npc_spatial_runtime.js
          git commit -m 'fix(r04): preserve fixed NPC decisions during same-time recovery (#351)'
          git push
