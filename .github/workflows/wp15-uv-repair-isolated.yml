name: WP15 isolated refined terrain UV repair

on:
  push:
    branches:
      - agent1/wp-s002-004-005-uv-final2

permissions:
  contents: write

concurrency:
  group: wp15-refined-terrain-uv-isolated
  cancel-in-progress: true

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated WP branch
        uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-uv-final2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore canonical UVs on refined terrain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/terrain-refine.ts')
          text = p.read_text()
          if 'const uvs = new Float32Array((positions.length / 3) * 2);' in text:
              print('refined terrain UVs already present')
              raise SystemExit(0)
          pattern = re.compile(
              r'  const originX = tile\.minX \+ tile\.size / 2,\n'
              r'\s*originZ = tile\.minZ \+ tile\.size / 2;\n'
              r'  for \(let i = 0; i < positions\.length; i \+= 3\) \{\n'
              r'    positions\[i\] -= originX;\n'
              r'    positions\[i \+ 2\] -= originZ;\n'
              r'  \}\n'
              r'  return \{\n'
              r'    positions: new Float32Array\(positions\),\n'
              r'    normals: new Float32Array\(normals\),\n'
              r'    colors: new Uint8Array\(colors\),\n'
              r'    indices: new Uint32Array\(indices\),\n'
              r'  \};\n'
              r'\}',
              re.MULTILINE,
          )
          replacement = "\n".join([
              "  const originX = tile.minX + tile.size / 2,",
              "    originZ = tile.minZ + tile.size / 2;",
              "  // Refined terrain creates new clipped/water vertices, so rebuild the",
              "  // canonical source-coordinate UV0 required by the shared projection material",
              "  // while positions are still absolute, before converting them to tile-local.",
              "  const uvs = new Float32Array((positions.length / 3) * 2);",
              "  for (let i = 0, v = 0; i < positions.length; i += 3, v += 2) {",
              "    uvs[v] = positions[i] / SOURCE_PRESENTATION_WIDTH + 0.5;",
              "    uvs[v + 1] = Math.max(",
              "      0,",
              "      Math.min(1, 0.5 + (positions[i + 2] * 2) / SOURCE_PRESENTATION_WIDTH),",
              "    );",
              "  }",
              "  for (let i = 0; i < positions.length; i += 3) {",
              "    positions[i] -= originX;",
              "    positions[i + 2] -= originZ;",
              "  }",
              "  return {",
              "    positions: new Float32Array(positions),",
              "    normals: new Float32Array(normals),",
              "    colors: new Uint8Array(colors),",
              "    indices: new Uint32Array(indices),",
              "    uvs,",
              "  };",
              "}",
          ])
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one terrain-refine return block, found {count}')
          p.write_text(updated)
          PY
      - name: Install
        run: npm ci
      - name: Targeted regression
        run: node --experimental-strip-types --test tests/terrain-refine.test.ts tests/surface-presentation.test.ts
      - name: Build
        run: npm run build
      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/terrain-refine.ts; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/terrain-refine.ts
          git commit -m "WP-S002-004-005 preserve refined terrain projection UVs"
          git push origin HEAD:agent1/wp-s002-004-005-uv-final2
