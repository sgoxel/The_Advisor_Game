name: S005 one-shot generated road-cache repair
on:
  push:
    branches: [agent1/wp-s005-001-001-canonical-cache-repair-20261023]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate strictly from current canonical SEED generator
        run: node --experimental-strip-types tools/build-world-cache.ts
      - name: Check canonical cache equals live generator
        run: timeout 5m node --experimental-strip-types --test tests/world-cache.test.ts
      - name: Commit only regenerated cache payloads to repair branch
        run: |
          if ! git diff --quiet -- src/generated/road-network.json src/generated/transport-extensions.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/generated/road-network.json src/generated/transport-extensions.json
            git commit -m "S005: regenerate exact canonical transport cache"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
