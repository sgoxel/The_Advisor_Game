name: AGENT1 WP-S004 Windows exact-source verification
on:
  push:
    branches: [agent1/wp-s004-001-001-20261015]
    paths:
      - .github/workflows/agent1-wp-s004-windows.yml
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify exact corrected source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${env:GITHUB_SHA}") { throw "wrong source SHA" }
          Select-String -Path src/settlement-exterior.ts -Pattern '/EXTERIOR/WATER-MORPH' -Quiet | ForEach-Object { if (-not $_) { throw "missing morphology runtime" } }
          Select-String -Path src/continuity-corridor.ts -Pattern 'for\(let a=0;a<candidates.length;a\+\+\)for\(let b=a\+1;b<candidates.length;b\+\+\)' -Quiet | ForEach-Object { if (-not $_) { throw "continuity fix missing" } }
      - run: npm ci
      - name: Settlement, political, surface and continuity regression
        shell: pwsh
        run: node --experimental-strip-types --test tests/settlement-exterior.test.ts tests/world.test.ts tests/final-surface-integration.test.ts tests/political-atlas.test.ts tests/continuity.test.ts
      - name: Production build
        run: npm run build
