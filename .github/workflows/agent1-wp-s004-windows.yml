name: AGENT1 WP-S004 Windows chain verification
on:
  push:
    branches: [agent1/wp-s004-001-001-20261015]
    paths:
      - .github/workflows/agent1-wp-s004-windows.yml
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply exact deterministic settlement-access correction
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${env:GITHUB_SHA}") { throw "wrong source SHA" }
          node tools/agent1-wp-s004-patch-v11.mjs
          if (Select-String -Path src/geography.ts -SimpleMatch 'selected[selected.length - 1]' -Quiet) { throw "sibling-order placement authority remains" }
          if (-not (Select-String -Path src/geography.ts -SimpleMatch 'return children.map((toPlace, index)' -Quiet)) { throw "parent access road correction missing" }
          if (-not (Select-String -Path tests/political-atlas.test.ts -SimpleMatch 'every village needs one legal provisional parent access reserve' -Quiet)) { throw "parent access regression missing" }
      - run: npm ci
      - name: Validate S004 distribution, morphology and continuity
        shell: pwsh
        run: node --experimental-strip-types --test tests/political-atlas.test.ts tests/continuity.test.ts tests/settlement-exterior.test.ts tests/village-morphology-runtime.test.ts tests/wp-s004-world-integration.test.ts tests/final-surface-integration.test.ts
      - name: Production build
        run: npm run build
