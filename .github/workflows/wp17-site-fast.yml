name: WP17 site access fast gate
on:
  push:
    branches: [agent1/wp-s002-004-007-site-access]
permissions:
  contents: read
jobs:
  unit-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
