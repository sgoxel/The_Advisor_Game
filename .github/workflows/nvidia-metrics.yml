          ## Definitions

          - \`success\` means the AI Developer finalize gate routed the auxiliary result to \`ai-awaiting-review\`; it is not formal verification.
          - \`handoff\` means the auxiliary result was routed to \`ai-handoff\` for formal Worker continuation.
          - \`evidence_verdict\` is schema-v3+ normalized evidence from the explicit \`VERDICT:\` line; historical records without it remain valid with unknown verdict.
          - \`grounding_verified\` is schema-v4 and true only for a terminal success that includes \`GROUNDING: VERIFIED\` plus at least one source line; the AI Developer finalizer independently validates literal source paths/tokens before success.
          - \`retry_used\` tracks only the explicit bounded outer retry in the composite action.
          - \`provider_503_count/provider_503_seen\` are schema-v2+ fields derived from the exact completed role-job log and include OpenCode/NVIDIA internal overload events that do not trigger the outer retry.
          - Historical schema-v1 metric comments remain append-only and are not rewritten; their provider 503 fields are unknown and therefore excluded from provider-503 totals.
          - Current-policy metrics intentionally exclude historical Coder execution and pre-policy runs.
          - \`AI AUXILIARY OPPORTUNITY\` is recorded by Planner only when a suitable candidate actually exists; it is not a count of every Planner scan.
          - \`routed\` means one supported role plus \`ai-ready\` was assigned; \`deferred_busy\` means the single NVIDIA slot was occupied; \`skipped_formal_claim\` avoids racing a formal Worker already testing the target.
          - \`AI AUXILIARY FOLLOW-UP\` compares NVIDIA evidence with a later genuinely comparable formal verdict. \`not_comparable\` is required when the two roles answer different questions.
          - Evidence matching tolerates harmless leading Markdown wrappers but still requires the normalized comment to begin with the exact role evidence marker.
          - \`coder_completed\` is historical compatibility data only and cannot re-enable NVIDIA Coder routing.
          - AI Developer runs that never invoke NVIDIA are intentionally excluded because they have no \`AI AUXILIARY RUN\` marker.

