name: NVIDIA Auxiliary Metrics

on:
  workflow_run:
    workflows: ["AI Developer"]
    types: [completed]

concurrency:
  group: nvidia-metrics-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  record:
    if: github.event.workflow_run.event == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    env:
      LEDGER_ISSUE: "79"
      CURRENT_POLICY_START: "2026-08-28T18:10:19Z"
      CURRENT_POLICY_NAME: "Nemotron Super Reviewer/Tester-only"
    steps:
      - name: Record and aggregate NVIDIA auxiliary metric
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          LEDGER_COMMENTS="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${LEDGER_ISSUE}/comments?per_page=100" |
              jq -s 'add'
          )"

          RUN_LINE="$(
            printf '%s' "$LEDGER_COMMENTS" |
              jq -r --arg run "$RUN_ID" --arg attempt "$RUN_ATTEMPT" \
                '[.[]
                  | select((.body // "") | startswith("AI AUXILIARY RUN: "))
                  | select((.body // "") | contains("run_id=" + $run + " "))
                  | select((.body // "") | contains("run_attempt=" + $attempt + " "))
                ] | last | .body // ""'
          )"

          if [ -z "$RUN_LINE" ]; then
            echo "AI Developer run ${RUN_ID}/${RUN_ATTEMPT} has no NVIDIA run marker; no metric is required."
            exit 0
          fi

          ISSUE_NUMBER="$(printf '%s' "$RUN_LINE" | sed -n 's/.* issue=\([0-9][0-9]*\).*/\1/p')"
          ROLE="$(printf '%s' "$RUN_LINE" | sed -n 's/.* role=\([^ ]*\) model=.*/\1/p')"
          MODEL="$(printf '%s' "$RUN_LINE" | sed -n 's/.* model=\([^ ]*\) started_at=.*/\1/p')"
          STARTED_AT="$(printf '%s' "$RUN_LINE" | sed -n 's/.* started_at=\([^ ]*\)$/\1/p')"

          if [ -z "$ISSUE_NUMBER" ] || [ -z "$ROLE" ] || [ -z "$MODEL" ] || [ -z "$STARTED_AT" ]; then
            gh issue comment "$LEDGER_ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body "AI AUXILIARY METRICS WARNING: run ${RUN_ID}/${RUN_ATTEMPT} has a malformed run marker and cannot be aggregated safely: ${RUN_LINE}" >/dev/null
            exit 0
          fi

          case "$ROLE" in
            coder) REQUIRED_PREFIX="AI CODER EVIDENCE:" ;;
            reviewer) REQUIRED_PREFIX="AI REVIEW EVIDENCE:" ;;
            tester) REQUIRED_PREFIX="AI TEST EVIDENCE:" ;;
            *)
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "AI AUXILIARY METRICS WARNING: unsupported role '${ROLE}' in run ${RUN_ID}/${RUN_ATTEMPT}; ledger record skipped." >/dev/null
              exit 0
              ;;
          esac

          EXISTING_METRIC_COUNT="$(
            printf '%s' "$LEDGER_COMMENTS" |
              jq --argjson run "$RUN_ID" --argjson attempt "$RUN_ATTEMPT" \
                '[.[]
                  | select((.body // "") | startswith("AI AUXILIARY METRIC: "))
                  | (.body | sub("^AI AUXILIARY METRIC: "; "") | fromjson?)
                  | select(. != null)
                  | select(.run_id == $run and .run_attempt == $attempt)
                ] | length'
          )"
          if [ "$EXISTING_METRIC_COUNT" -gt 0 ]; then
            echo "Metric already exists for AI Developer run ${RUN_ID}/${RUN_ATTEMPT}; skipping duplicate."
            exit 0
          fi

          COMMENTS="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" |
              jq -s 'add'
          )"
          ISSUE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"

          TERMINAL_SUCCESS_COUNT="$(
            printf '%s' "$COMMENTS" |
              jq --arg start "$STARTED_AT" --arg role "$ROLE" \
                '[.[] | select(.created_at >= $start)
                  | select((.body // "") | contains("AI AUXILIARY COMPLETE: role=" + $role + "."))
                ] | length'
          )"
          TERMINAL_HANDOFF_COUNT="$(
            printf '%s' "$COMMENTS" |
              jq --arg start "$STARTED_AT" \
                '[.[] | select(.created_at >= $start)
                  | select((.body // "") | contains("AI-HANDOFF: NVIDIA/OpenCode did not produce a complete"))
                ] | length'
          )"

          if [ "$TERMINAL_SUCCESS_COUNT" -gt 0 ]; then
            STATUS="success"
          elif [ "$TERMINAL_HANDOFF_COUNT" -gt 0 ]; then
            STATUS="handoff"
          else
            LABELS="$(printf '%s' "$ISSUE_JSON" | jq -r '.labels[].name')"
            if printf '%s\n' "$LABELS" | grep -Fxq 'ai-awaiting-review'; then
              STATUS="success"
            elif printf '%s\n' "$LABELS" | grep -Fxq 'ai-handoff'; then
              STATUS="handoff"
            else
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "AI AUXILIARY METRICS WARNING: AI Developer run ${RUN_ID}/${RUN_ATTEMPT} completed but no terminal auxiliary success/handoff state can be established safely." >/dev/null
              exit 0
            fi
          fi

          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          HEAD_SHA="$(printf '%s' "$RUN_JSON" | jq -r '.head_sha // "unknown"')"
          RUN_URL="$(printf '%s' "$RUN_JSON" | jq -r '.html_url // ""')"

          JOBS="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" |
              jq -s '[.[] | .jobs[]]'
          )"
          JOB_ID="$(printf '%s' "$JOBS" | jq -r --arg role "$ROLE" '[.[] | select(.name == $role)] | last | .id // 0')"
          JOB_URL="$(printf '%s' "$JOBS" | jq -r --arg role "$ROLE" '[.[] | select(.name == $role)] | last | .html_url // ""')"
          JOB_CONCLUSION="$(printf '%s' "$JOBS" | jq -r --arg role "$ROLE" '[.[] | select(.name == $role)] | last | .conclusion // "unknown"')"

          EVIDENCE_COUNT="$(
            printf '%s' "$COMMENTS" |
              jq --arg start "$STARTED_AT" --arg prefix "$REQUIRED_PREFIX" '
                def normalized: gsub("^[[:space:]*_`#>-]+"; "");
                [.[] | select(.created_at >= $start)
                  | select(((.body // "") | normalized) | startswith($prefix))
                ] | length'
          )"
          EVIDENCE_URL="$(
            printf '%s' "$COMMENTS" |
              jq -r --arg start "$STARTED_AT" --arg prefix "$REQUIRED_PREFIX" '
                def normalized: gsub("^[[:space:]*_`#>-]+"; "");
                [.[] | select(.created_at >= $start)
                  | select(((.body // "") | normalized) | startswith($prefix))
                ] | last | .html_url // ""'
          )"
          EVIDENCE_BODY="$(
            printf '%s' "$COMMENTS" |
              jq -r --arg start "$STARTED_AT" --arg prefix "$REQUIRED_PREFIX" '
                def normalized: gsub("^[[:space:]*_`#>-]+"; "");
                [.[] | select(.created_at >= $start)
                  | select(((.body // "") | normalized) | startswith($prefix))
                ] | last | .body // ""'
          )"
          EVIDENCE_VERDICT_RAW="$(printf '%s\n' "$EVIDENCE_BODY" | sed -n 's/^[[:space:]]*VERDICT:[[:space:]]*//p' | head -n 1 | tr '[:lower:]' '[:upper:]' | xargs || true)"
          case "$EVIDENCE_VERDICT_RAW" in
            PASS) EVIDENCE_VERDICT="pass" ;;
            "CHANGES REQUESTED") EVIDENCE_VERDICT="changes_requested" ;;
            FAIL) EVIDENCE_VERDICT="fail" ;;
            *) EVIDENCE_VERDICT="unknown" ;;
          esac

          if printf '%s\n' "$EVIDENCE_BODY" | grep -Fxq 'GROUNDING: VERIFIED'; then
            GROUNDING_MARKED=true
          else
            GROUNDING_MARKED=false
          fi
          SOURCE_LINE_COUNT="$(printf '%s\n' "$EVIDENCE_BODY" | grep -c '^SOURCE: ' || true)"
          GROUNDING_VERIFIED=false
          if [ "$STATUS" = "success" ] && [ "$GROUNDING_MARKED" = true ] && [ "$SOURCE_LINE_COUNT" -gt 0 ]; then
            GROUNDING_VERIFIED=true
          fi

          HANDOFF_COUNT="$(
            printf '%s' "$COMMENTS" |
              jq --arg start "$STARTED_AT" '
                def normalized: gsub("^[[:space:]*_`#>-]+"; "");
                [.[] | select(.created_at >= $start)
                  | select(((.body // "") | normalized) | startswith("AI-HANDOFF:"))
                ] | length'
          )"
          HANDOFF_URL="$(
            printf '%s' "$COMMENTS" |
              jq -r --arg start "$STARTED_AT" '
                def normalized: gsub("^[[:space:]*_`#>-]+"; "");
                [.[] | select(.created_at >= $start)
                  | select(((.body // "") | normalized) | startswith("AI-HANDOFF:"))
                ] | last | .html_url // ""'
          )"

          RETRY_COUNT="$(
            printf '%s' "$COMMENTS" |
              jq --arg start "$STARTED_AT" --arg run "$RUN_ID" \
                '[.[] | select(.created_at >= $start)
                  | select((.body // "") | startswith("AI AUXILIARY RETRY: "))
                  | select((.body // "") | contains("run_id=" + $run))
                ] | length'
          )"
          if [ "$RETRY_COUNT" -gt 0 ]; then RETRY_USED=true; else RETRY_USED=false; fi

          JOB_LOG_AVAILABLE=false
          PROVIDER_503_COUNT=0
          if [ "$JOB_ID" -gt 0 ]; then
            if gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --job "$JOB_ID" --log > /tmp/nvidia-role-job.log 2>/dev/null; then
              JOB_LOG_AVAILABLE=true
              PROVIDER_503_COUNT="$(grep -c 'Service temporarily overloaded' /tmp/nvidia-role-job.log || true)"
              if [ "$PROVIDER_503_COUNT" -eq 0 ]; then
                PROVIDER_503_COUNT="$(grep -Ec 'HTTP[[:space:]]+503|"code"[[:space:]]*:[[:space:]]*503' /tmp/nvidia-role-job.log || true)"
              fi
            fi
          fi
          if [ "$PROVIDER_503_COUNT" -gt 0 ]; then PROVIDER_503_SEEN=true; else PROVIDER_503_SEEN=false; fi

          PR_COUNT=0
          PR_URL=""
          if [ "$ROLE" = "coder" ]; then
            PRS="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json body,url,number)"
            PR_COUNT="$(printf '%s' "$PRS" | jq --arg issue "#${ISSUE_NUMBER}" '[.[] | select((.body // "") | contains($issue))] | length')"
            PR_URL="$(printf '%s' "$PRS" | jq -r --arg issue "#${ISSUE_NUMBER}" '[.[] | select((.body // "") | contains($issue))] | first | .url // ""')"
          fi

          CODER_COMPLETED=false
          if [ "$ROLE" = "coder" ] && [ "$STATUS" = "success" ] && \
             [ "$EVIDENCE_COUNT" -gt 0 ] && [ "$HANDOFF_COUNT" -eq 0 ] && [ "$PR_COUNT" -gt 0 ]; then
            CODER_COMPLETED=true
          fi

          ENDED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          START_EPOCH="$(date -u -d "$STARTED_AT" +%s)"
          END_EPOCH="$(date -u -d "$ENDED_AT" +%s)"
          DURATION_SECONDS="$((END_EPOCH - START_EPOCH))"
          if [ "$DURATION_SECONDS" -lt 0 ]; then DURATION_SECONDS=0; fi
          SOURCE_ISSUE_URL="https://github.com/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}"

          METRIC="$(jq -cn \
            --argjson schema_version 4 \
            --arg timestamp "$ENDED_AT" \
            --argjson issue_number "$ISSUE_NUMBER" \
            --arg source_issue_url "$SOURCE_ISSUE_URL" \
            --arg role "$ROLE" \
            --arg model "$MODEL" \
            --argjson run_id "$RUN_ID" \
            --argjson run_attempt "$RUN_ATTEMPT" \
            --arg run_url "$RUN_URL" \
            --argjson job_id "$JOB_ID" \
            --arg job_url "$JOB_URL" \
            --arg job_conclusion "$JOB_CONCLUSION" \
            --arg head_sha "$HEAD_SHA" \
            --arg started_at "$STARTED_AT" \
            --arg ended_at "$ENDED_AT" \
            --argjson duration_seconds "$DURATION_SECONDS" \
            --argjson retry_used "$RETRY_USED" \
            --argjson job_log_available "$JOB_LOG_AVAILABLE" \
            --argjson provider_503_seen "$PROVIDER_503_SEEN" \
            --argjson provider_503_count "$PROVIDER_503_COUNT" \
            --arg status "$STATUS" \
            --arg evidence_verdict "$EVIDENCE_VERDICT" \
            --argjson evidence_count "$EVIDENCE_COUNT" \
            --arg evidence_url "$EVIDENCE_URL" \
            --argjson grounding_marked "$GROUNDING_MARKED" \
            --argjson source_line_count "$SOURCE_LINE_COUNT" \
            --argjson grounding_verified "$GROUNDING_VERIFIED" \
            --argjson handoff_count "$HANDOFF_COUNT" \
            --arg handoff_url "$HANDOFF_URL" \
            --argjson coder_pr_count "$PR_COUNT" \
            --arg coder_pr_url "$PR_URL" \
            --argjson coder_completed "$CODER_COMPLETED" \
            --argjson ledger_issue "$LEDGER_ISSUE" \
            '{schema_version:$schema_version,timestamp:$timestamp,issue_number:$issue_number,source_issue_url:$source_issue_url,role:$role,model:$model,run_id:$run_id,run_attempt:$run_attempt,run_url:$run_url,job_id:$job_id,job_url:$job_url,job_conclusion:$job_conclusion,head_sha:$head_sha,started_at:$started_at,ended_at:$ended_at,duration_seconds:$duration_seconds,retry_used:$retry_used,job_log_available:$job_log_available,provider_503_seen:$provider_503_seen,provider_503_count:$provider_503_count,status:$status,evidence_verdict:$evidence_verdict,evidence_count:$evidence_count,evidence_url:$evidence_url,grounding_marked:$grounding_marked,source_line_count:$source_line_count,grounding_verified:$grounding_verified,handoff_count:$handoff_count,handoff_url:$handoff_url,coder_pr_count:$coder_pr_count,coder_pr_url:$coder_pr_url,coder_completed:$coder_completed,ledger_issue:$ledger_issue}')"

          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "AI AUXILIARY METRIC: ${METRIC}" >/dev/null
          gh issue comment "$LEDGER_ISSUE" --repo "$GITHUB_REPOSITORY" --body "AI AUXILIARY METRIC: ${METRIC}" >/dev/null

          LEDGER_COMMENTS="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${LEDGER_ISSUE}/comments?per_page=100" |
              jq -s 'add'
          )"
          METRICS="$(
            printf '%s' "$LEDGER_COMMENTS" |
              jq '[.[]
                | select((.body // "") | startswith("AI AUXILIARY METRIC: "))
                | (.body | sub("^AI AUXILIARY METRIC: "; "") | fromjson?)
              ] | map(select(. != null))'
          )"
          OPPORTUNITIES="$(
            printf '%s' "$LEDGER_COMMENTS" |
              jq '[.[]
                | select((.body // "") | startswith("AI AUXILIARY OPPORTUNITY: "))
                | (.body | sub("^AI AUXILIARY OPPORTUNITY: "; "") | fromjson?)
              ] | map(select(. != null))'
          )"
          FOLLOWUPS="$(
            printf '%s' "$LEDGER_COMMENTS" |
              jq '[.[]
                | select((.body // "") | startswith("AI AUXILIARY FOLLOW-UP: "))
                | (.body | sub("^AI AUXILIARY FOLLOW-UP: "; "") | fromjson?)
              ] | map(select(. != null))'
          )"

          TOTAL="$(printf '%s' "$METRICS" | jq 'length')"
          SUCCESS="$(printf '%s' "$METRICS" | jq '[.[] | select(.status == "success")] | length')"
          HANDOFF="$(printf '%s' "$METRICS" | jq '[.[] | select(.status == "handoff")] | length')"
          RETRIES="$(printf '%s' "$METRICS" | jq '[.[] | select(.retry_used == true)] | length')"
          PROVIDER_503_RUNS="$(printf '%s' "$METRICS" | jq '[.[] | select((.provider_503_count // 0) > 0)] | length')"
          PROVIDER_503_EVENTS="$(printf '%s' "$METRICS" | jq '[.[] | (.provider_503_count // 0)] | add // 0')"
          CODER_RUNS="$(printf '%s' "$METRICS" | jq '[.[] | select(.role == "coder")] | length')"
          CODER_SUCCESS="$(printf '%s' "$METRICS" | jq '[.[] | select(.role == "coder" and .status == "success")] | length')"
          CODER_HANDOFF="$(printf '%s' "$METRICS" | jq '[.[] | select(.role == "coder" and .status == "handoff")] | length')"
          CODER_COMPLETED_RUNS="$(printf '%s' "$METRICS" | jq '[.[] | select(.coder_completed == true)] | length')"
          CODER_COMPLETED_ISSUES="$(printf '%s' "$METRICS" | jq '[.[] | select(.coder_completed == true) | .issue_number] | unique | length')"
          REVIEWER_RUNS="$(printf '%s' "$METRICS" | jq '[.[] | select(.role == "reviewer")] | length')"
          REVIEWER_SUCCESS="$(printf '%s' "$METRICS" | jq '[.[] | select(.role == "reviewer" and .status == "success")] | length')"
          REVIEWER_HANDOFF="$(printf '%s' "$METRICS" | jq '[.[] | select(.role == "reviewer" and .status == "handoff")] | length')"
          TESTER_RUNS="$(printf '%s' "$METRICS" | jq '[.[] | select(.role == "tester")] | length')"
          TESTER_SUCCESS="$(printf '%s' "$METRICS" | jq '[.[] | select(.role == "tester" and .status == "success")] | length')"
          TESTER_HANDOFF="$(printf '%s' "$METRICS" | jq '[.[] | select(.role == "tester" and .status == "handoff")] | length')"
          SUCCESS_RATE="$(awk -v success="$SUCCESS" -v total="$TOTAL" 'BEGIN { if (total == 0) printf "0.0"; else printf "%.1f", (100 * success / total) }')"

          CURRENT_METRICS="$(printf '%s' "$METRICS" | jq --arg start "$CURRENT_POLICY_START" '[.[] | select((.timestamp // "") >= $start) | select(.role == "reviewer" or .role == "tester")]')"
          CURRENT_RUNS="$(printf '%s' "$CURRENT_METRICS" | jq 'length')"
          CURRENT_SUCCESS="$(printf '%s' "$CURRENT_METRICS" | jq '[.[] | select(.status == "success")] | length')"
          CURRENT_HANDOFF="$(printf '%s' "$CURRENT_METRICS" | jq '[.[] | select(.status == "handoff")] | length')"
          CURRENT_REVIEWER="$(printf '%s' "$CURRENT_METRICS" | jq '[.[] | select(.role == "reviewer")] | length')"
          CURRENT_TESTER="$(printf '%s' "$CURRENT_METRICS" | jq '[.[] | select(.role == "tester")] | length')"
          CURRENT_503_RUNS="$(printf '%s' "$CURRENT_METRICS" | jq '[.[] | select((.provider_503_count // 0) > 0)] | length')"
          CURRENT_DURATION_SUM="$(printf '%s' "$CURRENT_METRICS" | jq '[.[] | (.duration_seconds // 0)] | add // 0')"
          CURRENT_AVG_SECONDS="$(awk -v seconds="$CURRENT_DURATION_SUM" -v total="$CURRENT_RUNS" 'BEGIN { if (total == 0) printf "0"; else printf "%.0f", (seconds / total) }')"
          CURRENT_SUCCESS_RATE="$(awk -v success="$CURRENT_SUCCESS" -v total="$CURRENT_RUNS" 'BEGIN { if (total == 0) printf "0.0"; else printf "%.1f", (100 * success / total) }')"
          CURRENT_GROUNDED="$(printf '%s' "$CURRENT_METRICS" | jq '[.[] | select(.grounding_verified == true)] | length')"
          CURRENT_UNGROUNDED_SUCCESS="$(printf '%s' "$CURRENT_METRICS" | jq '[.[] | select(.status == "success" and (.grounding_verified // false) != true)] | length')"

          CURRENT_OPPORTUNITIES="$(printf '%s' "$OPPORTUNITIES" | jq --arg start "$CURRENT_POLICY_START" '[.[] | select((.timestamp // "") >= $start)]')"
          OPPORTUNITY_TOTAL="$(printf '%s' "$CURRENT_OPPORTUNITIES" | jq 'length')"
          OPPORTUNITY_ROUTED="$(printf '%s' "$CURRENT_OPPORTUNITIES" | jq '[.[] | select(.disposition == "routed")] | length')"
          OPPORTUNITY_BUSY="$(printf '%s' "$CURRENT_OPPORTUNITIES" | jq '[.[] | select(.disposition == "deferred_busy")] | length')"
          OPPORTUNITY_FORMAL="$(printf '%s' "$CURRENT_OPPORTUNITIES" | jq '[.[] | select(.disposition == "skipped_formal_claim")] | length')"
          OPPORTUNITY_RATE="$(awk -v routed="$OPPORTUNITY_ROUTED" -v total="$OPPORTUNITY_TOTAL" 'BEGIN { if (total == 0) printf "0.0"; else printf "%.1f", (100 * routed / total) }')"

          CURRENT_FOLLOWUPS="$(printf '%s' "$FOLLOWUPS" | jq --arg start "$CURRENT_POLICY_START" '[.[] | select((.timestamp // "") >= $start)]')"
          FOLLOWUP_TOTAL="$(printf '%s' "$CURRENT_FOLLOWUPS" | jq 'length')"
          FOLLOWUP_AGREE="$(printf '%s' "$CURRENT_FOLLOWUPS" | jq '[.[] | select(.agreement == "agree")] | length')"
          FOLLOWUP_DISAGREE="$(printf '%s' "$CURRENT_FOLLOWUPS" | jq '[.[] | select(.agreement == "disagree")] | length')"
          FOLLOWUP_NOT_COMPARABLE="$(printf '%s' "$CURRENT_FOLLOWUPS" | jq '[.[] | select(.agreement == "not_comparable")] | length')"
          FOLLOWUP_COMPARABLE="$((FOLLOWUP_AGREE + FOLLOWUP_DISAGREE))"
          AGREEMENT_RATE="$(awk -v agree="$FOLLOWUP_AGREE" -v total="$FOLLOWUP_COMPARABLE" 'BEGIN { if (total == 0) printf "0.0"; else printf "%.1f", (100 * agree / total) }')"

          MODEL_ROWS="$(
            printf '%s' "$METRICS" |
              jq -r '
                group_by(.model)[] as $rows
                | ($rows | length) as $attempts
                | ($rows | map(select(.status == "success")) | length) as $success
                | ($rows | map(select(.status == "handoff")) | length) as $handoff
                | ($rows | map(select((.provider_503_count // 0) > 0)) | length) as $p503runs
                | ($rows | map(.provider_503_count // 0) | add // 0) as $p503events
                | ($rows | map(select(.coder_completed == true) | .issue_number) | unique | length) as $coderissues
                | (($success * 1000 / $attempts | floor) / 10) as $rate
                | "| `\($rows[0].model)` | \($attempts) | \($success) | \($handoff) | \($rate)% | \($p503runs) | \($p503events) | \($coderissues) |"'
          )"

          FIRST_CODER="$(
            printf '%s' "$METRICS" |
              jq -r '[.[] | select(.coder_completed == true)] | sort_by(.timestamp)
                | if length == 0 then "None yet"
                  else (.[0] | "#" + (.issue_number|tostring) + " at " + .timestamp + " — run " + (.run_id|tostring))
                  end'
          )"
          LATEST_RUN="$(
            printf '%s' "$METRICS" |
              jq -r 'sort_by(.timestamp)
                | if length == 0 then "None"
                  else (last | "#" + (.issue_number|tostring) + " / " + .role + " / " + .status + " / run " + (.run_id|tostring) + " / " + .timestamp)
                  end'
          )"
          CURRENT_LATEST="$(
            printf '%s' "$CURRENT_METRICS" |
              jq -r 'sort_by(.timestamp)
                | if length == 0 then "None yet"
                  else (last | "#" + (.issue_number|tostring) + " / " + .role + " / " + .status + " / run " + (.run_id|tostring) + " / " + .timestamp)
                  end'
          )"

          cat > /tmp/nvidia-ledger.md <<EOF2
          # NVIDIA Agent Metrics Ledger

          Central observability dashboard for auxiliary NVIDIA Nemotron Reviewer/Tester runs, with historical Coder-era compatibility data retained for audit. Append-only \`AI AUXILIARY METRIC\`, \`AI AUXILIARY OPPORTUNITY\`, and \`AI AUXILIARY FOLLOW-UP\` comments are the machine-readable source records; this body is regenerated after every instrumented AI Developer completion.

          ## Aggregate historical statistics

          | Metric | Value |
          | --- | ---: |
          | Instrumented execution attempts | ${TOTAL} |
          | Successful auxiliary results | ${SUCCESS} |
          | Handoffs to formal Workers | ${HANDOFF} |
          | Overall auxiliary success rate | ${SUCCESS_RATE}% |
          | Runs using the bounded outer NVIDIA HTTP 503 retry | ${RETRIES} |
          | Runs with provider/OpenCode 503 observed in schema-v2+ logs | ${PROVIDER_503_RUNS} |
          | Provider/OpenCode 503 events observed in schema-v2+ logs | ${PROVIDER_503_EVENTS} |
          | Historical NVIDIA Coder attempts | ${CODER_RUNS} |
          | Historical NVIDIA Coder successful/verifiable runs | ${CODER_SUCCESS} |
          | Historical NVIDIA Coder handoffs | ${CODER_HANDOFF} |
          | Historical NVIDIA Coder completed-run records | ${CODER_COMPLETED_RUNS} |
          | Distinct historical Coder issues completed by old gate | ${CODER_COMPLETED_ISSUES} |
          | NVIDIA Reviewer attempts | ${REVIEWER_RUNS} |
          | NVIDIA Reviewer successes | ${REVIEWER_SUCCESS} |
