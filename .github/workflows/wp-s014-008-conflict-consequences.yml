name: WP-S014-008 Conflict Consequences
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/world/protagonist-conflict-consequences.js"
      - "scripts/world/protagonist-service-contracts.js"
      - "scripts/tests/wp-s014-008-conflict-consequences.test.js"
      - ".github/workflows/wp-s014-008-conflict-consequences.yml"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: wp-s014-008-${{ github.sha }}
  cancel-in-progress: false
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax + WP-S014-008 deterministic evidence
        run: |
          node --check scripts/world/protagonist-conflict-consequences.js
          node --check scripts/world/protagonist-service-contracts.js
          node --check scripts/tests/wp-s014-008-conflict-consequences.test.js
          node scripts/tests/wp-s014-008-conflict-consequences.test.js
      - name: Existing authority regressions
        run: |
          node scripts/tests/wp-s009-005-protagonist-health.test.js
          node scripts/tests/wp-s013-002-protagonist-standing.test.js
          node scripts/tests/wp-s013-004-protagonist-service-contracts.test.js
      - name: Verify exact product is live on GitHub Pages
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="accepted"; grep -q 'WP-S014-008.*COMPLETED' docs/ROADMAP.md && MODE="completed" || true
          for attempt in $(seq 1 72); do
            curl -fsSL --max-time 20 "$BASE/scripts/world/protagonist-conflict-consequences.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-conflict-consequences.js || true
            curl -fsSL --max-time 20 "$BASE/scripts/world/protagonist-service-contracts.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-service-contracts.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product=0; state=0
            grep -q 'VERSION="protagonist-conflict-consequences-v1"' /tmp/live-conflict-consequences.js 2>/dev/null \
              && grep -q 'ProtagonistServiceContracts.recordResult' /tmp/live-conflict-consequences.js 2>/dev/null \
              && ! grep -q 'recordConflictConsequence' /tmp/live-service-contracts.js 2>/dev/null \
              && grep -q 'protagonist-conflict-consequences.js?v=protagonist-conflict-consequences-v1' /tmp/live-index.html 2>/dev/null \
              && product=1 || true
            if [ "$MODE" = completed ]; then grep -q 'WP-S014-008.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state=1 || true; else state=1; fi
            [ "$product" -eq 1 ] && [ "$state" -eq 1 ] && exit 0
            sleep 5
          done
          exit 1
      - name: Comment Issue 284
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const body='AGENT #6 WP-S014-008 exact-head workflow: **${{ job.status }}**\nCommit: '+context.sha+'\nRun: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId+'\nConflict injury/standing/service integration evidence and Stage 9/13 authority regressions were attempted. VISUAL: N/A.';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:284,body});
