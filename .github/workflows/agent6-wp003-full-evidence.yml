name: Agent6 WP003 Full Evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp003-full-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Start local game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          sleep 1
      - name: Capture landscape refinement sequence
        run: |
          python tools/screenshot_tool.py http://127.0.0.1:8000/ visual-wp-s003-010-003-005-002 \
            --profile landscape --scenario wp-s003-010-003-005-002 --shots 10 --timestamp-names \
            --wait-min 1 --wait-max 1 --no-publish \
            --evidence-json evidence-wp-s003-010-003-attempt1-full-landscape.json
      - name: Preserve landscape output
        run: |
          mkdir -p /tmp/evidence/landscape
          cp tools/screenshots/*.png /tmp/evidence/landscape/ || true
          cp tools/screenshots/evidence-wp-s003-010-003-attempt1-full-landscape.json /tmp/evidence/landscape/
          rm -f tools/screenshots/*.png tools/screenshots/evidence-wp-s003-010-003-attempt1-full-landscape.json
      - name: Capture portrait refinement sequence
        run: |
          python tools/screenshot_tool.py http://127.0.0.1:8000/ visual-wp-s003-010-003-005-002 \
            --profile portrait --scenario wp-s003-010-003-005-002 --shots 10 --timestamp-names \
            --wait-min 1 --wait-max 1 --no-publish \
            --evidence-json evidence-wp-s003-010-003-attempt1-full-portrait.json
      - name: Preserve portrait output
        run: |
          mkdir -p /tmp/evidence/portrait
          cp tools/screenshots/*.png /tmp/evidence/portrait/ || true
          cp tools/screenshots/evidence-wp-s003-010-003-attempt1-full-portrait.json /tmp/evidence/portrait/
      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent6-wp003-attempt1-full-evidence
          path: /tmp/evidence/
          if-no-files-found: error
          retention-days: 1
