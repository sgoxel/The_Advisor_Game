name: WP15 final terrain repair
on:
  push:
    branches: [agent1/wp-s002-004-005-uv-final2]
permissions:
  contents: write
concurrency:
  group: wp15-attempt3-repair
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[wp15-a3]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-uv-final2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python tools/wp15_attempt3_repair.py
      - run: npm ci
      - name: Focused final terrain regressions
        run: node --experimental-strip-types --test tests/hydrology.test.ts tests/terrain-refine.test.ts tests/surface-presentation.test.ts tests/macro-geography.test.ts
      - name: Target and route proof
        run: |
          node --experimental-strip-types tools/wp15_targets.ts > /tmp/wp15-targets.json
          cat /tmp/wp15-targets.json
          node --experimental-strip-types --input-type=module -e "const m=await import('./src/village-routes.ts');const r=m.routeBetweenVillages('0/4/2/0','0/6/2/2');console.log(JSON.stringify({found:r.found,difficultM:r.surfaceM.difficult,ratio:r.fantasySeconds/r.straightLineFantasySeconds,expansions:r.expansions}));if(!r.found||r.surfaceM.difficult<=1000||r.fantasySeconds<=r.straightLineFantasySeconds*1.1)process.exit(1)"
      - run: npm run build
      - name: Commit validated final repair
        run: |
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/hydrology.ts tools/wp15_targets.ts
          git commit -m "WP-S002-004-005 finish natural relief evidence [wp15-a3]"
          git push origin HEAD:agent1/wp-s002-004-005-uv-final2
