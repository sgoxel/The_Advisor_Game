name: WP15 attempt 3 route validation
on:
  push:
    branches:
      - agent1/wp15-visual-attempt3
permissions:
  contents: read
concurrency:
  group: wp15-attempt3-route-validation
  cancel-in-progress: true
jobs:
  route:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp15-visual-attempt3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Seeded terrain-influenced route invariant
        run: node --experimental-strip-types --test --test-name-pattern="terrain can make a real seeded route longer" tests/routing.test.ts
