name: WP15 attempt 3 corridor scan
on:
  push:
    branches:
      - agent1/wp15-visual-attempt3
permissions:
  contents: read
concurrency:
  group: wp15-attempt3-corridor-scan
  cancel-in-progress: true
jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp15-visual-attempt3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Measure seeded neighbour highland spans
        run: node --experimental-strip-types tools/wp15_route_scan.ts
