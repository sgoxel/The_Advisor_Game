name: WP-S010-008 Offline Catch-Up

on:
  push:
    branches: [main, agent6-wp-s010-008]
    paths:
      - "scripts/world/protagonist-offline-catchup.js"
      - "scripts/tests/wp-s010-008-protagonist-offline-catchup.test.js"
      - "scripts/world/lazy-catchup.js"
      - "scripts/world/protagonist-needs.js"
      - "scripts/world/protagonist-health.js"
      - "scripts/world/protagonist-journey.js"
      - "index.html"
      - ".github/workflows/wp-s010-008-protagonist-offline-catchup.yml"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Offline catch-up acceptance
        run: |
          node --check scripts/world/protagonist-offline-catchup.js
          node --check scripts/world/lazy-catchup.js
          node scripts/tests/wp-s010-008-protagonist-offline-catchup.test.js
      - name: Stage 9 and 10 chronology regressions
        run: |
          node scripts/tests/wp-s009-002-protagonist-needs.test.js
          node scripts/tests/wp-s009-005-protagonist-health.test.js
          node scripts/tests/wp-s010-002-protagonist-journey.test.js
          node scripts/tests/wp-s010-007-protagonist-goal-progress.test.js
      - name: Campaign persistence regression
        run: node tools/tests/wp-s007-009-campaign-persistence.test.js
      - name: Verify exact product is live on GitHub Pages
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="accepted"
          if grep -q 'WP-S010-008.*COMPLETED' docs/ROADMAP.md; then MODE="completed"; fi
          for attempt in $(seq 1 36); do
            curl -fsSL --max-time 20 "$BASE/scripts/world/protagonist-offline-catchup.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-offline.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product_ok=0
            state_ok=0
            grep -q 'VERSION="protagonist-offline-catchup-v1"' /tmp/live-offline.js 2>/dev/null && \
              grep -q 'scripts/world/protagonist-offline-catchup.js?v=protagonist-offline-catchup-v1' /tmp/live-index.html 2>/dev/null && product_ok=1 || true
            if [ "$MODE" = "completed" ]; then
              grep -q 'WP-S010-008.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state_ok=1 || true
            else
              state_ok=1
            fi
            if [ "$product_ok" -eq 1 ] && [ "$state_ok" -eq 1 ]; then
              echo "GitHub Pages exposes WP-S010-008 mode=$MODE for commit ${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not expose expected WP-S010-008 $MODE markers in time." >&2
          exit 1
      - name: Comment exact run on Issue 211
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const sha = context.sha;
            const url = 'https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId;
            const body = [
              'AGENT #6 WP-S010-008 exact-head workflow: **'+status.toUpperCase()+'**',
              'Commit: '+sha,
              'Run: '+url,
              status === 'success'
                ? 'Offline catch-up/resume evidence, Stage 9/10 chronology regressions, campaign persistence regression, and public Pages verification passed. VISUAL: N/A — functional-only protagonist resume coordinator.'
                : 'Offline catch-up acceptance, regression, or public Pages verification failed; WP remains incomplete.'
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:211,body});
