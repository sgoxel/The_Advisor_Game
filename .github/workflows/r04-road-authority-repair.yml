name: R04 Road Authority Repair

on:
  push:
    paths:
      - '.github/workflows/r04-road-authority-repair.yml'

permissions:
  contents: write

jobs:
  repair-origin-well-road:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical origin-village anchor road connection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/spatial_world.js')
          text = path.read_text(encoding='utf-8')
          old = "    const paths = [];\n    for (let index = 1; index < buildings.length; index += 1) {\n"
          new = (
              "    // The anchor/well is building[0]. It is part of the same authoritative\n"
              "    // Simulation-owned road network as every other required village structure.\n"
              "    // Connect it before the remaining building connectors; do not create a\n"
              "    // second/decorative road topology in the presentation layer.\n"
              "    const anchorRoadConnection = connectBuildingToRoad(buildings[0], roads, blocked);\n"
              "    if (!anchorRoadConnection.length) {\n"
              "      throw new Error('Unable to connect origin-village anchor building to authoritative road network.');\n"
              "    }\n\n"
              "    const paths = [];\n"
              "    for (let index = 1; index < buildings.length; index += 1) {\n"
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one #235 road connector insertion point; found {count}. Refusing unsafe patch.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify patch syntax and contract location
        run: |
          node --check js/spatial_world.js
          grep -n "anchorRoadConnection = connectBuildingToRoad(buildings\[0\]" js/spatial_world.js
          grep -n "for (let index = 1; index < buildings.length; index += 1)" js/spatial_world.js

      - name: Commit authoritative road repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r04-road-authority-repair.yml
          git add js/spatial_world.js
          git commit -m "Connect origin well to authoritative road network (#235 #277)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
