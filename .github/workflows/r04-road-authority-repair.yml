name: R04 Road Authority Repair

on:
  push:
    paths:
      - '.github/workflows/r04-road-authority-repair.yml'

permissions:
  contents: write

jobs:
  repair-origin-well-road:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical origin-village anchor road connection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/spatial_world.js')
          text = path.read_text(encoding='utf-8')
          old = """    const paths = [];
              for (let index = 1; index < buildings.length; index += 1) {
          """.replace('              for', '    for')
          new = """    // The anchor/well is building[0]. It is part of the same authoritative
              // Simulation-owned road network as every other required village structure.
              // Connect it before the remaining building connectors; do not create a
              // second/decorative road topology in the presentation layer.
              const anchorRoadConnection = connectBuildingToRoad(buildings[0], roads, blocked);
              if (!anchorRoadConnection.length) {
                throw new Error('Unable to connect origin-village anchor building to authoritative road network.');
              }

              const paths = [];
              for (let index = 1; index < buildings.length; index += 1) {
          """.replaceAll('              ', '    ')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one #235 road connector insertion point; found {text.count(old)}. Refusing unsafe patch.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify patch syntax and contract location
        run: |
          node --check js/spatial_world.js
          grep -n "anchorRoadConnection = connectBuildingToRoad(buildings\[0\]" js/spatial_world.js
          grep -n "for (let index = 1; index < buildings.length; index += 1)" js/spatial_world.js

      - name: Commit authoritative road repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r04-road-authority-repair.yml
          git add js/spatial_world.js
          git commit -m "Connect origin well to authoritative road network (#235 #277)"
          git push origin HEAD:main
