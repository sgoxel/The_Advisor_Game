name: WP-S012-003 Protagonist Employment
# exact-head trigger after workflow registration

on:
  push:
    branches: [main]
    paths:
      - "scripts/world/protagonist-employment.js"
      - "scripts/tests/wp-s012-003-protagonist-employment.test.js"
      - ".github/workflows/wp-s012-003-protagonist-employment.yml"
      - "scripts/world/protagonist-wealth.js"
      - "scripts/world/protagonist-work-routine.js"
      - "scripts/world/protagonist-interaction-pipeline.js"
      - "scripts/world/protagonist-profile.js"
      - "scripts/world/world-state.js"
      - "scripts/world/campaign-persistence.js"
      - "index.html"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Employment contract and wage evidence
        run: node scripts/tests/wp-s012-003-protagonist-employment.test.js
      - name: Work, wealth and persistence regressions
        run: |
          node scripts/tests/wp-s012-001-protagonist-wealth.test.js
          node scripts/tests/wp-s010-005-protagonist-work-routine.test.js
          node scripts/tests/wp-s010-003-protagonist-interaction-pipeline.test.js
          node tools/tests/wp-s007-009-campaign-persistence.test.js
          node scripts/tests/wp-s009-004-protagonist-inventory.test.js
          node scripts/tests/wp-s009-006-protagonist-authority.test.js
      - name: Verify exact product is live on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="accepted"
          if grep -q 'WP-S012-003.*COMPLETED' docs/ROADMAP.md; then MODE="completed"; fi
          for attempt in $(seq 1 48); do
            curl -fsSL --max-time 20 "$BASE/scripts/world/protagonist-employment.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-employment.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product_ok=0
            state_ok=0
            grep -q 'VERSION="protagonist-employment-v1"' /tmp/live-employment.js 2>/dev/null && \
              grep -q 'scripts/world/protagonist-employment.js?v=protagonist-employment-v1' /tmp/live-index.html 2>/dev/null && product_ok=1 || true
            if [ "$MODE" = "completed" ]; then
              grep -q 'WP-S012-003.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state_ok=1 || true
            else
              state_ok=1
            fi
            if [ "$product_ok" -eq 1 ] && [ "$state_ok" -eq 1 ]; then
              echo "GitHub Pages exposes WP-S012-003 mode=$MODE for commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not expose expected WP-S012-003 $MODE markers in time." >&2
          exit 1
      - name: Comment exact run on Issue 245
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const sha = context.sha;
            const url = 'https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId;
            const body = [
              'AGENT #6 WP-S012-003 exact-head workflow: **'+status.toUpperCase()+'**',
              'Commit: '+sha,
              'Run: '+url,
              status === 'success'
                ? 'Employment/wage evidence, selected work/wealth/persistence authority regressions, and GitHub Pages product verification passed.'
                : 'Workflow, regression, or GitHub Pages verification failed; WP remains incomplete.'
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:245,body});
