name: WP-S007-013 Travel Encounters Evidence
# Evidence trigger revision: 2026-09-30 AGENT 6 final wayfinding-declutter retest

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - .github/workflows/wp-s007-013-travel-encounters.yml
      - scripts/world/travel-encounters.js
      - scripts/world/planet-stage.js
      - styles/travel-encounters.css
      - tools/tests/wp-s007-013-travel-encounters.test.js
      - tools/wp_s007_013_evidence.py
      - docs/ROADMAP.md
      - docs/changelog.txt
      - docs/suggest_log.txt
      - index.html

permissions:
  contents: read
  issues: write

concurrency:
  # Only push runs share a cancellation lane. Each issue-comment run gets its
  # own lane so an unrelated comment that is later skipped cannot cancel an
  # already-running exact-head browser capture before the job-level filter.
  group: ${{ github.event_name == 'push' && 'wp-s007-013-evidence-push' || format('wp-s007-013-evidence-comment-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  evidence:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/wp-s007-013-evidence'))
    strategy:
      fail-fast: false
      matrix:
        profile: [landscape, portrait]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Syntax
        run: |
          node --check scripts/world/travel-encounters.js
          node --check scripts/world/planet-stage.js
          node --check tools/tests/wp-s007-013-travel-encounters.test.js
          python -m py_compile tools/wp_s007_013_evidence.py
      - name: Deterministic rarity, context and bounds proof
        run: node tools/tests/wp-s007-013-travel-encounters.test.js
      - name: Start local game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          sleep 1
      - name: Capture exact local travel encounters
        env:
          TARGET: http://127.0.0.1:8000/?evidence_fast_start=1
          PROFILE: ${{ matrix.profile }}
        run: python tools/wp_s007_013_evidence.py
      - name: Upload evidence
        if: always() && hashFiles('tools/screenshots/wp-s007-013/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wp-s007-013-${{ matrix.profile }}-${{ github.run_id }}
          path: tools/screenshots/wp-s007-013/
          if-no-files-found: error
          retention-days: 14
      - name: Verify current WP state deployed to GitHub Pages
        if: github.event_name == 'push' && matrix.profile == 'landscape'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          if grep -q 'WP-S007-013.*COMPLETED' docs/ROADMAP.md; then
            MODE=completed
          else
            MODE=accepted
          fi
          for attempt in $(seq 1 24); do
            bust="${GITHUB_SHA}-${attempt}"
            curl -fsSL "${BASE}/scripts/world/planet-stage.js?rev=${bust}" -o /tmp/live-stage.js || true
            curl -fsSL "${BASE}/docs/ROADMAP.md?rev=${bust}" -o /tmp/live-roadmap.md || true
            curl -fsSL "${BASE}/docs/changelog.txt?rev=${bust}" -o /tmp/live-changelog.txt || true
            curl -fsSL "${BASE}/docs/suggest_log.txt?rev=${bust}" -o /tmp/live-suggest.txt || true
            product_ok=0
            grep -q 'travelEncounterFocus==="true"' /tmp/live-stage.js 2>/dev/null && product_ok=1 || true
            if [ "${MODE}" = completed ]; then
              state_ok=0
              grep -q 'WP-S007-013.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state_ok=1 || true
            else
              state_ok=0
              if grep -q 'MIXED PHASE 2 ACCEPTED — RARE TRAVEL ENCOUNTERS' /tmp/live-changelog.txt 2>/dev/null && \
                 grep -q 'WP-S007-013 | Phase 3 | Future improvement after accepted implementation' /tmp/live-suggest.txt 2>/dev/null; then
                state_ok=1
              fi
            fi
            if [ "${product_ok}" -eq 1 ] && [ "${state_ok}" -eq 1 ]; then
              echo "GitHub Pages verified for ${MODE} state on attempt ${attempt}."
              exit 0
            fi
            sleep 15
          done
          echo "GitHub Pages did not expose the expected WP-S007-013 ${MODE} markers in time." >&2
          exit 1
      - name: Comment run link on Issue
        if: always() && matrix.profile == 'landscape'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = '${{ job.status }}' === 'success';
            const issueNumber = context.eventName === 'issue_comment' ? context.issue.number : 132;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: ok
                ? `WP-S007-013 evidence completed. [Open workflow run and artifacts](${url}).`
                : `WP-S007-013 evidence FAILED. [Open workflow run and logs](${url}).`
            });
