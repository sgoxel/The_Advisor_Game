name: WP-S007-013 Travel Encounters Evidence
# Evidence trigger revision: 2026-09-30 AGENT 6 final wayfinding-declutter retest

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - .github/workflows/wp-s007-013-travel-encounters.yml
      - scripts/world/travel-encounters.js
      - scripts/world/planet-stage.js
      - styles/travel-encounters.css
      - tools/tests/wp-s007-013-travel-encounters.test.js
      - tools/wp_s007_013_evidence.py
      - index.html

permissions:
  contents: read
  issues: write

concurrency:
  # Only push runs share a cancellation lane. Each issue-comment run gets its
  # own lane so an unrelated comment that is later skipped cannot cancel an
  # already-running exact-head browser capture before the job-level filter.
  group: ${{ github.event_name == 'push' && 'wp-s007-013-evidence-push' || format('wp-s007-013-evidence-comment-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  evidence:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/wp-s007-013-evidence'))
    strategy:
      fail-fast: false
      matrix:
        profile: [landscape, portrait]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Syntax
        run: |
          node --check scripts/world/travel-encounters.js
          node --check scripts/world/planet-stage.js
          node --check tools/tests/wp-s007-013-travel-encounters.test.js
          python -m py_compile tools/wp_s007_013_evidence.py
      - name: Deterministic rarity, context and bounds proof
        run: node tools/tests/wp-s007-013-travel-encounters.test.js
      - name: Start local game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          sleep 1
      - name: Capture exact local travel encounters
        env:
          TARGET: http://127.0.0.1:8000/?evidence_fast_start=1
          PROFILE: ${{ matrix.profile }}
        run: python tools/wp_s007_013_evidence.py
      - name: Upload evidence
        if: always() && hashFiles('tools/screenshots/wp-s007-013/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wp-s007-013-${{ matrix.profile }}-${{ github.run_id }}
          path: tools/screenshots/wp-s007-013/
          if-no-files-found: error
          retention-days: 14
      - name: Comment run link on Issue
        if: always() && matrix.profile == 'landscape'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = '${{ job.status }}' === 'success';
            const issueNumber = context.eventName === 'issue_comment' ? context.issue.number : 132;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: ok
                ? `WP-S007-013 evidence completed. [Open workflow run and artifacts](${url}).`
                : `WP-S007-013 evidence FAILED. [Open workflow run and logs](${url}).`
            });
