name: WP15 failure bookkeeping
on:
  push:
    branches: [agent1/wp-s002-004-005-uv-final2]
permissions:
  contents: write
concurrency:
  group: wp15-failure-bookkeeping
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  record:
    if: ${{ !contains(github.event.head_commit.message, '[wp15-failure-docs]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-uv-final2
          fetch-depth: 0
      - name: Record failed final acceptance
        run: |
          cat >> docs/changelog.txt <<'EOF'
          2026-10-10 09:14 Europe/Istanbul — WP-S002-004-005, AGENT #1 final attempt 3/3 (MIXED): Clean runtime head f7c44dd0216aa1a54e8752f317fb277896047666 failed acceptance and remains undeployed. Exact-head functional run 38029725487 passed 115/116 tests but failed the binding neighbouring terrain-influenced route regression (`canonical registry has no terrain-influenced neighbouring route evidence`); the focused explicit difficult-route proof remained green at 61.63 km difficult terrain and 1.863× straight-line fantasy time. Fresh exact-head WebGPU/WebGL2 artifacts 11661507486/11661044231 were actually inspected at VISUAL 5/10: rivers remain channel-straight, lake connections artificial, mountain evidence retains repetitive faceted/banded geometry, and the outlet coast remains visibly stair-stepped; phone evidence was incomplete after capture cancellation. Three-attempt limit reached; WP remains OPEN/INCOMPLETE, unmerged and not deployed.
          EOF
          cat >> docs/evidence/WP-S002-004-005.md <<'EOF'

          ## Final attempt 3/3 — failed acceptance (2026-10-10)

          Evaluated clean runtime head: `f7c44dd0216aa1a54e8752f317fb277896047666`.

          - Exact-head functional run `38029725487`: 115/116 tests passed. The binding `tests/routing.test.ts:145` regression failed because the canonical registry produced no terrain-influenced neighbouring route evidence. The focused final-repair difficult-route proof did pass for `0/4/2/0` → `0/6/2/2` with about 61.63 km difficult terrain and a 1.863× straight-line fantasy-time ratio; that focused proof does not supersede the full regression.
          - Fresh visual run `38029725489`: WebGPU artifact `11661507486`, WebGL2 artifact `11661044231`. Both artifacts were actually inspected. VISUAL: **5/10 — FAIL**. Renderer parity and cliff readability improved, but Province/Village rivers remain ruler-straight, lake/tributary joins remain artificial, the mountain target shows strong repetitive faceted/banded tessellation, and the river outlet has an obvious stair-stepped coast/artificial mouth. Phone coverage is incomplete (WebGPU only Realm + river Province; WebGL2 no phone captures) because the capture jobs were cancelled.
          - Result: the 3/3 improvement-attempt limit is reached. No fourth runtime repair or test weakening is permitted in this run. The WP remains open, incomplete, unmerged and undeployed.
          EOF
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add docs/changelog.txt docs/evidence/WP-S002-004-005.md
          git commit -m "WP-S002-004-005 record failed final acceptance [wp15-failure-docs]"
          git push origin HEAD:agent1/wp-s002-004-005-uv-final2
