name: R04 World-Space Character Interior Continuity Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/world_space_character_interior_bridge.js'
      - 'js/starter_village_runtime_terrain.js'
      - 'js/starter_village_interiors.js'
      - 'js/npc_world.js'
      - 'assets/characters/world-space/**'
      - 'tests/browser/r04-world-space-character-interior-continuity.spec.mjs'
      - 'tests/browser/r04-exterior-world-space-sprites.spec.mjs'
      - 'tests/browser/r04-starter-village-interiors.spec.mjs'
      - 'tests/browser/r04-character-world-icons.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r04-world-space-character-interior-continuity-verification.yml'
  pull_request:
    paths:
      - 'js/world_space_character_interior_bridge.js'
      - 'js/starter_village_runtime_terrain.js'
      - 'js/starter_village_interiors.js'
      - 'js/npc_world.js'
      - 'assets/characters/world-space/**'
      - 'tests/browser/r04-world-space-character-interior-continuity.spec.mjs'
      - 'tests/browser/r04-exterior-world-space-sprites.spec.mjs'
      - 'tests/browser/r04-starter-village-interiors.spec.mjs'
      - 'tests/browser/r04-character-world-icons.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r04-world-space-character-interior-continuity-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-world-space-character-interior-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: |
          echo "R04 issue 254 candidate ${GITHUB_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused interior continuity regression
        run: npx playwright test tests/browser/r04-world-space-character-interior-continuity.spec.mjs --project=desktop
      - name: Preserve exterior world-space sprite contract
        run: npx playwright test tests/browser/r04-exterior-world-space-sprites.spec.mjs --project=desktop
      - name: Preserve starter-village interior contract
        run: npx playwright test tests/browser/r04-starter-village-interiors.spec.mjs --project=desktop
      - name: Preserve character identity mapping contract
        run: npx playwright test tests/browser/r04-character-world-icons.spec.mjs --project=desktop
      - name: Upload focused continuity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-world-space-character-interior-continuity-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
