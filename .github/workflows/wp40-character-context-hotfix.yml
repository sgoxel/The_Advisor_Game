name: WP40 character context hotfix
on:
  push:
    paths:
      - .github/workflows/wp40-character-context-hotfix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep normal billboards inside the currently presented world context
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/render/playcanvas/app.js')
          s=p.read_text()
          old='''  function characterInsideActiveTerrain(point){\n    const stats=terrainPreloadManager?.stats?.();\n    const center=stats?.centerChunk;\n    if(!center||!point)return true;\n    const size=Math.max(1,Number(stats.chunkSize||terrainChunkSize()));\n    const radii=terrainActiveRadii();\n    const x=characterChunkCoordinate(point.x,size),y=characterChunkCoordinate(point.y,size);\n    return x>=center.x-radii.x&&x<=center.x+radii.x&&y>=center.y-radii.y&&y<=center.y+radii.y;\n  }'''
          new='''  function characterInsideActiveTerrain(point){\n    const stats=terrainPreloadManager?.stats?.();\n    const center=stats?.centerChunk;\n    if(!center||!point)return true;\n    const size=Math.max(1,Number(stats.chunkSize||terrainChunkSize()));\n    const radii=terrainActiveRadii();\n    const x=characterChunkCoordinate(point.x,size),y=characterChunkCoordinate(point.y,size);\n    if(x<center.x-radii.x||x>center.x+radii.x||y<center.y-radii.y||y>center.y+radii.y)return false;\n    /* The current PlayCanvas stage presents authored village structures only near\n       the camera center. Keep normal NPC billboards in that same visual context\n       instead of drawing isolated sprites over otherwise empty prepared chunks.\n       This is presentation-only; Simulation coordinates are never changed. */\n    const cameraCenter=lastModel?.center;\n    if(!cameraCenter)return true;\n    const dx=safeDeltaTiles(point.x,cameraCenter.x),dy=safeDeltaTiles(point.y,cameraCenter.y);\n    return dx!==null&&dy!==null&&Math.abs(dx)<=8&&Math.abs(dy)<=8;\n  }'''
          assert old in s, 'character footprint helper changed'
          p.write_text(s.replace(old,new,1))
      - name: Commit correction
        run: |
          git config user.name "AGENT #1"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/render/playcanvas/app.js
          git commit -m "WP-S003-007 align billboards with presented village context"
          git push origin HEAD:main
