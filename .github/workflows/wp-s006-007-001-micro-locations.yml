name: WP-S006-007-001 Micro-Locations Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wp-s006-007-001-micro-locations.yml
      - scripts/world/world-destinations.js
      - scripts/world/micro-locations.js
      - scripts/world/planet-stage.js
      - styles/main.css
      - scripts/render/playcanvas/chunk-world-data.js
      - scripts/render/playcanvas/terrain-chunk-mesh.js
      - index.html
      - tools/tests/wp-s006-007-001-micro-locations.test.js
      - tools/wp_s006_007_001_evidence.py


permissions:
  contents: read
  issues: write

jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        profile: [landscape, portrait]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Announce exact-head evidence run
        if: matrix.profile == 'landscape'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 129,
              body: `WP-S006-007-001 exact-head evidence run: ${url}`
            });
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Syntax check
        run: |
          node --check scripts/world/world-destinations.js
          node --check scripts/world/micro-locations.js
          node --check scripts/world/planet-stage.js
          node --check scripts/render/playcanvas/chunk-world-data.js
          node --check scripts/render/playcanvas/terrain-chunk-mesh.js
      - name: Functional micro-location proof
        run: node tools/tests/wp-s006-007-001-micro-locations.test.js
      - name: Start local game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! >/tmp/advisor-http.pid
          sleep 1
      - name: Capture six micro-location types plus revisit
        env:
          TARGET: http://127.0.0.1:8000/
          PROFILE: ${{ matrix.profile }}
        run: python tools/wp_s006_007_001_evidence.py
      - name: Upload evidence
        if: always() && hashFiles('tools/screenshots/wp-s006-007-001/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wp-s006-007-001-${{ matrix.profile }}-${{ github.run_id }}
          path: tools/screenshots/wp-s006-007-001/
          if-no-files-found: error
          retention-days: 14
