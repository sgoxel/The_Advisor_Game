name: Agent6 WP005003 Incomplete Run Bookkeeping

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp005003-bookkeeping.yml"

permissions:
  contents: write

concurrency:
  group: agent6-wp005003-bookkeeping
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record incomplete WP evaluation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roadmap=Path("docs/ROADMAP.md")
          text=roadmap.read_text(encoding="utf-8")
          old="- `WP-S003-010-003-005-003` — Protagonist-First Focus UX + Safe-Area Local Context + Free Canonical Exploration"
          new=old+" — IN PROGRESS"
          if new not in text:
              if old not in text:
                  raise SystemExit("WP-S003-010-003-005-003 ROADMAP line not found")
              text=text.replace(old,new,1)
              roadmap.write_text(text,encoding="utf-8")

          changelog=Path("docs/changelog.txt")
          entry=(
              "2026-10-03 14:26 +03:00 | AGENT #6 | WP-S003-010-003-005-003 | MIXED INCOMPLETE — "
              "Protagonist-first focus UX functional evidence passed on exact product 553dbaabd772e647528bbe198dee63b57dfba6d3 via run 37118524221 / artifact 11272452762 "
              "(sha256:aadb9bb7e3199f7e5651b14c9e18f8d6be8dce19657d3fda23d8331188be9688). Two fixed SEEDs verified zero forced returns, no Simulation mutation, latest-position return, bounded soft follow with hardSnapCount=0, stable focus identity through the tested LOD handoff, and bounded/no-full-world-scan focus telemetry. All 16 fresh screenshots were directly inspected; VISUAL 6.6/10 FAIL because both phone-portrait captures visibly clip the protagonist billboard at the right edge and the focus dock competes with the optional geographic context readout. Final Attempt 3 run 37119369743 stopped during patch preparation with `style patch anchor not found` before producing product/evidence. Three-attempt cap reached; WP stays IN PROGRESS and Issue #302 remains open.\n"
          )
          current=changelog.read_text(encoding="utf-8")
          if "WP-S003-010-003-005-003 | MIXED INCOMPLETE" not in current:
              changelog.write_text(entry+current,encoding="utf-8")
          PY

          rm -f docs/WP_S003_010_003_005_003_RUN_NOTE.tmp
          rm -f tools/agent6_wp005003_attempt2_visual.txt
          rm -f tools/agent6_wp005003_attempt3_patch.py
          rm -f .github/workflows/agent6-wp005003-attempt3.yml
          git rm .github/workflows/agent6-wp005003-bookkeeping.yml

      - name: Commit bookkeeping
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(WP-S003-010-003-005-003): record incomplete visual acceptance"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
