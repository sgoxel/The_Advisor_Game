name: WP15 AGENT1 attempt2 repair
on:
  push:
    branches: [agent1/wp-s002-004-005-uv-final2]
permissions:
  contents: write
concurrency:
  group: wp15-agent1-attempt2-repair
  cancel-in-progress: true
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[agent1-wp15-attempt2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-uv-final2
          fetch-depth: 0
      - name: Remove unnecessary density increase
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/terrain-refine.ts')
          s = p.read_text()
          old = '    targetResolution = tile.size <= 128 ? (rugged ? 80 : 72) : tile.size <= 512 ? (rugged ? 60 : 44) : rugged ? 44 : 30,'
          new = '    targetResolution = tile.size <= 128 ? 68 : tile.size <= 512 ? (rugged ? 52 : 40) : rugged ? 40 : 28,'
          assert old in s, 'attempt-1 resolution line not found'
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/wp15-agent1-attempt2.yml
          git diff --check
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/terrain-refine.ts .github/workflows/wp15-agent1-attempt2.yml
          git commit -m "WP-S002-004-005 restore bounded refinement density [agent1-wp15-attempt2]"
          git push origin HEAD:agent1/wp-s002-004-005-uv-final2
