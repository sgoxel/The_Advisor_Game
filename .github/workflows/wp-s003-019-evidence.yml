name: WP-S003-019 Seasonal Evidence

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: wp-s003-019-seasonal-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  evidence:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.issue.pull_request &&
       github.event.issue.number == 126 &&
       (github.event.comment.user.login == github.repository_owner ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       startsWith(github.event.comment.body, '/wp-s003-019-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Verify browser
        run: |
          google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Start local game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-season-http.log 2>&1 &
          echo $! >/tmp/advisor-season-http.pid
          sleep 1

      - name: Run deterministic seasonal evidence
        run: python tools/test_wp_s003_019.py http://127.0.0.1:8000/ tools/wp_s003_019_artifact

      - name: Upload seasonal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-019-seasonal-evidence
          path: tools/wp_s003_019_artifact
          if-no-files-found: error
          retention-days: 14

      - name: Comment success
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'WP-S003-019 seasonal evidence completed successfully. Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })

      - name: Comment failure
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'WP-S003-019 seasonal evidence FAILED. Run/logs: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })
