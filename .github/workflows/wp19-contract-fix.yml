name: WP19 migrate stale resident-home regression
on:
  push:
    branches: [agent1/wp-s002-004-009-living-settlements]
    paths: [.github/workflows/wp19-contract-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent1/wp-s002-004-009-living-settlements
      - name: Update resident ownership regression to canonical home-building contract
        run: |
          git config user.name "AGENT #1"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin agent1/wp-s002-004-009-living-settlements
          git reset --hard origin/agent1/wp-s002-004-009-living-settlements
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/world.test.ts')
          text = path.read_text()
          old = '    place = [...cities, ...villages].find((p) => p.id === home.home)!;\n'
          new = '    place = [...cities, ...villages].find((p) => p.id === home.placeId)!;\n'
          if old not in text:
              raise SystemExit('stale resident-home assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/wp19-contract-fix.yml
          git add tests/world.test.ts
          git commit -m "WP-S002-004-009 update resident home regression contract"
          git push origin HEAD:agent1/wp-s002-004-009-living-settlements
