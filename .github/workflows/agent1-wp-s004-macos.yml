name: AGENT1 WP-S004 macOS exact chain acceptance
on:
  push:
    branches: [agent1/wp-s004-001-001-20261015]
    paths:
      - .github/workflows/agent1-wp-s004-macos.yml
permissions:
  contents: write
jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply exact deterministic settlement-access correction
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          node tools/agent1-wp-s004-patch-v11.mjs
          ! grep -q 'selected\[selected.length - 1\]' src/geography.ts
          grep -q 'return children.map((toPlace, index)' src/geography.ts
          grep -q 'every village needs one legal provisional parent access reserve' tests/political-atlas.test.ts
      - run: npm ci
      - name: Validate S004 distribution, morphology and continuity
        run: node --experimental-strip-types --test tests/political-atlas.test.ts tests/continuity.test.ts tests/settlement-exterior.test.ts tests/village-morphology-runtime.test.ts tests/wp-s004-world-integration.test.ts tests/final-surface-integration.test.ts
      - name: Production build
        run: npm run build
      - name: Create exact candidate commit
        id: candidate
        run: |
          git config user.name "AGENT #1"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/geography.ts tests/political-atlas.test.ts
          git commit -m "fix: remove village sibling-chain authority"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Relevant WebGPU semantic-zoom gate
        run: npx playwright test --config playwright.webgpu.config.js settlement-icons.spec.js
      - name: Relevant WebGL2 semantic-zoom gate
        run: npx playwright test --config playwright.fallback.config.js settlement-icons.spec.js
      - name: Capture fresh WP-S004 MIXED evidence
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
        run: bash tools/agent1-wp-s004-evidence.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wp-s004-macos-chain-${{ steps.candidate.outputs.sha }}
          path: test-results/
      - name: Push validated exact candidate
        run: git push origin HEAD:agent1/wp-s004-001-001-20261015
