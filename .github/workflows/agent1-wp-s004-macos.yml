name: AGENT1 WP-S004 macOS acceptance
on:
  push:
    branches: [agent1/wp-s004-001-001-20261015]
    paths:
      - .github/workflows/agent1-wp-s004-macos.yml
      - tools/agent1-wp-s004-patch-v2.mjs
      - tools/agent1-wp-s004-patch-v3.mjs
      - tools/agent1-wp-s004-patch-v4.mjs
      - tools/agent1-wp-s004-patch-v5.mjs
      - tools/agent1-wp-s004-patch-v6.mjs
      - tools/agent1-wp-s004-patch-v7.mjs
      - src/geography.ts
      - src/settlement-exterior.ts
      - src/world.ts
      - src/geometry.ts
      - tests/settlement-exterior.test.ts
      - tests/world.test.ts
      - tests/final-surface-integration.test.ts
      - tests/political-atlas.test.ts
permissions:
  contents: write
jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s004-001-001-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply complete deterministic settlement patch chain
        run: |
          node tools/agent1-wp-s004-patch-v2.mjs
          node tools/agent1-wp-s004-patch-v3.mjs
      - run: npm ci
      - name: Focused settlement morphology tests
        run: node --experimental-strip-types --test tests/settlement-exterior.test.ts tests/world.test.ts
      - name: Surface and political integration tests
        run: node --experimental-strip-types --test tests/final-surface-integration.test.ts tests/political-atlas.test.ts
      - name: Production build
        run: npm run build
      - name: Commit validated settlement implementation
        run: |
          git config user.name "AGENT #1"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/geography.ts src/settlement-exterior.ts src/world.ts src/geometry.ts tests/world.test.ts
          if git diff --cached --quiet; then
            echo "Settlement implementation already committed"
          else
            git commit -m "feat: finalize deterministic settlement morphology runtime"
            git push origin HEAD:agent1/wp-s004-001-001-20261015
          fi
