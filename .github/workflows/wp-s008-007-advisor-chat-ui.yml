name: WP-S008-007 Advisor Chat Interaction Surface

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles/main.css"
      - "scripts/world/advisor-channel.js"
      - "scripts/world/local-conversation-router.js"
      - "scripts/world/protagonist-command-evaluator.js"
      - "scripts/world/conversation-transactions.js"
      - "scripts/ui/advisor-conversation-ui.js"
      - "scripts/tests/wp-s008-007-advisor-chat-ui.test.js"
      - "tools/wp_s008_007_evidence.py"
      - ".github/workflows/wp-s008-007-advisor-chat-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp-s008-007-${{ github.sha }}
  cancel-in-progress: false

jobs:
  functional:
    name: Functional authority + trace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Syntax checks
        run: |
          node --check scripts/world/conversation-transactions.js
          node --check scripts/ui/advisor-conversation-ui.js
          node --check scripts/tests/wp-s008-007-advisor-chat-ui.test.js

      - name: Stage 8 conversation regression
        run: |
          node scripts/tests/wp-s008-003-local-conversation-router.test.js
          node scripts/tests/wp-s008-006-conversation-transactions.test.js
          node scripts/tests/wp-s008-007-advisor-chat-ui.test.js

  visual:
    name: Fresh responsive screenshots
    needs: functional
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Verify browser
        run: |
          google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Start exact-head game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-wp-s008-007-http.log 2>&1 &
          echo $! >/tmp/advisor-wp-s008-007-http.pid
          sleep 1

      - name: Capture Advisor chat evidence
        env:
          TARGET: http://127.0.0.1:8000/
          OUT: tools/screenshots/wp-s008-007
        run: python tools/wp_s008_007_evidence.py

      - name: Upload fresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s008-007-advisor-chat-${{ github.sha }}
          path: tools/screenshots/wp-s008-007/
          if-no-files-found: error
          retention-days: 14
