name: WP-S003-010-003-021 Interaction Coherence Evidence
on:
  push:
    branches: [main, agent6/wp-s003-010-003-021]
    paths:
      - .github/workflows/wp-s003-010-003-021-evidence.yml
      - tools/test_wp_s003_010_003_021.py
      - scripts/world/planet-stage.js
      - scripts/world/seasonal-presentation.js
      - index.html
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: wp-s003-010-003-021-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/wp-s003-010-003-021-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r tools/requirements.txt
      - name: Start local game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          sleep 1
      - name: Run interaction coherence evidence
        run: python tools/test_wp_s003_010_003_021.py "http://127.0.0.1:8000/?evidence_fast_start=1" tools/wp_s003_010_003_021_artifact
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-010-003-021-evidence-${{ github.run_id }}
          path: tools/wp_s003_010_003_021_artifact/
          retention-days: 14
      - name: Comment issue run
        if: github.event_name == 'issue_comment' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`WP-S003-010-003-021 evidence ${{ job.status }}. [Open run](${url}).`});
