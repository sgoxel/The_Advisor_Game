name: WP-S003-017 Audio Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/world/ambient-audio.js
      - index.html
      - tools/test_wp_s003_017.py
      - .github/workflows/wp-s003-017-audio.yml

permissions:
  contents: read

concurrency:
  group: wp-s003-017-audio-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audio-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser test dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Verify browser
        run: google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Start local game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! >/tmp/advisor-http.pid
          sleep 1

      - name: Run bounded audio acceptance
        run: python tools/test_wp_s003_017.py http://127.0.0.1:8000/ tools/wp_s003_017_evidence.json

      - name: Upload functional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-017-audio-evidence-${{ github.run_id }}
          path: tools/wp_s003_017_evidence.json
          if-no-files-found: warn
          retention-days: 14
