name: Agent6 WP003 Parent Evidence Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp003-parent-evidence-fix.yml"
      - "tools/agent6_wp003_parent_evidence_patch.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp003-parent-evidence-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Route parent WP to refinement evidence sequence
        run: |
          set -euo pipefail
          python tools/agent6_wp003_parent_evidence_patch.py
          PYTHONDONTWRITEBYTECODE=1 python -m py_compile tools/screenshot_tool.py
          rm -rf tools/__pycache__
          git diff --check
          grep -q 'WP_VIEWPORT_REFINEMENT_SCENARIO="wp-s003-010-003"' tools/screenshot_tool.py
          grep -q 'WP_SURFACE_REFINEMENT_SCENARIO,WP_VIEWPORT_REFINEMENT_SCENARIO' tools/screenshot_tool.py
          grep -q 'def _surface_refinement_frame(driver,index,timeout,viewport=(1280,800)):' tools/screenshot_tool.py
          grep -Fq 'set_exact_viewport(driver,*viewport)' tools/screenshot_tool.py
          grep -Fq '_surface_refinement_frame(driver,index,args.ready_timeout,(width,height))' tools/screenshot_tool.py
      - name: Commit evidence harness correction through Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : >/tmp/wp003-parent-api.log
          if git diff --quiet -- tools/screenshot_tool.py; then
            echo "WP003 parent evidence routing already current" | tee -a /tmp/wp003-parent-api.log
            exit 0
          fi
          file_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/tools/screenshot_tool.py?ref=main" --jq .sha)"
          python - "$file_sha" <<'PY'
          import base64,json,sys
          from pathlib import Path
          payload={
              "message":"test(WP-S003-010-003): preserve requested refinement viewport",
              "content":base64.b64encode(Path("tools/screenshot_tool.py").read_bytes()).decode("ascii"),
              "sha":sys.argv[1],
              "branch":"main",
          }
          Path("/tmp/wp003-parent-payload.json").write_text(json.dumps(payload),encoding="utf-8")
          PY
          set +e
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/tools/screenshot_tool.py" \
            --input /tmp/wp003-parent-payload.json >>/tmp/wp003-parent-api.log 2>&1
          status=$?
          set -e
          printf '\nstatus=%s\n' "$status" >>/tmp/wp003-parent-api.log
          cat /tmp/wp003-parent-api.log
          exit "$status"
      - name: Upload API diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp003-parent-evidence-api-diagnostics
          path: /tmp/wp003-parent-api.log
          if-no-files-found: ignore
          retention-days: 2
