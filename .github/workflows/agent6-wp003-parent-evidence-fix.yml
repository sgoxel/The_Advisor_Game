name: Agent6 WP003 Parent Evidence Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp003-parent-evidence-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp003-parent-evidence-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Route parent WP to refinement evidence sequence
        run: |
          set -euo pipefail
          python tools/agent6_wp003_parent_evidence_patch.py
          PYTHONDONTWRITEBYTECODE=1 python -m py_compile tools/screenshot_tool.py
          rm -rf tools/__pycache__
          git diff --check
          grep -q 'WP_VIEWPORT_REFINEMENT_SCENARIO="wp-s003-010-003"' tools/screenshot_tool.py
          grep -q 'WP_SURFACE_REFINEMENT_SCENARIO,WP_VIEWPORT_REFINEMENT_SCENARIO' tools/screenshot_tool.py
      - name: Commit evidence harness correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/screenshot_tool.py
          if git diff --cached --quiet; then
            echo "WP003 parent evidence routing already current"
            exit 0
          fi
          git commit -m "test(WP-S003-010-003): capture refinement sequence for parent WP"
          git pull --rebase origin main
          git push origin HEAD:main
