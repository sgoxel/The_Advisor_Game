name: WP19 wire interior authority boundary
on:
  push:
    branches: [agent1/wp-s002-004-009-living-settlements]
    paths: [.github/workflows/wp19-authority-wire.yml]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent1/wp-s002-004-009-living-settlements
      - name: Wire authority module and browser assertions
        run: |
          git config user.name "AGENT #1"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin agent1/wp-s002-004-009-living-settlements
          git reset --hard origin/agent1/wp-s002-004-009-living-settlements
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          old = '    <script type="module" src="/src/settlement-experience.ts"></script>\n'
          new = old + '    <script type="module" src="/src/settlement-entry-authority.ts"></script>\n'
          if '/src/settlement-entry-authority.ts' not in text:
              if old not in text: raise SystemExit('settlement experience script hook not found')
              index.write_text(text.replace(old, new, 1))

          browser = Path('tests/settlement-browser.js')
          text = browser.read_text()
          text = text.replace(
              'await page.waitForFunction(() => window.advisorWorld?.state.ready && window.advisorSettlements);',
              'await page.waitForFunction(() => window.advisorWorld?.state.ready && window.advisorSettlements?.state.authority?.installed);'
          )
          needle = '    await expect(page.locator("#interior-title")).toHaveText("Inn");\n    await expect(page.locator(".interior-room")).toHaveCount(inn.rooms.length);\n'
          insert = needle + '    const authority = await page.evaluate(() => window.advisorSettlements.state.authority);\n    expect(authority.last.characterDecision).toBe("accepted");\n    expect(authority.last.simulation).toBe("validated");\n    expect(authority.last.worldAction).toBe("entered");\n'
          if 'authority.last.characterDecision' not in text:
              if needle not in text: raise SystemExit('interior authority assertion hook not found')
              text = text.replace(needle, insert, 1)
          browser.write_text(text)

          css = Path('src/settlement-experience.css')
          text = css.read_text()
          addition = '''\n.settlement-authority-status {\n  display: block;\n  margin-top: 8px;\n  font-size: 11px;\n  line-height: 1.35;\n  opacity: 0.82;\n}\n'''
          if '.settlement-authority-status' not in text:
              css.write_text(text + addition)
          PY
          git rm .github/workflows/wp19-authority-wire.yml
          git add index.html tests/settlement-browser.js src/settlement-experience.css
          git commit -m "WP-S002-004-009 enforce Advisor interior-entry authority"
          git push origin HEAD:agent1/wp-s002-004-009-living-settlements
