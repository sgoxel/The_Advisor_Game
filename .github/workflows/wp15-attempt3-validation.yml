name: WP15 attempt 3 validation
on:
  push:
    branches:
      - agent1/wp15-attempt3-validation
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp15-attempt3-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply terrain repair
        run: python tools/wp15_attempt3_patch.py
      - name: Install
        run: npm ci
      - name: Targeted regressions
        run: node --experimental-strip-types --test tests/hydrology.test.ts tests/terrain-refine.test.ts tests/surface-presentation.test.ts
      - name: Validate evidence targets
        run: node --experimental-strip-types tools/wp15_targets.ts
      - name: Build
        run: npm run build
      - name: Commit validated terrain source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/hydrology.ts
          git commit -m "WP-S002-004-005 remove repeated ridge-band terrain artifacts"
          git push origin HEAD:agent1/wp15-attempt3-validation
