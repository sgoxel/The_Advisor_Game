name: WP15 current-main integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply final-surface routing adapter once
        run: |
          if grep -q 'macroTerrainSampler' src/routing.ts; then
            python tools/wp15_integrate.py
            git config user.name 'AGENT #1'
            git config user.email '163722426+sgoxel@users.noreply.github.com'
            git add src/routing.ts src/geography.ts tests/routing.test.ts
            git commit -m 'WP-S002-004-005 route on final surface authority'
            git push origin HEAD:${{ github.head_ref }}
          else
            echo 'WP15 final routing adapter already applied on this head.'
          fi
