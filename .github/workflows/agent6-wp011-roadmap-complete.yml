name: Agent 6 WP011 Roadmap Completion

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/agent6-wp011-roadmap-complete.yml'

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Mark accepted WP completed and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '- `WP-S003-010-003-011` — TOP PRIORITY BUG: Pure Zoom + Canonical 1/N Scale Ladder + Scale-Aware Navigation'
          new = old + ' — COMPLETED'
          if new not in text:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one WP011 roadmap line, found {count}')
              roadmap.write_text(text.replace(old, new, 1), encoding='utf-8')
          helper = Path('.github/workflows/agent6-wp011-roadmap-complete.yml')
          if helper.exists():
              helper.unlink()
          PY
      - name: Commit completion bookkeeping
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+sgoxel@users.noreply.github.com'
          git add -A
          git commit -m 'docs(WP-S003-010-003-011): mark completed'
          git pull --rebase origin main
          git push origin HEAD:main
