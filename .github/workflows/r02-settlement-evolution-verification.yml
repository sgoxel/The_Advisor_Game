name: R02 Settlement Evolution Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/settlement_evolution.js'
      - 'js/world_composition.js'
      - 'js/world_hierarchy.js'
      - 'js/campaign_calendar.js'
      - 'js/utils.js'
      - 'tests/browser/r02-settlement-evolution.spec.mjs'
      - '.github/workflows/r02-settlement-evolution-verification.yml'
  pull_request:
    paths:
      - 'js/settlement_evolution.js'
      - 'js/world_composition.js'
      - 'js/world_hierarchy.js'
      - 'js/campaign_calendar.js'
      - 'js/utils.js'
      - 'tests/browser/r02-settlement-evolution.spec.mjs'
      - '.github/workflows/r02-settlement-evolution-verification.yml'

permissions:
  contents: read

jobs:
  settlement-evolution-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run compact settlement evolution regression
        run: npx playwright test tests/browser/r02-settlement-evolution.spec.mjs
      - name: Re-run world hierarchy regression
        run: npx playwright test tests/browser/r02-world-hierarchy.spec.mjs
      - name: Re-run world composition regression
        run: npx playwright test tests/browser/r02-world-composition.spec.mjs
      - name: Re-run campaign calendar regression
        run: npx playwright test tests/browser/r02-campaign-calendar.spec.mjs
      - name: Run stabilized R01 browser regression
        run: npm run test:browser:r01
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r02-settlement-evolution-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
