name: Agent6 WP162 Capped Run Bookkeeping

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp162-bookkeeping.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp162-bookkeeping
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record capped WP continuation
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path
          import re

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          line = '- `WP-S003-010-003-005-002` — True Cross-LOD Surface Refinement + Texel/Geometry Density Continuity — IN PROGRESS'
          updated, count = re.subn(r'^- `WP-S003-010-003-005-002` — True Cross-LOD Surface Refinement \+ Texel/Geometry Density Continuity.*$', line, text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit(f'ROADMAP WP line replacement count={count}')
          roadmap.write_text(updated, encoding='utf-8')

          changelog = Path('docs/changelog.txt')
          entry = ('2026-10-03 08:45 +03:00 | AGENT #6 | WP-S003-010-003-005-002 | MIXED INCOMPLETE — '
                   'Current continuation exhausted its three-attempt cap on exact runtime head dc917f6abf7269538941ce238ae6d0c02ef86be7. '
                   'Final fresh Visual Evidence run 37100218836 / artifact 11265754151 (sha256:a0cdcb6f1e830ebb7a1760a634a60ba539d234405f09cf926a40c36054c63d25) '
                   'completed successfully and all ten 1280×800 fixed-focus screenshots were directly inspected; VISUAL 5.6/10 FAIL. '
                   'Functional density/coverage remains correct through 1750→37.5→7.5→2.344→0.5→0.225 m/texel and 4000→220→44→11→3→2 m geometry spacing, '
                   'with foreground coverage/visibility true and offscreen fine detail inactive. The final handoff broadening and duplicate-authority-sample removal softened the hard child edge and reduced peak software evidence build cost only marginally to 22796.6 ms; '
                   'regional/local terrain still reads as enlarged low-frequency blur and the near-ground focus footprint remains visible. WP stays IN PROGRESS and Issue #162 remains open.\n')
          ctext = changelog.read_text(encoding='utf-8')
          if 'run 37100218836 / artifact 11265754151' not in ctext:
              changelog.write_text(entry + ctext, encoding='utf-8')

          suggest = Path('docs/suggest_log.txt')
          sentry = ('2026-10-03 08:45 +03:00 | WP-S003-010-003-005-002 | Phase close-handoff-continuation-5 | FUTURE — '
                    'Preserve the accepted fixed-focus density/coverage family, shared photometric continuity, Campaign-SEED coordinate authority, and bounded 1×/6×/12× resource ownership. '
                    'For the next claim, replace the remaining enlarged low-frequency local/near-ground color field with a genuinely scale-appropriate registered source-detail hierarchy rather than increasing residual gain, and profile preparation by phase to reduce the 640px focus/medium authority work and 8-resource cache pressure. '
                    'Require the unchanged ten-frame visual gate to reach at least 8/10 and verify no rectangular focus identity before changing completion state. Do not implement unless explicitly requested.\n')
          stext = suggest.read_text(encoding='utf-8')
          if 'Phase close-handoff-continuation-5' not in stext:
              suggest.write_text(sentry + stext, encoding='utf-8')
          PY
          git rm .github/workflows/agent6-wp162-bookkeeping.yml
          git diff --check
      - name: Commit bookkeeping
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+sgoxel@users.noreply.github.com"
          git add -A -- docs/ROADMAP.md docs/changelog.txt docs/suggest_log.txt .github/workflows/agent6-wp162-bookkeeping.yml
          if git diff --cached --quiet; then
            echo "Bookkeeping already current"
            exit 0
          fi
          git commit -m "docs(WP-S003-010-003-005-002): record capped continuation"
          git pull --rebase origin main
          git push origin HEAD:main
