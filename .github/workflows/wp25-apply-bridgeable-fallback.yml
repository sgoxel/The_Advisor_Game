name: WP25 apply bridgeable fallback
on:
  push:
    branches: [agent1/wp-s005-001-001]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s005-001-001
      - run: python tools/wp25_bridgeable_fallback_patch.py
      - name: Commit transport source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "AGENT #1"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/transport-network.ts
          git commit -m "WP-S005 preserve legal bridgeable planner proposals"
          git push origin HEAD:agent1/wp-s005-001-001
