name: Validate S006 living residents
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/clock.ts'
      - 'src/main.ts'
      - 'src/political-settlement-access.ts'
      - 'src/resident-inspector.*'
      - 'src/settlement-exterior*.ts'
      - 'src/simulation.ts'
      - 'src/transport-walking-route.ts'
      - 'tests/simulation.test.ts'
      - 'tools/screenshot_tool.py'
      - '.github/workflows/agent1-s006-resident-evidence.yml'
concurrency:
  group: s006-resident-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  resident-evidence:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate resident release invariants (bounded PR gate)
        if: github.event_name != 'workflow_dispatch'
        run: npm run test:s006:focused
      - name: Full resident authority diagnostics (on demand)
        if: github.event_name == 'workflow_dispatch'
        run: node --experimental-strip-types --test tests/simulation.test.ts
      - run: npm run build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'agent1/s006-canonical-actor-evidence-20261024-r2')
      - run: npx playwright install --with-deps chromium
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'agent1/s006-canonical-actor-evidence-20261024-r2')
      - run: python -m pip install playwright==1.63.0
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'agent1/s006-canonical-actor-evidence-20261024-r2')
      - name: Capture resident inspector evidence
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'agent1/s006-canonical-actor-evidence-20261024-r2')
        run: |
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          RESIDENT_STEPS='eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.villages[0].canonicalPosition);eval:window.advisorWorld.setHalfHeight(4);wait:1500;settle;eval:(window.__s006Resident=window.advisorWorld.residentEvidencePick())||Promise.reject(new Error("No actual clickable resident onscreen"));shot:resident-scene;eval:(a=>["pointerdown","pointerup"].forEach(type=>document.getElementById("world").dispatchEvent(new PointerEvent(type,{bubbles:true,pointerId:31,clientX:a.clientX,clientY:a.clientY}))))(window.__s006Resident);visible:#npc-popup:not([hidden]);eval:document.getElementById("npc-seed-code")?.textContent===window.__s006Resident.code||Promise.reject(new Error("Canvas pick and popup canonical resident disagree"));eval:document.getElementById("npc-home-entrance")?.textContent===window.__s006Resident.homeEntrance||Promise.reject(new Error("Selected resident owned-door mismatch"));eval:(document.getElementById("npc-route-code")?.textContent&&((window.advisorWorld.clock.tickAt(Date.now())!==window.__s006Resident.tick)||document.getElementById("npc-route-code").textContent===window.__s006Resident.route))||Promise.reject(new Error("Missing route or same-tick canonical route mismatch"));shot:resident-selected;eval:document.querySelector("#npc-popup .npc-technical").open=true;shot:resident-canonical-details'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/s006-residents-webgl2 --name residents --profile fullhd-landscape,fullhd-portrait --renderer webgl2 --timeout 240 --steps "$RESIDENT_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/s006-residents-webgpu --name residents --profile fullhd-landscape,fullhd-portrait --renderer webgpu --timeout 240 --steps "$RESIDENT_STEPS"
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'agent1/s006-canonical-actor-evidence-20261024-r2'))
        with:
          name: s006-resident-evidence
          path: test-results/
