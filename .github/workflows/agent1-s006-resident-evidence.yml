name: Validate S006 living residents
on:
  workflow_dispatch:
  # Capture actual current-main actor evidence separately per viewport/backend.
  # WP-S006-001-001: exact-main actor click then camera-only SEED home-door proof, both real screencast PNGs (2026-10-25).
  push:
    branches: [main]
    paths:
      # Acceptance needs screenshots of deployed gameplay, not only edits to this workflow.
      - 'src/main.ts'
      - 'src/render-resolution.ts'
      - 'src/npc-popup.ts'
      - 'src/simulation.ts'
      - 'src/settlement-exterior.ts'
      - 'src/settlement-exterior-core.ts'
      - 'src/world.ts'
      # WP-S009-001-001: changes to real worker/terrain hot paths also need
      # exact-main cold resident/worker/upload measurements. Prior changes to
      # geography.ts and natural-surface-mesh.ts silently skipped this evidence.
      - 'src/geography.ts'
      - 'src/natural-surface-mesh.ts'
      - 'src/surface-refinement.ts'
      - 'src/vegetation-render.ts'
      - 'src/tile-worker.ts'
      - 'src/hydrology.ts'
      - 'src/world-core.ts'
      - 'src/resident-inspector.css'
      - 'src/default-character.ts'
      - 'src/resident-query.ts'
      - 'src/resident-foot-ring.ts'
      - 'tools/screenshot_tool.py'
      - '.github/workflows/agent1-s006-resident-evidence.yml'
concurrency:
  group: s006-resident-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  resident-diagnostics:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Full resident authority diagnostics (on demand)
        run: node --experimental-strip-types --test tests/simulation.test.ts
  resident-evidence:
    # Release invariants/build are already mandatory in pages.yml for PRs.
    # Keep four genuine screenshot_tool.py views on main or explicit dispatch.
    strategy:
      fail-fast: false
      matrix:
        renderer: [webgl2, webgpu]
        profile: [fullhd-landscape, fullhd-portrait]
    # Real Chrome/Metal presentation avoids the reproducible Linux software
    # WebGPU compositor stall. WebGL2 keeps the proven Xvfb/Linux surface.
    runs-on: ${{ matrix.renderer == 'webgpu' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Linux software Vulkan presentation needs an actual ICD/runtime. The
      # Playwright browser dependency installer does not guarantee Mesa's ICD.
      # Limit this package install to the WebGPU evidence jobs only.
      - name: Install Vulkan software ICD for WebGPU
        if: runner.os == 'Linux' && matrix.renderer == 'webgpu'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers
      - run: python -m pip install playwright==1.63.0 mss==10.1.0 pillow==11.3.0
      # Active WP-S010-003-001: a real 1920x1080 night gate in the same
      # screenshot_tool.py pipeline. Full landscape evidence is essential:
      # selecting a character indoors or far from a gate is not proof of watch.
      # Do not substitute simulated pixels or counts for this real PNG.
# Put night-watch metadata in a subfolder: the resident screenshot tool
      # writes its own capture.json at the parent root and otherwise overwrites it.
      # WP-S010-003-001: the original full-HD night-gate PNG shows the
      # second genuinely on-duty guard from Simulation behind a solid sloping
      # gate-wall roof. Pixel (980,720) is the foreground opaque wall over
      # that guard's grounded projected lower body. Tap the *real canvas*
      # before the single original PNG: a hidden resident must never open
      # an NPC inspector through this wall. The shared #npc-popup is ALSO
      # the legitimate building/settlement inspector on an opaque roof tap;
      # reject the actual canonical resident #npc-seed-code, not every world
      # information card. Keep the same fixed tick, actual
      # PlayCanvas render, camera, backends, resolution and screenshot count.
      - name: Capture physically staffed night gate at 1920x1080
        if: matrix.profile == 'fullhd-landscape'
        run: |
          npm run preview -- --port 4174 > /tmp/advisor-gate-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          NIGHT_TIME_MS=$(node --experimental-strip-types --input-type=module -e '
            import { FantasyClock, TIME_SCALE, localSecondOfDay } from "./src/clock.ts";
            import { villages } from "./src/geography.ts";
            const start=1792874335750, clock=new FantasyClock();
            const now=localSecondOfDay(clock.tickAt(start), villages[0].canonicalPosition.lon);
            const delta=(21*3600-now+86400)%86400;
            console.log(start+Math.ceil(delta/TIME_SCALE*1000));
          ')
          GATE_STEPS='eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.villages[0].canonicalPosition);eval:window.advisorWorld.setHalfHeight(3);click:#focus-gate-watch;until:(window.__watch=window.advisorWorld.gateWatchEvidence())&&window.__watch.dutyCodes.length>0&&window.__watch.displayed.some(g=>g.mesh);settle;shot:village-night-gate-1920x1080;tap:980,720;wait:2000;eval:!document.querySelector("#npc-popup:not([hidden]) #npc-seed-code")||Promise.reject(new Error("WP-S010-003-001: a night guard was selected through the real gate-wall roof. Ray="+JSON.stringify(window.__wp353Ray)+" Pick="+JSON.stringify(window.__wp353PickResult)))'
          if [ "${{ runner.os }}" = "macOS" ]; then
            python tools/screenshot_tool.py 'http://127.0.0.1:4174/?resident-route-probes=1' --headed --browser-channel chrome --out test-results/s006-${{ matrix.renderer }}-${{ matrix.profile }}/night-watch --name gate-watch --width 1920 --height 1080 --profile fullhd-landscape --renderer ${{ matrix.renderer }} --fixed-time-ms "$NIGHT_TIME_MS" --initial-ready-only --timeout 180 --steps "$GATE_STEPS"
          else
            xvfb-run -a -s '-screen 0 2560x2560x24' timeout --signal=TERM --kill-after=10s 420s python tools/screenshot_tool.py 'http://127.0.0.1:4174/?resident-route-probes=1' --headed --out test-results/s006-${{ matrix.renderer }}-${{ matrix.profile }}/night-watch --name gate-watch --width 1920 --height 1080 --profile fullhd-landscape --renderer ${{ matrix.renderer }} --fixed-time-ms "$NIGHT_TIME_MS" --initial-ready-only --timeout 180 --steps "$GATE_STEPS"
          fi
      - name: Capture resident inspector evidence
        run: |
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          # Freeze the same legitimate, seeded Fantasy tick for every viewport and renderer.
          # This does not freeze browser timers/animation or change game code/SEED.
          FIXED_TIME_MS=1792874335750 # Fantasy tick 36274242 (same proven daylight evidence tick)
          RESIDENT_STEPS='eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.villages[0].canonicalPosition);eval:window.advisorWorld.setHalfHeight(18);wait:1500;until:(window.__s006Resident=window.advisorWorld.residentEvidencePick());eval:(()=>{const r=window.__s006Resident\;const p=window.advisorWorld.navigation.surfaceAtScreen(r.clientX,r.clientY)\;if(!p)throw Error("S006 selected actor has no real ground anchor")\;window.advisorWorld.navigation.setFocus(p.lon,p.lat)\;window.advisorWorld.setHalfHeight(10)})();wait:1500;until:(window.__s006Resident=window.advisorWorld.residentEvidencePick());eval:window.advisorWorld.state.settlementPresentation==="buildings"||(()=>{throw Error("S006 captured icon zoom instead of resident-building detail")})();eval:window.__s006Focus=JSON.stringify(window.advisorWorld.state.focus);tap:resident;visible:#npc-popup:not([hidden]);eval:window.__s006Focus===JSON.stringify(window.advisorWorld.state.focus)||(()=>{throw Error("S006 resident inspection changed geographic focus")})();eval:(()=>{const r=window.__s006Resident\;const get=id=>document.getElementById(id)?.textContent\;for(const [id,expected] of [["npc-seed-code",r.code],["npc-home-entrance",r.homeEntrance],["npc-workplace-code",r.workplace],["npc-current-task",r.task],["npc-route-code",r.route]])if(get(id)!==expected)throw new Error("S006 actual browser click mismatch: "+id+" expected "+expected+" found "+get(id))\;return true})();visible:#selected-resident-marker:not([hidden]);eval:document.getElementById("selected-resident-marker").dataset.residentCode===window.__s006Resident.code||(()=>{throw Error("S006 on-scene selected marker identity mismatch")})();until:(window.__ring=window.advisorWorld.residentFootRingEvidence())&&window.__ring.shown&&window.__ring.grounded&&window.__ring.depthTest&&!window.__ring.depthWrite&&window.__ring.meshCount===1&&window.__ring.code===window.__s006Resident.code&&window.__ring.actorCode===window.__s006Resident.code;click:#npc-popup [data-go^="resident:"];until:(window.__ring=window.advisorWorld.residentFootRingEvidence())&&window.__ring.shown&&window.__ring.grounded&&window.__ring.depthTest&&!window.__ring.depthWrite&&window.__ring.meshCount===1&&window.__ring.code===window.__s006Resident.code&&window.__ring.actorCode===window.__s006Resident.code&&document.getElementById("selected-resident-marker").dataset.residentCode===window.__s006Resident.code;eval:window.advisorWorld.state.view.halfHeight<=0.76||(()=>{throw Error("S006 resident not framed at true scale")})();eval:document.querySelector("#npc-popup .npc-technical").open=true;until:window.advisorWorld.state.settled;eval:(()=>{const r=window.__s006Resident\;if(document.getElementById("selected-resident-marker").dataset.residentCode!==r.code||document.getElementById("npc-seed-code").textContent!==r.code||!((window.__ring=window.advisorWorld.residentFootRingEvidence())&&window.__ring.shown&&window.__ring.grounded&&window.__ring.depthTest&&!window.__ring.depthWrite&&window.__ring.meshCount===1&&window.__ring.code===window.__s006Resident.code&&window.__ring.actorCode===window.__s006Resident.code))throw Error("S006 settled 3D foot ring lost its original Simulation actor or depth testing")\;return true})();shot:resident-canonical-details;click:#npc-popup [data-go^="home:"];until:!document.getElementById("selected-home-door-marker").hidden;eval:document.getElementById("selected-home-door-marker").dataset.homeEntrance===window.__s006Resident.homeEntrance||Promise.reject(new Error("S006 owned doorway identity mismatch"));eval:document.getElementById("npc-seed-code").textContent===window.__s006Resident.code||Promise.reject(new Error("S006 lost original SEED resident identity"));until:window.advisorWorld.state.settled;shot:owned-home-entrance'
          # Require the actual enabled, actor-grounded, depth-tested 3D ring and fully settled mandatory geometry
          # before judging the actual SEED-owned doorway; failing the bounded wait is
          # PENDING/FAIL, never a photograph of an incomplete house.
          # Prove the real rendered actor/pointer/authoritative five-field click before
          # the first GPU readback. Historical pre-click screenshots consumed >10m
          # and were canceled before testing a single click; time-bound each job.
          # Keep the full real resident click + owned-door evidence. Use a visible
          # Xvfb-backed Chromium compositor because the headless runner returned
          # no screencast frames after a successful canvas click (4/4 zero PNG).
          # One consolidated real-click/details tool PNG per job avoids a second very slow GPU readback. A failed WebGPU or portrait
          # cannot withhold already-produced PNGs for another backend/viewport.
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Native Apple Silicon Chrome uses the real Metal WebGPU device.
            # Keep all renderer/SEED/canvas-click/fresh-POST PNG checks active.
            python tools/screenshot_tool.py 'http://127.0.0.1:4174/?resident-route-probes=1' --headed --browser-channel chrome --out test-results/s006-${{ matrix.renderer }}-${{ matrix.profile }} --name residents --profile ${{ matrix.profile }} --renderer ${{ matrix.renderer }} --fixed-time-ms "$FIXED_TIME_MS" --initial-ready-only --timeout 180 --steps "$RESIDENT_STEPS"
          else
            xvfb-run -a -s '-screen 0 2560x2560x24' timeout --signal=TERM --kill-after=10s 840s python tools/screenshot_tool.py 'http://127.0.0.1:4174/?resident-route-probes=1' --headed --out test-results/s006-${{ matrix.renderer }}-${{ matrix.profile }} --name residents --profile ${{ matrix.profile }} --renderer ${{ matrix.renderer }} --fixed-time-ms "$FIXED_TIME_MS" --initial-ready-only --timeout 180 --steps "$RESIDENT_STEPS"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s006-resident-${{ matrix.renderer }}-${{ matrix.profile }}
          path: test-results/s006-${{ matrix.renderer }}-${{ matrix.profile }}/
          if-no-files-found: warn
