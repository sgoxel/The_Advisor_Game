name: Validate S006 living residents
on:
  workflow_dispatch:
  # Capture actual current-main actor evidence separately per viewport/backend.
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent1-s006-resident-evidence.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/clock.ts'
      - 'src/main.ts'
      - 'src/political-settlement-access.ts'
      - 'src/resident-inspector.*'
      - 'src/settlement-exterior*.ts'
      - 'src/simulation.ts'
      - 'src/transport-walking-route.ts'
      - 'tests/simulation.test.ts'
      - 'tools/screenshot_tool.py'
      - '.github/workflows/agent1-s006-resident-evidence.yml'
concurrency:
  group: s006-resident-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  resident-invariants:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate resident release invariants (bounded PR gate)
        run: npm run test:s006:focused
  resident-diagnostics:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Full resident authority diagnostics (on demand)
        run: node --experimental-strip-types --test tests/simulation.test.ts
  resident-evidence:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        renderer: [webgl2, webgpu]
        profile: [fullhd-landscape, fullhd-portrait]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install playwright==1.63.0
      - name: Capture resident inspector evidence
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          # Freeze the same legitimate, seeded Fantasy tick for every viewport and renderer.
          # This does not freeze browser timers/animation or change game code/SEED.
          FIXED_TIME_MS=1792874335750 # Fantasy tick 36274242 (same proven daylight evidence tick)
          RESIDENT_STEPS='eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.villages[0].canonicalPosition);eval:window.advisorWorld.setHalfHeight(18);wait:1500;shot:resident-first-view;until:(window.__s006Resident=window.advisorWorld.residentEvidencePick());shot:resident-pre-click;until:(window.__s006Resident=window.advisorWorld.residentEvidencePick());eval:window.__s006Focus=JSON.stringify(window.advisorWorld.state.focus);tap:resident;visible:#npc-popup:not([hidden]);eval:window.__s006Focus===JSON.stringify(window.advisorWorld.state.focus)||(()=>{throw Error("S006 resident inspection changed geographic focus")})();eval:(()=>{const r=window.__s006Resident\;const get=id=>document.getElementById(id)?.textContent\;for(const [id,expected] of [["npc-seed-code",r.code],["npc-home-entrance",r.homeEntrance],["npc-workplace-code",r.workplace],["npc-current-task",r.task],["npc-route-code",r.route]])if(get(id)!==expected)throw new Error("S006 actual browser click mismatch: "+id+" expected "+expected+" found "+get(id))\;return true})();visible:#selected-resident-marker:not([hidden]);eval:document.getElementById("selected-resident-marker").dataset.residentCode===window.__s006Resident.code||(()=>{throw Error("S006 on-scene selected marker identity mismatch")})();shot:resident-selected;eval:document.querySelector("#npc-popup .npc-technical").open=true;shot:resident-canonical-details'
          # Exactly one actual tool capture per job. A failed WebGPU or portrait
          # cannot withhold already-produced PNGs for another backend/viewport.
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/s006-${{ matrix.renderer }}-${{ matrix.profile }} --name residents --profile ${{ matrix.profile }} --renderer ${{ matrix.renderer }} --fixed-time-ms "$FIXED_TIME_MS" --initial-ready-only --timeout 180 --steps "$RESIDENT_STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s006-resident-${{ matrix.renderer }}-${{ matrix.profile }}
          path: test-results/s006-${{ matrix.renderer }}-${{ matrix.profile }}/
          if-no-files-found: warn
