name: Validate S006 living residents
on:
  pull_request:
    branches: [main]
concurrency:
  group: s006-resident-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  resident-evidence:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate complete deterministic test suite
        run: npm test
      - name: Validate resident authority and performance contracts
        run: node --experimental-strip-types --test tests/simulation.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install playwright==1.63.0
      - name: Capture resident inspector evidence
        run: |
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          RESIDENT_STEPS='eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.villages[0].canonicalPosition);eval:window.advisorWorld.setHalfHeight(48);wait:1500;settle;shot:resident-scene;eval:document.getElementById("travel-panel").hidden=false;visible:#travel-panel;visible:#resident-inspector;visible:#resident-select;eval:document.getElementById("travel-panel").scrollTop=document.getElementById("resident-inspector").offsetTop-18;wait:150;shot:resident-primary;eval:(s=>{s.selectedIndex=Math.min(6,s.options.length-1),s.dispatchEvent(new Event("change"))})(document.getElementById("resident-select"));wait:100;shot:resident-guard;eval:(n=>n.setFocus=((o)=>((lon,lat)=>(window.__s006HouseFocus={lon,lat},o(lon,lat))))(n.setFocus.bind(n)))(window.advisorWorld.navigation);click:#resident-home-inspect;wait:100;eval:(a=>{if(!a||Math.hypot(a.lon-window.advisorWorld.state.navigation.focus.lon,a.lat-window.advisorWorld.state.navigation.focus.lat)>1e-8)throw new Error("house focus mismatch")})(window.__s006HouseFocus);eval:(e=>{if(e?.closest(".travel-panel"))throw new Error("house focus obscured by resident inspector")})(document.elementFromPoint(innerWidth/2,innerHeight/2));shot:resident-house'
          PROFILES='desktop,laptop,tablet,tablet-portrait,phone,phone-small,phone-landscape'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/s006-residents-webgl2 --name residents --profile "$PROFILES" --renderer webgl2 --timeout 240 --steps "$RESIDENT_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/s006-residents-webgpu --name residents --profile "$PROFILES" --renderer webgpu --timeout 240 --steps "$RESIDENT_STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s006-resident-evidence
          path: test-results/
