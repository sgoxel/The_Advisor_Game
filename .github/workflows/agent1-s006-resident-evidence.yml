name: Validate S006 living residents
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/clock.ts'
      - 'src/main.ts'
      - 'src/political-settlement-access.ts'
      - 'src/resident-inspector.*'
      - 'src/settlement-exterior*.ts'
      - 'src/simulation.ts'
      - 'src/transport-walking-route.ts'
      - 'tests/simulation.test.ts'
      - 'tools/screenshot_tool.py'
      - '.github/workflows/agent1-s006-resident-evidence.yml'
concurrency:
  group: s006-resident-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  resident-evidence:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate resident authority and performance contracts
        run: node --experimental-strip-types --test tests/simulation.test.ts
      - run: npm run build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'agent1/s006-visual-evidence-close-actors-20261024')
      - run: npx playwright install --with-deps chromium
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'agent1/s006-visual-evidence-close-actors-20261024')
      - run: python -m pip install playwright==1.63.0
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'agent1/s006-visual-evidence-close-actors-20261024')
      - name: Capture resident inspector evidence
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'agent1/s006-visual-evidence-close-actors-20261024')
        run: |
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          RESIDENT_STEPS='eval:window.advisorWorld.clock.tickAt=()=>36274242;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.advisorWorld.geography.villages[0].canonicalPosition);eval:window.advisorWorld.setHalfHeight(4);wait:1500;settle;eval:window.advisorWorld.state.residentPresentation.visibleActors>0||Promise.reject(new Error("Resident scene contains no active street actors"));shot:resident-scene;eval:document.getElementById("travel-panel").hidden=false;visible:#resident-inspector;visible:#resident-select;settle;wait:350;eval:(s=>s?.value&&document.getElementById("resident-task")?.textContent?.trim()&&document.getElementById("resident-home-inspect")||Promise.reject(new Error("Canonical resident inspector unavailable")))(document.getElementById("resident-select"));eval:document.getElementById("travel-panel").scrollTop=document.getElementById("resident-inspector").offsetTop-18;shot:resident-primary;click:#resident-home-inspect;wait:350;shot:resident-house'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/s006-residents-webgl2 --name residents --profile fullhd-landscape,fullhd-portrait --renderer webgl2 --timeout 240 --steps "$RESIDENT_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/s006-residents-webgpu --name residents --profile fullhd-landscape,fullhd-portrait --renderer webgpu --timeout 240 --steps "$RESIDENT_STEPS"
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'agent1/s006-visual-evidence-close-actors-20261024'))
        with:
          name: s006-resident-evidence
          path: test-results/
