name: R04 Autonomous Decision Loop Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/autonomous_decision_loop.js'
      - 'js/autonomous_action_execution.js'
      - 'js/local_bot_driver.js'
      - 'js/protagonist_driver_intent.js'
      - 'js/game_time.js'
      - 'js/campaign_calendar.js'
      - 'js/campaign_persistence.js'
      - 'js/world_action_resolution.js'
      - 'js/spatial_action_legality.js'
      - 'js/interaction_validation.js'
      - 'js/interaction_target.js'
      - 'js/action_legality.js'
      - 'js/utils.js'
      - 'tests/browser/r04-autonomous-decision-loop.spec.mjs'
      - 'tests/browser/r04-autonomous-action-execution.spec.mjs'
      - 'tests/browser/r02-game-time.spec.mjs'
      - 'tests/browser/r02-campaign-calendar.spec.mjs'
      - 'tests/browser/r02-cumulative-persistence-regression.spec.mjs'
      - 'tests/browser/r01-baseline.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r04-autonomous-decision-loop-verification.yml'
  pull_request:
    paths:
      - 'js/autonomous_decision_loop.js'
      - 'js/autonomous_action_execution.js'
      - 'js/local_bot_driver.js'
      - 'js/protagonist_driver_intent.js'
      - 'js/game_time.js'
      - 'js/campaign_calendar.js'
      - 'js/campaign_persistence.js'
      - 'js/world_action_resolution.js'
      - 'js/spatial_action_legality.js'
      - 'js/interaction_validation.js'
      - 'js/interaction_target.js'
      - 'js/action_legality.js'
      - 'js/utils.js'
      - 'tests/browser/r04-autonomous-decision-loop.spec.mjs'
      - 'tests/browser/r04-autonomous-action-execution.spec.mjs'
      - 'tests/browser/r02-game-time.spec.mjs'
      - 'tests/browser/r02-campaign-calendar.spec.mjs'
      - 'tests/browser/r02-cumulative-persistence-regression.spec.mjs'
      - 'tests/browser/r01-baseline.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r04-autonomous-decision-loop-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-autonomous-decision-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: echo "R04-T04 candidate ${GITHUB_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused R04 time-aware autonomous decision regression
        run: npx playwright test tests/browser/r04-autonomous-decision-loop.spec.mjs
      - name: Preserve R04 autonomous Simulation execution
        run: npx playwright test tests/browser/r04-autonomous-action-execution.spec.mjs
      - name: Preserve authoritative game-time regression
        run: npx playwright test tests/browser/r02-game-time.spec.mjs
      - name: Preserve campaign calendar and resume catch-up regression
        run: npx playwright test tests/browser/r02-campaign-calendar.spec.mjs
      - name: Preserve cumulative persistence regression
        run: npx playwright test tests/browser/r02-cumulative-persistence-regression.spec.mjs
      - name: Preserve canonical R01 responsive browser baseline
        run: npm run test:browser:r01
      - name: Upload focused R04 Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-autonomous-decision-loop-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
