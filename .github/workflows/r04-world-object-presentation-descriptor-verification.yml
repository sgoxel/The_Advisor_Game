name: R04 World Object Presentation Descriptor Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/world_object_presentation_descriptor.js'
      - 'js/config.js'
      - 'tests/browser/r04-world-object-presentation-descriptor.spec.mjs'
      - '.github/workflows/r04-world-object-presentation-descriptor-verification.yml'
      - 'playwright.config.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-object-descriptor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4

      - name: Record exact candidate SHA
        run: echo "R04 world-object descriptor candidate ${GITHUB_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts

      - name: Check descriptor syntax
        run: node --check js/world_object_presentation_descriptor.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused world-object descriptor regression
        run: npx playwright test tests/browser/r04-world-object-presentation-descriptor.spec.mjs --project=desktop

      - name: Upload focused Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-world-object-descriptor-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
