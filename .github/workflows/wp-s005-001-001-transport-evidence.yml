name: S005 transport visual evidence
on:
  workflow_dispatch:
  push:
    branches: [main, "agent1/wp-s005-001-001-native-evidence-*", "agent1/wp-s005-001-001-canonical-bridge-evidence-*", "agent1/wp-s005-001-001-route-answer-clearview-*", "agent1/wp-s005-001-001-first-answer-summary-*"]
    paths:
      - ".github/workflows/wp-s005-001-001-transport-evidence.yml"
      - "src/transport-inspector.ts"
      - "src/world-core.ts"
      - "src/transport-route-corridor.ts"
permissions:
  contents: read
jobs:
  transport-evidence:
    # Use native Chrome/Metal for both actual renderer backends: Linux software
    # WebGL2 kept unfinished tiles at the 180s settled bound even bridge-first,
    # yielding zero inspectable PNGs. Keep renderer=webgl2 (no WebGPU fallback)
    # and screenshot_tool.py's unchanged real readiness/settled requirements.
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [webgpu, webgl2]
        profile: [fullhd-landscape, fullhd-portrait]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install playwright==1.63.0 mss==10.1.0 pillow==11.3.0
      - name: Capture canonical junction, bridge, grade, harbor and ferry
        run: |
          mkdir -p test-results
          node --experimental-strip-types --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { siteTransportNetwork as transportNetwork, siteTransportAcceptanceSummary as transportAcceptanceSummary } from "./src/site-transport-network.ts";
            const summary = transportAcceptanceSummary();
            if (summary.uncoveredNodeCodes.length || !summary.junctions || !summary.harbors || !summary.ferries ||
                !summary.siteNodes || summary.siteAccessBranches !== summary.siteNodes)
              throw new Error("Missing canonical transport endpoint or transfer evidence");
            writeFileSync("test-results/transport-authority.json", JSON.stringify({
              digest: transportNetwork.digest,
              roads: summary.roads,
              junctions: summary.junctions,
              harbors: summary.harbors,
              ferries: summary.ferries,
              criticalSiteNodes: summary.siteNodes,
              criticalSiteBranches: summary.siteAccessBranches,
              crossingCodes: transportNetwork.borderCrossings.map(c => c.code),
              ferryCodes: transportNetwork.ferryEdges.map(e => e.code),
            }, null, 2));
          '
          npm run preview -- --port 4174 > /tmp/advisor-s005-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          # Capture the SAME exact Campaign-SEED-owned, sampled-legal bridge
          # across both backends and viewports, even when lazy nearby bridge
          # caches differ. An absent/changed SEED code fails evidence closed.
          # A third capture shows the actual on-demand bounded physical verdict;
          # it is NOT an autonomous-actor passage or full-route certification.
          # Two real S005 player surfaces: an authoritative SEED graph route
          # preview (not an actor-travel claim) and the selected physical bridge.
          # Preserve the original final-surface tests as separate authority.
          # Use the previously proven fixed daylight tick so the real bridge,
          # banks and grade can be visually inspected rather than lost in night shading.
          FIXED_TIME_MS=1792874335750
          STEPS='eval:window.advisorTransport.selectEvidence("junction");select:#map-scale=50;settle;eval:document.querySelector("#transport-site-route").click();eval:window.advisorTransport.telemetry().firstSiteRouteStatus==="canonical walking graph preview ready"||Promise.reject(new Error("Real selected junction-to-site route unavailable"));settle;shot:junction-site-route;click:#transport-route-corridor;until:!document.querySelector("#transport-route-corridor").disabled;eval:document.querySelector("#transport-corridor-result .transport-route-verdict")?.textContent?.includes("character has not moved")||Promise.reject(new Error("Physical verdict falsely claims actor travel or is missing"));shot:junction-site-physical-verdict;eval:window.advisorTransport.selectEvidence("bridge","ADVISOR-0126-ALDERWICK/macro-roads-v2/ROAD/J/0/11/1/1~J/0/11/1/3/BRIDGE/ADVISOR-0126-ALDERWICK-v5-DRAINAGE-0-69-MAIN-19");eval:window.advisorTransport.telemetry().selection?.code==="ADVISOR-0126-ALDERWICK/macro-roads-v2/ROAD/J/0/11/1/1~J/0/11/1/3/BRIDGE/ADVISOR-0126-ALDERWICK-v5-DRAINAGE-0-69-MAIN-19"||Promise.reject(new Error("Wrong canonical bridge evidence target"));click:#transport-bridge-closeup;settle;shot:owned-bridge-low-angle;click:#transport-bridge-clearview;settle;shot:owned-bridge-unobstructed;click:#transport-resume;eval:!document.querySelector("#transport-panel").hidden||Promise.reject(new Error("Inspector did not return after clear view"))'
          # Real first graph answers at all four required S005 scales; graph
          # timing is never physical passage or a rendered-pixel measurement.
          if [ "${{ matrix.backend }}" = "webgpu" ]; then
            # Selecting evidence explicitly focuses the camera at 1/100.
            # Select the canonical Y ONCE, then let each user-selected scale
            # persist through the actual first-answer click. Previously the
            # second selection reset all 1/20 and 1/250 samples to 1/100.
            STEPS="$STEPS;eval:window.advisorTransport.selectEvidence(\"junction\")"
            for SCALE in 20 50 100 250; do
              STEPS="$STEPS;select:#map-scale=$SCALE;until:window.advisorWorld?.state?.scaleLabel===\"1/$SCALE\";eval:document.querySelector(\"#transport-site-route\").click();eval:window.advisorTransport.telemetry().firstSiteRouteStatus===\"canonical walking graph preview ready\"||Promise.reject(new Error(\"No graph answer at $SCALE\"))"
            done
            STEPS="$STEPS;eval:Object.values(window.advisorTransport.telemetry().fourScaleSiteRouteTimings).every(v=>v.samples>0&&v.ready>0&&Number.isFinite(v.calculationP95Ms))||Promise.reject(new Error(\"First-answer scale unmeasured\"))"
          fi
          # WebGL2's remote-junction 1/50 warm-up fails to settle on both
          # Linux viewport sizes (0 captured PNGs). Capture the actual selected
          # bridge FIRST at Street scale for both; keep full junction→site
          # route scenes on native WebGPU and optional manual dispatch.
          # Never bypass screenshot_tool.py readiness/settled assertions.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ matrix.backend }}" = "webgl2" ]; then
            STEPS='eval:window.advisorTransport.selectEvidence("bridge","ADVISOR-0126-ALDERWICK/macro-roads-v2/ROAD/J/0/11/1/1~J/0/11/1/3/BRIDGE/ADVISOR-0126-ALDERWICK-v5-DRAINAGE-0-69-MAIN-19");eval:window.advisorTransport.telemetry().selection?.code==="ADVISOR-0126-ALDERWICK/macro-roads-v2/ROAD/J/0/11/1/1~J/0/11/1/3/BRIDGE/ADVISOR-0126-ALDERWICK-v5-DRAINAGE-0-69-MAIN-19"||Promise.reject(new Error("Wrong canonical bridge evidence target"));click:#transport-bridge-closeup;settle;shot:owned-bridge-low-angle;click:#transport-bridge-clearview;settle;shot:owned-bridge-unobstructed;click:#transport-resume;eval:!document.querySelector("#transport-panel").hidden||Promise.reject(new Error("Inspector did not return after clear view"))'
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            python tools/screenshot_tool.py http://127.0.0.1:4174/ --headed --browser-channel chrome --out test-results/s005-${{ matrix.backend }}-${{ matrix.profile }} --name s005 --profile ${{ matrix.profile }} --renderer ${{ matrix.backend }} --fixed-time-ms "$FIXED_TIME_MS" --initial-ready-only --timeout 180 --steps "$STEPS"
          else
            xvfb-run -a -s '-screen 0 2560x2560x24' timeout --signal=TERM --kill-after=10s 840s python tools/screenshot_tool.py http://127.0.0.1:4174/ --headed --out test-results/s005-${{ matrix.backend }}-${{ matrix.profile }} --name s005 --profile ${{ matrix.profile }} --renderer ${{ matrix.backend }} --fixed-time-ms "$FIXED_TIME_MS" --initial-ready-only --timeout 180 --steps "$STEPS"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s005-transport-${{ matrix.backend }}-${{ matrix.profile }}
          path: test-results/s005-${{ matrix.backend }}-${{ matrix.profile }}/
          if-no-files-found: warn
