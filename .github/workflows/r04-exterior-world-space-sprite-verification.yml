name: R04 Exterior World-Space Sprite Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/npc_world.js'
      - 'js/npc_activity_bubble_layout.js'
      - 'assets/characters/world-space/**'
      - 'design/R04_WORLD_SPACE_PNG_SPRITE_FOUNDATION.md'
      - 'tests/browser/r04-exterior-world-space-sprites.spec.mjs'
      - 'tests/browser/r04-character-world-icons.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r04-exterior-world-space-sprite-verification.yml'
  pull_request:
    paths:
      - 'js/npc_world.js'
      - 'js/npc_activity_bubble_layout.js'
      - 'assets/characters/world-space/**'
      - 'design/R04_WORLD_SPACE_PNG_SPRITE_FOUNDATION.md'
      - 'tests/browser/r04-exterior-world-space-sprites.spec.mjs'
      - 'tests/browser/r04-character-world-icons.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r04-exterior-world-space-sprite-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-exterior-world-space-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: echo "R04 #324 candidate ${GITHUB_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused exterior world-space sprite regression
        run: npx playwright test tests/browser/r04-exterior-world-space-sprites.spec.mjs --project=desktop
      - name: Preserve completed character world-icon compatibility contract
        run: npx playwright test tests/browser/r04-character-world-icons.spec.mjs --project=desktop
      - name: Preserve Simulation-owned NPC world presence
        run: npx playwright test tests/browser/r02-npc-world-presence.spec.mjs --project=desktop
      - name: Upload focused exterior sprite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-exterior-world-space-sprites-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
