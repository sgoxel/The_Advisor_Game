name: WP15 AGENT1 final visual repair
on:
  push:
    branches:
      - agent1/wp-s002-004-005-uv-final2
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-uv-final2
          fetch-depth: 0
      - name: Apply final repair
        run: python tools/wp15_attempt3_patch.py
      - name: Commit final repair atomically
        run: |
          rm .github/workflows/wp15-agent1-attempt3.yml tools/wp15_attempt3_patch.py
          git diff --check
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/hydrology.ts src/terrain-refine.ts .github/workflows/wp15-agent1-attempt3.yml tools/wp15_attempt3_patch.py
          git commit -m "WP-S002-004-005 band-limit relief and refine shorelines [agent1-wp15-attempt3]"
          git push origin HEAD:agent1/wp-s002-004-005-uv-final2
