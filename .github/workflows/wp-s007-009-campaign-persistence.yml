name: WP-S007-009 Campaign Persistence Evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wp-s007-009-campaign-persistence.yml
      - scripts/world/campaign-persistence.js
      - scripts/world/world-state.js
      - scripts/world/lazy-catchup.js
      - scripts/core/event-scheduler.js
      - scripts/core/seed.js
      - scripts/core/game-time.js
      - tools/tests/wp-s007-009-campaign-persistence.test.js
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  evidence:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/wp-s007-009-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          node --check scripts/world/campaign-persistence.js
          node --check scripts/world/world-state.js
          node --check scripts/world/lazy-catchup.js
          node --check tools/tests/wp-s007-009-campaign-persistence.test.js

      - name: Versioned save load deterministic resume acceptance
        run: node tools/tests/wp-s007-009-campaign-persistence.test.js

      - name: Comment run link on Issue
        if: github.event_name == 'issue_comment' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `WP-S007-009 evidence completed. [Open workflow run](${url}).`
                : `WP-S007-009 evidence FAILED. [Open workflow run and logs](${url}).`
            });
