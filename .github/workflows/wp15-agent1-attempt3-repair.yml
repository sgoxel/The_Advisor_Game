name: WP15 AGENT1 attempt3 repair

on:
  push:
    branches:
      - agent1/wp-s002-004-005-uv-final2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-uv-final2
          fetch-depth: 0
      - name: Apply bounded visual repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hydro = Path('src/hydrology.ts')
          text = hydro.read_text()
          replacements = [
            (
              '''      0.1 * Math.sin(angle * 3 + lake.phase) +\n      0.06 * Math.sin(angle * 5 - lake.phase * 0.61) +\n      0.035 * Math.cos(angle * 7 + lake.phase * 1.37);''',
              '''      0.14 * Math.sin(angle * 3 + lake.phase) +\n      0.075 * Math.sin(angle * 5 - lake.phase * 0.61) +\n      0.045 * Math.cos(angle * 7 + lake.phase * 1.37);'''
            ),
            (
              '''      Math.sin(p.lon * 1489 + p.lat * 1777 + phase[0]) * 0.24,\n      Math.cos(p.lon * 2333 - p.lat * 1597 + phase[1]) * 0.2,\n      Math.sin(p.lon * 3761 + p.lat * 2903 + phase[2]) * 0.18,\n      Math.cos(p.lon * 5147 - p.lat * 4099 + phase[3]) * 0.15,\n      Math.sin(p.lon * 7481 + p.lat * 6211 + phase[4]) * 0.13,\n      Math.cos(p.lon * 10009 - p.lat * 8011 + phase[5]) * 0.1,''',
              '''      Math.sin(p.lon * 97 + p.lat * 131 + phase[0]) * 0.24,\n      Math.cos(p.lon * 149 - p.lat * 113 + phase[1]) * 0.2,\n      Math.sin(p.lon * 211 + p.lat * 167 + phase[2]) * 0.18,\n      Math.cos(p.lon * 269 - p.lat * 197 + phase[3]) * 0.15,\n      Math.sin(p.lon * 337 + p.lat * 251 + phase[4]) * 0.13,\n      Math.cos(p.lon * 389 - p.lat * 307 + phase[5]) * 0.1,'''
            ),
            (
              '    localRelief = fine * Math.min(155, macro.reliefM * 0.3) * mountainWeight,',
              '    localRelief = fine * Math.min(92, macro.reliefM * 0.2) * mountainWeight,'
            ),
            (
              '''      const lakeIndex = Math.min(points.length - 2, 6),\n        lakePoint = points[lakeIndex],\n        lake =''',
              '''      const lakeIndex = Math.min(points.length - 3, 6),\n        lakePoint = points[lakeIndex],\n        lakeBefore = points[Math.max(0, lakeIndex - 1)],\n        lakeAfter = points[Math.min(points.length - 1, lakeIndex + 1)],\n        lakeFlowX = wrapSourceX(lakeAfter.x - lakeBefore.x),\n        lakeFlowZ = lakeAfter.z - lakeBefore.z,\n        lakeFlowAngle = Math.atan2(lakeFlowZ, lakeFlowX),\n        lake ='''
            ),
            (
              '                radius: 64 + addressed(`${key}/lake-radius`) * 96,',
              '                radius: 84 + addressed(`${key}/lake-radius`) * 116,'
            ),
            (
              '                elongation: 0.12 + addressed(`${key}/lake-elongation`) * 0.28,\n                rotation: addressed(`${key}/lake-rotation`) * Math.PI * 2,',
              '                elongation: 0.3 + addressed(`${key}/lake-elongation`) * 0.26,\n                rotation:\n                  lakeFlowAngle + (addressed(`${key}/lake-rotation`) - 0.5) * 0.44,'
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'missing hydrology replacement: {old[:80]!r}')
            text = text.replace(old, new, 1)
          hydro.write_text(text)

          terrain = Path('src/terrain-refine.ts')
          text = terrain.read_text()
          old = '''    targetResolution = coastal\n      ? tile.size <= 512\n        ? 72\n        : 64'''
          new = '''    targetResolution = coastal\n      ? tile.size <= 512\n        ? 112\n        : 96'''
          if old not in text:
            raise SystemExit('missing coastal targetResolution block')
          text = text.replace(old, new, 1)
          terrain.write_text(text)

          evidence = Path('docs/evidence/WP-S002-004-005.md')
          text = evidence.read_text().rstrip() + '''\n\n## AGENT #1 continuation — attempt 2 result (2026-10-10)\n\nEvaluated exact head: `d5f485fa42fd1d9af54ede196c6212db719d186f`.\n\n- Exact-head unit/build gate passed: 116/116 tests and production build.\n- Fresh dual-renderer gallery run `38038624871` completed on desktop and phone. WebGL2 artifact `11665012803`; WebGPU artifact `11664668576`. Both artifact sets were actually inspected.\n- VISUAL: **6/10 — FAIL**. Renderer parity, river curvature and Street-scale cliff shading improved, but the Province mountain target retained a conspicuous repeated spike/lattice texture, the seeded lake read as a bulb with artificial straight joins, and the river outlet still met a visibly stair-stepped coast.\n- Capture-step duration was about 8m51s for WebGL2 and 11m13s for WebGPU. The global density rollback removed the attempt-1 all-tile increase, but WebGPU gallery cost remains a performance concern.\n\n## AGENT #1 continuation — attempt 3/3 candidate (2026-10-10)\n\nThe final bounded visual repair low-passes the canonical sub-kilometre mountain spectrum so Province sampling cannot alias it into a lattice, reduces its amplitude while preserving macro mountain authority, aligns/elongates irregular seeded lakes to their canonical river flow, and spends additional mesh resolution only on tiles that actually straddle a macro shoreline. No camera, renderer, timing or load-order input is introduced. Exact-head functional/browser gates and fresh WebGPU/WebGL2 desktop+phone screenshots must pass before merge.\n'''
          evidence.write_text(text)
          PY

          rm .github/workflows/wp15-agent1-attempt3-repair.yml
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/hydrology.ts src/terrain-refine.ts docs/evidence/WP-S002-004-005.md .github/workflows/wp15-agent1-attempt3-repair.yml
          git commit -m "WP-S002-004-005 final visual repair [agent1-attempt3]"
          git push origin HEAD:agent1/wp-s002-004-005-uv-final2
