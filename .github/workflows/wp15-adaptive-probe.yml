name: WP15 adaptive probe
on:
  push:
    branches: [agent1/wp-s003-003-001-diagnostic2]
    paths:
      - ".github/workflows/wp15-adaptive-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s003-003-001-diagnostic2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export production repair for this diagnostic process only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/village-routes.ts')
          s=p.read_text()
          old='function repairViaPoliticalTopology(from: Place, to: Place): RouteResult | undefined {'
          new='export function __wp15RepairViaPoliticalTopology(from: Place, to: Place): RouteResult | undefined {'
          if old not in s: raise SystemExit('repair function marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - run: node --experimental-strip-types tools/wp15-actual-political-probe.ts
