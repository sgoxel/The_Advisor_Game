name: AGENT1 WP24 integrate
on:
  push:
    branches: [agent1/wp-s004-002-001-20261015]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'integrate critical sites into final surface') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s004-002-001-20261015
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/apply_wp24_patch.mjs
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/world.ts src/sites.ts index.html
          git commit -m "feat(s004): integrate critical sites into final surface"
          git push origin HEAD:agent1/wp-s004-002-001-20261015
