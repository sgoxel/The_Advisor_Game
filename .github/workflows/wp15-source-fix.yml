name: WP15 legality correction

on:
  push:
    branches:
      - agent1/wp-s002-004-005-final

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout WP branch
        uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-final
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply deterministic legality patch
        run: python tools/wp15_apply_legality.py
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit validated correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          rm .github/workflows/wp15-source-fix.yml tools/wp15_apply_legality.py
          git add src/geography.ts src/world.ts tests/world.test.ts tests/climate.test.ts .github/workflows/wp15-source-fix.yml tools/wp15_apply_legality.py
          git commit -m "WP-S002-004-005 enforce dry settlement connectors"
          git push origin HEAD:agent1/wp-s002-004-005-final
