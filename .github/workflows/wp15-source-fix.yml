name: WP15 settlement surface legality fix

on:
  push:
    branches:
      - agent1/wp-s002-004-005-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply authoritative placement legality
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/world.ts')
          text = p.read_text()
          old = '''    if (heightAt(x, z) < 0.2) return;
              features.push({
                kind,
                x,
                z,
                y: heightAt(x, z),
                variant,
                code: `${WORLD_SEED}/${GENERATOR_VERSION}/F/${id}`,
              });'''
          if old not in text:
              old = '''    if (heightAt(x, z) < 0.2) return;
              features.push({
                kind,
                x,
                z,
                y: heightAt(x, z),
                variant,
                code: `${WORLD_SEED}/${GENERATOR_VERSION}/F/${id}`,
              });'''.replace('              ', '')
          new = '''    const surface = surfaceAt(x, z);
              if (surface.water !== "none" || surface.cliff || surface.elevation < 0.2) return;
              features.push({
                kind,
                x,
                z,
                y: surface.elevation,
                variant,
                code: `${WORLD_SEED}/${GENERATOR_VERSION}/F/${id}`,
              });'''.replace('              ', '')
          assert old in text, 'world feature legality block not found'
          p.write_text(text.replace(old, new, 1))

          p = Path('src/geography.ts')
          text = p.read_text()
          start = text.index('function locallyDrySettlementSite(')
          end = text.index('/**\n * Country anchors', start)
          new_guard = '''function locallyDrySettlementSite(
            position: LonLat,
            maxReliefM: number,
            coreRadius: number,
          ) {
            const macro = macroSampleAt(position);
            if (!macro.land || macro.reliefM > maxReliefM) return false;
            if (macro.coastDistanceRad * SOURCE_PRESENTATION_RADIUS < 42) return false;
            const { x, z } = lonLatToSource(position.lon, position.lat),
              diagonal = coreRadius * Math.SQRT1_2,
              offsets = [
                [0, 0],
                [coreRadius, 0],
                [-coreRadius, 0],
                [0, coreRadius],
                [0, -coreRadius],
                [diagonal, diagonal],
                [diagonal, -diagonal],
                [-diagonal, diagonal],
                [-diagonal, -diagonal],
              ] as const;
            for (const [dx, dz] of offsets) {
              const surface = naturalSurfaceAt(x + dx, z + dz);
              if (surface.water !== "none" || surface.cliff) return false;
            }
            return true;
          }

          '''
          # Dedent the TypeScript block to column zero.
          import textwrap
          new_guard = textwrap.dedent(new_guard)
          text = text[:start] + new_guard + text[end:]
          text = text.replace('!locallyDrySettlementSite(candidate, 90)', '!locallyDrySettlementSite(candidate, 90, 80)', 1)
          text = text.replace('!locallyDrySettlementSite(candidate, 95)', '!locallyDrySettlementSite(candidate, 95, 72)', 1)
          p.write_text(text)

          p = Path('tests/world.test.ts')
          text = p.read_text()
          assert 'assert.equal(WORLD_FOUNDATION_VERSION, "v4");' in text
          p.write_text(text.replace('assert.equal(WORLD_FOUNDATION_VERSION, "v4");', 'assert.equal(WORLD_FOUNDATION_VERSION, "v5");', 1))
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          rm .github/workflows/wp15-source-fix.yml
          git add src/world.ts src/geography.ts tests/world.test.ts .github/workflows/wp15-source-fix.yml
          git commit -m "WP-S002-004-005 enforce settlement feature surface legality"
          git push origin HEAD:agent1/wp-s002-004-005-final
