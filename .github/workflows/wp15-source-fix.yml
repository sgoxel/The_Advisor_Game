name: WP15 settlement surface legality fix

on:
  push:
    branches:
      - agent1/wp-s002-004-005-final
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply authoritative placement and road legality
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          p = Path('src/world.ts')
          text = p.read_text()
          old = '''    if (heightAt(x, z) < 0.2) return;
    features.push({
      kind,
      x,
      z,
      y: heightAt(x, z),
      variant,
      code: `${WORLD_SEED}/${GENERATOR_VERSION}/F/${id}`,
    });'''
          new = '''    const surface = surfaceAt(x, z);
    if (surface.water !== "none" || surface.cliff || surface.elevation < 0.2) return;
    features.push({
      kind,
      x,
      z,
      y: surface.elevation,
      variant,
      code: `${WORLD_SEED}/${GENERATOR_VERSION}/F/${id}`,
    });'''
          assert old in text, 'world feature legality block not found'
          p.write_text(text.replace(old, new, 1))

          p = Path('src/geography.ts')
          text = p.read_text()
          start = text.index('function locallyDrySettlementSite(')
          comment_start = text.rfind('/**', 0, start)
          if comment_start < 0:
              comment_start = start
          end = text.index('/**\n * Country anchors', start)
          new_guard = textwrap.dedent('''
          /**
           * Canonical settlement-site guard against the natural hydrology authority.
           * Political ownership remains independent; nine deterministic core probes
           * prevent later settlement earthworks from hiding water or cliff hazards.
           */
          function locallyDrySettlementSite(
            position: LonLat,
            maxReliefM: number,
            coreRadius: number,
          ) {
            const macro = macroSampleAt(position);
            if (!macro.land || macro.reliefM > maxReliefM) return false;
            if (macro.coastDistanceRad * SOURCE_PRESENTATION_RADIUS < 42) return false;
            const { x, z } = lonLatToSource(position.lon, position.lat),
              diagonal = coreRadius * Math.SQRT1_2,
              offsets = [
                [0, 0],
                [coreRadius, 0],
                [-coreRadius, 0],
                [0, coreRadius],
                [0, -coreRadius],
                [diagonal, diagonal],
                [diagonal, -diagonal],
                [-diagonal, diagonal],
                [-diagonal, -diagonal],
              ] as const;
            for (const [dx, dz] of offsets) {
              const surface = naturalSurfaceAt(x + dx, z + dz);
              if (surface.water !== "none" || surface.cliff) return false;
            }
            return true;
          }

          ''').lstrip()
          text = text[:comment_start] + new_guard + text[end:]
          text = text.replace('!locallyDrySettlementSite(candidate, 90)', '!locallyDrySettlementSite(candidate, 90, 80)', 1)
          text = text.replace('!locallyDrySettlementSite(candidate, 95)', '!locallyDrySettlementSite(candidate, 95, 72)', 1)
          p.write_text(text)

          p = Path('src/surface.ts')
          text = p.read_text()
          elevation_start = text.index('export function surfaceElevationAt(')
          surface_comment = text.index('/** One canonical final-surface query', elevation_start)
          new_elevation = textwrap.dedent('''
          export function surfaceElevationAt(x: number, z: number) {
            const natural = hydrologySurfaceAt(x, z),
              road = roadAt(x, z);
            if (natural.water !== "none" && !road) return natural.elevation;
            const earthwork = earthworkAt(x, z);
            return lerp(earthwork.target, natural.elevation, earthwork.blend);
          }

          ''')
          text = text[:elevation_start] + new_elevation + text[surface_comment:]
          surface_start = text.index('export function surfaceAt(')
          new_surface = textwrap.dedent('''
          export function surfaceAt(x: number, z: number): SurfaceSample {
            const natural = hydrologySurfaceAt(x, z),
              road = roadAt(x, z),
              roadCorridor = Boolean(road),
              earthwork = natural.water === "none" || roadCorridor ? earthworkAt(x, z) : null,
              water = roadCorridor ? "none" : natural.water,
              graded = Boolean(earthwork && earthwork.blend < 0.999 && water === "none"),
              elevation =
                water === "none" && earthwork
                  ? lerp(earthwork.target, natural.elevation, earthwork.blend)
                  : hydrologyElevationAt(x, z),
              slope = graded ? Math.min(natural.slope, 0.2) : natural.slope,
              cliff = water === "none" && !graded && natural.cliff,
              traversal: TraversalKind =
                water !== "none"
                  ? "blocked-water"
                  : cliff
                    ? "blocked-cliff"
                    : slope >= 0.42
                      ? "difficult"
                      : "walkable";
            return {
              ...natural,
              elevation,
              water,
              slope,
              cliff,
              traversal,
              walkable: traversal === "walkable" || traversal === "difficult",
              riverBank: roadCorridor ? false : natural.riverBank,
            };
          }
          ''')
          text = text[:surface_start] + new_surface
          p.write_text(text)

          for filename in ['tests/world.test.ts', 'tests/climate.test.ts']:
              p = Path(filename)
              text = p.read_text()
              text = text.replace('WORLD_FOUNDATION_VERSION, "v4"', 'WORLD_FOUNDATION_VERSION, "v5"')
              text = text.replace('${WORLD_SEED}/v4/CLIMATE', '${WORLD_SEED}/v5/CLIMATE')
              p.write_text(text)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit validated correction and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          rm .github/workflows/wp15-source-fix.yml
          git add src/world.ts src/geography.ts src/surface.ts tests/world.test.ts tests/climate.test.ts .github/workflows/wp15-source-fix.yml
          git commit -m "WP-S002-004-005 enforce final surface legality"
          git push origin HEAD:agent1/wp-s002-004-005-final
