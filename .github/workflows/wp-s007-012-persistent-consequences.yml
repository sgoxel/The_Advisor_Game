name: WP-S007-012 Persistent Consequences Evidence

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  evidence:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/wp-s007-012-evidence'))
    strategy:
      fail-fast: false
      matrix:
        profile: [landscape, portrait]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Syntax
        run: |
          node --check scripts/world/persistent-consequences.js
          node --check tools/tests/wp-s007-012-persistent-consequences.test.js
      - name: Deterministic persistence and recovery proof
        run: node tools/tests/wp-s007-012-persistent-consequences.test.js
      - name: Start local game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          sleep 1
      - name: Capture persistent consequence states
        env:
          TARGET: http://127.0.0.1:8000/
          PROFILE: ${{ matrix.profile }}
        run: python tools/wp_s007_012_evidence.py
      - name: Upload evidence
        if: always() && hashFiles('tools/screenshots/wp-s007-012/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wp-s007-012-${{ matrix.profile }}-${{ github.run_id }}
          path: tools/screenshots/wp-s007-012/
          if-no-files-found: error
          retention-days: 14
      - name: Comment run link on Issue
        if: github.event_name == 'issue_comment' && always() && matrix.profile == 'landscape'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `WP-S007-012 evidence completed. [Open workflow run and artifacts](${url}).`
                : `WP-S007-012 evidence FAILED. [Open workflow run and logs](${url}).`
            });
