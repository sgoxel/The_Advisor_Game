name: Agent6 WP006 Attempt3 Ownership Patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp006-attempt3-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp006-attempt3-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch undersized focus terrain ownership
        run: |
          python tools/agent6_wp006_attempt3_patch.py
          node --check scripts/world/planet-stage.js
          git diff --check
      - name: Commit WP-006 final visual correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world/planet-stage.js
          if git diff --cached --quiet; then
            echo "WP-006 ownership patch already current"
            exit 0
          fi
          git commit -m "fix(WP-S003-010-003-006): gate undersized focus terrain"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
