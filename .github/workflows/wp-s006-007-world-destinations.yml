name: WP-S006-007 World Destinations Evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wp-s006-007-world-destinations.yml
      - scripts/world/world-destinations.js
      - scripts/world/world-field.js
      - scripts/world/planet-stage.js
      - scripts/world/geography.js
      - scripts/world/planet-geography.js
      - scripts/world/political-geography.js
      - scripts/world/region-profile.js
      - scripts/world/settlement-archetypes.js
      - tools/tests/wp-s006-007-world-destinations.test.js
      - index.html
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  evidence:
    if: >-
      github.event_name != 'issue_comment' ||
      (!github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/wp-s006-007-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax
        run: |
          node --check scripts/world/world-destinations.js
          node --check scripts/world/world-field.js
          node --check scripts/world/planet-stage.js
          node --check tools/tests/wp-s006-007-world-destinations.test.js

      - name: Deterministic destination queries
        run: node tools/tests/wp-s006-007-world-destinations.test.js

      - name: Comment run link on Issue
        if: github.event_name == 'issue_comment' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `WP-S006-007 evidence completed. [Open workflow run](${url}).`
                : `WP-S006-007 evidence FAILED. [Open workflow run and logs](${url}).`
            });
