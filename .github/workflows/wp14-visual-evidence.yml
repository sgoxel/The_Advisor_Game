name: WP14 biome visual evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture WP-S002-004-004 biome evidence
        run: |
          python -m pip install playwright==1.63.0
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          BIOME_STEPS='eval:window.__climateTargets=Array.from({length:72},(_,y)=>Array.from({length:144},(_,x)=>({lon:(x*2.5-178.75)*Math.PI/180,lat:(y*2.5-88.75)*Math.PI/180}))).flat().concat(window.advisorWorld.geography.mountainSystems.flatMap(m=>[m.center,...m.path])).reduce((a,p)=>(c=>a[c.terrainClass]?a:Object.assign(a,{[c.terrainClass]:p}))(window.advisorWorld.planet.climateSampleAt(p)),{});click:#overview;eval:window.advisorWorld.navigation.setFocus(0,Math.PI/2);settle;shot:north-pole-realm;eval:window.advisorWorld.navigation.setFocus(0,-Math.PI/2);settle;shot:south-pole-realm;eval:window.advisorWorld.setHalfHeight(1800);eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets.grassland);settle;shot:grassland;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets.desert);settle;shot:desert;eval:window.advisorWorld.setHalfHeight(700);eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets.beach);settle;shot:beach;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets.cliff);settle;shot:cliff;eval:window.advisorWorld.setHalfHeight(120);eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets["conifer-forest"]);settle;shot:conifer-forest-close;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets["temperate-forest"]);settle;shot:temperate-forest-close;eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets["dry-woodland"]);settle;shot:dry-woodland-close;eval:window.advisorWorld.setHalfHeight(360);eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))(window.__climateTargets["snowy-mountain"]);settle;shot:snowy-mountain;eval:window.advisorWorld.setHalfHeight(180);eval:(p=>window.advisorWorld.navigation.setFocus(p.lon,p.lat))((window.__climateTargets["polar-ice"]||window.__climateTargets.tundra||window.__climateTargets["sea-ice"]));settle;shot:frozen-local'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp14-biomes-webgl2 --name biomes --profile desktop,phone --renderer webgl2 --timeout 420 --steps "$BIOME_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp14-biomes-webgpu --name biomes --profile desktop,phone --renderer webgpu --timeout 420 --steps "$BIOME_STEPS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp14-biome-visual-evidence
          path: test-results/wp14-biomes-*
