name: Texture Quality Evidence

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: texture-quality-evidence-${{ github.repository }}
  cancel-in-progress: false

jobs:
  compare:
    if: >-
      !github.event.issue.pull_request &&
      (github.actor == github.repository_owner || contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association)) &&
      startsWith(github.event.comment.body, '/texture-quality-evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements.txt
      - name: Start local game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          sleep 1
      - name: Compare texture quality profiles
        run: python tools/texture_quality_compare.py http://127.0.0.1:8000/
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-quality-comparison-${{ github.run_id }}
          path: tools/screenshots/
          retention-days: 14
      - name: Comment result
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`Texture quality comparison completed. [Open workflow run and artifact](${url}).`});
