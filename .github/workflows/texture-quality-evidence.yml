name: Texture Quality Evidence

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: texture-quality-evidence-${{ github.repository }}
  cancel-in-progress: false

jobs:
  compare:
    if: >-
      !github.event.issue.pull_request &&
      (github.actor == github.repository_owner || contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association)) &&
      startsWith(github.event.comment.body, '/texture-quality-evidence')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements.txt
      - name: Start local game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          sleep 1
      - name: Compare texture quality profiles
        run: python tools/texture_quality_compare.py http://127.0.0.1:8000/
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texture-quality-comparison-${{ github.run_id }}
          path: tools/screenshots/
          retention-days: 14
      - name: Comment result
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = JSON.parse(fs.readFileSync('tools/screenshots/texture-quality-comparison.json','utf8'));
            const lines = report.profiles.map(p => `| ${p.profile} | ${p.resolution}px | ${p.budgetMB} | ${p.activeTextureCount} | ${p.estimatedLoadedTextureMB} | ${p.budgetUtilization} | ${p.drawCalls ?? 'N/A'} | ${p.frameMs ?? 'N/A'} | ${p.materialCount ?? 'N/A'} | ${p.shaderVariants ?? 'N/A'} |`);
            const body = `Texture quality comparison completed. Simulation identity preserved: **${report.simulationIdentityPreserved ? 'YES' : 'NO'}**.\n\n| Profile | Resolution | Budget MB | Active textures | Est. loaded MB | Budget utilization | Draw calls | Frame ms | Materials | Shader variants |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n${lines.join('\n')}\n\n[Open workflow run and screenshots](${url}). Metrics unavailable from the current renderer are reported as N/A rather than invented.`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
