name: WP-S008-001 Sentence Library

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/world/sentence-library.js"
      - "scripts/tests/wp-s008-001-sentence-library.test.js"
      - ".github/workflows/wp-s008-001-sentence-library.yml"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
      - "index.html"

permissions:
  contents: read
  issues: write

jobs:
  deterministic-sentence-library:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run WP-S008-001 deterministic evidence
        run: node scripts/tests/wp-s008-001-sentence-library.test.js
      - name: Verify exact Sentence Library deployed to GitHub Pages
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          for attempt in $(seq 1 24); do
            bust="${GITHUB_SHA}-${attempt}"
            curl -fsSL "${BASE}/scripts/world/sentence-library.js?rev=${bust}" -o /tmp/live-sentence-library.js || true
            curl -fsSL "${BASE}/index.html?rev=${bust}" -o /tmp/live-index.html || true
            module_ok=0
            index_ok=0
            grep -q 'LIBRARY_VERSION="advisor-sentence-library-v1"' /tmp/live-sentence-library.js 2>/dev/null && module_ok=1 || true
            grep -q 'scripts/world/sentence-library.js?v=sentence-library-v1' /tmp/live-index.html 2>/dev/null && index_ok=1 || true
            if [ "${module_ok}" -eq 1 ] && [ "${index_ok}" -eq 1 ]; then
              echo "GitHub Pages exposes the WP-S008-001 production module on attempt ${attempt}."
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not expose the WP-S008-001 production markers in time." >&2
          exit 1
      - name: Comment exact run on Issue 178
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const sha = context.sha;
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `AGENT #6 WP-S008-001 exact-head workflow: **${status.toUpperCase()}**`,
              `Commit: \`${sha}\``,
              `Run: ${url}`,
              status === 'success'
                ? 'Deterministic Sentence Library evidence passed and the exact production module/index markers were verified on GitHub Pages.'
                : 'Workflow or GitHub Pages deployment verification failed; WP remains incomplete.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 178,
              body
            });
