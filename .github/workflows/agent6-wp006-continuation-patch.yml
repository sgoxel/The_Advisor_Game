name: Agent6 WP006 Continuation Patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp006-continuation-patch.yml"
      - "tools/agent6_wp006_continuation_patch.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp006-continuation-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply WP006 viewport-safe ownership fix
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python tools/agent6_wp006_continuation_patch.py
          node --check scripts/world/planet-stage.js
          python -m py_compile tools/screenshot_tool.py
          git checkout -- tools/__pycache__/screenshot_tool.cpython-312.pyc 2>/dev/null || true
          rm -f tools/__pycache__/screenshot_tool.cpython-311.pyc
          git diff --check
      - name: Commit tested runtime and evidence patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+sgoxel@users.noreply.github.com"
          git add scripts/world/planet-stage.js tools/screenshot_tool.py
          if git diff --cached --quiet; then
            echo "WP006 viewport-safe patch already current"
            exit 0
          fi
          git commit -m "fix(WP-S003-010-003-006): make fine owner viewport-safe"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
