name: AGENT1 S006 real bridge resident probe
on:
  push:
    branches: ["agent1/s006-physical-bridge-journey-20261026"]
    paths:
      - "tools/s006-bridge-journey-probe.ts"
      - ".github/workflows/agent1-s006-bridge-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-resident-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bound genuine same-SEED resident bridge work/home route check
        run: timeout --signal=TERM --kill-after=10s 8m node --experimental-strip-types tools/s006-bridge-journey-probe.ts
