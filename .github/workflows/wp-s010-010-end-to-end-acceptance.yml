name: WP-S010-010 End-to-End Acceptance
on:
  push:
    branches: [main]
    paths:
      - "scripts/world/local-conversation-router.js"
      - "scripts/world/command-set-interface.js"
      - "scripts/world/protagonist-command-evaluator.js"
      - "scripts/world/protagonist-action-runtime.js"
      - "scripts/world/protagonist-journey.js"
      - "scripts/world/protagonist-interaction-pipeline.js"
      - "scripts/world/conversation-transactions.js"
      - "scripts/world/object-interactions.js"
      - "scripts/world/action-executor.js"
      - "scripts/ui/advisor-conversation-ui.js"
      - "scripts/ui/protagonist-activity-ui.js"
      - "scripts/tests/wp-s010-010-end-to-end-acceptance.test.js"
      - "tools/wp_s010_010_evidence.py"
      - ".github/workflows/wp-s010-010-end-to-end-acceptance.yml"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wp-s010-010-${{ github.sha }}
  cancel-in-progress: false

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: End-to-end acceptance chain
        run: |
          node --check scripts/tests/wp-s010-010-end-to-end-acceptance.test.js
          node scripts/tests/wp-s010-010-end-to-end-acceptance.test.js
      - name: Stage 8/10 authority regressions
        run: |
          node scripts/tests/wp-s008-003-local-conversation-router.test.js
          node scripts/tests/wp-s008-005-protagonist-command-evaluator.test.js
          node scripts/tests/wp-s008-006-conversation-transactions.test.js
          node scripts/tests/wp-s008-007-advisor-chat-ui.test.js
          node scripts/tests/wp-s010-001-protagonist-action-runtime.test.js
          node scripts/tests/wp-s010-002-protagonist-journey.test.js
          node scripts/tests/wp-s010-003-protagonist-interaction-pipeline.test.js
          node scripts/tests/wp-s010-009-protagonist-activity-ui.test.js

  visual:
    needs: functional
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m http.server 8000 --bind 127.0.0.1 >/tmp/wp-s010-010-http.log 2>&1 &
      - name: Capture authoritative phone + desktop acceptance evidence
        env: {TARGET: "http://127.0.0.1:8000/", OUT: "tools/screenshots/wp-s010-010"}
        run: python tools/wp_s010_010_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-s010-010-acceptance-${{ github.sha }}
          path: tools/screenshots/wp-s010-010/
          if-no-files-found: error
          retention-days: 14
      - name: Verify exact acceptance package is live on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="in-progress"; grep -q 'WP-S010-010.*COMPLETED' docs/ROADMAP.md && MODE="completed" || true
          for attempt in $(seq 1 72); do
            curl -fsSL --max-time 20 "$BASE/scripts/tests/wp-s010-010-end-to-end-acceptance.test.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-test.js || true
            curl -fsSL --max-time 20 "$BASE/tools/wp_s010_010_evidence.py?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-evidence.py || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product=0; state=0
            grep -q 'WP-S010-010' /tmp/live-test.js 2>/dev/null && grep -q 'authoritative phone + desktop' .github/workflows/wp-s010-010-end-to-end-acceptance.yml 2>/dev/null && grep -q 'WP-S010-010' /tmp/live-evidence.py 2>/dev/null && product=1 || true
            if [ "$MODE" = completed ]; then grep -q 'WP-S010-010.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state=1 || true; else grep -q 'WP-S010-010.*IN PROGRESS' /tmp/live-roadmap.md 2>/dev/null && state=1 || true; fi
            [ "$product" -eq 1 ] && [ "$state" -eq 1 ] && exit 0
            sleep 5
          done
          exit 1
      - name: Comment exact run on Issue 213
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body='AGENT #6 WP-S010-010 exact-head workflow: **${{ job.status }}**\nCommit: '+context.sha+'\nRun: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId+'\nEnd-to-end authority regressions, fresh phone/desktop authoritative-result screenshots, and public Pages verification were attempted.';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:213,body});
