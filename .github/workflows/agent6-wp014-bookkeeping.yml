name: Agent6 WP014 Bookkeeping

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp014-bookkeeping.yml"

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update incomplete WP bookkeeping
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '- `WP-S003-010-003-014` — Physical-Scale Semantic Layer Ladder + Stable Label/Border/Route Decluttering\n'
          new = '- `WP-S003-010-003-014` — Physical-Scale Semantic Layer Ladder + Stable Label/Border/Route Decluttering — IN PROGRESS\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('WP-S003-010-003-014 roadmap line not found in expected state')
          roadmap.write_text(text, encoding='utf-8')

          changelog = Path('docs/changelog.txt')
          marker = '2026-10-03 09:48 +03:00 | AGENT #6 | WP-S003-010-003-014 | MIXED INCOMPLETE'
          entry = marker + ' — Reopened semantic-readiness continuation exhausted the three-attempt cap. Attempts 1/2 confirmed ready-LOD semantic ownership and no premature local-layer leakage, but visual evidence remained below the 8/10 gate. Final exact-head run 37103826388 on b8fda81b13999e0bb5f15a1fd0f0670ceab6bbc8 produced artifact 11268005182 (sha256:45d1e3293d7fa6083db13f08190e8e73646b6283974e315fc33d6fd2b4647edc); both fresh frames were directly inspected at VISUAL 7.3/10. During the smooth ground request the ready COUNTRY / REGION parent remained visible while the scale strip advertised 1/50 → 1/10000, exposing the reopened requested-scale/ready-representation mismatch, and the normal handoff did not reach a fully ready ground state within 180 seconds. Evidence-tooling head b8fda81b13999e0bb5f15a1fd0f0670ceab6bbc8 deployed successfully via Pages run 37103825688. WP remains IN PROGRESS and Issue #169 remains open.\n'
          cur = changelog.read_text(encoding='utf-8')
          if marker not in cur:
              changelog.write_text(entry + cur, encoding='utf-8')

          suggest = Path('docs/suggest_log.txt')
          smarker = '2026-10-03 09:48 +03:00 | WP-S003-010-003-014 | Phase semantic-readiness-continuation-3 | FUTURE'
          sentry = smarker + ' — Preserve canonical focus, deterministic SEED authority, ready-visible semantic ownership, and the proven no-local-layer-leak policy. In the next claim, make the scale strip describe the ready visible representation while a finer child is preparing instead of presenting the requested 1/10000 target as current visual scale; if the requested target must remain visible, separate it explicitly from the ready/current semantic state. Also isolate why the normal smooth COUNTRY / REGION → GROUND request does not converge to zero pending preparation with matching requested/active signatures inside the evidence gate. Revalidate ready-parent visibility, ground completion, return-to-broad cleanup, same-label arrow suppression, and fresh visual quality >=8/10 before changing completion state. Do not implement unless explicitly requested.\n'
          scur = suggest.read_text(encoding='utf-8')
          if smarker not in scur:
              suggest.write_text(sentry + scur, encoding='utf-8')
          PY
          git rm .github/workflows/agent6-wp014-bookkeeping.yml
          git add docs/ROADMAP.md docs/changelog.txt docs/suggest_log.txt
          git commit -m 'docs(WP-S003-010-003-014): record incomplete semantic readiness run'
          git pull --rebase origin main
          git push origin HEAD:main
