name: WP19 AGENT1 preflight
on:
  push:
    branches: [agent1/wp-s002-004-009-living-settlements]
permissions:
  contents: read
concurrency:
  group: wp19-agent1-preflight
  cancel-in-progress: true
jobs:
  unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: WP19 settlement authority tests
        run: node --experimental-strip-types --test tests/settlements.test.ts
      - run: npm test
      - run: npm run build
