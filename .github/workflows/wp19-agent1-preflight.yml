name: WP19 AGENT1 preflight
on:
  push:
    branches: [agent1/wp-s002-004-009-living-settlements]
permissions:
  contents: read
concurrency:
  group: wp19-agent1-preflight
  cancel-in-progress: true
jobs:
  unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: WP19 settlement authority tests
        run: node --experimental-strip-types --test tests/settlements.test.ts
      - name: Full regression suite
        id: regression
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee full-test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Production build
        id: build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp19-preflight-${{ github.sha }}
          path: |
            full-test.log
            build.log
      - name: Enforce preflight result
        if: always()
        run: |
          test "${{ steps.regression.outputs.exit_code }}" = "0"
          test "${{ steps.build.outputs.exit_code }}" = "0"
