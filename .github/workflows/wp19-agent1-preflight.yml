name: WP19 AGENT1 preflight
on:
  push:
    branches: [agent1/wp-s002-004-009-living-settlements]
permissions:
  contents: read
concurrency:
  group: wp19-agent1-preflight
  cancel-in-progress: true
jobs:
  unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: WP19 settlement authority tests
        run: node --experimental-strip-types --test tests/settlements.test.ts
      - name: Full regression suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee full-test.log
      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp19-preflight-${{ github.sha }}
          path: |
            full-test.log
            build.log
