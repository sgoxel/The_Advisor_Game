name: Planner 151 Post-152 TODO Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/planner-151-post152-todo.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark verified visual foundation complete and phase gate ready
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path = Path('TODO.json')
          text = path.read_text(encoding='utf-8')
          json.loads(text)
          old_task = '    {"id":"R02-T33","order":32,"title":"Define original seinen-inspired old-school PC RPG art direction foundation","status":"ready","depends_on":["R02-T19","R02-T26"],"github_issue":152,"role_owner":"Designer role","issue_state":"open_ready_unclaimed","admin_issue":150,"planner_issue":151},'
          new_task = '    {"id":"R02-T33","order":32,"title":"Define original seinen-inspired old-school PC RPG art direction foundation","status":"completed","depends_on":["R02-T19","R02-T26"],"github_issue":152,"role_owner":"Designer role","issue_state":"closed_completed","admin_issue":150,"planner_issue":151,"independent_test":{"result":"PASS","worker":"Worker #6","tested_ref":"b430a4c4194d2c67e8b73141842005187916775e","comment":5458286875}},'
          old_gate = '    {"id":"R02-T11","order":33,"title":"Authoritative unbounded hierarchical living world and campaign state phase gate","status":"blocked","depends_on":["R02-T01","R02-T02","R02-T03","R02-T04","R02-T05","R02-T06","R02-T07","R02-T08","R02-T09","R02-T10","R02-T12","R02-T13","R02-T14","R02-T15","R02-T16","R02-T17","R02-T18","R02-T19","R02-T20","R02-T21","R02-T22","R02-T23","R02-T24","R02-T25","R02-T26","R02-T27","R02-T28","R02-T29","R02-T30","R02-T31","R02-T32","R02-T33"],"github_issue":93,"role_owner":"Tester role","issue_state":"open_blocked"}'
          new_gate = '    {"id":"R02-T11","order":33,"title":"Authoritative unbounded hierarchical living world and campaign state phase gate","status":"ready","depends_on":["R02-T01","R02-T02","R02-T03","R02-T04","R02-T05","R02-T06","R02-T07","R02-T08","R02-T09","R02-T10","R02-T12","R02-T13","R02-T14","R02-T15","R02-T16","R02-T17","R02-T18","R02-T19","R02-T20","R02-T21","R02-T22","R02-T23","R02-T24","R02-T25","R02-T26","R02-T27","R02-T28","R02-T29","R02-T30","R02-T31","R02-T32","R02-T33"],"github_issue":93,"role_owner":"Tester role","issue_state":"open_ready_unclaimed"}'
          if text.count(old_task) != 1 or text.count(old_gate) != 1:
              raise SystemExit('TODO no longer matches expected post-#151/pre-#152-PASS state; refusing stale overwrite.')
          text = text.replace(old_task, new_task, 1).replace(old_gate, new_gate, 1)
          parsed = json.loads(text)
          task = next(t for t in parsed['tasks'] if t['id'] == 'R02-T33')
          gate = next(t for t in parsed['tasks'] if t['id'] == 'R02-T11')
          assert task['status'] == 'completed' and gate['status'] == 'ready'
          assert parsed['active_phase_id'] == 'R02'
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "The Advisor Game Worker"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add TODO.json
          git diff --cached --quiet && { echo 'No TODO change produced'; exit 1; }
          git commit -m "Record verified R02 art direction and reopen phase gate (#151)"
          git push origin HEAD:main
