name: R03 World Action Resolution Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/action_legality.js'
      - 'js/interaction_target.js'
      - 'js/spatial_action_legality.js'
      - 'js/interaction_validation.js'
      - 'js/world_action_resolution.js'
      - 'js/state.js'
      - 'js/campaign_persistence.js'
      - 'tests/browser/r03-world-action-resolution.spec.mjs'
      - 'tests/browser/r03-interaction-validation.spec.mjs'
      - 'tests/browser/r03-spatial-action-legality.spec.mjs'
      - 'tests/browser/r02-world-delta-persistence.spec.mjs'
      - 'tests/browser/r02-authoritative-state.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r03-world-action-resolution-verification.yml'
  pull_request:
    paths:
      - 'js/action_legality.js'
      - 'js/interaction_target.js'
      - 'js/spatial_action_legality.js'
      - 'js/interaction_validation.js'
      - 'js/world_action_resolution.js'
      - 'js/state.js'
      - 'js/campaign_persistence.js'
      - 'tests/browser/r03-world-action-resolution.spec.mjs'
      - 'tests/browser/r03-interaction-validation.spec.mjs'
      - 'tests/browser/r03-spatial-action-legality.spec.mjs'
      - 'tests/browser/r02-world-delta-persistence.spec.mjs'
      - 'tests/browser/r02-authoritative-state.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r03-world-action-resolution-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-action-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: echo "R03-T06 candidate ${GITHUB_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused R03 authoritative world-resolution checks
        run: npx playwright test tests/browser/r03-world-action-resolution.spec.mjs
      - name: Preserve R03 interaction validation
        run: npx playwright test tests/browser/r03-interaction-validation.spec.mjs
      - name: Preserve R03 spatial action legality
        run: npx playwright test tests/browser/r03-spatial-action-legality.spec.mjs
      - name: Preserve authoritative state and world-delta persistence
        run: >-
          npx playwright test
          tests/browser/r02-authoritative-state.spec.mjs
          tests/browser/r02-world-delta-persistence.spec.mjs
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03-t06-world-action-resolution-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
