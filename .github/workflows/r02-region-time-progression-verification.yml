name: R02 Region Time Progression Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/region_time_progression.js'
      - 'js/relevance_bounded_compute.js'
      - 'js/political_geography.js'
      - 'js/settlement_evolution.js'
      - 'js/utils.js'
      - 'tests/browser/r02-region-time-progression.spec.mjs'
      - 'tests/browser/r02-region-time-relevance-integration.spec.mjs'
      - '.github/workflows/r02-region-time-progression-verification.yml'
  pull_request:
    paths:
      - 'js/region_time_progression.js'
      - 'js/relevance_bounded_compute.js'
      - 'js/political_geography.js'
      - 'js/settlement_evolution.js'
      - 'js/utils.js'
      - 'tests/browser/r02-region-time-progression.spec.mjs'
      - 'tests/browser/r02-region-time-relevance-integration.spec.mjs'
      - '.github/workflows/r02-region-time-progression-verification.yml'

permissions:
  contents: read

jobs:
  region-time-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run active/off-screen progression regression
        run: npx playwright test tests/browser/r02-region-time-progression.spec.mjs
      - name: Run relevance-bounded integration regression
        run: npx playwright test tests/browser/r02-region-time-relevance-integration.spec.mjs --project=desktop
      - name: Re-run relevance-bounded scheduling regression
        run: npx playwright test tests/browser/r02-relevance-bounded-compute.spec.mjs --project=desktop
      - name: Re-run political geography regression
        run: npx playwright test tests/browser/r02-political-geography.spec.mjs
      - name: Re-run settlement evolution regression
        run: npx playwright test tests/browser/r02-settlement-evolution.spec.mjs
      - name: Re-run authoritative game-time regression
        run: npx playwright test tests/browser/r02-game-time.spec.mjs
      - name: Re-run world-delta persistence regression
        run: npx playwright test tests/browser/r02-world-delta-persistence.spec.mjs
      - name: Run stabilized R01 browser regression
        run: npm run test:browser:r01
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r02-t22-region-time-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
