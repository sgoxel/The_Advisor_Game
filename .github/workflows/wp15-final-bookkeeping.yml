name: WP15 failed acceptance bookkeeping

on:
  push:
    branches:
      - agent1/wp-s002-004-005-uv-final2

permissions:
  contents: write

jobs:
  bookkeeping:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-uv-final2
          fetch-depth: 0
      - name: Record failed acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text()
          old = '- WP-S002-004-005 — Natural terrain/hydrology/traversal authority: distributed freshwater, drainage-valid rivers/lakes, canonical walkability, surface-safe earthworks and bounded seam-safe generation'
          new = old + ' — INCOMPLETE (final evaluation failed)'
          if old in text and new not in text:
              text = text.replace(old, new, 1)
          roadmap.write_text(text)

          evidence = Path('docs/evidence/WP-S002-004-005.md')
          text = evidence.read_text().rstrip()
          marker = '## AGENT #1 continuation — attempt 3/3 final result (2026-10-10)'
          if marker not in text:
              text += '''\n\n## AGENT #1 continuation — attempt 2 result (2026-10-10)\n\nEvaluated exact head: `d5f485fa42fd1d9af54ede196c6212db719d186f`.\n\n- Exact-head unit/build gate passed 116/116 tests and the production build.\n- Fresh dual-renderer gallery run `38038624871` completed on desktop and phone. WebGL2 artifact `11665012803` and WebGPU artifact `11664668576` were both actually inspected.\n- VISUAL: **6/10 — FAIL**. Renderer parity, river curvature and Street-scale cliff shading improved, but the Province mountain target retained a conspicuous repeated spike/lattice texture, the seeded lake read as a bulb with artificial straight joins, and the river outlet still met a visibly stair-stepped coast.\n- Capture-step duration was about 8m51s for WebGL2 and 11m13s for WebGPU. The global density rollback removed the attempt-1 all-tile increase, but WebGPU gallery cost remained a performance concern.\n\n## AGENT #1 continuation — attempt 3/3 final result (2026-10-10)\n\nEvaluated clean branch runtime head `6afb229e58967a396cc527fe0919f97f9240f138` through PR merge ref `bf95b729221e207b2e39ec400398654cff950d46`.\n\n- General validation run `38040684288`, job `114180146773`: **115/116 tests passed**. The binding `tests/hydrology.test.ts` regression failed because the seeded mountain systems exposed no canonical cliff sample. The all-neighbour routing proof and terrain-influenced-route regression passed on this head; build/browser stages were skipped only because `npm test` failed.\n- Fresh visual run `38040684299`: WebGL2 artifact `11666231834` and WebGPU artifact `11665568289`. Both complete desktop+phone galleries were retrieved and actually inspected.\n- VISUAL: **5/10 — FAIL**. Backend parity is good and the previous Province lattice is removed, but the repair over-corrected the mountain presentation into an almost flat/unreadable Province target. The Street cliff remains a pronounced stair-step terrace, the lake still has bulb-like geometry with artificial straight joins, and the river outlet coast remains visibly stepped.\n- Result: the three AGENT #1 continuation improvement/evaluation attempts are exhausted. No fourth runtime repair or test weakening is permitted in this run. The WP remains **OPEN / INCOMPLETE**, PR #67 remains open and unmerged, no deployment was performed, and Issue #15 must remain open.\n'''
          evidence.write_text(text + '\n')

          changelog = Path('docs/changelog.txt')
          text = changelog.read_text()
          text = text.replace('Issue #15 stays open.2026-10-10', 'Issue #15 stays open.\n2026-10-10')
          entry = '2026-10-10 12:33 Europe/Istanbul — WP-S002-004-005, AGENT #1 continuation final evaluation (MIXED): Exact runtime head 6afb229e58967a396cc527fe0919f97f9240f138 failed acceptance. Validation run 38040684288 passed 115/116 tests; hydrology failed because seeded mountain systems exposed no canonical cliff sample. Fresh run 38040684299 produced complete WebGPU/WebGL2 desktop+phone artifacts 11665568289/11666231834, both actually inspected: VISUAL 5/10; the lattice was removed but Province mountain relief became unreadable/flat, the Street cliff remained stair-stepped, lake joins artificial and outlet coast stepped. Continuation attempts 1–3 are exhausted. WP remains INCOMPLETE, unmerged and undeployed; PR #67 and Issue #15 remain open.'
          if entry not in text:
              text = text.rstrip() + '\n' + entry + '\n'
          changelog.write_text(text)
          PY

          rm .github/workflows/wp15-final-bookkeeping.yml
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add docs/ROADMAP.md docs/evidence/WP-S002-004-005.md docs/changelog.txt .github/workflows/wp15-final-bookkeeping.yml
          git commit -m "WP-S002-004-005 record failed final acceptance"
          git push origin HEAD:agent1/wp-s002-004-005-uv-final2
