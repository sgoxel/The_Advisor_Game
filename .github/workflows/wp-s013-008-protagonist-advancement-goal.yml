# WP-S013-008 exact-head gate — autonomous advancement selection
name: WP-S013-008 Autonomous Advancement Selection
on:
  push:
    branches: [main]
    paths:
      - "scripts/world/protagonist-advancement-goal.js"
      - "scripts/tests/wp-s013-008-protagonist-advancement-goal.test.js"
      - ".github/workflows/wp-s013-008-protagonist-advancement-goal.yml"
      - "scripts/world/protagonist-profile.js"
      - "scripts/world/protagonist-needs.js"
      - "scripts/world/protagonist-health.js"
      - "scripts/world/protagonist-goals.js"
      - "scripts/world/protagonist-authority.js"
      - "scripts/world/social-state.js"
      - "scripts/world/protagonist-employment.js"
      - "scripts/world/protagonist-wealth.js"
      - "scripts/world/protagonist-action-runtime.js"
      - "scripts/world/protagonist-command-evaluator.js"
      - "scripts/world/protagonist-interaction-pipeline.js"
      - "scripts/world/command-set-interface.js"
      - "index.html"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Autonomous advancement selector evidence
        run: node scripts/tests/wp-s013-008-protagonist-advancement-goal.test.js
      - name: Evaluator, runtime, authority and employment regressions
        run: |
          node scripts/tests/wp-s008-005-protagonist-command-evaluator.test.js
          node scripts/tests/wp-s009-006-protagonist-authority.test.js
          node scripts/tests/wp-s010-001-protagonist-action-runtime.test.js
          node scripts/tests/wp-s012-003-protagonist-employment.test.js
      - name: Verify exact product is live on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="product"
          if grep -q 'WP-S013-008.*COMPLETED' docs/ROADMAP.md; then
            MODE="completed"
          elif grep -q 'WP-S013-008.*FUNCTIONAL accepted' docs/ROADMAP.md; then
            MODE="accepted"
          fi
          for attempt in $(seq 1 120); do
            curl -fsSL --max-time 20 "$BASE/scripts/world/protagonist-advancement-goal.js?sha=$GITHUB_SHA&try=$attempt" -o /tmp/live-advancement.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=$GITHUB_SHA&try=$attempt" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=$GITHUB_SHA&try=$attempt" -o /tmp/live-roadmap.md || true
            product_ok=0; state_ok=0
            grep -q 'VERSION="protagonist-advancement-goal-v1"' /tmp/live-advancement.js 2>/dev/null && grep -q 'scripts/world/protagonist-advancement-goal.js?v=protagonist-advancement-goal-v1' /tmp/live-index.html 2>/dev/null && product_ok=1 || true
            if [ "$MODE" = "completed" ]; then
              grep -q 'WP-S013-008.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state_ok=1 || true
            elif [ "$MODE" = "accepted" ]; then
              grep -q 'WP-S013-008.*FUNCTIONAL accepted' /tmp/live-roadmap.md 2>/dev/null && state_ok=1 || true
            else
              state_ok=1
            fi
            if [ "$product_ok" -eq 1 ] && [ "$state_ok" -eq 1 ]; then echo "GitHub Pages exposes WP-S013-008 mode=$MODE for commit $GITHUB_SHA"; exit 0; fi
            sleep 5
          done
          echo "GitHub Pages did not expose expected WP-S013-008 $MODE markers in time." >&2
          exit 1
      - name: Comment exact run on Issue 271
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}', sha = context.sha, url = 'https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId;
            const body = ['AGENT #6 WP-S013-008 exact-head workflow: **'+status.toUpperCase()+'**','Commit: '+sha,'Run: '+url,status==='success'?'Deterministic pursue/defer/reject/maintain selection, Stage 1–12-only live reads, invalid/prerequisite guards, bounded work, Runtime -> Evaluator -> Simulation terminal handoff, regressions, and GitHub Pages verification passed. VISUAL: N/A — no rendered surface introduced.':'Workflow, regression, or GitHub Pages verification failed; WP remains incomplete.'].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:271,body});
