name: WP19 source reconciliation macOS
on:
  push:
    branches: [agent1/wp-s002-004-009-20261011]
    paths:
      - .github/workflows/wp19-reconcile-macos.yml
permissions:
  contents: write
concurrency:
  group: wp19-source-reconcile-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reconcile:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-009-20261011
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/wp19_integrate.py
      - run: git diff --check
      - name: Commit reconciled source
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source reconciliation changes required.'
            exit 0
          fi
          git config user.name 'AGENT #1'
          git config user.email '163722426+sgoxel@users.noreply.github.com'
          git add src/world.ts
          git commit -m 'WP-S002-004-009: reconcile global road walkability'
          git push origin HEAD:agent1/wp-s002-004-009-20261011
