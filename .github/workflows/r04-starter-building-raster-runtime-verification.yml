name: R04 Starter Building Raster Runtime Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/starter_village_exteriors.js'
      - 'js/tile_registry.js'
      - 'textures/tiles/building/**'
      - 'tests/browser/r04-starter-building-raster-runtime.spec.mjs'
      - '.github/workflows/r04-starter-building-raster-runtime-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify semantic starter-building raster runtime
        run: npx playwright test tests/browser/r04-starter-building-raster-runtime.spec.mjs
