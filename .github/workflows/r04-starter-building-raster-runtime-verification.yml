name: R04 Starter Building Raster Runtime Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/starter_village_exteriors.js'
      - 'js/tile_registry.js'
      - 'textures/tiles/building/**'
      - 'tests/browser/r04-starter-building-raster-runtime.spec.mjs'
      - '.github/workflows/r04-starter-building-raster-runtime-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify semantic starter-building raster runtime
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/r04-starter-building-raster-runtime-diagnostics
          npx playwright test tests/browser/r04-starter-building-raster-runtime.spec.mjs --reporter=line 2>&1 \
            | tee test-results/r04-starter-building-raster-runtime-diagnostics/output.log
      - name: Prepare exact-SHA diagnostic evidence
        if: always()
        shell: bash
        run: |
          mkdir -p r04-starter-building-raster-runtime-evidence
          printf 'candidate=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > r04-starter-building-raster-runtime-evidence/candidate.txt
          if [ -f test-results/r04-starter-building-raster-runtime-diagnostics/output.log ]; then
            cp test-results/r04-starter-building-raster-runtime-diagnostics/output.log \
              r04-starter-building-raster-runtime-evidence/output.log
          else
            printf 'Focused raster-runtime output.log was not produced.\n' \
              > r04-starter-building-raster-runtime-evidence/diagnostic-missing.txt
          fi
      - name: Preserve focused raster-runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-starter-building-raster-runtime-diagnostics-${{ github.sha }}
          path: r04-starter-building-raster-runtime-evidence
          if-no-files-found: error
          retention-days: 14
