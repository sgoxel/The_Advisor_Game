name: Agent6 WP018 Bookkeeping

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent6-wp018-bookkeeping.yml

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record capped WP result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "AGENT #6"
          git config user.email "163722426+sgoxel@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '- `WP-S003-010-003-018` — Continuous Pure Zoom Interpolation + Input/Focus Stability'
          new = old + ' — IN PROGRESS'
          if new not in text:
              if old not in text:
                  raise SystemExit('WP-018 roadmap anchor missing')
              text = text.replace(old, new, 1)
              roadmap.write_text(text, encoding='utf-8')

          changelog = Path('docs/changelog.txt')
          marker = '2026-10-03 15:40 +03:00 | AGENT #6 | WP-S003-010-003-018 | MIXED INCOMPLETE'
          entry = (
              marker + ' — Three-attempt continuation cap reached. Attempts 1/2 (runs 37123157814 and 37123298879) exposed evidence-harness patching defects before product acceptance. Final Attempt 3 on exact head d22d92bdd11a217415d39a67057d9605c0aabc85 reached the actual game in run 37123404418; artifact 11274267724 (sha256:3dcda05a3d0ca818f9450377a7d23a9621e25b61ff0a33f0dc7399f91723bf7d) confirmed the player-facing display ladder is exactly the canonical README 10 labels while the 19-point ladder remains internal interpolation telemetry, and completed wheel/retarget proofs preserved fixed canonical/screen focus with 0 px reported maximum focus drift. Acceptance then failed because forward 1/250 did not settle within the 25-second transition gate. All six fresh 1280x800 screenshots were directly inspected; VISUAL 6.5/10 FAIL because broad-map presentation remains extremely sparse/near-black and the 1/15 frame visibly clips the WESTMARCH CONTINENT label at the right viewport edge. Phone-orientation evidence was not reached. WP remains IN PROGRESS and Issue #173 remains open.\n'
          )
          ctext = changelog.read_text(encoding='utf-8')
          if marker not in ctext:
              changelog.write_text(entry + ctext, encoding='utf-8')

          suggest = Path('docs/suggest_log.txt')
          smarker = '2026-10-03 15:40 +03:00 | WP-S003-010-003-018 | Phase reopened-continuous-zoom-continuation-3'
          sentry = (
              smarker + ' | FUTURE — Preserve the exact canonical 10-label player-facing scale ladder, the internal-only interpolation milestones, deterministic SEED authority, fixed canonical/screen focus, and same-task no-teleport semantics. In the next claim, isolate why forward interpolation/readiness does not converge at 1/250 by tracing requested/visible detail ownership, pending preparation, readiness caps, and animation velocity through the 1/100→1/250 approach without weakening ready-before-swap behavior. After convergence is corrected, address broad-map label edge clipping and sparse presentation, then require complete desktop plus phone-orientation fresh evidence with VISUAL >=8/10 before changing completion state. Do not implement unless explicitly requested.\n'
          )
          stext = suggest.read_text(encoding='utf-8')
          if smarker not in stext:
              suggest.write_text(sentry + stext, encoding='utf-8')
          PY

            git add docs/ROADMAP.md docs/changelog.txt docs/suggest_log.txt
            if git diff --cached --quiet; then
              echo "Bookkeeping already present on main."
              exit 0
            fi
            git commit -m "docs(WP-S003-010-003-018): record capped acceptance"
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Could not publish bookkeeping after three current-main retries."
          exit 1
