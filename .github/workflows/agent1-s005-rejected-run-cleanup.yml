name: Close rejected S005 candidate evidence
on:
  push:
    branches: [agent1/s005-canonical-road-walkability-20261023]
    paths: [.github/workflows/agent1-s005-rejected-run-cleanup.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Cancel only obsolete closed PR 314 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 40006790054 40006790151; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/cancel" --silent || echo "Run ${run} already terminal"
          done
