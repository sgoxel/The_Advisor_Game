name: AGENT1 WP-S004 exact-head acceptance
on:
  push:
    branches: [agent1/wp-s004-001-001-20261015]
    paths:
      - .github/workflows/agent1-wp-s004-final-acceptance.yml
concurrency:
  group: agent1-wp-s004-final-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s004-001-001-20261015
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify exact settlement integration
        run: |
          grep -q '/EXTERIOR/WATER-MORPH' src/settlement-exterior.ts
          grep -q 'function settlementStreetAt' src/world.ts
          grep -q 'nearbyPlaces, places' src/world.ts
          grep -q 'boxYaw' src/geometry.ts
          grep -q 'field-form base must survive' tests/world.test.ts
      - run: npm ci
      - name: Full deterministic unit suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: WebGPU browser gate
        run: xvfb-run -a npm run test:webgpu
      - name: WebGL2 fallback browser gate
        run: xvfb-run -a npx playwright test --config playwright.fallback.config.js
      - name: Navigation browser gate
        run: xvfb-run -a npx playwright test --config playwright.navigation.config.js
      - name: Capture fresh WP-S004 MIXED evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python -m pip install playwright==1.63.0 pillow
          npm run dev -- --port 4174 > /tmp/wp-s004-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done

          DESKTOP='eval:Promise.all([import("/src/geography.ts"),import("/src/settlement-exterior.ts"),import("/src/world.ts"),import("/src/planet.ts")]).then(([g,s,w,p])=>{window.__sg={g,s,w,p};window.__samples={};for(const a of ["green","roadside","riverside","dispersed-farming"]){const v=g.villages.find(v=>s.settlementExteriorFor(v).archetype===a);if(!v)throw new Error("missing archetype "+a);window.__samples[a]={v,plan:s.settlementExteriorFor(v)}};const cv=g.cities.find(v=>["market-trade","fortified-frontier"].includes(s.settlementExteriorFor(v).archetype))||g.cities[0];window.__samples.city={v:cv,plan:s.settlementExteriorFor(cv)};window.__service=(sample,name)=>{const plot=sample.plan.plots.find(q=>q.service===name);if(!plot)throw new Error("missing service plot "+name);for(const c of plot.candidates){const t=w.tileForPosition(c.x,c.z,15),f=w.featuresFor(t).find(f=>f.service===name&&f.code.includes(sample.v.id));if(f)return f}throw new Error("unresolved service "+name)};window.__focus=(x,z,h)=>{const ll=p.sourceToLonLat(x,z);window.advisorWorld.navigation.setFocus(ll.lon,ll.lat);window.advisorWorld.setHalfHeight(h)}});eval:(x=>window.__focus(x.v.x,x.v.z,125))(window.__samples.green);settle;shot:village-green;eval:(x=>window.__focus(x.v.x,x.v.z,125))(window.__samples.roadside);settle;shot:village-roadside;eval:(x=>window.__focus(x.v.x,x.v.z,130))(window.__samples.riverside);settle;shot:village-riverside;eval:(x=>window.__focus(x.v.x,x.v.z,145))(window.__samples["dispersed-farming"]);settle;shot:village-farming;eval:(x=>window.__focus(x.v.x,x.v.z,430))(window.__samples.city);settle;shot:city-district;eval:(f=>window.__focus(f.x,f.z,46))(window.__service(window.__samples.green,"market"));settle;shot:market-close;eval:(f=>window.__focus(f.x,f.z,42))(window.__service(window.__samples.green,"blacksmith"));settle;shot:blacksmith-close;eval:(f=>window.__focus(f.x,f.z,52))(window.__service(window.__samples["dispersed-farming"],"farmstead"));settle;shot:farmstead-close'
          PHONE='eval:Promise.all([import("/src/geography.ts"),import("/src/settlement-exterior.ts"),import("/src/world.ts"),import("/src/planet.ts")]).then(([g,s,w,p])=>{const find=a=>{const v=g.villages.find(v=>s.settlementExteriorFor(v).archetype===a);return {v,plan:s.settlementExteriorFor(v)}};window.__m=find("green");window.__r=find("riverside");window.__svc=name=>{const plot=window.__m.plan.plots.find(q=>q.service===name);for(const c of plot.candidates){const f=w.featuresFor(w.tileForPosition(c.x,c.z,15)).find(f=>f.service===name&&f.code.includes(window.__m.v.id));if(f)return f}throw new Error("unresolved "+name)};window.__focus=(x,z,h)=>{const ll=p.sourceToLonLat(x,z);window.advisorWorld.navigation.setFocus(ll.lon,ll.lat);window.advisorWorld.setHalfHeight(h)}});eval:window.__focus(window.__m.v.x,window.__m.v.z,130);settle;shot:village-mobile;eval:window.__focus(window.__r.v.x,window.__r.v.z,135);settle;shot:riverside-mobile;eval:(f=>window.__focus(f.x,f.z,45))(window.__svc("market"));settle;shot:market-mobile;eval:(f=>window.__focus(f.x,f.z,42))(window.__svc("blacksmith"));settle;shot:blacksmith-mobile'

          for R in webgpu webgl2; do
            python tools/screenshot_tool.py http://127.0.0.1:4174/ --out "test-results/wp-s004-${R}-desktop" --name settlement --profile desktop --renderer "$R" --timeout 360 --steps "$DESKTOP"
            python tools/screenshot_tool.py http://127.0.0.1:4174/ --out "test-results/wp-s004-${R}-mobile" --name settlement --profile phone,phone-landscape --renderer "$R" --timeout 360 --steps "$PHONE"
          done

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import math, os
          files=sorted(Path('test-results').glob('wp-s004-*/*.png'))
          if not files:
              raise SystemExit('no WP-S004 screenshots captured')
          source=os.environ['SOURCE_SHA']; W,H=1600,1120; font=ImageFont.load_default(); pages=[]
          for page_index in range(math.ceil(len(files)/4)):
              page=Image.new('RGB',(W,H),'white'); draw=ImageDraw.Draw(page)
              draw.text((20,12),f'WP-S004-001-001 fresh evidence · exact head {source} · page {page_index+1}',fill='black',font=font)
              for slot,file in enumerate(files[page_index*4:(page_index+1)*4]):
                  image=Image.open(file).convert('RGB'); image.thumbnail((780,480))
                  col,row=slot%2,slot//2; x,y=10+col*795,50+row*530
                  draw.text((x,y),str(file.relative_to('test-results')),fill='black',font=font)
                  page.paste(image,(x,y+24))
              pages.append(page)
          out=Path('tmp/wp-s004-evidence'); out.mkdir(parents=True,exist_ok=True)
          pdf=out/f'evidence-{source}.pdf'
          pages[0].save(pdf,save_all=True,append_images=pages[1:],resolution=110)
          print(pdf)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wp-s004-exact-head-${{ github.sha }}
          path: test-results/
      - name: Publish evidence contact sheet for inspection
        run: |
          git config user.name "AGENT #1"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/wp-s004-evidence/*.pdf
          git commit -m "WP-S004-001-001: publish fresh exact-head visual evidence"
          git push origin HEAD:agent1/wp-s004-001-001-20261015
