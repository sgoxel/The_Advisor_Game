name: AGENT1 WP-S004 exact-head acceptance
on:
  push:
    branches: [agent1/wp-s004-001-001-20261015]
    paths:
      - .github/workflows/agent1-wp-s004-final-acceptance.yml
      - src/**
      - tests/**
      - tools/agent1-wp-s004-evidence.sh
      - package.json
  workflow_dispatch:
concurrency:
  group: agent1-wp-s004-final-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify exact settlement integration
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '/EXTERIOR/WATER-MORPH' src/settlement-exterior-core.ts
          grep -q '"merchant"' src/settlement-exterior.ts
          grep -q '"headman"' src/settlement-exterior.ts
          grep -q '"garden"' src/settlement-exterior.ts
          grep -q 'function settlementStreetAt' src/world.ts
          grep -q '"roadside-tree"' src/world.ts
          grep -q '"pavement"' src/world.ts
          grep -q 'nearbyPlaces, places' src/world.ts
          grep -q 'boxYaw' src/geometry.ts
          grep -q 'field-form base must survive' tests/wp-s004-world-integration.test.ts
      - run: npm ci
      - name: Full deterministic unit suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: WebGPU browser gate
        run: xvfb-run -a npm run test:webgpu
      - name: WebGL2 fallback browser gate
        run: xvfb-run -a npx playwright test --config playwright.fallback.config.js
      - name: Navigation browser gate
        run: xvfb-run -a npx playwright test --config playwright.navigation.config.js
      - name: Capture fresh WP-S004 MIXED evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: bash tools/agent1-wp-s004-evidence.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wp-s004-exact-head-${{ github.sha }}
          path: test-results/

