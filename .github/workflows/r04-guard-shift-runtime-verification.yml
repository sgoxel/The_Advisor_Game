name: R04 Guard Shift Runtime Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/guard_shift_runtime.js'
      - 'js/guard_duty_anchors.js'
      - 'js/npc_spatial_runtime.js'
      - 'js/npc_indoor_work_anchors.js'
      - 'js/npc_terrain_routing_bridge.js'
      - 'tests/browser/r04-guard-shift-runtime.spec.mjs'
      - '.github/workflows/r04-guard-shift-runtime-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r04-guard-shift-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record exact candidate
        run: |
          echo "candidate=${GITHUB_SHA}"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify authoritative guard shift rotation
        run: npx playwright test tests/browser/r04-guard-shift-runtime.spec.mjs --project=desktop
      - name: Preserve deterministic guard-duty anchor foundation
        run: npx playwright test tests/browser/r04-guard-duty-anchors.spec.mjs --project=desktop
      - name: Preserve stabilized R01 browser compatibility
        run: npx playwright test tests/browser/r01-cumulative.spec.mjs --project=desktop
      - name: Prepare exact-SHA evidence
        if: always()
        run: |
          mkdir -p r04-guard-shift-runtime-evidence
          printf 'candidate=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > r04-guard-shift-runtime-evidence/candidate.txt
          if [ -d playwright-report ]; then cp -R playwright-report r04-guard-shift-runtime-evidence/; fi
          if [ -d test-results ]; then cp -R test-results r04-guard-shift-runtime-evidence/; fi
      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-guard-shift-runtime-${{ github.sha }}
          path: r04-guard-shift-runtime-evidence
          if-no-files-found: error
          retention-days: 14
