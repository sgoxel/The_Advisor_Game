name: WP19 temporary performance diagnostic
on:
  push:
    branches: [agent1/wp-s002-004-009-living-settlements]
    paths: [.github/workflows/wp19-perf-diagnostic.yml]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types tools/wp19_perf.ts
