name: AGENT1 WP15 bridge patch
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent1/wp-s003-003-001-natural-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s003-003-001-natural-authority
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply legal crossing composition
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/world.ts')
          s=p.read_text()
          s=s.replace('import { naturalSurfaceAt } from "./hydrology.ts";', 'import { freshwaterCrossingSpanMAt, naturalSurfaceAt } from "./hydrology.ts";')
          old='''      representativeCreek = representativeCreekAt(x, z),\n      bridge =\n        road.code === REPRESENTATIVE_BRIDGE_ROAD.code &&\n        base.water.kind === "river" &&\n        representativeCreek.wet &&\n        REPRESENTATIVE_BRIDGE_SPAN_M <= RURAL_BRIDGE_MAX_LENGTH_M &&\n        distance <= 5;'''
          new='''      representativeCreek = representativeCreekAt(x, z),\n      naturalSpanM = freshwaterCrossingSpanMAt(x, z),\n      crossingSpanM = representativeCreek.wet ? REPRESENTATIVE_BRIDGE_SPAN_M : naturalSpanM,\n      bridge =\n        base.water.kind === "river" &&\n        crossingSpanM > 0 &&\n        crossingSpanM <= RURAL_BRIDGE_MAX_LENGTH_M &&\n        distance <= 5;'''
          if old not in s:
              raise RuntimeError('road bridge block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "GPT-5.6 Sol (AGENT #1)"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/world.ts
          git commit -m "WP-S003-003-001 compose legal bounded river bridges"
          git push origin HEAD:agent1/wp-s003-003-001-natural-authority
