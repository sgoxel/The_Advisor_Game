name: Remove NVIDIA Auxiliary Pipeline Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-nvidia-auxiliary-once.yml'

permissions:
  contents: write
  issues: write

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main safely
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove retired auxiliary pipeline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          BASE_SHA="$(git rev-parse HEAD)"
          git config user.name "ChatGPT Admin Maintenance"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          printf '%s' '' | base64 -d > /tmp/remove_nvidia.py
          python /tmp/remove_nvidia.py
          if git grep -n -E 'NVIDIA|Nemotron|AI_AUXILIARY|ai-ready|ai-running|ai-awaiting-review|ai-handoff|ai-role-(coder|reviewer|tester)|opencode-nvidia|target-specific auxiliary reservation|auxiliary AI evidence' -- ':!backup/**'; then
            echo "Retired process markers still exist in tracked repository content." >&2
            exit 1
          fi
          remote_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_head" != "$BASE_SHA" ]; then
            echo "Collision: main advanced during cleanup; refusing to overwrite newer work." >&2
            exit 1
          fi
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "Admin #310: remove NVIDIA/Nemotron auxiliary pipeline"
          git push origin HEAD:main
      - name: Remove obsolete auxiliary labels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for label in ai-ready ai-role-coder ai-role-reviewer ai-role-tester ai-running work-claimed ai-awaiting-review ai-handoff; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/labels/${label}" >/dev/null 2>&1 || true
          done
