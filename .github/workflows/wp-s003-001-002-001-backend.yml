name: WP-S003-001-002-001 Backend Evidence

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wp-s003-001-002-001-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  evidence:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.issue.pull_request &&
       github.event.issue.number == 298 &&
       (github.event.comment.user.login == github.repository_owner ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       startsWith(github.event.comment.body, '/wp-s003-001-002-001-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact head and syntax
        env:
          WP_EVIDENCE_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$WP_EVIDENCE_HEAD"
          node --check scripts/world/planet-stage.js
          node --check scripts/render/renderer-bootstrap.js
          node --check scripts/render/playcanvas/app.js
          python -m py_compile tools/wp_s003_001_002_001_evidence.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Verify browser
        run: |
          google-chrome --version || google-chrome-stable --version || chromium --version
          command -v xvfb-run

      - name: Start local game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-backend-http.log 2>&1 &
          echo $! >/tmp/advisor-backend-http.pid
          sleep 1

      - name: Run deterministic backend comparison
        env:
          WP_EVIDENCE_HEAD: ${{ github.sha }}
        run: xvfb-run -a python tools/wp_s003_001_002_001_evidence.py http://127.0.0.1:8000/ tools/wp_s003_001_002_001_artifact

      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-001-002-001-backend-evidence
          path: tools/wp_s003_001_002_001_artifact
          if-no-files-found: error
          retention-days: 14

      - name: Comment success
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'WP-S003-001-002-001 backend evidence completed. Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })

      - name: Comment failure
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'WP-S003-001-002-001 backend evidence FAILED. Run/logs: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })
