# one-use corrected exact-head verification; remove after acceptance
name: WP-S009-006 Protagonist Authority Exact Head Rerun

on:
  push:
    branches: [main]
    paths:
      - "scripts/world/protagonist-authority.js"
      - "scripts/tests/wp-s009-006-protagonist-authority.test.js"
      - ".github/workflows/wp-s009-006-protagonist-authority-rerun.yml"
      - "scripts/world/protagonist-profile.js"
      - "scripts/world/protagonist-health.js"
      - "scripts/world/protagonist-command-evaluator.js"
      - "scripts/world/world-state.js"
      - "scripts/world/campaign-persistence.js"
      - "index.html"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Authoritative protagonist rank and role evidence
        run: node scripts/tests/wp-s009-006-protagonist-authority.test.js
      - name: Stage prerequisites and autonomy boundary regressions
        run: |
          node scripts/tests/wp-s009-001-protagonist-profile.test.js
          node scripts/tests/wp-s009-003-protagonist-goals.test.js
          node scripts/tests/wp-s009-005-protagonist-health.test.js
          node scripts/tests/wp-s008-005-protagonist-command-evaluator.test.js
          node tools/tests/wp-s007-009-campaign-persistence.test.js
      - name: Verify exact product is live on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="accepted"
          if grep -q 'WP-S009-006.*COMPLETED' docs/ROADMAP.md; then MODE="completed"; fi
          for attempt in $(seq 1 72); do
            curl -fsSL --max-time 20 "$BASE/scripts/world/protagonist-authority.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-authority.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product_ok=0
            state_ok=0
            grep -q 'VERSION="protagonist-authority-v1"' /tmp/live-authority.js 2>/dev/null && grep -q 'scripts/world/protagonist-authority.js?v=protagonist-authority-v1' /tmp/live-index.html 2>/dev/null && product_ok=1 || true
            if [ "$MODE" = "completed" ]; then
              grep -q 'WP-S009-006.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state_ok=1 || true
            else
              state_ok=1
            fi
            if [ "$product_ok" -eq 1 ] && [ "$state_ok" -eq 1 ]; then
              echo "GitHub Pages exposes WP-S009-006 mode=$MODE for commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not expose the expected WP-S009-006 $MODE markers in time." >&2
          exit 1
      - name: Comment exact run on Issue 199
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const sha = context.sha;
            const url = 'https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId;
            const body = [
              'AGENT #6 WP-S009-006 corrected exact-head workflow: **'+status.toUpperCase()+'**',
              'Commit: '+sha,
              'Run: '+url,
              status === 'success'
                ? 'Authoritative rank/role evidence, Stage prerequisite regressions, protagonist evaluator regression, campaign persistence regression, and GitHub Pages product verification passed.'
                : 'Workflow, regression, or GitHub Pages verification failed; WP remains incomplete.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 199,
              body
            });
