name: AGENT6 WP005002 Attempt3 Runtime Repair

on:
  push:
    branches: [main]
    paths:
      - tools/agent6_wp005002_attempt3_runtime_repair.py

permissions:
  contents: write

concurrency:
  group: agent6-wp005002-attempt3-runtime-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Repair ready-scale runtime expression
        run: python tools/agent6_wp005002_attempt3_runtime_repair.py

      - name: Validate runtime source
        run: |
          node --check scripts/world/planet-stage.js
          grep -F 'scaleStateForScalar(scalarForFootprintHeight(LOCAL_DETAIL_LEVELS' scripts/world/planet-stage.js
          ! grep -F 'levelNativeScalar(displayResource.levelIndex)' scripts/world/planet-stage.js

      - name: Commit runtime repair to main
        shell: bash
        run: |
          if git diff --quiet -- scripts/world/planet-stage.js; then
            echo 'Runtime repair already present.'
            exit 0
          fi
          git add scripts/world/planet-stage.js
          git commit -m 'fix(WP-S003-010-003-005-002): keep final evidence runtime executable'
          git pull --rebase origin main
          git push origin main
