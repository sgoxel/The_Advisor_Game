name: WP-S004-007 Functional

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/world/work-cycles.js
      - scripts/world/action-executor.js
      - scripts/world/resident-movement.js
      - scripts/world/planet-stage.js
      - index.html
      - tools/tests/wp-s004-007-work-cycles.test.js
      - tools/wp_s004_007_live_smoke.py
      - tools/requirements.txt
      - .github/workflows/wp-s004-007-functional.yml

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Syntax check
        run: |
          node --check scripts/world/work-cycles.js
          node --check scripts/world/action-executor.js
          node --check scripts/world/resident-movement.js
          node --check scripts/world/planet-stage.js
      - name: Work-cycle contract
        run: node tools/tests/wp-s004-007-work-cycles.test.js
      - name: Start local game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! >/tmp/advisor-http.pid
          sleep 1
      - name: Live default-seed smoke
        env:
          TARGET: http://127.0.0.1:8000/
        run: python tools/wp_s004_007_live_smoke.py
