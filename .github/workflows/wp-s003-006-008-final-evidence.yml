name: WP-S003-006-008 Final Evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wp-s003-006-008-final-evidence.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: wp-s003-006-008-final-evidence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Verify browser
        run: google-chrome --version || google-chrome-stable --version || chromium --version
      - name: Start local game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          sleep 1
      - name: Capture final WP evidence
        run: |
          python tools/screenshot_tool.py \
            http://127.0.0.1:8000/ \
            visual-wp-s003-006-008-final \
            --profile landscape \
            --scenario wp-s003-006-008 \
            --shots 11 \
            --timestamp-names \
            --wait-min 1 \
            --wait-max 1 \
            --evidence-json evidence-wp-s003-006-008-final-${GITHUB_RUN_ID}.json \
            --issue 80 \
            --no-publish
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-006-008-final-evidence-${{ github.run_id }}
          path: tools/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Report result
        if: always()
        uses: actions/github-script@v7
        env:
          RUN_STATUS: ${{ job.status }}
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = process.env.RUN_STATUS === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 80,
              body: `WP-S003-006-008 final isolated evidence **${ok ? 'PASSED' : 'FAILED'}**. [Open workflow run and artifact](${url}).`
            });
