# WP-S013-005 exact-head gate v3 — acceptance docs verification
name: WP-S013-005 Legitimate Appointment Resolution
on:
  push:
    branches: [main]
    paths:
      - "scripts/world/protagonist-appointment-resolution.js"
      - "scripts/tests/wp-s013-005-protagonist-appointment-resolution.test.js"
      - ".github/workflows/wp-s013-005-protagonist-appointment-resolution.yml"
      - "scripts/world/daily-activity.js"
      - "scripts/world/protagonist-profile.js"
      - "scripts/world/protagonist-authority.js"
      - "scripts/world/protagonist-interaction-pipeline.js"
      - "scripts/world/protagonist-employment.js"
      - "scripts/world/social-state.js"
      - "scripts/world/world-state.js"
      - "scripts/world/campaign-persistence.js"
      - "index.html"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Legitimate eligibility and appointment evidence
        run: node scripts/tests/wp-s013-005-protagonist-appointment-resolution.test.js
      - name: Authority, interaction, employment and persistence regressions
        run: |
          node scripts/tests/wp-s009-006-protagonist-authority.test.js
          node scripts/tests/wp-s010-003-protagonist-interaction-pipeline.test.js
          node scripts/tests/wp-s012-003-protagonist-employment.test.js
          node scripts/tests/wp-s012-006-protagonist-profession-opportunities.test.js
          node tools/tests/wp-s004-008-contextual-reactions.test.js
          node tools/tests/wp-s007-009-campaign-persistence.test.js
      - name: Verify exact product is live on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="product"
          if grep -q 'WP-S013-005.*COMPLETED' docs/ROADMAP.md; then
            MODE="completed"
          elif grep -q 'WP-S013-005.*FUNCTIONAL accepted' docs/ROADMAP.md; then
            MODE="accepted"
          fi
          for attempt in $(seq 1 120); do
            curl -fsSL --max-time 20 "$BASE/scripts/world/protagonist-appointment-resolution.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-appointment.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product_ok=0; state_ok=0
            grep -q 'VERSION="protagonist-appointment-resolution-v1"' /tmp/live-appointment.js 2>/dev/null && grep -q 'scripts/world/protagonist-appointment-resolution.js?v=protagonist-appointment-resolution-v1' /tmp/live-index.html 2>/dev/null && product_ok=1 || true
            if [ "$MODE" = "completed" ]; then
              grep -q 'WP-S013-005.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state_ok=1 || true
            elif [ "$MODE" = "accepted" ]; then
              grep -q 'WP-S013-005.*FUNCTIONAL accepted' /tmp/live-roadmap.md 2>/dev/null && state_ok=1 || true
            else
              state_ok=1
            fi
            if [ "$product_ok" -eq 1 ] && [ "$state_ok" -eq 1 ]; then echo "GitHub Pages exposes WP-S013-005 mode=$MODE for commit ${GITHUB_SHA}"; exit 0; fi
            sleep 5
          done
          echo "GitHub Pages did not expose expected WP-S013-005 $MODE markers in time." >&2
          exit 1
      - name: Comment exact run on Issue 268
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}', sha = context.sha, url = 'https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId;
            const body = ['AGENT #6 WP-S013-005 exact-head workflow: **'+status.toUpperCase()+'**','Commit: '+sha,'Run: '+url,status === 'success' ? 'Eligibility/appointment separation, grounded employer/institution validation, single ProtagonistAuthority transition, persistence regressions, and GitHub Pages verification passed. VISUAL: N/A — no rendered surface introduced.' : 'Workflow, regression, or GitHub Pages verification failed; WP remains incomplete.'].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:268,body});
