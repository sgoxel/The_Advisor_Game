name: R04 NPC Bubble Layout Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/npc_activity_bubble_layout.js'
      - 'js/npc_contextual_activity.js'
      - 'js/npc_runtime_bridge.js'
      - 'js/npc_spatial_runtime.js'
      - 'js/utils.js'
      - 'tests/browser/r04-npc-bubble-layout.spec.mjs'
      - 'tests/browser/r04-npc-contextual-activity.spec.mjs'
      - 'tests/browser/r04-npc-presentation-relevance.spec.mjs'
      - 'tests/browser/r04-spatial-world-100.spec.mjs'
      - '.github/workflows/r04-npc-bubble-layout-verification.yml'
  pull_request:
    paths:
      - 'js/npc_activity_bubble_layout.js'
      - 'js/npc_contextual_activity.js'
      - 'js/npc_runtime_bridge.js'
      - 'js/npc_spatial_runtime.js'
      - 'js/utils.js'
      - 'tests/browser/r04-npc-bubble-layout.spec.mjs'
      - 'tests/browser/r04-npc-contextual-activity.spec.mjs'
      - 'tests/browser/r04-npc-presentation-relevance.spec.mjs'
      - 'tests/browser/r04-spatial-world-100.spec.mjs'
      - '.github/workflows/r04-npc-bubble-layout-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npc-bubble-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4

      - name: Record exact candidate SHA
        run: git rev-parse HEAD

      - name: Validate presentation integration syntax
        run: |
          node --check js/npc_activity_bubble_layout.js
          node --check js/npc_contextual_activity.js
          node --check js/npc_runtime_bridge.js
          node --check tests/browser/r04-npc-bubble-layout.spec.mjs
          node --check tests/browser/r04-npc-contextual-activity.spec.mjs
          node --check tests/browser/r04-npc-presentation-relevance.spec.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run dense NPC bubble, relevance and contextual activity regression
        run: npx playwright test tests/browser/r04-npc-bubble-layout.spec.mjs tests/browser/r04-npc-presentation-relevance.spec.mjs tests/browser/r04-npc-contextual-activity.spec.mjs --project=desktop

      - name: Preserve collision-safe NPC occupancy and shared dialogue regression
        run: npx playwright test tests/browser/r04-spatial-world-100.spec.mjs --project=desktop

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-npc-bubble-layout-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
