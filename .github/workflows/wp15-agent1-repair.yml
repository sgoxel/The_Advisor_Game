name: WP15 AGENT1 bounded repair
on:
  push:
    branches: [agent1/wp-s002-004-005-uv-final2]
permissions:
  contents: write
concurrency:
  group: wp15-agent1-repair
  cancel-in-progress: true
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[agent1-wp15-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-uv-final2
          fetch-depth: 0
      - name: Apply bounded canonical/presentation repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          hydro_path = Path('src/hydrology.ts')
          hydro = hydro_path.read_text()
          hydro = hydro.replace(
              '    turn = (sphericalNoise(sx, z, 83 + continentId) - 0.5) * 0.82;',
              '    turn = (sphericalNoise(sx, z, 83 + continentId) - 0.5) * 1.05;',
          )
          marker = '''function blendDirection(previous: { x: number; z: number }, target: { x: number; z: number }, amount: number) {
            const x = previous.x * (1 - amount) + target.x * amount,
              z = previous.z * (1 - amount) + target.z * amount,
              length = Math.hypot(x, z) || 1;
            return { x: x / length, z: z / length };
          }'''.replace('          ', '')
          replacement = marker + '''
          function rotateDirection(direction: { x: number; z: number }, angle: number) {
            const c = Math.cos(angle),
              s = Math.sin(angle);
            return {
              x: direction.x * c - direction.z * s,
              z: direction.x * s + direction.z * c,
            };
          }
          function riverMeander(key: string, step: number) {
            const phase = addressed(`${key}/meander-phase`) * Math.PI * 2,
              amplitude = 0.105 + addressed(`${key}/meander-amplitude`) * 0.105;
            return (
              Math.sin(step * 0.39 + phase) * amplitude +
              Math.sin(step * 0.17 + phase * 1.73) * amplitude * 0.48
            );
          }'''.replace('          ', '')
          assert marker in hydro, 'blendDirection marker missing'
          hydro = hydro.replace(marker, replacement, 1)
          old = '    direction = blendDirection(direction, flowTarget(current.x, current.z, continentId), 0.38);'
          new = '''    direction = blendDirection(direction, flowTarget(current.x, current.z, continentId), 0.52);
              direction = rotateDirection(direction, riverMeander(key, RIVER_STEPS + extra) * 0.42);'''.replace('              ', '')
          assert old in hydro, 'outlet direction marker missing'
          hydro = hydro.replace(old, new, 1)
          old = '      direction = blendDirection(direction, flowTarget(x, z, macro.continentId), 0.34);'
          new = '''      direction = blendDirection(direction, flowTarget(x, z, macro.continentId), 0.4);
                direction = rotateDirection(direction, riverMeander(key, step));'''.replace('                ', '')
          assert old in hydro, 'river direction marker missing'
          hydro = hydro.replace(old, new, 1)
          old = '      const stride = RIVER_STEP * (0.9 + addressed(`${key}/stride/${step}`) * 0.2),'
          new = '      const stride = RIVER_STEP * (0.78 + addressed(`${key}/stride/${step}`) * 0.36),'
          assert old in hydro, 'stride marker missing'
          hydro = hydro.replace(old, new, 1)
          hydro_path.write_text(hydro)

          terrain_path = Path('src/terrain-refine.ts')
          terrain = terrain_path.read_text()
          assert 'type Vertex = { point: Point; tint: RGB };' in terrain
          terrain = terrain.replace(
              'type Vertex = { point: Point; tint: RGB };',
              'type Vertex = { point: Point; tint: RGB; normal?: Point };',
              1,
          )
          blend_marker = '''function blend(a: RGB, b: RGB, t: number): RGB {
            const amount = clamp01(t);
            return [
              a[0] + (b[0] - a[0]) * amount,
              a[1] + (b[1] - a[1]) * amount,
              a[2] + (b[2] - a[2]) * amount,
            ];
          }'''.replace('          ', '')
          helpers = blend_marker + '''
          function normalizePoint(point: Point): Point {
            const length = Math.hypot(point[0], point[1], point[2]) || 1;
            return [point[0] / length, point[1] / length, point[2] / length];
          }
          function reliefShade(normal: Point) {
            const light = normal[0] * -0.34 + normal[1] * 0.88 + normal[2] * -0.32;
            return Math.max(0.88, Math.min(1.06, 0.94 + light * 0.11));
          }'''.replace('          ', '')
          assert blend_marker in terrain, 'blend marker missing'
          terrain = terrain.replace(blend_marker, helpers, 1)

          old_interp = '''function interpolate(a: Vertex, b: Vertex, t: number): Vertex {
            return {
              point: [
                a.point[0] + (b.point[0] - a.point[0]) * t,
                a.point[1] + (b.point[1] - a.point[1]) * t,
                a.point[2] + (b.point[2] - a.point[2]) * t,
              ],
              tint: blend(a.tint, b.tint, t),
            };
          }'''.replace('          ', '')
          new_interp = '''function interpolate(a: Vertex, b: Vertex, t: number): Vertex {
            const normal =
              a.normal && b.normal
                ? normalizePoint([
                    a.normal[0] + (b.normal[0] - a.normal[0]) * t,
                    a.normal[1] + (b.normal[1] - a.normal[1]) * t,
                    a.normal[2] + (b.normal[2] - a.normal[2]) * t,
                  ])
                : undefined;
            return {
              point: [
                a.point[0] + (b.point[0] - a.point[0]) * t,
                a.point[1] + (b.point[1] - a.point[1]) * t,
                a.point[2] + (b.point[2] - a.point[2]) * t,
              ],
              tint: blend(a.tint, b.tint, t),
              normal,
            };
          }'''.replace('          ', '')
          assert old_interp in terrain, 'interpolate marker missing'
          terrain = terrain.replace(old_interp, new_interp, 1)

          pattern = re.compile(r'''function pushTriangle\(\n  positions: number\[\],\n  normals: number\[\],\n  colors: number\[\],\n  indices: number\[\],\n  a: Vertex,\n  b: Vertex,\n  c: Vertex,\n\) \{.*?\n\}\nfunction pushPolygon''', re.S)
          new_push = '''function pushTriangle(
            positions: number[],
            normals: number[],
            colors: number[],
            indices: number[],
            a: Vertex,
            b: Vertex,
            c: Vertex,
          ) {
            const ux = b.point[0] - a.point[0],
              uy = b.point[1] - a.point[1],
              uz = b.point[2] - a.point[2],
              vx = c.point[0] - a.point[0],
              vy = c.point[1] - a.point[1],
              vz = c.point[2] - a.point[2],
              faceNormal = normalizePoint([
                uy * vz - uz * vy,
                uz * vx - ux * vz,
                ux * vy - uy * vx,
              ]),
              start = positions.length / 3;
            for (const vertex of [a, b, c]) {
              const normal = vertex.normal ?? faceNormal,
                shade = reliefShade(normal);
              positions.push(...vertex.point);
              normals.push(...normal);
              colors.push(
                byte(vertex.tint[0] * shade),
                byte(vertex.tint[1] * shade),
                byte(vertex.tint[2] * shade),
                255,
              );
            }
            indices.push(start, start + 1, start + 2);
          }
          function pushPolygon'''.replace('          ', '')
          terrain, count = pattern.subn(new_push, terrain, count=1)
          assert count == 1, f'pushTriangle replacement count {count}'

          old_res = '    targetResolution = tile.size <= 128 ? 68 : tile.size <= 512 ? (rugged ? 52 : 40) : rugged ? 40 : 28,'
          new_res = '    targetResolution = tile.size <= 128 ? (rugged ? 80 : 72) : tile.size <= 512 ? (rugged ? 60 : 44) : rugged ? 44 : 30,'
          assert old_res in terrain, 'resolution marker missing'
          terrain = terrain.replace(old_res, new_res, 1)

          grid_marker = '''    grid.push(row);
            }
          
            const positions: number[] = [],'''.replace('            ', '')
          normals_pass = '''    grid.push(row);
          }

          // Share one smooth normal at every logical grid vertex. This removes the
          // checkerboard faceting caused by per-triangle normals while preserving the
          // canonical sampled elevations and all traversal/water authority.
          for (let iz = 0; iz <= resolution; iz++) {
            for (let ix = 0; ix <= resolution; ix++) {
              const left = grid[iz][Math.max(0, ix - 1)].point,
                right = grid[iz][Math.min(resolution, ix + 1)].point,
                up = grid[Math.max(0, iz - 1)][ix].point,
                down = grid[Math.min(resolution, iz + 1)][ix].point,
                dx = Math.max(1e-6, right[0] - left[0]),
                dz = Math.max(1e-6, down[2] - up[2]),
                slopeX = (right[1] - left[1]) / dx,
                slopeZ = (down[1] - up[1]) / dz;
              grid[iz][ix].normal = normalizePoint([-slopeX, 1, -slopeZ]);
            }
          }

          const positions: number[] = [],'''.replace('          ', '')
          assert grid_marker in terrain, 'grid insertion marker missing'
          terrain = terrain.replace(grid_marker, normals_pass, 1)
          old_diag = '          (x + z) % 2 === 1,'
          new_diag = '          Math.abs(quad[0].point[1] - quad[2].point[1]) > Math.abs(quad[1].point[1] - quad[3].point[1]),'
          assert old_diag in terrain, 'triangulation marker missing'
          terrain = terrain.replace(old_diag, new_diag, 1)
          terrain_path.write_text(terrain)
          PY
          rm .github/workflows/wp15-agent1-repair.yml
          git diff --check
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/hydrology.ts src/terrain-refine.ts .github/workflows/wp15-agent1-repair.yml
          git commit -m "WP-S002-004-005 smooth terrain and naturalize drainage [agent1-wp15-repair]"
          git push origin HEAD:agent1/wp-s002-004-005-uv-final2
