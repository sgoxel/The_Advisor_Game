name: WP-S004-008 Contextual Reaction Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wp-s004-008-evidence.yml
      - tools/wp_s004_008_evidence.py
      - tools/tests/wp-s004-008-contextual-reactions.test.js
      - scripts/world/contextual-reactions.js
      - scripts/world/resident-movement.js
      - index.html

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        profile: [landscape, portrait]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Functional contextual-reaction proof
        run: node tools/tests/wp-s004-008-contextual-reactions.test.js
      - name: Start local game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! >/tmp/advisor-http.pid
          sleep 1
      - name: Capture contextual-reaction evidence
        env:
          TARGET: http://127.0.0.1:8000/
          PROFILE: ${{ matrix.profile }}
        run: python tools/wp_s004_008_evidence.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s004-008-${{ matrix.profile }}-${{ github.run_id }}
          path: tools/screenshots/wp-s004-008/
          if-no-files-found: error
          retention-days: 14
