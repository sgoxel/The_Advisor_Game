name: Validate continuous surface zoom
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/continuity*.ts'
      - 'src/final-surface.ts'
      - 'src/globe*.ts'
      - 'src/geometry*.ts'
      - 'src/handoff.ts'
      - 'src/main.ts'
      - 'src/natural-surface-mesh.ts'
      - 'src/navigation.ts'
      - 'src/planet.ts'
      - 'src/render-frame.ts'
      - 'src/renderer*.ts'
      - 'src/streaming*.ts'
      - 'src/surface*.ts'
      - 'src/tile-worker.ts'
      - 'src/world*.ts'
      - 'tests/*zoom*'
      - 'tests/*surface*'
      - 'tests/browser/zoom.spec.js'
      - 'tests/webgpu/zoom.spec.js'
      - 'tools/verify-zoom-images.py'
      - '.github/workflows/zoom-validation.yml'
permissions:
  contents: read
concurrency:
  # A PR merge emits 'closed'; it must not cancel that PR's active zoom
  # screenshot/test job before original evidence is uploaded. New commits still
  # replace older active runs, so no duplicate suites are scheduled.
  group: zoom-validation-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'closed' && 'closed' || 'active' }}
  cancel-in-progress: true
jobs:
  full-unit-diagnostics:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: timeout --signal=TERM --kill-after=30s 45m npm test
  zoom:
    if: github.event.action != 'closed'
    strategy:
      fail-fast: true
      matrix:
        backend: [webgpu, webgl2]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bounded PR release invariants
        if: github.event_name == 'pull_request' && matrix.backend == 'webgpu'
        run: timeout --signal=TERM --kill-after=30s 12m npm run test:release
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install pillow numpy playwright==1.63.0
      - name: WebGPU browser suite
        if: matrix.backend == 'webgpu'
        run: timeout --signal=TERM --kill-after=30s 31m xvfb-run -a npx playwright test --config playwright.webgpu.config.js zoom.spec.js
      - name: WebGL2 browser suite
        if: matrix.backend == 'webgl2'
        run: timeout --signal=TERM --kill-after=30s 31m xvfb-run -a npx playwright test --config playwright.fallback.config.js zoom.spec.js
      - name: Perceptual palette and block boundary gate
        run: |
          python tools/verify-zoom-images.py --self-test
          python tools/verify-zoom-images.py test-results/zoom-${{ matrix.backend }}/pairs.json
      - name: Named owner Country regression captures
        run: |
          npm run preview -- --port 4174 > /tmp/zoom-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=30s 9m xvfb-run -a python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/zoom-country-${{ matrix.backend }} --scenario zoom-country --profile fullhd-landscape,fullhd-portrait --renderer ${{ matrix.backend }} --timeout 240
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zoom-evidence-${{ matrix.backend }}
          path: test-results/
