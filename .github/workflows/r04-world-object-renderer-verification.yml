name: R04 World Object Renderer Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/world_object_renderer.js'
      - 'js/world_object_presentation_descriptor.js'
      - 'js/tile_registry.js'
      - 'js/utils.js'
      - 'tests/browser/r04-world-object-renderer.spec.mjs'
      - 'tests/browser/r04-world-object-presentation-descriptor.spec.mjs'
      - 'tests/node/tile-registry.test.mjs'
      - 'tests/fixtures/world-objects/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r04-world-object-renderer-verification.yml'
  pull_request:
    paths:
      - 'js/world_object_renderer.js'
      - 'js/world_object_presentation_descriptor.js'
      - 'js/tile_registry.js'
      - 'js/utils.js'
      - 'tests/browser/r04-world-object-renderer.spec.mjs'
      - 'tests/browser/r04-world-object-presentation-descriptor.spec.mjs'
      - 'tests/node/tile-registry.test.mjs'
      - 'tests/fixtures/world-objects/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r04-world-object-renderer-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-world-object-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: echo "R04 world object renderer candidate ${GITHUB_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify generalized transparent world-object composition
        run: npx playwright test tests/browser/r04-world-object-renderer.spec.mjs --project=desktop
      - name: Preserve Simulation-backed descriptor authority boundary
        run: npx playwright test tests/browser/r04-world-object-presentation-descriptor.spec.mjs --project=desktop
      - name: Preserve semantic tile registry boundary
        run: node --test tests/node/tile-registry.test.mjs
      - name: Upload focused R04 world-object renderer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-world-object-renderer-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
