name: WP25 route fallback patch

on:
  push:
    branches: [agent1/wp-s005-001-001]
    paths: [.github/workflows/wp25-route-fallback-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s005-001-001
      - name: Extend existing bounded bridge search
        run: python -c "from pathlib import Path; p=Path('src/transport-network.ts'); t=p.read_text(); old='  if (separationM > 120_000) return Object.freeze([]) as readonly LegalBridgeRouteCandidate[];\\n'; assert old in t; p.write_text(t.replace(old, '', 1))"
      - name: Commit patch and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wp25-route-fallback-patch.yml
          git add src/transport-network.ts
          git commit -m "WP-S005 extend bounded bridge search to regional corridors"
          git push origin HEAD:agent1/wp-s005-001-001
