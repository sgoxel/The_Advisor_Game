name: Agent1 temporary pole patch
on:
  push:
    branches: [agent1/wp-s002-003-003]
    paths:
      - tools/wp-s002-003-003-pole-patch.mjs
      - .github/workflows/agent1-pole-patch.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-003-003
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/wp-s002-003-003-pole-patch.mjs
      - name: Commit corrected pole selection
        run: |
          if git diff --quiet -- src/world.ts; then
            echo "Pole patch already applied"
            exit 0
          fi
          git config user.name "AGENT #1"
          git config user.email "actions@users.noreply.github.com"
          git add src/world.ts
          git commit -m "WP-S002-003-003 canonicalize exact-pole streaming"
          git push origin HEAD:agent1/wp-s002-003-003
