name: R02 Unbounded World Verification

on:
  push:
    branches: [main]
    paths:
      - 'tests/browser/r02-unbounded-world-regression.spec.mjs'
      - 'tests/browser/r02-multi-region-terrain.spec.mjs'
      - 'tests/browser/r02-origin-village.spec.mjs'
      - 'tests/browser/r02-npc-world-presence.spec.mjs'
      - 'tests/browser/r02-world-delta-persistence.spec.mjs'
      - 'tests/browser/r02-region-navigation.spec.mjs'
      - 'tests/browser/r02-cumulative-persistence-regression.spec.mjs'
      - 'js/rng.js'
      - 'js/campaign_persistence.js'
      - 'js/npc_world.js'
      - 'js/region_navigation.js'
      - 'js/state.js'
      - 'js/terrain.js'
      - '.github/workflows/r02-unbounded-world-verification.yml'
  pull_request:
    paths:
      - 'tests/browser/r02-unbounded-world-regression.spec.mjs'
      - 'tests/browser/r02-multi-region-terrain.spec.mjs'
      - 'tests/browser/r02-origin-village.spec.mjs'
      - 'tests/browser/r02-npc-world-presence.spec.mjs'
      - 'tests/browser/r02-world-delta-persistence.spec.mjs'
      - 'tests/browser/r02-region-navigation.spec.mjs'
      - 'tests/browser/r02-cumulative-persistence-regression.spec.mjs'
      - 'js/rng.js'
      - 'js/campaign_persistence.js'
      - 'js/npc_world.js'
      - 'js/region_navigation.js'
      - 'js/state.js'
      - 'js/terrain.js'
      - '.github/workflows/r02-unbounded-world-verification.yml'

permissions:
  contents: read

jobs:
  unbounded-world-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: git rev-parse HEAD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run cumulative unbounded-world regression across responsive projects
        run: npx playwright test tests/browser/r02-unbounded-world-regression.spec.mjs
      - name: Re-run focused unbounded-world foundations
        run: npx playwright test tests/browser/r02-multi-region-terrain.spec.mjs tests/browser/r02-origin-village.spec.mjs tests/browser/r02-npc-world-presence.spec.mjs tests/browser/r02-world-delta-persistence.spec.mjs tests/browser/r02-region-navigation.spec.mjs --project=desktop
      - name: Re-run cumulative R02 persistence regression
        run: npx playwright test tests/browser/r02-cumulative-persistence-regression.spec.mjs
      - name: Run stabilized R01 browser regression
        run: npm run test:browser:r01
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r02-t20-unbounded-world-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
