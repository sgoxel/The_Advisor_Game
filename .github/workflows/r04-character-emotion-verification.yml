name: R04 Character Emotion Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/character_identity.js'
      - 'js/character_age.js'
      - 'js/character_location_context.js'
      - 'js/character_emotion.js'
      - 'js/game_time.js'
      - 'js/campaign_calendar.js'
      - 'js/utils.js'
      - 'tests/browser/r04-character-emotion.spec.mjs'
      - '.github/workflows/r04-character-emotion-verification.yml'
  pull_request:
    paths:
      - 'js/character_identity.js'
      - 'js/character_age.js'
      - 'js/character_location_context.js'
      - 'js/character_emotion.js'
      - 'js/game_time.js'
      - 'js/campaign_calendar.js'
      - 'js/utils.js'
      - 'tests/browser/r04-character-emotion.spec.mjs'
      - '.github/workflows/r04-character-emotion-verification.yml'

permissions:
  contents: read

jobs:
  deterministic-character-emotion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: git rev-parse HEAD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deterministic character emotion regression
        run: npx playwright test tests/browser/r04-character-emotion.spec.mjs
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-character-emotion-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
