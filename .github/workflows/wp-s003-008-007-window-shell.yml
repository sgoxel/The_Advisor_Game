name: WP-S003-008-007 Window Shell Evidence

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: wp-s003-008-007-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  evidence:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/wp-s003-008-007-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evidence dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Start local build
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-window-shell-http.log 2>&1 &
          echo $! >/tmp/advisor-window-shell-http.pid
          sleep 1
      - name: Run functional + visual evidence
        env:
          TARGET: http://127.0.0.1:8000/
          OUT: tools/screenshots/wp-s003-008-007
        run: python tools/wp_s003_008_007_evidence.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-008-007-window-shell-${{ github.run_id }}
          path: tools/screenshots/wp-s003-008-007/
          if-no-files-found: warn
          retention-days: 14
      - name: Comment result
        if: github.event_name == 'issue_comment' && always()
        uses: actions/github-script@v7
        env:
          RUN_STATUS: ${{ job.status }}
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok = process.env.RUN_STATUS === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `WP-S003-008-007 window-shell evidence completed. [Open workflow run and artifact](${url}).`
                : `WP-S003-008-007 window-shell evidence FAILED. [Open workflow run and logs](${url}).`
            });
