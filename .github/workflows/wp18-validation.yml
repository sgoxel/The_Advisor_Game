name: WP-S002-004-008 route evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-wp18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Routing authority acceptance tests
        run: node --experimental-strip-types --test tests/routing.test.ts tests/routing-final-surface.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture road mountain and water route evidence on WebGL2 and WebGPU
        run: |
          python -m pip install playwright==1.63.0
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          for scenario in route-road route-mountain route-water; do
            python tools/screenshot_tool.py http://127.0.0.1:4174/ --out "test-results/wp18-${scenario}-webgl2" --scenario "$scenario" --profile desktop,phone,phone-landscape --renderer webgl2 --timeout 360
            python tools/screenshot_tool.py http://127.0.0.1:4174/ --out "test-results/wp18-${scenario}-webgpu" --scenario "$scenario" --profile desktop,phone,phone-landscape --renderer webgpu --timeout 360
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp18-route-evidence
          path: test-results/
