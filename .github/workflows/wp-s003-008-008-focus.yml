name: WP-S003-008-008 Focus Navigation Evidence

on:
  push:
    branches:
      - agent6/wp-s003-008-008
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Functional guards
        run: |
          node --check scripts/world/planet-stage.js
          node scripts/tests/wp-s003-008-008-focus-navigation.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Evidence harness syntax
        run: python -m py_compile tools/wp_s003_008_008_evidence.py
      - name: Start branch-local game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! >/tmp/advisor-http.pid
          sleep 1
      - name: Browser evidence
        env:
          TARGET: http://127.0.0.1:8000/
          OUT: tools/screenshots/wp-s003-008-008
        run: python tools/wp_s003_008_008_evidence.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-008-008-evidence-${{ github.run_id }}
          path: tools/screenshots/wp-s003-008-008
          if-no-files-found: error
