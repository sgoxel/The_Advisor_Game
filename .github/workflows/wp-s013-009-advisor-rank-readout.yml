name: WP-S013-009 Advisor Rank Readout Evidence
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles/main.css"
      - "scripts/ui/advisor-rank-readout-ui.js"
      - "scripts/ui/advisor-conversation-ui.js"
      - "scripts/ui/protagonist-status-ui.js"
      - "scripts/tests/wp-s013-009-advisor-rank-readout.test.js"
      - "tools/wp_s013_009_evidence.py"
      - ".github/workflows/wp-s013-009-advisor-rank-readout.yml"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: wp-s013-009-${{ github.sha }}
  cancel-in-progress: false
jobs:
  functional:
    if: github.event_name != 'issue_comment' || (github.event.issue.number == 272 && contains(github.event.comment.body, '/wp-s013-009-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Syntax + authority boundary tests
        run: |
          node --check scripts/ui/advisor-rank-readout-ui.js
          node --check scripts/ui/advisor-conversation-ui.js
          node --check scripts/ui/protagonist-status-ui.js
          node --check scripts/tests/wp-s013-009-advisor-rank-readout.test.js
          python -m py_compile tools/wp_s013_009_evidence.py
          node scripts/tests/wp-s013-009-advisor-rank-readout.test.js
          node scripts/tests/wp-s009-010-protagonist-status-ui.test.js
          node scripts/tests/wp-s008-007-advisor-chat-ui.test.js
          node scripts/tests/wp-s013-003-protagonist-patronage-opportunities.test.js
          node scripts/tests/wp-s013-004-protagonist-service-contracts.test.js
          node scripts/tests/wp-s013-005-protagonist-appointment-resolution.test.js
          node scripts/tests/wp-s013-006-protagonist-oath-allegiance.test.js
          node scripts/tests/wp-s013-007-protagonist-status-obligations.test.js
  visual:
    needs: functional
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m http.server 8000 --bind 127.0.0.1 >/tmp/wp-s013-009-http.log 2>&1 &
      - name: Capture fresh responsive rank readout evidence
        env: {TARGET: "http://127.0.0.1:8000/", OUT: "tools/screenshots/wp-s013-009"}
        run: python tools/wp_s013_009_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-s013-009-rank-readout-${{ github.sha }}
          path: tools/screenshots/wp-s013-009/
          if-no-files-found: error
          retention-days: 14
      - name: Verify exact product is live on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="accepted"; grep -q 'WP-S013-009.*COMPLETED' docs/ROADMAP.md && MODE="completed" || true
          for attempt in $(seq 1 72); do
            curl -fsSL --max-time 20 "$BASE/scripts/ui/advisor-rank-readout-ui.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product=0; state=0
            grep -q 'VERSION="advisor-rank-readout-v1"' /tmp/live.js 2>/dev/null && grep -q 'scripts/ui/advisor-rank-readout-ui.js?v=advisor-rank-readout-v1' /tmp/live-index.html 2>/dev/null && product=1 || true
            if [ "$MODE" = completed ]; then grep -q 'WP-S013-009.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state=1 || true; else state=1; fi
            [ "$product" -eq 1 ] && [ "$state" -eq 1 ] && exit 0
            sleep 5
          done
          exit 1
      - name: Comment Issue 272
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body='AGENT #6 WP-S013-009 exact-head workflow: **${{ job.status }}**\nCommit: '+context.sha+'\nRun: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId+'\nFunctional authority tests, fresh responsive screenshots, and public Pages verification were attempted.';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:272,body});
