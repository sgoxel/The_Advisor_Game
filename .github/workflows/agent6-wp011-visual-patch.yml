name: Agent6 WP011 Visual Patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp011-visual-patch.yml"
      - "tools/agent6_wp011_visual_patch.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp011-visual-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply WP011 visual acceptance fix
        run: |
          python tools/agent6_wp011_visual_patch.py
          node --check scripts/world/planet-stage.js
          git diff --check
      - name: Commit visual fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+sgoxel@users.noreply.github.com"
          git add scripts/world/planet-stage.js
          if git diff --cached --quiet; then
            echo "WP011 visual patch already current"
            exit 0
          fi
          git commit -m "fix(WP-S003-010-003-011): declutter focus labels and sharpen local tiers"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
