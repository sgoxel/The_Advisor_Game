name: Agent 6 WP011 Patch

on:
  push:
    branches:
      - main
    paths:
      - tools/agent6_wp011_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python tools/agent6_wp011_patch.py
      - name: Parse check
        run: node --check scripts/world/planet-stage.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+sgoxel@users.noreply.github.com'
          git add scripts/world/planet-stage.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(WP-S003-010-003-011): declutter center scale labels'
          git pull --rebase origin main
          git push origin HEAD:main
