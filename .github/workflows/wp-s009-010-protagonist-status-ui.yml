name: WP-S009-010 Protagonist Status Readout
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles/main.css"
      - "scripts/ui/advisor-conversation-ui.js"
      - "scripts/ui/protagonist-status-ui.js"
      - "scripts/tests/wp-s009-010-protagonist-status-ui.test.js"
      - "tools/wp_s009_010_evidence.py"
      - ".github/workflows/wp-s009-010-protagonist-status-ui.yml"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: wp-s009-010-${{ github.sha }}
  cancel-in-progress: false
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Syntax + status readout authority tests
        run: |
          node --check scripts/ui/protagonist-status-ui.js
          node --check scripts/tests/wp-s009-010-protagonist-status-ui.test.js
          node scripts/tests/wp-s009-010-protagonist-status-ui.test.js
          node scripts/tests/wp-s008-007-advisor-chat-ui.test.js
          node scripts/tests/wp-s009-009-protagonist-guidance.test.js
  visual:
    needs: functional
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m http.server 8000 --bind 127.0.0.1 >/tmp/wp-s009-010-http.log 2>&1 &
      - name: Capture exact-head responsive state matrix
        env: {TARGET: "http://127.0.0.1:8000/", OUT: "tools/screenshots/wp-s009-010"}
        run: python tools/wp_s009_010_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-s009-010-status-${{ github.sha }}
          path: tools/screenshots/wp-s009-010/
          if-no-files-found: error
          retention-days: 14
      - name: Verify exact product is live on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="accepted"; grep -q 'WP-S009-010.*COMPLETED' docs/ROADMAP.md && MODE="completed" || true
          for attempt in $(seq 1 72); do
            curl -fsSL --max-time 20 "$BASE/scripts/ui/protagonist-status-ui.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product=0; state=0
            grep -q 'VERSION="protagonist-status-ui-v1"' /tmp/live.js 2>/dev/null && grep -q 'scripts/ui/protagonist-status-ui.js?v=protagonist-status-ui-v1' /tmp/live-index.html 2>/dev/null && product=1 || true
            if [ "$MODE" = completed ]; then grep -q 'WP-S009-010.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state=1 || true; else state=1; fi
            [ "$product" -eq 1 ] && [ "$state" -eq 1 ] && exit 0
            sleep 5
          done
          exit 1
      - name: Comment exact run on Issue 203
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body='AGENT #6 WP-S009-010 exact-head workflow: **${{ job.status }}**\nCommit: '+context.sha+'\nRun: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId+'\nFunctional tests, fresh responsive screenshot capture, and public Pages verification were attempted.';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:203,body});
