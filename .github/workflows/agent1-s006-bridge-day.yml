name: AGENT1 S006 actual bridge-day acceptance
on:
  push:
    branches: ["agent1/s006-bridge-day-proof-20261026"]
    paths:
      - "tools/s006-bridge-day-witness.ts"
      - "src/simulation.ts"
      - ".github/workflows/agent1-s006-bridge-day.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-bridge-day:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify actual same-SEED-ID gate bridge work home
        run: timeout --signal=TERM --kill-after=10s 8m node --experimental-strip-types tools/s006-bridge-day-witness.ts
