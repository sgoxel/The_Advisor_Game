name: R01 Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/r01-dependency-audit.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/r01-dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4

      - name: Record exact candidate SHA
        run: echo "R01 dependency-audit candidate ${GITHUB_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install exact declared development dependency tree
        run: npm install --ignore-scripts

      - name: Record installed dependency tree
        run: npm ls --all

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Record full audit details
        run: npm audit --json > npm-audit-full.json || true

      - name: Print full audit details
        run: cat npm-audit-full.json

      - name: Enforce full high-severity result for review
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete R01 cumulative browser regression
        run: >-
          npx playwright test
          tests/browser/r01-baseline.spec.mjs
          tests/browser/r01-organic-elevation.spec.mjs
          tests/browser/r01-readability.spec.mjs
          tests/browser/r01-cumulative.spec.mjs

      - name: Upload dependency and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r01-dependency-audit-${{ github.sha }}
          path: |
            npm-audit-full.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
