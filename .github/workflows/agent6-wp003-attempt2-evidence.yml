name: Agent6 WP003 Attempt2 Evidence

on:
  push:
    branches: [main]
    paths:
      - "scripts/world/planet-stage.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent6-wp003-attempt2-evidence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Start local game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          sleep 1
      - name: Capture landscape parent acceptance
        run: |
          python tools/screenshot_tool.py http://127.0.0.1:8000/ visual-wp-s003-010-003 \
            --profile landscape --scenario wp-s003-010-003 --shots 10 --timestamp-names \
            --wait-min 1 --wait-max 1 --no-publish \
            --evidence-json evidence-wp-s003-010-003-attempt2-landscape.json
      - name: Preserve landscape
        run: |
          mkdir -p /tmp/wp003-attempt2/landscape
          cp tools/screenshots/*.png /tmp/wp003-attempt2/landscape/
          cp tools/screenshots/evidence-wp-s003-010-003-attempt2-landscape.json /tmp/wp003-attempt2/landscape/
          rm -f tools/screenshots/*.png tools/screenshots/evidence-wp-s003-010-003-attempt2-landscape.json
      - name: Capture real phone portrait parent acceptance
        run: |
          python tools/screenshot_tool.py http://127.0.0.1:8000/ visual-wp-s003-010-003 \
            --profile portrait --scenario wp-s003-010-003 --shots 10 --timestamp-names \
            --wait-min 1 --wait-max 1 --no-publish \
            --evidence-json evidence-wp-s003-010-003-attempt2-portrait.json
      - name: Preserve portrait and assert 390x844
        run: |
          mkdir -p /tmp/wp003-attempt2/portrait
          cp tools/screenshots/*.png /tmp/wp003-attempt2/portrait/
          cp tools/screenshots/evidence-wp-s003-010-003-attempt2-portrait.json /tmp/wp003-attempt2/portrait/
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('/tmp/wp003-attempt2/portrait')
          data=json.loads((root/'evidence-wp-s003-010-003-attempt2-portrait.json').read_text())
          assert len(data['frames'])==10, len(data['frames'])
          for p in root.glob('*.png'):
              assert Image.open(p).size==(390,844), (p.name,Image.open(p).size)
          PY
      - name: Upload Attempt 2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent6-wp003-attempt2-${{ github.sha }}
          path: /tmp/wp003-attempt2/
          if-no-files-found: error
          retention-days: 2
