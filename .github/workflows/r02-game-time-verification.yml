name: R02 Game Time Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/game_time.js'
      - 'js/utils.js'
      - 'tests/browser/r02-game-time.spec.mjs'
      - '.github/workflows/r02-game-time-verification.yml'
  pull_request:
    paths:
      - 'js/game_time.js'
      - 'js/utils.js'
      - 'tests/browser/r02-game-time.spec.mjs'
      - '.github/workflows/r02-game-time-verification.yml'

permissions:
  contents: read

jobs:
  game-time-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run deterministic real-time clock regression
        run: npx playwright test tests/browser/r02-game-time.spec.mjs
      - name: Re-run campaign persistence regression
        run: npx playwright test tests/browser/r02-save-load-roundtrip.spec.mjs tests/browser/r02-save-load-validation.spec.mjs
      - name: Run stabilized R01 browser regression
        run: npm run test:browser:r01
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r02-t21-game-time-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
