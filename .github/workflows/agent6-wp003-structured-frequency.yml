name: Agent6 WP003 Structured Frequency Refinement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp003-structured-frequency.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp003-structured-frequency
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply registered structured-frequency correction
        run: |
          set -euo pipefail
          python tools/agent6_wp003_structured_frequency_patch.py
          node --check scripts/world/planet-stage.js
          git diff --check
          grep -q 'canonical-continuous-cross-lod-source-v40' scripts/world/planet-stage.js
          grep -q 'structuredFrequencyTransform:true' scripts/world/planet-stage.js
      - name: Commit product correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/world/planet-stage.js
          if git diff --cached --quiet; then
            echo "WP003 structured-frequency product already current"
            exit 0
          fi
          git commit -m "fix(WP-S003-010-003): sharpen registered terrain refinement"
          git pull --rebase origin main
          git push origin HEAD:main
