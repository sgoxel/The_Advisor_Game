name: R02 World Delta Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/campaign_persistence.js'
      - 'tests/browser/r02-world-delta-persistence.spec.mjs'
      - '.github/workflows/r02-world-delta-verification.yml'
  pull_request:
    paths:
      - 'js/campaign_persistence.js'
      - 'tests/browser/r02-world-delta-persistence.spec.mjs'
      - '.github/workflows/r02-world-delta-verification.yml'

permissions:
  contents: read

jobs:
  world-delta-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: git rev-parse HEAD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run sparse world delta persistence regression
        run: npx playwright test tests/browser/r02-world-delta-persistence.spec.mjs
      - name: Re-run deterministic save load round trip
        run: npx playwright test tests/browser/r02-deterministic-roundtrip.spec.mjs
      - name: Re-run safe save load validation and rollback
        run: npx playwright test tests/browser/r02-save-load-validation.spec.mjs
      - name: Re-run deterministic multi-region terrain regression
        run: npx playwright test tests/browser/r02-multi-region-terrain.spec.mjs
      - name: Re-run inhabited origin village regression
        run: npx playwright test tests/browser/r02-origin-village.spec.mjs
      - name: Run stabilized R01 browser regression
        run: npm run test:browser:r01
      - name: Run production-surface dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r02-t17-world-delta-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
