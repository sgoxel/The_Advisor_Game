name: WP-S014-004 Personal Combat Exchange
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/world/personal-combat-exchange.js"
      - "scripts/tests/wp-s014-004-personal-combat-exchange.test.js"
      - ".github/workflows/wp-s014-004-personal-combat-exchange.yml"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: wp-s014-004-${{ github.sha }}
  cancel-in-progress: false
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Syntax + deterministic personal combat evidence
        run: |
          node --check scripts/world/personal-combat-exchange.js
          node --check scripts/tests/wp-s014-004-personal-combat-exchange.test.js
          node scripts/tests/wp-s014-004-personal-combat-exchange.test.js
      - name: Existing health authority regression
        run: |
          node scripts/tests/wp-s009-005-protagonist-health.test.js
      - name: Verify exact product is live on GitHub Pages
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="accepted"; grep -q 'WP-S014-004.*COMPLETED' docs/ROADMAP.md && MODE="completed" || true
          for attempt in $(seq 1 72); do
            curl -fsSL --max-time 20 "$BASE/scripts/world/personal-combat-exchange.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-combat.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product=0; state=0
            grep -q 'VERSION="personal-combat-exchange-v1"' /tmp/live-combat.js 2>/dev/null && grep -q 'personal-combat-exchange.js?v=personal-combat-exchange-v1' /tmp/live-index.html 2>/dev/null && product=1 || true
            if [ "$MODE" = completed ]; then grep -q 'WP-S014-004.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state=1 || true; else state=1; fi
            [ "$product" -eq 1 ] && [ "$state" -eq 1 ] && exit 0
            sleep 5
          done
          exit 1
      - name: Comment Issue 280
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body='AGENT #6 WP-S014-004 exact-head workflow: **${{ job.status }}**\nCommit: '+context.sha+'\nRun: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId+'\nDeterministic personal-combat evidence, ProtagonistHealth authority regression, and public Pages verification were attempted. VISUAL: N/A.';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:280,body});
