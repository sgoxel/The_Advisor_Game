name: AGENT1 WP-S005 ARM exact acceptance
on:
  push:
    branches: [agent1/wp-s005-001-001-current]
    paths:
      - .github/workflows/agent1-wp-s005-arm.yml
concurrency:
  group: agent1-wp-s005-arm-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify exact S005 source
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q 'const capitalsByCountry' src/transport-network.ts
          grep -q 'function compareCanonical' src/transport-network.ts
          grep -q 'to = capitalsByCountry.get(gateway.neighbourCountryCode)' src/transport-network.ts
          grep -q 'international main roads connect capitals through explicit canonical border crossings' tests/transport-network.test.ts
          grep -q 'transport-inspector.ts' index.html
          grep -q 'desktop,laptop,tablet,phone,phone-landscape,phone-small,tablet-portrait' .github/workflows/wp-s005-evidence.yml
      - run: npm ci
      - name: Targeted deterministic transport tests
        run: |
          mkdir -p test-results
          set -o pipefail
          node --experimental-strip-types --test tests/transport-network.test.ts 2>&1 | tee test-results/wp-s005-targeted.log
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Python Playwright
        run: python -m pip install playwright==1.63.0
      - name: Capture exact-head transport evidence
        run: |
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          TRANSPORT_STEPS='eval:window.advisorTransport.focusEvidence("bridge");settle;visible:#transport-panel;shot:river-bridge-1-100;eval:window.advisorTransport.focusEvidence("border-crossing");settle;shot:capital-border-crossing-1-100;eval:window.advisorTransport.focusEvidence("lake-detour");settle;shot:lake-detour-1-100;eval:window.advisorTransport.focusEvidence("mountain-pass");settle;shot:mountain-pass-1-100;eval:window.advisorTransport.focusEvidence("junction");settle;shot:shared-junction-1-100;eval:window.advisorTransport.focusEvidence("harbor");settle;shot:road-linked-harbor-1-100;eval:window.advisorTransport.focusEvidence("ferry");settle;shot:sea-link-semantics;eval:(s=>{s.value="250";s.dispatchEvent(new Event("change",{bubbles:true}))})(document.querySelector("#map-scale"));settle;shot:roads-hidden-1-250'
          PROFILES='desktop,laptop,tablet,phone,phone-landscape,phone-small,tablet-portrait'
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp-s005-arm-webgl2 --name transport --profile "$PROFILES" --renderer webgl2 --timeout 720 --steps "$TRANSPORT_STEPS"
          python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp-s005-arm-webgpu --name transport --profile "$PROFILES" --renderer webgpu --timeout 720 --steps "$TRANSPORT_STEPS"
      - name: Full deterministic integration suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results/wp-s005-full-suite.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-s005-arm-exact-head-${{ github.sha }}
          path: test-results/
