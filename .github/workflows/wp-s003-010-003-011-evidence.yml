name: WP-S003-010-003-011 Pure Zoom Evidence

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: wp-s003-010-003-011-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  evidence:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.issue.pull_request &&
       github.event.issue.number == 165 &&
       (github.event.comment.user.login == github.repository_owner ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       startsWith(github.event.comment.body, '/wp-s003-010-003-011-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout AGENT #6 WP branch
        uses: actions/checkout@v4
        with:
          ref: agent6/wp-s003-010-003-011
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Static JavaScript parse check
        run: node --check scripts/world/planet-stage.js

      - name: Verify browser
        run: |
          google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Start local game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-pure-zoom-http.log 2>&1 &
          echo $! >/tmp/advisor-pure-zoom-http.pid
          sleep 1

      - name: Run pure zoom, scale and drag evidence
        run: python tools/test_wp_s003_010_003_011.py http://127.0.0.1:8000/ tools/wp_s003_010_003_011_artifact

      - name: Upload pure zoom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-010-003-011-evidence
          path: tools/wp_s003_010_003_011_artifact
          if-no-files-found: error
          retention-days: 14

      - name: Comment success
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'WP-S003-010-003-011 evidence completed successfully. Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })

      - name: Comment failure
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'WP-S003-010-003-011 evidence FAILED. Run/logs: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })
