name: Verified Release

on:
  workflow_dispatch:
    inputs:
      verified_commit:
        description: "Exact 40-character commit SHA independently verified by Tester"
        required: true
        type: string
      release_tag:
        description: "GitHub Release tag to create or restore (for example v0.1.0-dev.1)"
        required: true
        type: string
      release_name:
        description: "Optional human-readable release title; defaults to the tag"
        required: false
        default: ""
        type: string
      confirm_verified:
        description: "Confirm that the commit passed the independent release gate"
        required: true
        default: false
        type: boolean
      restore_existing_verified:
        description: "Restore an already-published verified release to Pages without changing its tag or GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: verified-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, verify live Pages, and create or restore GitHub Release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Validate verified release inputs
        shell: bash
        env:
          VERIFIED_SHA: ${{ inputs.verified_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRM_VERIFIED: ${{ inputs.confirm_verified }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_VERIFIED" != "true" ]]; then
            echo "::error::Release blocked: independent verification was not explicitly confirmed."
            exit 1
          fi
          if [[ ! "$VERIFIED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::verified_commit must be an exact 40-character commit SHA."
            exit 1
          fi
          if [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" =~ [[:space:]] ]]; then
            echo "::error::release_tag must be non-empty and contain no whitespace."
            exit 1
          fi

      - name: Check out exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verified_commit }}
          fetch-depth: 0

      - name: Verify checked-out commit identity
        shell: bash
        env:
          VERIFIED_SHA: ${{ inputs.verified_commit }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "${ACTUAL_SHA,,}" != "${VERIFIED_SHA,,}" ]]; then
            echo "::error::Checked-out commit $ACTUAL_SHA does not match verified commit $VERIFIED_SHA."
            exit 1
          fi
          echo "Verified immutable candidate: $ACTUAL_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression test suite
        run: npm test

      - name: Validate release tag mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ inputs.verified_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RESTORE_EXISTING: ${{ inputs.restore_existing_verified }}
        run: |
          set -euo pipefail
          if [[ "$RESTORE_EXISTING" == "true" ]]; then
            if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Restore blocked: tag $RELEASE_TAG does not exist."
              exit 1
            fi
            git fetch --force --tags origin
            TAG_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "${TAG_SHA,,}" != "${VERIFIED_SHA,,}" ]]; then
              echo "::error::Restore blocked: tag $RELEASE_TAG resolves to $TAG_SHA, not verified commit $VERIFIED_SHA."
              exit 1
            fi
            if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Restore blocked: no published GitHub Release exists for $RELEASE_TAG."
              exit 1
            fi
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [[ "$IS_DRAFT" != "false" ]]; then
              echo "::error::Restore blocked: $RELEASE_TAG is not a published GitHub Release."
              exit 1
            fi
            echo "Restore mode: preserving existing verified tag and GitHub Release $RELEASE_TAG."
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Tag $RELEASE_TAG already exists. Refusing to overwrite a previous release."
              exit 1
            fi
          fi

      - name: Prepare static Pages artifact
        shell: bash
        env:
          VERIFIED_SHA: ${{ inputs.verified_commit }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'tests/' \
            --exclude 'node_modules/' \
            --exclude 'README.md' \
            --exclude 'ROADMAP.json' \
            --exclude 'TODO.json' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude '.gitignore'
          test -f _site/index.html
          printf '{"verifiedCommit":"%s"}\n' "$VERIFIED_SHA" > _site/release-candidate.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy exact verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait for exact verified Pages build
        shell: bash
        env:
          VERIFIED_SHA: ${{ inputs.verified_commit }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}"
          MARKER_URL="$BASE_URL/release-candidate.json"
          EXPECTED="{\"verifiedCommit\":\"$VERIFIED_SHA\"}"
          for attempt in {1..30}; do
            BODY="$(curl --fail --silent --show-error --location --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "$MARKER_URL?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}&attempt=$attempt" 2>/dev/null || true)"
            BODY="${BODY//$'\r'/}"
            BODY="${BODY//$'\n'/}"
            if [[ "$BODY" == "$EXPECTED" ]]; then
              echo "Live Pages marker matches verified commit $VERIFIED_SHA"
              exit 0
            fi
            echo "Waiting for exact Pages build ($attempt/30)..."
            sleep 10
          done
          echo "::error::Live Pages did not serve the exact verified release marker for $VERIFIED_SHA."
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify deployed Pages browser and accessibility behavior
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx playwright test

      - name: Upload live release browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-live-browser-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Create verified GitHub Release
        if: ${{ !inputs.restore_existing_verified }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ inputs.verified_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          TITLE="$RELEASE_NAME"
          if [[ -z "$TITLE" ]]; then
            TITLE="$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" \
            --target "$VERIFIED_SHA" \
            --title "$TITLE" \
            --generate-notes

      - name: Confirm existing verified release restored
        if: ${{ inputs.restore_existing_verified }}
        shell: bash
        env:
          VERIFIED_SHA: ${{ inputs.verified_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "Restored existing verified release $RELEASE_TAG at $VERIFIED_SHA to GitHub Pages without changing the tag or GitHub Release."
