name: Agent6 WP016 Temporal Handoff Evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp016-visual-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent6-wp016-temporal-handoff-evidence
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Verify browser
        run: google-chrome --version || google-chrome-stable --version || chromium --version
      - name: Start local game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! >/tmp/advisor-http.pid
          sleep 1
      - name: Capture WP016 temporal coherence evidence
        run: |
          set -euo pipefail
          rm -rf artifacts/wp016-temporal
          mkdir -p artifacts/wp016-temporal
          python tools/screenshot_tool.py \
            --target http://127.0.0.1:8000/ \
            --profile landscape \
            --scenario wp-s003-010-003-016 \
            --shots 5 \
            --output-dir artifacts/wp016-temporal \
            --headless \
            --require-webgl2
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-010-003-016-agent6-attempt1
          path: artifacts/wp016-temporal/
          if-no-files-found: error
          retention-days: 14
