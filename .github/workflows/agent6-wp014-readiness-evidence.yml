name: Agent6 WP014 Readiness Evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp014-readiness-evidence.yml"
      - "tools/test_wp_s003_010_003_014.py"
      - "scripts/world/planet-stage.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent6-wp014-readiness-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Verify browser
        run: google-chrome --version || google-chrome-stable --version || chromium --version
      - name: Start exact-commit local server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! >/tmp/advisor-http.pid
          sleep 1
      - name: Run WP014 semantic-readiness regression
        run: |
          set -euo pipefail
          mkdir -p /tmp/wp-s003-010-003-014
          python tools/test_wp_s003_010_003_014.py http://127.0.0.1:8000/ /tmp/wp-s003-010-003-014 | tee /tmp/wp-s003-010-003-014/evidence.json
      - name: Record exact product head
        if: always()
        run: git rev-parse HEAD | tee /tmp/wp-s003-010-003-014/product-head.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-010-003-014-agent6-readiness-${{ github.run_id }}
          path: /tmp/wp-s003-010-003-014/
          if-no-files-found: error
          retention-days: 14
