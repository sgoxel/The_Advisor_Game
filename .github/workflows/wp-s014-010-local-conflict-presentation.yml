name: WP-S014-010 Local Conflict Presentation Evidence
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles/main.css"
      - "scripts/ui/local-conflict-presentation.js"
      - "scripts/tests/wp-s014-010-local-conflict-presentation.test.js"
      - "tools/wp_s014_010_evidence.py"
      - "tools/screenshot_tool.py"
      - ".github/workflows/wp-s014-010-local-conflict-presentation.yml"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: wp-s014-010-main
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Syntax + presentation authority tests
        run: |
          node --check scripts/ui/local-conflict-presentation.js
          node --check scripts/tests/wp-s014-010-local-conflict-presentation.test.js
          python -m py_compile tools/wp_s014_010_evidence.py
          node scripts/tests/wp-s014-010-local-conflict-presentation.test.js
          node scripts/tests/wp-s014-001-local-security-incidents.test.js
          node scripts/tests/wp-s014-004-personal-combat-exchange.test.js
          node scripts/tests/wp-s014-008-conflict-consequences.test.js
          node scripts/tests/wp-s009-005-protagonist-health.test.js
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r tools/requirements.txt
      - name: Start local evidence server
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "wp-s014-010-http.log"
          Start-Process -FilePath "python" -ArgumentList @("-m","http.server","8000","--bind","127.0.0.1") -RedirectStandardOutput $log -RedirectStandardError "$log.err" -WindowStyle Hidden
          Start-Sleep -Seconds 2
      - name: Capture fresh conflict/outcome/recovery evidence
        env: {TARGET: "http://127.0.0.1:8000/", OUT: "tools/screenshots/wp-s014-010"}
        run: python tools/wp_s014_010_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-s014-010-local-conflict-${{ github.sha }}
          path: tools/screenshots/wp-s014-010/
          if-no-files-found: error
          retention-days: 14
      - name: Verify exact product is live on GitHub Pages
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="accepted"; grep -q 'WP-S014-010.*COMPLETED' docs/ROADMAP.md && MODE="completed" || true
          for attempt in $(seq 1 72); do
            curl -fsSL --max-time 20 "$BASE/scripts/ui/local-conflict-presentation.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/styles/main.css?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live.css || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product=0; state=0
            grep -q 'VERSION="local-conflict-presentation-v2"' /tmp/live.js 2>/dev/null \
              && grep -q 'scripts/ui/local-conflict-presentation.js?v=local-conflict-presentation-v2' /tmp/live-index.html 2>/dev/null \
              && grep -q 'WP-S014-010 — visible local conflict' /tmp/live.css 2>/dev/null \
              && product=1 || true
            if [ "$MODE" = completed ]; then grep -q 'WP-S014-010.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state=1 || true; else state=1; fi
            [ "$product" -eq 1 ] && [ "$state" -eq 1 ] && exit 0
            sleep 5
          done
          exit 1
      - name: Comment Issue 286
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body='AGENT #6 WP-S014-010 exact-head acceptance workflow: **${{ job.status }}**\nCommit: '+context.sha+'\nRun: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId+'\nFunctional authority checks, fresh phone/desktop visual evidence, grounded/camera-motion anchoring, and public Pages verification were attempted in one runner allocation.';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:286,body});
