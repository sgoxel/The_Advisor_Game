name: Agent6 WP007 Evidence Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp007-evidence-diagnostic.yml"
      - "tools/agent6_wp007_evidence_diagnostic_patch.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp007-evidence-diagnostic
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve WP007 validation telemetry
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python tools/agent6_wp007_evidence_diagnostic_patch.py
          PYTHONDONTWRITEBYTECODE=1 python -m py_compile tools/screenshot_tool.py
          rm -rf tools/__pycache__
          git diff --check
      - name: Commit evidence harness improvement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+sgoxel@users.noreply.github.com"
          git add tools/screenshot_tool.py
          if git diff --cached --quiet; then
            echo "WP007 validation diagnostic already current"
            exit 0
          fi
          git commit -m "test(WP-S003-010-003-007): preserve failed validation telemetry"
          git pull --rebase origin main
          git push origin HEAD:main
