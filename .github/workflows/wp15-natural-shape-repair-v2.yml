name: WP15 natural hydrology visual repair v2

on:
  push:
    branches:
      - agent1/wp15-natural-repair-v2-final

permissions:
  contents: write

concurrency:
  group: wp15-natural-hydrology-repair-v2
  cancel-in-progress: true

jobs:
  repair:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp15-natural-repair-v2-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Patch canonical lake shape and evidence targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}: {old[:90]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('src/hydrology.ts',
          '''export type DrainagePoint = { x: number; z: number; bed: number };
          export type DrainageRecipe = {
            code: string;
            continentId: number;
            points: DrainagePoint[];
            tributary: DrainagePoint[];
            width: number;
            lake: { x: number; z: number; radius: number; level: number } | null;
            outlet: "ocean" | "lake";
          };''',
          '''export type DrainagePoint = { x: number; z: number; bed: number };
          export type DrainageLake = {
            x: number;
            z: number;
            radius: number;
            level: number;
            phase: number;
            elongation: number;
            rotation: number;
          };
          export type DrainageRecipe = {
            code: string;
            continentId: number;
            points: DrainagePoint[];
            tributary: DrainagePoint[];
            width: number;
            lake: DrainageLake | null;
            outlet: "ocean" | "lake";
          };''')

          replace_once('src/hydrology.ts',
          '''function lerp(a: number, b: number, t: number) {
            return a + (b - a) * t;
          }
          function sphericalNoise''',
          '''function lerp(a: number, b: number, t: number) {
            return a + (b - a) * t;
          }
          /** Canonical deterministic shoreline radius shared by queries and rendering. */
          export function drainageLakeRadiusAt(lake: DrainageLake, angle: number) {
            const local = angle - lake.rotation,
              c = Math.cos(local),
              s = Math.sin(local),
              major = 1 + lake.elongation,
              minor = 1 - lake.elongation * 0.45,
              ellipse =
                lake.radius /
                Math.sqrt((c * c) / (major * major) + (s * s) / (minor * minor)),
              irregular =
                1 +
                0.1 * Math.sin(angle * 3 + lake.phase) +
                0.06 * Math.sin(angle * 5 - lake.phase * 0.61) +
                0.035 * Math.cos(angle * 7 + lake.phase * 1.37);
            return Math.max(lake.radius * 0.68, ellipse * irregular);
          }
          function sphericalNoise''')

          replace_once('src/hydrology.ts',
          '''            ? {
                x: lakePoint.x,
                z: lakePoint.z,
                radius: 64 + addressed(`${key}/lake-radius`) * 96,
                level: Math.min(
                  lakePoint.bed + 0.35,
                  naturalElevationAt(lakePoint.x, lakePoint.z) - 0.45,
                ),
              }
            : null;''',
          '''            ? {
                x: lakePoint.x,
                z: lakePoint.z,
                radius: 64 + addressed(`${key}/lake-radius`) * 96,
                level: Math.min(
                  lakePoint.bed + 0.35,
                  naturalElevationAt(lakePoint.x, lakePoint.z) - 0.45,
                ),
                phase: addressed(`${key}/lake-phase`) * Math.PI * 2,
                elongation: 0.05 + addressed(`${key}/lake-elongation`) * 0.13,
                rotation: addressed(`${key}/lake-rotation`) * Math.PI * 2,
              }
            : null;''')

          replace_once('src/hydrology.ts',
          '''      if (recipe.lake) {
        const distance =
          Math.hypot(wrapSourceX(canonicalX - recipe.lake.x), z - recipe.lake.z) -
          recipe.lake.radius;
        if (distance < best.distance)''',
          '''      if (recipe.lake) {
        const lakeDx = wrapSourceX(canonicalX - recipe.lake.x),
          lakeDz = z - recipe.lake.z,
          shoreRadius = drainageLakeRadiusAt(recipe.lake, Math.atan2(lakeDz, lakeDx)),
          distance = Math.hypot(lakeDx, lakeDz) - shoreRadius;
        if (distance < best.distance)''')

          replace_once('src/surface.ts',
          '''export {
            drainageRecipeAt,
            drainageRecipesNear,''',
          '''export {
            drainageLakeRadiusAt,
            drainageRecipeAt,
            drainageRecipesNear,''')
          replace_once('src/surface.ts',
          '''export type {
            DrainagePoint,
            DrainageRecipe,''',
          '''export type {
            DrainageLake,
            DrainagePoint,
            DrainageRecipe,''')

          replace_once('src/terrain-refine.ts',
          '''import {
            drainageRecipesNear,
            surfaceAt,''',
          '''import {
            drainageLakeRadiusAt,
            drainageRecipesNear,
            surfaceAt,''')
          replace_once('src/terrain-refine.ts',
          '''  const x = unwrapNear(lake.x, tile.minX + tile.size / 2),
            radius = lake.radius;
          if (
            x + radius < tile.minX ||
            x - radius > tile.minX + tile.size ||
            lake.z + radius < tile.minZ ||
            lake.z - radius > tile.minZ + tile.size
          )
            return;
          const y = Math.max(0.08, lake.level + 0.14),
            center: Vertex = { point: [x, y, lake.z], tint: LAKE_WATER },
            sides = 40;
          for (let i = 0; i < sides; i++) {
            const a = (i / sides) * Math.PI * 2,
              b = ((i + 1) / sides) * Math.PI * 2,
              va: Vertex = {
                point: [x + Math.cos(a) * radius, y, lake.z + Math.sin(a) * radius],
                tint: LAKE_WATER,
              },
              vb: Vertex = {
                point: [x + Math.cos(b) * radius, y, lake.z + Math.sin(b) * radius],
                tint: LAKE_WATER,
              };
            pushTriangle(positions, normals, colors, indices, center, va, vb);
          }''',
          '''  const x = unwrapNear(lake.x, tile.minX + tile.size / 2),
            maxRadius = lake.radius * 1.45;
          if (
            x + maxRadius < tile.minX ||
            x - maxRadius > tile.minX + tile.size ||
            lake.z + maxRadius < tile.minZ ||
            lake.z - maxRadius > tile.minZ + tile.size
          )
            return;
          const y = Math.max(0.08, lake.level + 0.14),
            center: Vertex = { point: [x, y, lake.z], tint: LAKE_WATER },
            sides = 64;
          for (let i = 0; i < sides; i++) {
            const a = (i / sides) * Math.PI * 2,
              b = ((i + 1) / sides) * Math.PI * 2,
              radiusA = drainageLakeRadiusAt(lake, a),
              radiusB = drainageLakeRadiusAt(lake, b),
              va: Vertex = {
                point: [x + Math.cos(a) * radiusA, y, lake.z + Math.sin(a) * radiusA],
                tint: LAKE_WATER,
              },
              vb: Vertex = {
                point: [x + Math.cos(b) * radiusB, y, lake.z + Math.sin(b) * radiusB],
                tint: LAKE_WATER,
              };
            pushTriangle(positions, normals, colors, indices, center, va, vb);
          }''')

          replace_once('tests/hydrology.test.ts',
          '''import {
            drainageRecipeAt,
            freshwaterDistanceAt,''',
          '''import {
            drainageLakeRadiusAt,
            drainageRecipeAt,
            freshwaterDistanceAt,''')
          replace_once('tests/hydrology.test.ts',
          '''  assert.deepEqual(repeated, first);
          });

          test("surface identity is wrap-safe''',
          '''  assert.deepEqual(repeated, first);
          });

          test("local freshwater lakes use deterministic non-circular canonical shorelines", () => {
            const lake = generatedRecipes().find((recipe) => recipe.lake)?.lake;
            assert.ok(lake, "expected a seeded local lake");
            const radii = Array.from({ length: 32 }, (_, index) =>
              drainageLakeRadiusAt(lake, (index / 32) * Math.PI * 2),
            );
            assert.ok(Math.max(...radii) - Math.min(...radii) > lake.radius * 0.12);
            assert.deepEqual(
              radii,
              Array.from({ length: 32 }, (_, index) =>
                drainageLakeRadiusAt(lake, (index / 32) * Math.PI * 2),
              ),
            );
          });

          test("surface identity is wrap-safe''')

          replace_once('tools/wp15_targets.ts',
          '''  SOURCE_PRESENTATION_POLE_DISTANCE,
            sourceToLonLat,''',
          '''  SOURCE_PRESENTATION_POLE_DISTANCE,
            SOURCE_PRESENTATION_RADIUS,
            sourceToLonLat,''')
          replace_once('tools/wp15_targets.ts',
          '''let cliffPoint: DrainagePoint | undefined;
          const cliffRadii = [0, 24, 48, 72, 96, 128, 160, 224, 320, 448, 640] as const;
          const cliffDirections = 16;
          outer: for (const mountain of MACRO_PLAN.mountainSystems) {
            for (const anchor of mountain.path) {
              const centre = lonLatToSource(anchor.lon, anchor.lat);
              for (const radius of cliffRadii) {
                const directions = radius === 0 ? 1 : cliffDirections;
                for (let direction = 0; direction < directions; direction++) {
                  const angle = (direction / cliffDirections) * Math.PI * 2,
                    x = centre.x + Math.cos(angle) * radius,
                    z = centre.z + Math.sin(angle) * radius;
                  if (z <= -SOURCE_PRESENTATION_POLE_DISTANCE || z >= SOURCE_PRESENTATION_POLE_DISTANCE)
                    continue;
                  const sample = surfaceAt(x, z);
                  if (!sample.cliff) continue;
                  cliffPoint = { x, z, bed: sample.elevation };
                  break outer;
                }
              }
            }
          }''',
          '''let cliffPoint: DrainagePoint | undefined,
            cliffClearance = -Infinity;
          const cliffRadii = [0, 24, 48, 72, 96, 128, 160, 224, 320, 448, 640] as const;
          const cliffDirections = 16;
          for (const mountain of MACRO_PLAN.mountainSystems) {
            for (const anchor of mountain.path) {
              const centre = lonLatToSource(anchor.lon, anchor.lat);
              for (const radius of cliffRadii) {
                const directions = radius === 0 ? 1 : cliffDirections;
                for (let direction = 0; direction < directions; direction++) {
                  const angle = (direction / cliffDirections) * Math.PI * 2,
                    x = centre.x + Math.cos(angle) * radius,
                    z = centre.z + Math.sin(angle) * radius;
                  if (z <= -SOURCE_PRESENTATION_POLE_DISTANCE || z >= SOURCE_PRESENTATION_POLE_DISTANCE)
                    continue;
                  const sample = surfaceAt(x, z),
                    macro = MACRO_PLAN.continents.length ? null : null;
                  if (!sample.cliff || sample.water !== "none") continue;
                  const land = sourceToLonLat(x, z),
                    coast = Math.max(0, MACRO_PLAN.continents.length && SOURCE_PRESENTATION_RADIUS ? sample.freshwaterDistance : 0),
                    clearance = Math.min(sample.freshwaterDistance, 1e9);
                  void macro; void land; void coast;
                  if (clearance > cliffClearance) {
                    cliffClearance = clearance;
                    cliffPoint = { x, z, bed: sample.elevation };
                  }
                }
              }
            }
          }''')
          replace_once('tools/wp15_targets.ts',
          '''const mountain = [...MACRO_PLAN.mountainSystems].sort(
            (a, b) => b.reliefM - a.reliefM || (a.code < b.code ? -1 : 1),
          )[0];
          if (!mountain) throw new Error("Visual evidence requires a seeded mountain system");''',
          '''const mountain =
            [...MACRO_PLAN.mountainSystems]
              .filter((system) => system.path.length >= 4 && system.kind !== "volcano")
              .sort(
                (a, b) =>
                  b.reliefM * b.lengthRad - a.reliefM * a.lengthRad ||
                  (a.code < b.code ? -1 : 1),
              )[0] ?? [...MACRO_PLAN.mountainSystems].sort((a, b) => b.reliefM - a.reliefM)[0];
          if (!mountain) throw new Error("Visual evidence requires a seeded mountain system");
          const mountainTarget = mountain.path[Math.floor(mountain.path.length / 2)] ?? mountain.center;''')
          replace_once('tools/wp15_targets.ts', '  mountain: mountain.center,', '  mountain: mountainTarget,')

          replace_once('.github/workflows/wp15-visual-evidence.yml',
                       'window.advisorWorld.setHalfHeight(1200);settle;shot:mountain-range',
                       'window.advisorWorld.setHalfHeight(1900);settle;shot:mountain-range')
          replace_once('.github/workflows/wp15-visual-evidence.yml',
                       'window.advisorWorld.setHalfHeight(170);settle;shot:cliff-street',
                       'window.advisorWorld.setHalfHeight(260);settle;shot:cliff-street')
          PY
      - name: Install
        run: npm ci
      - name: Targeted natural-surface regression
        run: node --experimental-strip-types --test tests/hydrology.test.ts tests/terrain-refine.test.ts tests/surface-presentation.test.ts
      - name: Validate evidence target selection
        run: node --experimental-strip-types tools/wp15_targets.ts
      - name: Build
        run: npm run build
      - name: Commit tested repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git rm -f .github/workflows/wp15-natural-shape-repair.yml .github/workflows/wp15-natural-shape-repair-v2.yml
          git add src/hydrology.ts src/surface.ts src/terrain-refine.ts tests/hydrology.test.ts tools/wp15_targets.ts .github/workflows/wp15-visual-evidence.yml
          git commit -m "WP-S002-004-005 naturalize canonical lakes and visual targets"
          git push origin HEAD:agent1/wp15-natural-repair-v2-final
