name: WP15 fix adaptive syntax

on:
  push:
    branches:
      - agent1/wp-s002-004-005-current-main
    paths:
      - ".github/workflows/wp15-fix-adaptive-syntax.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-current-main
          fetch-depth: 0
      - name: Correct transcription
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/village-routes.ts')
          s = p.read_text()
          replacements = {
            "    (clearance) => projectedDrainageBankPoint(path, segmentIndex, t, sideB',\n    baseClearance,": "    (clearance) => projectedDrainageBankPoint(path, segmentIndex, t, sideB, clearance),\n    baseClearance,",
            "  waypoints.push(...drainageHeadCapPoints(path, sideA, sideB',\n  waypoints.push": "  waypoints.push(...drainageHeadCapPoints(path, sideA, sideB, clearance));\n  waypoints.push",
            "    side B,\n    clearance,": "    sideB,\n    clearance,",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected corrupted fragment: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/village-routes.ts
          git commit -m "WP-S003-003-001: correct adaptive bank repair syntax"
          git push origin HEAD:agent1/wp-s002-004-005-current-main
