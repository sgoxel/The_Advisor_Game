      - scripts/world/interior-objects.js
      - scripts/data/world-standards.js
      - scripts/data/terrain-palette.js
      - scripts/data/tile-textures.js
      - scripts/ui/app-ui.js
      - scripts/ui/responsive-control-deck.js
      - scripts/render/texture-assets.js
      - scripts/render/game-renderer.js
      - scripts/render/renderer-contract.js
      - scripts/render/renderer-bootstrap.js
      - scripts/render/runtime-render-quality.js
