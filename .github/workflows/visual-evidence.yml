        description: Commit tools/screenshots output to main
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - tools/screenshot_tool.py
      - tools/requirements.txt
      - .github/workflows/visual-evidence.yml
      - index.html
      - scripts/world/planet-stage.js
      - scripts/world/planet-geography.js
