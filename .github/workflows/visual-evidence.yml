name: Visual Evidence

on:
  workflow_dispatch:
    inputs:
      target:
        description: URL to capture
        required: true
        default: https://sgoxel.github.io/The_Advisor_Game/
        type: string
      profile:
        description: Viewport profile
        required: true
        default: landscape
        type: choice
        options:
          - landscape
          - portrait
      scenario:
        description: Evidence scenario
        required: true
        default: static
        type: choice
        options:
          - static
          - panel-cycle
          - responsive-cycle
          - camera-pan
          - camera-zoom
          - camera-pan-zoom
          - motion-sequence
          - time-of-day
          - village-reference
          - region-transition
          - save-load
          - npc-conversation-state
          - npc-edge-crossing
      shots:
        description: Requested screenshot count; scenario minimums still apply
        required: true
        default: '1'
        type: string
      publish_to_main:
        description: Commit tools/screenshots output to main
        required: true
        default: false
        type: boolean
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - tools/screenshot_tool.py
      - tools/requirements.txt
      - .github/workflows/visual-evidence.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: visual-evidence-${{ github.repository }}
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/visual-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Verify browser
        run: |
          google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Configure Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Start local game server for push self-test
        if: github.event_name == 'push'
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! >/tmp/advisor-http.pid
          sleep 1

      - name: Resolve capture inputs
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_SCENARIO: ${{ inputs.scenario }}
          INPUT_SHOTS: ${{ inputs.shots }}
          INPUT_PUBLISH: ${{ inputs.publish_to_main }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
        run: |
          target='https://sgoxel.github.io/The_Advisor_Game/'
          profile='landscape'
          scenario='static'
          shots='1'
          publish='false'
          issue=''

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            target="${INPUT_TARGET:-$target}"
            profile="${INPUT_PROFILE:-$profile}"
            scenario="${INPUT_SCENARIO:-$scenario}"
            shots="${INPUT_SHOTS:-$shots}"
            publish="${INPUT_PUBLISH:-false}"
          elif [ "$EVENT_NAME" = 'push' ]; then
            target='http://127.0.0.1:8000/'
            scenario='camera-zoom'
          elif [ "$EVENT_NAME" = 'issue_comment' ]; then
            requested="$(printf '%s' "$COMMENT_BODY" | awk '{print $2}')"
            [ -n "$requested" ] && scenario="$requested"
            issue="$ISSUE_NUMBER"
          fi

          case "$scenario" in
            static|panel-cycle|camera-pan|camera-zoom|camera-pan-zoom|responsive-cycle|motion-sequence|time-of-day|village-reference|region-transition|save-load|npc-conversation-state|npc-edge-crossing) ;;
            *) echo "Unsupported scenario: $scenario" >&2; exit 2 ;;
          esac
          case "$profile" in landscape|portrait) ;; *) echo "Unsupported profile: $profile" >&2; exit 2 ;; esac
          case "$shots" in ''|*[!0-9]*) echo "shots must be an integer" >&2; exit 2 ;; esac

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "scenario=$scenario" >> "$GITHUB_OUTPUT"
          echo "shots=$shots" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"

      - name: Capture screenshots
        shell: bash
        env:
          TARGET: ${{ steps.resolve.outputs.target }}
          PROFILE: ${{ steps.resolve.outputs.profile }}
          SCENARIO: ${{ steps.resolve.outputs.scenario }}
          SHOTS: ${{ steps.resolve.outputs.shots }}
          PUBLISH: ${{ steps.resolve.outputs.publish }}
          ISSUE: ${{ steps.resolve.outputs.issue }}
        run: |
          args=(
            "$TARGET"
            "visual-${SCENARIO}"
            --profile "$PROFILE"
            --scenario "$SCENARIO"
            --shots "$SHOTS"
            --timestamp-names
            --wait-min 1
            --wait-max 1
            --evidence-json "evidence-${SCENARIO}-${GITHUB_RUN_ID}.json"
          )
          if [ -n "$ISSUE" ]; then args+=(--issue "$ISSUE"); fi
          if [ "$PUBLISH" != 'true' ]; then args+=(--no-publish); fi
          python tools/screenshot_tool.py "${args[@]}"

      - name: Upload visual evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-${{ steps.resolve.outputs.scenario }}-${{ github.run_id }}
          path: tools/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Comment run link on Issue
        if: github.event_name == 'issue_comment' && success()
        uses: actions/github-script@v7
        env:
          SCENARIO: ${{ steps.resolve.outputs.scenario }}
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Visual evidence completed for **${process.env.SCENARIO}**. [Open workflow run and artifact](${url}).`
            });
