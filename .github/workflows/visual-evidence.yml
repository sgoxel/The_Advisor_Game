          - portrait
      scenario:
        description: Evidence scenario
        required: true
        default: static
        type: choice
        options:
          - static
          - panel-cycle
          - responsive-cycle
          - camera-pan
          - camera-zoom
          - camera-pan-zoom
          - motion-sequence
          - time-of-day
          - village-reference
          - region-transition
          - save-load
          - npc-conversation-state
          - npc-edge-crossing
          - terrain-natural
          - main-road
          - starting-village
          - building-presentation
          - building-occlusion
          - wp-s001-001
          - wp-s001-004
          - wp-s003-005
          - playcanvas-foundation
          - playcanvas-scene
          - wp-s003-003
          - wp-s003-004-002
          - wp-s003-004-003
          - wp-s003-004-004
          - wp-s003-004-005
          - wp-s003-005-002
          - wp-s003-005-003
          - wp-s003-005-004
