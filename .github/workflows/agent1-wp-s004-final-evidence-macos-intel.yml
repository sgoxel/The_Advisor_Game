name: AGENT1 WP-S004 exact candidate evidence macOS Intel
on:
  push:
    branches: [agent1/wp-s004-001-001-evidence-20261016]
    paths: [.github/workflows/agent1-wp-s004-final-evidence-macos-intel.yml]
permissions:
  contents: read
jobs:
  validate-and-capture-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2a2d3f725f5f5eabf224aa1fe831555d73979a2c
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "2a2d3f725f5f5eabf224aa1fe831555d73979a2c"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/political-atlas.test.ts tests/continuity.test.ts tests/settlement-exterior.test.ts tests/village-morphology-runtime.test.ts tests/wp-s004-world-integration.test.ts tests/final-surface-integration.test.ts
      - run: npm run build
      - name: Browser setup
        run: |
          npx playwright install chromium
          python3 -m pip install playwright==1.63.0 pillow
      - run: npx playwright test --config playwright.webgpu.config.js settlement-icons.spec.js
      - run: npx playwright test --config playwright.fallback.config.js settlement-icons.spec.js
      - name: Capture exact candidate exterior views
        run: |
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi; sleep 1; done
          INIT='Promise.all([import("/src/geography.ts"),import("/src/settlement-exterior.ts"),import("/src/planet.ts")]).then(([g,s,p])=>{window.__samples={};for(const a of ["green","riverside","dispersed-farming"]){const v=g.villages.find(v=>s.settlementExteriorFor(v).archetype===a);if(!v)throw new Error("missing "+a);window.__samples[a]={v}};window.__samples.city={v:g.cities[0]};window.__focus=(x,z,h)=>{const ll=p.sourceToLonLat(x,z);window.advisorWorld.navigation.setFocus(ll.lon,ll.lat);window.advisorWorld.setHalfHeight(h)}})'
          INIT_ESCAPED=$(printf '%s' "$INIT" | sed 's/;/\\;/g')
          DESKTOP="eval:${INIT_ESCAPED};eval:(x=>window.__focus(x.v.x,x.v.z,125))(window.__samples.green);settle;shot:village-green;eval:(x=>window.__focus(x.v.x,x.v.z,130))(window.__samples.riverside);settle;shot:village-riverside;eval:(x=>window.__focus(x.v.x,x.v.z,145))(window.__samples[\"dispersed-farming\"]);settle;shot:village-farming;eval:(x=>window.__focus(x.v.x,x.v.z,430))(window.__samples.city);settle;shot:city-district"
          PHONE="eval:${INIT_ESCAPED};eval:(x=>window.__focus(x.v.x,x.v.z,130))(window.__samples.green);settle;shot:village-mobile;eval:(x=>window.__focus(x.v.x,x.v.z,135))(window.__samples.riverside);settle;shot:riverside-mobile"
          for R in webgpu webgl2; do
            python3 tools/screenshot_tool.py http://127.0.0.1:4174/ --out "test-results/wp-s004-${R}-desktop" --name settlement --profile desktop --renderer "$R" --timeout 360 --steps "$DESKTOP"
            python3 tools/screenshot_tool.py http://127.0.0.1:4174/ --out "test-results/wp-s004-${R}-mobile" --name settlement --profile phone,phone-landscape --renderer "$R" --timeout 360 --steps "$PHONE"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-s004-exact-2a2d3f7-macos-intel-evidence
          path: test-results/
