name: Agent6 WP003 Artifact Export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp003-artifact-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Upload directly inspectable screenshots
        uses: actions/upload-artifact@v4
        with:
          name: agent6-wp003-attempt1-inspection
          path: tools/screenshots/agent6-wp003-attempt1/
          if-no-files-found: error
          retention-days: 1
