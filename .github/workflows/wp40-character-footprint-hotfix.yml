name: WP40 character footprint hotfix
on:
  push:
    paths:
      - .github/workflows/wp40-character-footprint-hotfix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply presentation-only character footprint filter
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/render/playcanvas/app.js')
          s=p.read_text()
          old='''  function syncCharacterBillboards(characters){\n    if(!charactersRoot)return Object.freeze({activeCharacterCount:0,simulatedCharacterCount:0,preparedCharacterCount:characterTextures.size,visibleCharacterIds:Object.freeze([]),visibleProtagonist:false,instances:Object.freeze([])});\n    const desired=new Map();\n    const cameraPosition=camera?.getPosition?.()||new pc.Vec3(13.5,15.5,13.5);\n    let activeCharacterCount=0;\n    const visibleIds=[];\n    const instances=[];\n    for(const raw of characters||[]){\n      const url=characterAssetKey(raw);\n      const point=raw?.point;\n      if(!url||!point)continue;\n      const texture=characterTextures.get(url);\n      if(!texture)continue;\n      const id=String(raw.id||url);'''
          new='''  function characterChunkCoordinate(value,size){\n    const d=BigInt(size),v=BigInt(String(value));\n    let q=v/d,r=v%d;\n    if(r<0n)q-=1n;\n    return Number(q);\n  }\n  function characterInsideActiveTerrain(point){\n    const stats=terrainPreloadManager?.stats?.();\n    const center=stats?.centerChunk;\n    if(!center||!point)return true;\n    const size=Math.max(1,Number(stats.chunkSize||terrainChunkSize()));\n    const radii=terrainActiveRadii();\n    const x=characterChunkCoordinate(point.x,size),y=characterChunkCoordinate(point.y,size);\n    return x>=center.x-radii.x&&x<=center.x+radii.x&&y>=center.y-radii.y&&y<=center.y+radii.y;\n  }\n  function syncCharacterBillboards(characters){\n    if(!charactersRoot)return Object.freeze({activeCharacterCount:0,simulatedCharacterCount:0,preparedCharacterCount:characterTextures.size,visibleCharacterIds:Object.freeze([]),visibleProtagonist:false,suppressedCharacterCount:0,suppressedCharacterIds:Object.freeze([]),instances:Object.freeze([])});\n    const desired=new Map();\n    const cameraPosition=camera?.getPosition?.()||new pc.Vec3(13.5,15.5,13.5);\n    let activeCharacterCount=0;\n    const visibleIds=[];\n    const suppressedIds=[];\n    const instances=[];\n    for(const raw of characters||[]){\n      const url=characterAssetKey(raw);\n      const point=raw?.point;\n      if(!url||!point)continue;\n      const texture=characterTextures.get(url);\n      if(!texture)continue;\n      const id=String(raw.id||url);\n      if(!characterInsideActiveTerrain(point)){suppressedIds.push(id);continue;}'''
          assert old in s, 'syncCharacterBillboards target changed'
          s=s.replace(old,new,1)
          old2='''      visibleCharacterIds:Object.freeze(visibleIds),\n      visibleProtagonist:visibleIds.includes("protagonist"),\n      instances:Object.freeze(instances)'''
          new2='''      visibleCharacterIds:Object.freeze(visibleIds),\n      visibleProtagonist:visibleIds.includes("protagonist"),\n      suppressedCharacterCount:suppressedIds.length,\n      suppressedCharacterIds:Object.freeze(suppressedIds),\n      instances:Object.freeze(instances)'''
          assert old2 in s, 'character telemetry target changed'
          s=s.replace(old2,new2,1)
          old3='''visibleCharacterIds:lastCharacterState.visibleCharacterIds,visibleProtagonist:Boolean(lastCharacterState.visibleProtagonist),instances:lastCharacterState.instances||Object.freeze([]),feetAnchored:true'''
          new3='''visibleCharacterIds:lastCharacterState.visibleCharacterIds,visibleProtagonist:Boolean(lastCharacterState.visibleProtagonist),suppressedCharacterCount:Number(lastCharacterState.suppressedCharacterCount||0),suppressedCharacterIds:lastCharacterState.suppressedCharacterIds||Object.freeze([]),instances:lastCharacterState.instances||Object.freeze([]),feetAnchored:true'''
          assert old3 in s, 'snapshot telemetry target changed'
          s=s.replace(old3,new3,1)
          p.write_text(s)
      - name: Commit correction
        run: |
          git config user.name "AGENT #1"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/render/playcanvas/app.js
          git commit -m "WP-S003-007 keep character billboards on active terrain"
          git push origin HEAD:main
