name: WP15 exact route debug

on:
  push:
    branches:
      - agent1/wp-s002-004-005-current-main
    paths:
      - ".github/workflows/wp15-debug-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-005-current-main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types tools/wp15-route-debug.ts
