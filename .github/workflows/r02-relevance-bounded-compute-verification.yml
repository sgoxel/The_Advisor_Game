name: R02 Relevance-Bounded Compute Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/relevance_bounded_compute.js'
      - 'js/utils.js'
      - 'js/world_hierarchy.js'
      - 'js/political_geography.js'
      - 'js/settlement_evolution.js'
      - 'tests/browser/r02-relevance-bounded-compute.spec.mjs'
      - '.github/workflows/r02-relevance-bounded-compute-verification.yml'
  pull_request:
    paths:
      - 'js/relevance_bounded_compute.js'
      - 'js/utils.js'
      - 'js/world_hierarchy.js'
      - 'js/political_geography.js'
      - 'js/settlement_evolution.js'
      - 'tests/browser/r02-relevance-bounded-compute.spec.mjs'
      - '.github/workflows/r02-relevance-bounded-compute-verification.yml'

permissions:
  contents: read

jobs:
  relevance-bounded-compute-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run relevance-bounded scheduling regression
        run: npx playwright test tests/browser/r02-relevance-bounded-compute.spec.mjs --project=desktop
      - name: Re-run world hierarchy regression
        run: npx playwright test tests/browser/r02-world-hierarchy.spec.mjs --project=desktop
      - name: Re-run political geography regression
        run: npx playwright test tests/browser/r02-political-geography.spec.mjs --project=desktop
      - name: Re-run settlement evolution regression
        run: npx playwright test tests/browser/r02-settlement-evolution.spec.mjs --project=desktop
      - name: Re-run campaign calendar regression
        run: npx playwright test tests/browser/r02-campaign-calendar.spec.mjs --project=desktop
      - name: Run stabilized R01 browser regression
        run: npm run test:browser:r01
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r02-relevance-bounded-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
