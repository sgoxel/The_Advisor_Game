name: WP15 AGENT1 clean v5 port
on:
  push:
    branches: [agent1/wp-s002-004-005-natural-v5]
permissions:
  contents: write
jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Port accepted foundation and apply Attempt 1 visual corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          export GIT_EDITOR=true

          if ! git cherry-pick 4b3d4da2c042271096e814450d87a43af9f8919d; then
            for file in docs/ROUTING.md package.json src/village-routes.ts; do
              if git diff --name-only --diff-filter=U | grep -Fxq "$file"; then
                git checkout --ours -- "$file"
                git add "$file"
              fi
            done
            remaining="$(git diff --name-only --diff-filter=U)"
            if [ -n "$remaining" ]; then
              echo "Unexpected cherry-pick conflicts:"
              echo "$remaining"
              exit 1
            fi
            git cherry-pick --continue
          fi

          git cherry-pick 3a874c8f6f3b7c3287de7be416f198e888867fce
          rm -f .github/workflows/wp15-agent1-eval.yml .github/workflows/wp15-agent1-patch.yml

          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          # Canonical hydrology: more organic paths and one shared variable-width truth.
          replace("src/hydrology.ts", "const RIVER_STEPS = 48;\nconst RIVER_STEP = 165;", "const RIVER_STEPS = 56;\nconst RIVER_STEP = 145;")
          replace(
              "src/hydrology.ts",
              "      0.1 * Math.sin(angle * 3 + lake.phase) +\n      0.06 * Math.sin(angle * 5 - lake.phase * 0.61) +\n      0.035 * Math.cos(angle * 7 + lake.phase * 1.37);",
              "      0.13 * Math.sin(angle * 3 + lake.phase) +\n      0.075 * Math.sin(angle * 5 - lake.phase * 0.61) +\n      0.045 * Math.cos(angle * 7 + lake.phase * 1.37);",
          )
          replace(
              "src/hydrology.ts",
              "  return Math.max(lake.radius * 0.68, ellipse * irregular);\n}\nconst sphericalPhaseCache",
              "  return Math.max(lake.radius * 0.64, ellipse * irregular);\n}\n\n/** Shared canonical river half-width for both traversal queries and rendering. */\nexport function drainageRiverWidthAt(\n  recipe: DrainageRecipe,\n  segmentIndex: number,\n  tributary = false,\n) {\n  const path = tributary ? recipe.tributary : recipe.points,\n    t = path.length <= 2 ? 0 : Math.max(0, Math.min(1, segmentIndex / (path.length - 2))),\n    growth = tributary ? 0.78 + smooth01(t) * 0.24 : 0.68 + smooth01(t) * 0.5,\n    base = recipe.width * (tributary ? 0.62 : 1),\n    phase = addressed(`${recipe.code}/WIDTH-PHASE`) * Math.PI * 2,\n    variation = 1 + Math.sin((segmentIndex + 1) * 0.83 + phase) * 0.075;\n  return base * growth * variation;\n}\nconst sphericalPhaseCache",
          )
          replace(
              "src/hydrology.ts",
              "    amplitude = 0.105 + addressed(`${key}/meander-amplitude`) * 0.105;\n  return (\n    Math.sin(step * 0.39 + phase) * amplitude +\n    Math.sin(step * 0.17 + phase * 1.73) * amplitude * 0.48\n  );",
              "    amplitude = 0.145 + addressed(`${key}/meander-amplitude`) * 0.12;\n  return (\n    Math.sin(step * 0.31 + phase) * amplitude +\n    Math.sin(step * 0.13 + phase * 1.73) * amplitude * 0.52\n  );",
          )
          replace(
              "src/hydrology.ts",
              "                elongation: 0.05 + addressed(`${key}/lake-elongation`) * 0.13,",
              "                elongation: 0.11 + addressed(`${key}/lake-elongation`) * 0.17,",
          )
          replace(
              "src/hydrology.ts",
              "      for (const path of [recipe.points, recipe.tributary]) {\n        for (let i = 0; i < path.length - 1; i++) {\n          const hit = pointDistanceToSegment(canonicalX, z, path[i], path[i + 1]),\n            width = path === recipe.points ? recipe.width : recipe.width * 0.62,",
              "      for (const [pathIndex, path] of [recipe.points, recipe.tributary].entries()) {\n        for (let i = 0; i < path.length - 1; i++) {\n          const hit = pointDistanceToSegment(canonicalX, z, path[i], path[i + 1]),\n            width = drainageRiverWidthAt(recipe, i, pathIndex === 1),",
          )

          # Runtime terrain: use the same variable-width river authority and increase bounded edge fidelity.
          replace(
              "src/terrain-runtime.ts",
              "  drainageLakeRadiusAt,\n  drainageRecipesNear,",
              "  drainageLakeRadiusAt,\n  drainageRiverWidthAt,\n  drainageRecipesNear,",
          )
          replace("src/terrain-runtime.ts", "  for (let i = 0; i < 5; i++) {", "  for (let i = 0; i < 8; i++) {")
          replace(
              "src/terrain-runtime.ts",
              "  path: DrainagePoint[],\n  width: number,\n) {\n  for (let i = 0; i < path.length - 1; i++)\n    pushRiverSegment(\n      positions,\n      normals,\n      colors,\n      indices,\n      tile,\n      path[i],\n      path[i + 1],\n      width,\n    );\n}",
              "  recipe: DrainageRecipe,\n  tributary = false,\n) {\n  const path = tributary ? recipe.tributary : recipe.points;\n  for (let i = 0; i < path.length - 1; i++)\n    pushRiverSegment(\n      positions,\n      normals,\n      colors,\n      indices,\n      tile,\n      path[i],\n      path[i + 1],\n      drainageRiverWidthAt(recipe, i, tributary),\n    );\n}",
          )
          replace("src/terrain-runtime.ts", "    sides = 48;", "    sides = 72;")
          replace(
              "src/terrain-runtime.ts",
              "  if (tile.size <= 32) target = coastal || rugged ? 24 : 16;\n  else if (tile.size <= 64) target = coastal || rugged ? 32 : 24;\n  else if (tile.size <= 128) target = coastal || rugged ? 40 : 30;\n  else if (tile.size <= 256) target = coastal || rugged ? 48 : 36;\n  else target = coastal || rugged ? 40 : 28;",
              "  if (tile.size <= 32) target = coastal || rugged ? 32 : 18;\n  else if (tile.size <= 64) target = coastal || rugged ? 40 : 26;\n  else if (tile.size <= 128) target = coastal || rugged ? 48 : 32;\n  else if (tile.size <= 256) target = coastal || rugged ? 56 : 38;\n  else target = coastal || rugged ? 48 : 30;",
          )
          replace(
              "src/terrain-runtime.ts",
              "  }\n\n  const positions: number[] = [],\n    normals: number[] = [],",
              "  }\n\n  // Smooth presentation normals over neighbouring final-height samples at Province/Village\n  // scales. Geometry and canonical slope/cliff truth are untouched; this removes coherent\n  // grid-frequency ribbing without flattening the actual mountain or cliff silhouette.\n  const smoothingPasses = tile.size >= 128 ? 2 : tile.size >= 64 ? 1 : 0;\n  for (let pass = 0; pass < smoothingPasses; pass++) {\n    const next = grid.map((row) => row.map((vertex) => vertex.normal));\n    for (let iz = 0; iz <= resolution; iz++)\n      for (let ix = 0; ix <= resolution; ix++) {\n        const centre = grid[iz][ix].normal,\n          neighbours = [\n            grid[iz][Math.max(0, ix - 1)].normal,\n            grid[iz][Math.min(resolution, ix + 1)].normal,\n            grid[Math.max(0, iz - 1)][ix].normal,\n            grid[Math.min(resolution, iz + 1)][ix].normal,\n          ];\n        next[iz][ix] = normalize([\n          centre[0] * 4 + neighbours.reduce((sum, n) => sum + n[0], 0),\n          centre[1] * 4 + neighbours.reduce((sum, n) => sum + n[1], 0),\n          centre[2] * 4 + neighbours.reduce((sum, n) => sum + n[2], 0),\n        ]);\n      }\n    for (let iz = 0; iz <= resolution; iz++)\n      for (let ix = 0; ix <= resolution; ix++) grid[iz][ix].normal = next[iz][ix];\n  }\n\n  const positions: number[] = [],\n    normals: number[] = [],",
          )
          replace(
              "src/terrain-runtime.ts",
              "    pushRiverPath(\n      positions,\n      normals,\n      colors,\n      indices,\n      tile,\n      recipe.points,\n      recipe.width,\n    );\n    pushRiverPath(\n      positions,\n      normals,\n      colors,\n      indices,\n      tile,\n      recipe.tributary,\n      recipe.width * 0.62,\n    );",
              "    pushRiverPath(positions, normals, colors, indices, tile, recipe, false);\n    pushRiverPath(positions, normals, colors, indices, tile, recipe, true);",
          )

          # Presentation: restore readable relief now that normals are spatially smoothed.
          replace(
              "src/terrain-polish.ts",
              "      tileSize >= 256 ? 0.035 :\n      tileSize >= 128 ? 0.08 :\n      tileSize >= 64 ? 0.28 : 0.72;",
              "      tileSize >= 256 ? 0.16 :\n      tileSize >= 128 ? 0.24 :\n      tileSize >= 64 ? 0.45 : 0.78;",
          )
          replace(
              "src/terrain-polish.ts",
              "    highlandMaterial = blend(base, HIGHLAND, highland * (tileSize >= 128 ? 0.18 : 0.12)),",
              "    highlandMaterial = blend(base, HIGHLAND, highland * (tileSize >= 128 ? 0.08 : 0.07)),",
          )
          replace(
              "src/terrain-polish.ts",
              "      0.34,\n      steep * (close ? 0.16 : 0.055) +\n        highland * (close ? 0.07 : 0.04) +\n        (surface.cliff ? (close ? 0.08 : 0.018) : 0),",
              "      0.42,\n      steep * (close ? 0.25 : 0.12) +\n        highland * (close ? 0.06 : 0.035) +\n        (surface.cliff ? (close ? 0.12 : 0.04) : 0),",
          )
          replace(
              "src/terrain-polish.ts",
              "      tileSize <= 32 ? 0.78 :\n      tileSize <= 64 ? 0.64 :\n      tileSize <= 128 ? 0.17 : 0.055,\n    altitudeTone = highland * (tileSize >= 128 ? 0.18 : 0.12),\n    slopeTone = steep * (close ? -0.105 : -0.025),",
              "      tileSize <= 32 ? 0.86 :\n      tileSize <= 64 ? 0.76 :\n      tileSize <= 128 ? 0.46 : 0.22,\n    altitudeTone = highland * (tileSize >= 128 ? 0.075 : 0.06),\n    slopeTone = steep * (close ? -0.12 : -0.045),",
          )
          replace(
              "src/terrain-polish.ts",
              "      Math.min(1.2, 0.94 + altitudeTone + slopeTone + (light - 0.86) * normalContrast),",
              "      Math.min(1.2, 0.985 + altitudeTone + slopeTone + (light - 0.86) * normalContrast),",
          )
          PY

          rm -f .github/workflows/wp15-agent1-port-v5.yml
          git add -A
          git commit -m "WP-S002-004-005 natural terrain v5 attempt 1"
          git push origin HEAD:agent1/wp-s002-004-005-natural-v5
