name: WP-S013-010 Rank-Aware Local Access Evidence
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/world/protagonist-rank-access.js"
      - "scripts/world/object-interactions.js"
      - "scripts/world/contextual-reactions.js"
      - "scripts/ui/app-ui.js"
      - "scripts/tests/wp-s013-010-rank-aware-access.test.js"
      - "tools/wp_s013_010_evidence.py"
      - ".github/workflows/wp-s013-010-rank-aware-access.yml"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: wp-s013-010-${{ github.sha }}
  cancel-in-progress: false
jobs:
  functional:
    if: github.event_name != 'issue_comment' || (github.event.issue.number == 273 && contains(github.event.comment.body, '/wp-s013-010-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Syntax + authority boundary tests
        run: |
          node --check scripts/world/protagonist-rank-access.js
          node --check scripts/world/object-interactions.js
          node --check scripts/world/contextual-reactions.js
          node --check scripts/ui/app-ui.js
          node --check scripts/tests/wp-s013-010-rank-aware-access.test.js
          python -m py_compile tools/wp_s013_010_evidence.py
          node scripts/tests/wp-s013-010-rank-aware-access.test.js
          node tools/tests/wp-s004-008-contextual-reactions.test.js
          node scripts/tests/wp-s013-007-protagonist-status-obligations.test.js
          node scripts/tests/wp-s013-009-advisor-rank-readout.test.js
  visual:
    needs: functional
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m http.server 8000 --bind 127.0.0.1 >/tmp/wp-s013-010-http.log 2>&1 &
      - name: Capture fresh access + NPC reaction evidence
        env: {TARGET: "http://127.0.0.1:8000/", OUT: "tools/screenshots/wp-s013-010"}
        run: python tools/wp_s013_010_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-s013-010-rank-access-${{ github.sha }}
          path: tools/screenshots/wp-s013-010/
          if-no-files-found: error
          retention-days: 14
      - name: Verify exact product is live on GitHub Pages
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="accepted"; grep -q 'WP-S013-010.*COMPLETED' docs/ROADMAP.md && MODE="completed" || true
          for attempt in $(seq 1 72); do
            curl -fsSL --max-time 20 "$BASE/scripts/world/protagonist-rank-access.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-rank.js || true
            curl -fsSL --max-time 20 "$BASE/scripts/world/object-interactions.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-object.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product=0; state=0
            grep -q 'VERSION="protagonist-rank-access-v2"' /tmp/live-rank.js 2>/dev/null && grep -q 'VERSION="world-object-interactions-v2"' /tmp/live-object.js 2>/dev/null && grep -q 'protagonist-rank-access.js?v=protagonist-rank-access-v2' /tmp/live-index.html 2>/dev/null && product=1 || true
            if [ "$MODE" = completed ]; then grep -q 'WP-S013-010.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state=1 || true; else state=1; fi
            [ "$product" -eq 1 ] && [ "$state" -eq 1 ] && exit 0
            sleep 5
          done
          exit 1
      - name: Comment Issue 273
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body='AGENT #6 WP-S013-010 exact-head workflow: **${{ job.status }}**\nCommit: '+context.sha+'\nRun: https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId+'\nFunctional authority tests, fresh phone/desktop screenshots, and public Pages verification were attempted.';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:273,body});
