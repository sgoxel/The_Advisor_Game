name: Agent6 WP008008 Attempt1 Evidence Patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp008008-attempt1-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp008008-attempt1-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Relax stale exact-tier evidence assumption
        run: |
          python tools/agent6_wp008008_attempt1_patch.py
          python -m py_compile tools/wp_s003_008_008_evidence.py tools/screenshot_tool.py
          git diff --check
      - name: Commit WP-008-008 evidence correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/wp_s003_008_008_evidence.py tools/screenshot_tool.py
          if git diff --cached --quiet; then
            echo "WP-008-008 evidence correction already current"
            exit 0
          fi
          git commit -m "test(WP-S003-008-008): accept refined wider-view marker"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
