name: Agent6 WP008008 Final Docs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent6-wp008008-attempt1-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp008008-final-docs
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record accepted evidence and clean run helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          apply_changes() {
            python - <<'PY'
          from pathlib import Path

          changelog = Path("docs/changelog.txt")
          change_line = (
              "2026-10-03 04:39 +03:00 | AGENT #6 | WP-S003-008-008 | MIXED ACCEPTED — "
              "Canonical Places View Targeting + Protagonist Max-Zoom Focus passed exact-main acceptance on "
              "8a71789a0d9aa3b9958e8175f931391753b9af32 via workflow 37085318169; artifact 11260073758 "
              "(sha256:5b848ac061e5158ca20125c340db72d2281aa8d663036332915d7051b7dbeef8). The two-SEED functional matrix "
              "passed bounded targeting, no full-world scan, invalid-coordinate camera stability, mandatory Places classes, "
              "current-position protagonist max zoom with no teleport, deterministic repeated targeting, stable LOD target, and water-destination coverage. "
              "All five fresh desktop/phone frames were directly inspected; VISUAL 8.4/10 PASS with canonical destination centering, inspectable wider-view protagonist marker, "
              "final ground focus, readable responsive controls, and no major wrong-location/ocean, focus-drift, clipping, or developer-banner defect. "
              "The evidence harness now checks renderer-agnostic inspectability rather than an obsolete exact near-ground-close tier name; gameplay, SEED authority, and renderer behavior are unchanged. "
              "The accepted change is preserved in deployed descendant f7d669b0a4ab0e811ad3578acd97347fcca2d78b; GitHub Pages deploy run 37086057036 succeeded for deployment 6821606156.\n"
          )
          text = changelog.read_text(encoding="utf-8")
          if "WP-S003-008-008 | MIXED ACCEPTED" not in text:
              changelog.write_text(change_line + text, encoding="utf-8")

          suggest = Path("docs/suggest_log.txt")
          suggest_line = (
              "2026-10-03 04:39 +03:00 | WP-S003-008-008 | Phase canonical-focus-acceptance-2 | FUTURE — "
              "Expose a renderer-agnostic protagonist-inspectable semantic in PlanetStage evidence/telemetry so future responsive focus tests consume an explicit presentation contract instead of renderer tier names; "
              "keep the signal read-only, bounded, SEED-deterministic, and separate from camera/world mutation authority. Also consider reducing Local Event chrome density on narrow phones without changing authoritative event content. "
              "Do not implement unless explicitly requested.\n"
          )
          stext = suggest.read_text(encoding="utf-8")
          if "WP-S003-008-008 | Phase canonical-focus-acceptance-2" not in stext:
              suggest.write_text(suggest_line + stext, encoding="utf-8")

          for path in (
              Path(".github/workflows/agent6-wp008008-attempt1-patch.yml"),
              Path(".github/workflows/agent6-wp008008-attempt1-evidence.yml"),
              Path("tools/agent6_wp008008_attempt1_patch.py"),
          ):
              path.unlink(missing_ok=True)
          PY
          }

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            apply_changes
            git add docs/changelog.txt docs/suggest_log.txt .github/workflows tools/agent6_wp008008_attempt1_patch.py
            git diff --cached --check
            if git diff --cached --quiet; then
              echo "WP-008-008 final docs already current"
              exit 0
            fi
            git commit -m "docs(WP-S003-008-008): record accepted evidence"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update detected; retrying on newest head"
          done
          echo "Failed to publish WP-008-008 final docs after bounded retries" >&2
          exit 1
