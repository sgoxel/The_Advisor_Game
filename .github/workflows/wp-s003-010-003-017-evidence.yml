name: WP-S003-010-003-017 Evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wp-s003-010-003-017-evidence.yml
      - tools/test_wp_s003_010_003_017.py
      - scripts/world/planet-stage.js
      - styles/main.css
      - index.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install browser dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Verify browser
        run: google-chrome --version || google-chrome-stable --version || chromium --version

      - name: Start local game
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! >/tmp/advisor-http.pid
          sleep 1

      - name: Run semantic marker evidence
        run: python tools/test_wp_s003_010_003_017.py http://127.0.0.1:8000/ tools/wp_s003_010_003_017_artifact

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-010-003-017-evidence-${{ github.run_id }}
          path: tools/wp_s003_010_003_017_artifact/
          if-no-files-found: warn
          retention-days: 14
