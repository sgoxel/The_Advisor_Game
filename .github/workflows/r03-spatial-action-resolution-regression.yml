name: R03 Spatial Action Resolution Regression

on:
  push:
    branches: [main]
    paths:
      - 'js/action_legality.js'
      - 'js/spatial_action_legality.js'
      - 'js/world_action_resolution.js'
      - 'js/state.js'
      - 'tests/browser/r03-spatial-action-resolution-regression.spec.mjs'
      - 'tests/browser/r03-world-action-resolution.spec.mjs'
      - 'tests/browser/r03-spatial-action-legality.spec.mjs'
      - 'tests/browser/r03-action-intent-legality.spec.mjs'
      - 'tests/browser/r02-authoritative-state.spec.mjs'
      - 'tests/browser/r01-cumulative.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r03-spatial-action-resolution-regression.yml'
  pull_request:
    paths:
      - 'js/action_legality.js'
      - 'js/spatial_action_legality.js'
      - 'js/world_action_resolution.js'
      - 'js/state.js'
      - 'tests/browser/r03-spatial-action-resolution-regression.spec.mjs'
      - 'tests/browser/r03-world-action-resolution.spec.mjs'
      - 'tests/browser/r03-spatial-action-legality.spec.mjs'
      - 'tests/browser/r03-action-intent-legality.spec.mjs'
      - 'tests/browser/r02-authoritative-state.spec.mjs'
      - 'tests/browser/r01-cumulative.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r03-spatial-action-resolution-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spatial-resolution-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: echo "R03-T07 candidate ${GITHUB_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused R03 spatial action resolution regression
        run: npx playwright test tests/browser/r03-spatial-action-resolution-regression.spec.mjs
      - name: Preserve R03 world action resolution integration
        run: npx playwright test tests/browser/r03-world-action-resolution.spec.mjs
      - name: Preserve R03 spatial and base action legality
        run: >-
          npx playwright test
          tests/browser/r03-spatial-action-legality.spec.mjs
          tests/browser/r03-action-intent-legality.spec.mjs
      - name: Preserve authoritative-state boundary
        run: npx playwright test tests/browser/r02-authoritative-state.spec.mjs
      - name: Preserve stabilized R01 cumulative regression
        run: npx playwright test tests/browser/r01-cumulative.spec.mjs
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03-t07-spatial-resolution-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14