name: Agent 6 WP017 microdetail fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent6-wp017-microdetail-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate local presentation outside broad map scales
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/world/planet-stage.js')
          s=p.read_text(encoding='utf-8')
          anchor='  const scalar=clamp(Number(value)||0,ZOOM_MIN,ZOOM_MAX),revealTier=settlementRevealTierForScalar(scalar);'
          insert=anchor+'\n  const requestedScaleIndex=Number(scaleStateForScalar(scalar)?.index??0),broadMapScale=requestedScaleIndex<=5;'
          if anchor not in s:
              raise SystemExit('local presentation scalar anchor not found')
          s=s.replace(anchor,insert,1)
          old='  return Object.freeze({visible:revealTier!=="none"||staticWorldVisible,revealTier,rawLevelIndex:rawIndex,rawLevelId:requestedLevel==="ground"?"ground":level?.id||null,rawStaticWorld:staticWorldVisible});'
          new='  const effectiveRevealTier=broadMapScale?"none":revealTier;\n  return Object.freeze({visible:!broadMapScale&&(effectiveRevealTier!=="none"||staticWorldVisible),revealTier:effectiveRevealTier,requestedScaleIndex,broadMapScale,rawLevelIndex:rawIndex,rawLevelId:requestedLevel==="ground"?"ground":level?.id||null,rawStaticWorld:staticWorldVisible});'
          if old not in s:
              raise SystemExit('local presentation return anchor not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git rm .github/workflows/agent6-wp017-microdetail-fix.yml
          git add scripts/world/planet-stage.js
          git commit -m 'fix(WP-S003-010-003-017): suppress local microdetail at broad map scales'
          git pull --rebase origin main
          git push origin HEAD:main
