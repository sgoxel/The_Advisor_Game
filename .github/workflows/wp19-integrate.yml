name: WP19 branch reconciliation
on:
  push:
    branches: [agent1/wp-s002-004-009-20261011]
    paths:
      - tools/wp19_integrate.py
      - tools/wp19_main_integrate.py
      - .github/workflows/wp19-integrate.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent1/wp-s002-004-009-20261011
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/wp19_integrate.py
      - run: python tools/wp19_main_integrate.py
      - run: git diff --check
      - name: Commit reconciled runtime authority
        run: |
          if git diff --quiet; then
            echo "No reconciliation changes required."
            exit 0
          fi
          git config user.name "AGENT #1"
          git config user.email "163722426+sgoxel@users.noreply.github.com"
          git add src/world.ts src/main.ts src/settlement-render.ts .github/workflows/wp19-acceptance.yml
          git commit -m "[wp19-integrated] reconcile settlement runtime authority"
          git push origin HEAD:agent1/wp-s002-004-009-20261011
