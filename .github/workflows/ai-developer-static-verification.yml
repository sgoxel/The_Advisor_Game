name: AI Developer Static Verification

on:
  push:
    branches: [main]
    paths:
      - 'opencode.json'
      - '.github/AI_AUXILIARY_RULES.md'
      - '.github/WORKER_ROTATION.md'
      - '.github/actions/opencode-nvidia/action.yml'
      - '.github/workflows/ai-developer.yml'
      - '.github/workflows/nvidia-metrics.yml'
      - '.github/workflows/ai-developer-static-verification.yml'
  pull_request:
    paths:
      - 'opencode.json'
      - '.github/AI_AUXILIARY_RULES.md'
      - '.github/WORKER_ROTATION.md'
      - '.github/actions/opencode-nvidia/action.yml'
      - '.github/workflows/ai-developer.yml'
      - '.github/workflows/nvidia-metrics.yml'
      - '.github/workflows/ai-developer-static-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-finalization-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v6

      - name: Parse workflow YAML and OpenCode JSON
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/actions/opencode-nvidia/action.yml"); YAML.load_file(".github/workflows/ai-developer.yml"); YAML.load_file(".github/workflows/nvidia-metrics.yml"); YAML.load_file(".github/workflows/ai-developer-static-verification.yml")'
          python -m json.tool opencode.json >/dev/null

      - name: Verify exact evidence-prefix and verdict parsing cases
        shell: bash
        run: |
          set -euo pipefail
          START='2026-08-28T00:00:00Z'

          evidence_count() {
            local body="$1"
            local prefix="$2"
            jq -cn --arg body "$body" '[{created_at:"2026-08-28T00:00:01Z",body:$body}]' |
              jq --arg start "$START" --arg prefix "$prefix" \
                '[.[] | select(.created_at >= $start) | select(((.body // "") | startswith($prefix)) or ((.body // "") | startswith("**" + $prefix)))] | length'
          }

          verdict_value() {
            local body="$1"
            printf '%s\n' "$body" | sed -n 's/^[[:space:]]*VERDICT:[[:space:]]*//p' | head -n 1 | tr '[:lower:]' '[:upper:]' | xargs || true
          }

          assert_count() {
            local expected="$1"
            local body="$2"
            local prefix="$3"
            local actual
            actual="$(evidence_count "$body" "$prefix")"
            if [ "$actual" != "$expected" ]; then
              echo "Evidence parser mismatch: expected=$expected actual=$actual prefix=$prefix body=$body" >&2
              exit 1
            fi
          }

          assert_count 1 $'AI TEST EVIDENCE:\nGROUNDING: VERIFIED\nVERDICT: PASS' 'AI TEST EVIDENCE:'
          assert_count 1 $'**AI TEST EVIDENCE:**\nGROUNDING: VERIFIED\nVERDICT: FAIL' 'AI TEST EVIDENCE:'
          assert_count 1 $'AI REVIEW EVIDENCE:\nGROUNDING: VERIFIED\nVERDICT: PASS' 'AI REVIEW EVIDENCE:'
          assert_count 1 $'**AI REVIEW EVIDENCE:**\nGROUNDING: VERIFIED\nVERDICT: CHANGES REQUESTED' 'AI REVIEW EVIDENCE:'
          assert_count 0 'Unrelated note mentioning AI TEST EVIDENCE: PASS' 'AI TEST EVIDENCE:'
          assert_count 0 '**NOT AI TEST EVIDENCE: PASS**' 'AI TEST EVIDENCE:'

          [ "$(verdict_value $'AI REVIEW EVIDENCE:\nGROUNDING: VERIFIED\nVERDICT: PASS')" = "PASS" ]
          [ "$(verdict_value $'AI REVIEW EVIDENCE:\nGROUNDING: VERIFIED\nVERDICT: CHANGES REQUESTED')" = "CHANGES REQUESTED" ]
          [ "$(verdict_value $'AI TEST EVIDENCE:\nGROUNDING: VERIFIED\nVERDICT: FAIL')" = "FAIL" ]

      - name: Verify literal repository grounding validation cases
        shell: bash
        run: |
          set -euo pipefail

          validate_grounding() {
            local body="$1"
            printf '%s\n' "$body" | grep -Fxq 'GROUNDING: VERIFIED' || return 1
            local count=0
            while IFS= read -r source_line; do
              [ -n "$source_line" ] || continue
              count=$((count + 1))
              local entry path needle
              entry="${source_line#SOURCE: }"
              path="${entry%% :: *}"
              needle="${entry#* :: }"
              [ "$path" != "$entry" ] || return 1
              [ -n "$path" ] && [ -n "$needle" ] || return 1
              [ -f "$path" ] || return 1
              grep -Fq -- "$needle" "$path" || return 1
            done < <(printf '%s\n' "$body" | sed -n 's/^SOURCE: /SOURCE: /p')
            [ "$count" -gt 0 ]
          }

          VALID=$'AI REVIEW EVIDENCE:\nGROUNDING: VERIFIED\nVERDICT: PASS\nSOURCE: .github/AI_AUXILIARY_RULES.md :: ## Evidence Grounding'
          BAD_FILE=$'AI REVIEW EVIDENCE:\nGROUNDING: VERIFIED\nVERDICT: PASS\nSOURCE: does-not-exist.md :: impossible'
          BAD_TOKEN=$'AI REVIEW EVIDENCE:\nGROUNDING: VERIFIED\nVERDICT: PASS\nSOURCE: .github/AI_AUXILIARY_RULES.md :: wisdom crystals invented token'
          NO_GROUNDING=$'AI REVIEW EVIDENCE:\nVERDICT: PASS\nSOURCE: .github/AI_AUXILIARY_RULES.md :: ## Evidence Grounding'

          validate_grounding "$VALID"
          if validate_grounding "$BAD_FILE"; then echo 'Bad file unexpectedly passed grounding.' >&2; exit 1; fi
          if validate_grounding "$BAD_TOKEN"; then echo 'Bad token unexpectedly passed grounding.' >&2; exit 1; fi
          if validate_grounding "$NO_GROUNDING"; then echo 'Missing grounding marker unexpectedly passed.' >&2; exit 1; fi

      - name: Verify read-only dirty-gate isolation behavior
        shell: bash
        run: |
          set -euo pipefail
          [ -z "$(git status --porcelain)" ]
          cp package.json /tmp/nvidia-readonly-package.json
          printf '%s\n' '/*' >> .git/info/exclude
          git update-index --skip-worktree package.json
          printf '\n' >> package.json
          printf 'disposable\n' > nvidia-readonly-test-output.tmp

          if [ -n "$(git status --porcelain)" ]; then
            echo 'skip-worktree/untracked isolation did not keep the upstream dirty gate clean.' >&2
            git status --short >&2
            exit 1
          fi

          git update-index --no-skip-worktree package.json
          cp /tmp/nvidia-readonly-package.json package.json
          git diff --exit-code -- package.json
          [ -z "$(git status --porcelain --untracked-files=no)" ]

      - name: Guard Super Reviewer/Tester-only preflight policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          workflow = Path('.github/workflows/ai-developer.yml').read_text(encoding='utf-8')
          metrics = Path('.github/workflows/nvidia-metrics.yml').read_text(encoding='utf-8')
          rotation = Path('.github/WORKER_ROTATION.md').read_text(encoding='utf-8')
          action = Path('.github/actions/opencode-nvidia/action.yml').read_text(encoding='utf-8')
          rules = Path('.github/AI_AUXILIARY_RULES.md').read_text(encoding='utf-8')
          config = json.loads(Path('opencode.json').read_text(encoding='utf-8'))

          required_workflow = [
              'nvidia/nemotron-3-super-120b-a12b',
              'NVIDIA Coder routing is disabled by Admin policy',
              'reviewer|tester)',
              'gameplay/game-world logic or plausibility review',
              'STRICT GROUNDING:',
              'SOURCE: relative/path :: exact literal token copied from that file',
              'GROUNDING: VERIFIED',
              'Invalid NVIDIA grounding source',
              'Grounding gate verified',
              'RULE CONSISTENCY, GAMEPLAY LOGIC, REAL-WORLD PLAUSIBILITY, INTENTIONAL ABSTRACTION',
              '`VERDICT: PASS` or `VERDICT: CHANGES REQUESTED`',
              '`VERDICT: PASS` or `VERDICT: FAIL`',
              'REQUIRED_PREFIX="AI REVIEW EVIDENCE:"',
              'REQUIRED_PREFIX="AI TEST EVIDENCE:"',
              'startswith("AI-HANDOFF:")',
              'startswith($prefix)) or ((.body // "") | startswith("**" + $prefix))',
              'needs: [triage, reviewer, tester]',
          ]
          missing = [item for item in required_workflow if item not in workflow]
          if missing:
              raise SystemExit(f'Missing expected Reviewer/Tester preflight workflow guard(s): {missing}')

          forbidden_workflow = [
              '\n  coder:\n',
              'needs.coder',
              'REQUIRED_PREFIX="AI CODER EVIDENCE:"',
              "role == 'coder'",
              'coder|reviewer|tester) ;;',
          ]
          present = [item for item in forbidden_workflow if item in workflow]
          if present:
              raise SystemExit(f'Forbidden NVIDIA Coder execution path remains: {present}')

          required_action = [
              'only Reviewer and Tester are executable',
              "printf '%s\\n' '/*' >> .git/info/exclude",
              'npm install --no-save --package-lock=false --ignore-scripts',
              'git update-index --skip-worktree',
              'git update-index --no-skip-worktree',
              'Read-only NVIDIA setup changed tracked repository content.',
              'Read-only NVIDIA worktree is not clean before OpenCode execution.',
          ]
          missing_action = [item for item in required_action if item not in action]
          if missing_action:
              raise SystemExit(f'Missing read-only NVIDIA action guard(s): {missing_action}')
          if 'nvidia/nvidia/nemotron-3-super-120b-a12b' not in action:
              raise SystemExit('Composite action default is not Nemotron 3 Super.')

          if config.get('model') != 'nvidia/nvidia/nemotron-3-super-120b-a12b':
              raise SystemExit('OpenCode default model is not Nemotron 3 Super.')
          models = config.get('provider', {}).get('nvidia', {}).get('models', {})
          if list(models) != ['nvidia/nemotron-3-super-120b-a12b']:
              raise SystemExit(f'Unexpected active NVIDIA provider model set: {list(models)}')

          plan_permission = config.get('agent', {}).get('plan', {}).get('permission', {})
          if plan_permission.get('edit') != 'deny':
              raise SystemExit('NVIDIA plan agent must deny edit/write/patch tools.')
          bash_permission = plan_permission.get('bash', {})
          if bash_permission.get('*') != 'allow':
              raise SystemExit('NVIDIA plan agent bash baseline changed unexpectedly.')
          required_denied = [
              'git add *', 'git commit *', 'git push *', 'git checkout *',
              'git switch *', 'git restore *', 'git reset *', 'git clean *',
              'git rm *', 'git mv *', 'git merge *', 'git rebase *',
              'git cherry-pick *', 'git tag *', 'npm install *', 'npm i *',
              'npm add *', 'npm ci *', 'npm update *', 'npm uninstall *',
              'npm remove *', 'pnpm add *', 'pnpm install *', 'pnpm update *',
              'yarn add *', 'yarn install *', 'yarn up *', 'bun add *',
              'bun install *', '*--update-snapshots*',
          ]
          bad_permissions = [key for key in required_denied if bash_permission.get(key) != 'deny']
          if bad_permissions:
              raise SystemExit(f'NVIDIA plan agent mutation command(s) are not denied: {bad_permissions}')

          required_rules = [
              'NVIDIA may execute only as **Reviewer** or **Tester**',
              'never acts as Coder',
              'Formal Planner Workers alone may change',
              'recommendations are advisory evidence only',
              '## Proactive Utilization and Preflight',
              '## Gameplay Logic and Plausibility Review',
              '## Evidence Grounding',
              'SOURCE: relative/path :: exact literal token copied from that file',
              'GROUNDING: VERIFIED',
              '`VERDICT: CHANGES REQUESTED` is permitted only',
              'RULE CONSISTENCY',
              'GAMEPLAY LOGIC',
              'REAL-WORLD PLAUSIBILITY',
              'INTENTIONAL ABSTRACTION',
              'AI AUXILIARY OPPORTUNITY:',
              'AI AUXILIARY FOLLOW-UP:',
          ]
          missing_rules = [item for item in required_rules if item not in rules]
          if missing_rules:
              raise SystemExit(f'Missing subordinate routing guidance: {missing_rules}')

          required_rotation = [
              'NVIDIA utilization/preflight scan',
              '## NVIDIA preflight utilization',
              'AI AUXILIARY OPPORTUNITY:',
              'AI AUXILIARY FOLLOW-UP:',
              'ai-ready` **last**',
          ]
          missing_rotation = [item for item in required_rotation if item not in rotation]
          if missing_rotation:
              raise SystemExit(f'Missing Worker NVIDIA utilization protocol: {missing_rotation}')

          required_metrics = [
              'CURRENT_POLICY_START:',
              'AI AUXILIARY OPPORTUNITY: ',
              'AI AUXILIARY FOLLOW-UP: ',
              'evidence_verdict',
              'Current Reviewer/Tester policy',
              'Preflight routing opportunities',
              'Formal follow-up agreement',
          ]
          missing_metrics = [item for item in required_metrics if item not in metrics]
          if missing_metrics:
              raise SystemExit(f'Missing NVIDIA metrics/utilization guard(s): {missing_metrics}')
          PY
