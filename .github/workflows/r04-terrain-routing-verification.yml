name: R04 Terrain Routing Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/terrain_routing.js'
      - 'js/npc_terrain_routing_bridge.js'
      - 'js/utils.js'
      - 'tests/browser/r04-terrain-routing.spec.mjs'
      - '.github/workflows/r04-terrain-routing-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r04-terrain-routing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record exact candidate
        run: |
          echo "candidate=${GITHUB_SHA}"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify shared terrain routing
        run: npx playwright test tests/browser/r04-terrain-routing.spec.mjs --project=desktop
      - name: Preserve collision-safe NPC spatial behavior
        run: npx playwright test tests/browser/r04-spatial-world-100.spec.mjs --project=desktop
      - name: Preserve R01 browser compatibility
        run: npx playwright test tests/browser/r01-cumulative.spec.mjs --project=desktop
      - name: Prepare exact-SHA evidence
        if: always()
        run: |
          mkdir -p r04-terrain-routing-evidence
          printf 'candidate=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > r04-terrain-routing-evidence/candidate.txt
          if [ -d playwright-report ]; then cp -R playwright-report r04-terrain-routing-evidence/; fi
          if [ -d test-results ]; then cp -R test-results r04-terrain-routing-evidence/; fi
      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-terrain-routing-${{ github.sha }}
          path: r04-terrain-routing-evidence
          if-no-files-found: error
          retention-days: 14
