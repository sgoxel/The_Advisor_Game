name: Agent6 WP005003 Focus UX

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp005003-focus.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp005003-focus
  cancel-in-progress: false

jobs:
  implement-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evidence dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Wire focus controller through existing protagonist UI bootstrap
        env:
          LOADER_B64: 
        run: |
          set -euo pipefail
          python -c 'import os,base64; from pathlib import Path; p=Path("scripts/ui/protagonist-status-ui.js"); t=p.read_text(encoding="utf-8"); loader=base64.b64decode(os.environ["LOADER_B64"]).decode(); p.write_text(t if "data-protagonist-focus-ui-loader" in t else t+loader,encoding="utf-8")'
      - name: Static contract test
        run: |
          set -euo pipefail
          node --check scripts/ui/protagonist-focus-ui.js
          node tools/tests/wp-s003-010-003-005-003-protagonist-focus-ui.test.js
          git diff --check
      - name: Commit and push product wiring
        id: product
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ui/protagonist-status-ui.js
          if ! git diff --cached --quiet; then
            git commit -m "feat(WP-S003-010-003-005-003): wire protagonist-first focus UX"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Start exact product server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/wp005003-http.log 2>&1 &
          echo $! >/tmp/wp005003-http.pid
          sleep 1
      - name: Functional and fresh visual evidence
        run: |
          set -euo pipefail
          rm -rf tools/screenshots/wp-s003-010-003-005-003
          TARGET=http://127.0.0.1:8000/ python tools/wp_s003_010_003_005_003_evidence.py | tee /tmp/wp005003-evidence.log
          cp /tmp/wp005003-evidence.log tools/screenshots/wp-s003-010-003-005-003/run.log
          printf '%s\n' '${{ steps.product.outputs.sha }}' > tools/screenshots/wp-s003-010-003-005-003/product-sha.txt
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-010-003-005-003-focus-evidence
          path: tools/screenshots/wp-s003-010-003-005-003
          if-no-files-found: warn
          retention-days: 14
