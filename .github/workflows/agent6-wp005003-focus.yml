name: Agent6 WP005003 Focus UX
# AGENT #6 continuation trigger 2026-10-03T17:53:38+03:00

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp005003-focus.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent6-wp005003-focus
  cancel-in-progress: false

jobs:
  implement-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evidence dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Tighten phone-safe soft-follow dead zone
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/ui/protagonist-focus-ui.js')
          t=p.read_text(encoding='utf-8')
          old='const MIN_DEAD_ZONE_METERS=10;'
          new='const MIN_DEAD_ZONE_METERS=2;'
          if old in t:
              t=t.replace(old,new,1)
          elif new not in t:
              raise SystemExit('unexpected protagonist focus dead-zone source')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Static contract test
        run: |
          set -euo pipefail
          node --check scripts/ui/protagonist-focus-ui.js
          node tools/tests/wp-s003-010-003-005-003-protagonist-focus-ui.test.js
          grep -q 'const MIN_DEAD_ZONE_METERS=2;' scripts/ui/protagonist-focus-ui.js
          git diff --check
      - name: Commit and push product fix
        id: product
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ui/protagonist-focus-ui.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(WP-S003-010-003-005-003): keep portrait protagonist inside focus frame"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Start exact product server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/wp005003-http.log 2>&1 &
          echo $! >/tmp/wp005003-http.pid
          sleep 1
      - name: Functional and fresh visual evidence
        run: |
          set -euo pipefail
          rm -rf tools/screenshots/wp-s003-010-003-005-003
          TARGET=http://127.0.0.1:8000/ python tools/wp_s003_010_003_005_003_evidence.py | tee /tmp/wp005003-evidence.log
          cp /tmp/wp005003-evidence.log tools/screenshots/wp-s003-010-003-005-003/run.log
          printf '%s\n' '${{ steps.product.outputs.sha }}' > tools/screenshots/wp-s003-010-003-005-003/product-sha.txt
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-s003-010-003-005-003-focus-evidence-attempt2
          path: tools/screenshots/wp-s003-010-003-005-003
          if-no-files-found: warn
          retention-days: 14
