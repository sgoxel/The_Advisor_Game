name: R04 Character Invariants Combined Regression

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/character_identity.js'
      - 'js/character_age.js'
      - 'js/character_location_context.js'
      - 'js/character_emotion.js'
      - 'js/character_driver_context.js'
      - 'js/character_progression_profile.js'
      - 'js/character_profile_persistence.js'
      - 'js/local_bot_driver.js'
      - 'js/action_legality.js'
      - 'js/protagonist_driver_intent.js'
      - 'js/game_time.js'
      - 'js/campaign_calendar.js'
      - 'js/campaign_persistence.js'
      - 'tests/browser/r04-character-base-identity.spec.mjs'
      - 'tests/browser/r04-character-age.spec.mjs'
      - 'tests/browser/r04-character-location-context.spec.mjs'
      - 'tests/browser/r04-character-emotion.spec.mjs'
      - 'tests/browser/r04-character-driver-context-local-bot.spec.mjs'
      - 'tests/browser/r04-character-progression-profile.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r04-character-invariants-combined-regression.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'js/character_identity.js'
      - 'js/character_age.js'
      - 'js/character_location_context.js'
      - 'js/character_emotion.js'
      - 'js/character_driver_context.js'
      - 'js/character_progression_profile.js'
      - 'js/character_profile_persistence.js'
      - 'js/local_bot_driver.js'
      - 'js/action_legality.js'
      - 'js/protagonist_driver_intent.js'
      - 'js/game_time.js'
      - 'js/campaign_calendar.js'
      - 'js/campaign_persistence.js'
      - 'tests/browser/r04-character-base-identity.spec.mjs'
      - 'tests/browser/r04-character-age.spec.mjs'
      - 'tests/browser/r04-character-location-context.spec.mjs'
      - 'tests/browser/r04-character-emotion.spec.mjs'
      - 'tests/browser/r04-character-driver-context-local-bot.spec.mjs'
      - 'tests/browser/r04-character-progression-profile.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/r04-character-invariants-combined-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-character-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: echo "R04 combined character invariant candidate ${GITHUB_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Preserve deterministic base identity across travel rematerialization and resume
        run: npx playwright test tests/browser/r04-character-base-identity.spec.mjs --project=desktop
      - name: Preserve chronology age save load catch-up and lazy derivation
        run: npx playwright test tests/browser/r04-character-age.spec.mjs --project=desktop
      - name: Preserve birthplace and contrasting current-location context
        run: npx playwright test tests/browser/r04-character-location-context.spec.mjs --project=desktop
      - name: Preserve emotion recovery persistence and lazy reconciliation
        run: npx playwright test tests/browser/r04-character-emotion.spec.mjs --project=desktop
      - name: Preserve unified Local BOT character truth and Simulation legality authority
        run: npx playwright test tests/browser/r04-character-driver-context-local-bot.spec.mjs --project=desktop
      - name: Preserve meaningful progression deltas through real campaign persistence
        run: npx playwright test tests/browser/r04-character-progression-profile.spec.mjs --project=desktop
      - name: Upload combined character invariant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r04-character-invariants-combined-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
