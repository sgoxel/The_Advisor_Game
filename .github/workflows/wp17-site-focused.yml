name: WP17 focused site acceptance
on:
  push:
    branches: [agent1/wp-s002-004-007-site-access]
permissions:
  contents: read
jobs:
  focused:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/political-atlas.test.ts
      - run: npm run build
