name: WP-S012-001 Protagonist Wealth

on:
  push:
    branches: [main]
    paths:
      - "scripts/world/protagonist-wealth.js"
      - "scripts/tests/wp-s012-001-protagonist-wealth.test.js"
      - ".github/workflows/wp-s012-001-protagonist-wealth.yml"
      - "scripts/world/protagonist-profile.js"
      - "scripts/world/protagonist-inventory.js"
      - "scripts/world/protagonist-authority.js"
      - "scripts/world/world-state.js"
      - "scripts/world/campaign-persistence.js"
      - "index.html"
      - "docs/ROADMAP.md"
      - "docs/changelog.txt"
      - "docs/suggest_log.txt"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Authoritative protagonist wealth evidence
        run: node scripts/tests/wp-s012-001-protagonist-wealth.test.js
      - name: Persistence and authority regressions
        run: |
          node tools/tests/wp-s007-009-campaign-persistence.test.js
          node scripts/tests/wp-s008-005-protagonist-command-evaluator.test.js
          node scripts/tests/wp-s008-006-conversation-transactions.test.js
          node scripts/tests/wp-s009-004-protagonist-inventory.test.js
          node scripts/tests/wp-s009-006-protagonist-authority.test.js
          node scripts/tests/wp-s010-003-protagonist-interaction-pipeline.test.js
          node scripts/tests/wp-s011-006-advisor-command.test.js
          node scripts/tests/wp-s011-010-end-to-end-advisor-acceptance.test.js
      - name: Verify exact product is live on GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sgoxel.github.io/The_Advisor_Game"
          MODE="accepted"
          if grep -q 'WP-S012-001.*COMPLETED' docs/ROADMAP.md; then MODE="completed"; fi
          for attempt in $(seq 1 48); do
            curl -fsSL --max-time 20 "$BASE/scripts/world/protagonist-wealth.js?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-wealth.js || true
            curl -fsSL --max-time 20 "$BASE/index.html?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-index.html || true
            curl -fsSL --max-time 20 "$BASE/docs/ROADMAP.md?sha=${GITHUB_SHA}&try=${attempt}" -o /tmp/live-roadmap.md || true
            product_ok=0
            state_ok=0
            grep -q 'VERSION="protagonist-wealth-v1"' /tmp/live-wealth.js 2>/dev/null && \
              grep -q 'scripts/world/protagonist-wealth.js?v=protagonist-wealth-v1' /tmp/live-index.html 2>/dev/null && product_ok=1 || true
            if [ "$MODE" = "completed" ]; then
              grep -q 'WP-S012-001.*COMPLETED' /tmp/live-roadmap.md 2>/dev/null && state_ok=1 || true
            else
              state_ok=1
            fi
            if [ "$product_ok" -eq 1 ] && [ "$state_ok" -eq 1 ]; then
              echo "GitHub Pages exposes WP-S012-001 mode=$MODE for commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not expose the expected WP-S012-001 $MODE markers in time." >&2
          exit 1
      - name: Comment exact run on Issue 243
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const sha = context.sha;
            const url = 'https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId;
            const body = [
              'AGENT #6 WP-S012-001 exact-head workflow: **'+status.toUpperCase()+'**',
              'Commit: '+sha,
              'Run: '+url,
              status === 'success'
                ? 'Authoritative currency/wealth evidence, selected Stage 7–11 persistence/authority regressions, and GitHub Pages product verification passed.'
                : 'Workflow, regression, or GitHub Pages verification failed; WP remains incomplete.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 243,
              body
            });
