name: R02 NPC Life Verification

on:
  push:
    branches: [main]
    paths:
      - 'js/npc_life.js'
      - 'js/npc_world.js'
      - 'js/game_time.js'
      - 'js/utils.js'
      - 'tests/browser/r02-npc-life.spec.mjs'
      - '.github/workflows/r02-npc-life-verification.yml'
  pull_request:
    paths:
      - 'js/npc_life.js'
      - 'js/npc_world.js'
      - 'js/game_time.js'
      - 'js/utils.js'
      - 'tests/browser/r02-npc-life.spec.mjs'
      - '.github/workflows/r02-npc-life-verification.yml'

permissions:
  contents: read

jobs:
  npc-life-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run time-aware NPC life regression
        run: npx playwright test tests/browser/r02-npc-life.spec.mjs
      - name: Re-run NPC world-presence regression
        run: npx playwright test tests/browser/r02-npc-world-presence.spec.mjs
      - name: Re-run authoritative game-time regression
        run: npx playwright test tests/browser/r02-game-time.spec.mjs
      - name: Run stabilized R01 browser regression
        run: npm run test:browser:r01
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r02-t23-npc-life-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
