name: Bootstrap Agent Labels

# Creates the agent:* labels used by agent-dispatch.yml.
# Runs once on the default branch; safe to re-run (idempotent).

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/agent-dispatch.yml"
      - ".github/workflows/bootstrap-labels.yml"
  workflow_dispatch:
  workflow_call:   # allows agent-dispatch.yml to call this as a reusable workflow

permissions:
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'agent:coder',    color: '0075ca', description: 'Dispatch to Copilot as Coder role'    },
              { name: 'agent:designer', color: 'e4e669', description: 'Dispatch to Copilot as Designer role' },
              { name: 'agent:tester',   color: 'd73a4a', description: 'Dispatch to Copilot as Tester role'   },
              { name: 'agent:reviewer', color: '0e8a16', description: 'Dispatch to Copilot as Reviewer role' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
                core.info(`Label "${label.name}" already exists — skipping.`);
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
                core.info(`Created label "${label.name}".`);
              }
            }
