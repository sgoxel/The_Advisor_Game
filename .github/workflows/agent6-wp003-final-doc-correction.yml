name: Agent6 WP003 Final Doc Correction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp003-final-doc-correction.yml"

permissions:
  contents: write

concurrency:
  group: agent6-wp003-final-doc-correction
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct capped final evidence record and self-clean
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path

          changelog=Path('docs/changelog.txt')
          lines=changelog.read_text(encoding='utf-8').splitlines()
          prefix='2026-10-03 17:36 +03:00 | AGENT #6 | WP-S003-010-003 | MIXED INCOMPLETE'
          replacement=('2026-10-03 17:44 +03:00 | AGENT #6 | WP-S003-010-003 | MIXED INCOMPLETE — '
            'Reopened Zoom-Driven Detail Refinement + Off-Screen Eviction continuation reached the three-attempt cap. '
            'Final product commit e90f76bcbee8511fc449fd5d95b050d985015ecd adds deterministic Campaign-SEED/world-meter registered near-ground micro refinement while preserving viewport-bounded ownership and world truth. '
            'Fresh final run 37130258383 / artifact 11275939915 (sha256:7b18e5a239d69cfe02212c5b5d10c226f035c52dc3744a382f82c7dd03d62225) completed successfully; all ten 1365x768 landscape and ten 390x844 real-phone portrait screenshots were retrieved and directly inspected. '
            'VISUAL 6.2/10 FAIL: local/settlement tiers retain useful registered variation, but near-ground-close frames remain broad blurred green forms and ground changes to flatter cel-like patches instead of refining the same readable structures. '
            'Functional boundedness remains intact: missingCoverageCount=0, offscreenFineDetailActive=false, one active detailed resource, two culled outer representations, cache bounded at 8 resources (~18.4 MiB desktop / ~16.2 MiB phone) with no budget overflow, and monotonic physical source density to 0.233 m/texel desktop / 0.199 m/texel phone. '
            'Software close/local preparation remains roughly 5.8–8.9 s with 100 ms recent-max-frame telemetry, so no performance pass is claimed. The corrected evidence harness now proves the requested 390x844 phone viewport. WP remains open; ROADMAP completion state is unchanged.')
          found=False
          for i,line in enumerate(lines):
            if line.startswith(prefix):
              lines[i]=replacement
              found=True
              break
          if not found and not any('37130258383' in line and 'WP-S003-010-003' in line for line in lines):
            lines.insert(0,replacement)
          changelog.write_text('\n'.join(lines)+'\n',encoding='utf-8')

          suggest=Path('docs/suggest_log.txt')
          slines=suggest.read_text(encoding='utf-8').splitlines()
          sprefix='2026-10-03 17:36 +03:00 | WP-S003-010-003 | Phase 3 | FUTURE'
          sreplacement=('2026-10-03 17:44 +03:00 | WP-S003-010-003 | Phase 3 | FUTURE — '
            'Preserve the proven Campaign-SEED coordinate authority, fixed-focus pure zoom, viewport-bounded ownership, off-screen eviction, monotonic physical density, bounded 8-resource cache, and the now-verified 390x844 phone evidence path. '
            'In the next claim, stop deriving close terrain identity mainly from transformed value-noise color fields: derive reusable canonical geomorphology/material structure such as ridge/valley/drainage lines, slope/material regions and registered ground-surface boundaries from the existing world foundation, then refine those same structures by scale without a near-ground/ground presentation reset. '
            'Profile cooperative preparation/caching so close-tier builds no longer require multi-second software preparation. Require fresh desktop and real-phone evidence with VISUAL >=8/10 before changing completion state. Do not implement unless explicitly requested.')
          found=False
          for i,line in enumerate(slines):
            if line.startswith(sprefix):
              slines[i]=sreplacement
              found=True
              break
          if not found and not any('now-verified 390x844 phone evidence path' in line for line in slines):
            slines.insert(0,sreplacement)
          suggest.write_text('\n'.join(slines)+'\n',encoding='utf-8')
          PY
            rm -f .github/workflows/agent6-wp003-final-doc-correction.yml
            git diff --check
            git add -A
            if git diff --cached --quiet; then
              echo "Final capped evidence record already correct."
              exit 0
            fi
            git commit -m "docs(WP-S003-010-003): record final capped evidence"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update detected; retrying ($attempt/5)."
          done
          echo "Unable to publish final capped evidence record after five retries." >&2
          exit 1
