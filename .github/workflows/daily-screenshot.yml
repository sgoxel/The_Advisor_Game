name: Visual Review Capture

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      wait_seconds:
        required: false
        default: ""
        type: string
        description: "Optional fixed pre-capture wait; empty uses random 15-60 seconds"

permissions:
  contents: write

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check selenium

      - id: settings
        shell: bash
        run: |
          set -euo pipefail
          WAIT_MIN="15"
          WAIT_MAX="60"
          MANUAL_WAIT="${{ inputs.wait_seconds }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$MANUAL_WAIT" ]]; then
            [[ "$MANUAL_WAIT" =~ ^[0-9]+([.][0-9]+)?$ ]] || {
              echo "wait_seconds must be numeric" >&2
              exit 1
            }
            WAIT_MIN="$MANUAL_WAIT"
            WAIT_MAX="$MANUAL_WAIT"
          fi

          echo "wait_min=$WAIT_MIN" >> "$GITHUB_OUTPUT"
          echo "wait_max=$WAIT_MAX" >> "$GITHUB_OUTPUT"

      - name: Serve exact commit
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/visual-review-http.log 2>&1 &
          for _ in {1..30}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/visual-review-http.log >&2 || true
          exit 1

      - name: Capture four timestamped screenshots
        shell: bash
        run: |
          set -euo pipefail
          WAIT_MIN="${{ steps.settings.outputs.wait_min }}"
          WAIT_MAX="${{ steps.settings.outputs.wait_max }}"

          python tools/screenshot_tool.py http://127.0.0.1:8000/ phone \
            --profile portrait \
            --shots 2 \
            --interval 0.2 \
            --timestamp-names \
            --wait-min "$WAIT_MIN" \
            --wait-max "$WAIT_MAX" \
            --no-publish

          python tools/screenshot_tool.py http://127.0.0.1:8000/ tablet \
            --profile landscape \
            --shots 2 \
            --interval 0.2 \
            --timestamp-names \
            --wait-min "$WAIT_MIN" \
            --wait-max "$WAIT_MAX" \
            --no-publish

      - name: Verify new capture set
        shell: bash
        run: |
          set -euo pipefail
          PHONE_COUNT=$(find tools/screenshots -maxdepth 1 -type f -name 'phone-[12]-*.png' | wc -l)
          TABLET_COUNT=$(find tools/screenshots -maxdepth 1 -type f -name 'tablet-[12]-*.png' | wc -l)
          [[ "$PHONE_COUNT" -ge 2 ]]
          [[ "$TABLET_COUNT" -ge 2 ]]

      - name: Metadata
        shell: bash
        run: |
          {
            echo "commit_sha=${{ github.sha }}"
            echo "branch=main"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "portrait_viewport=1080x1920"
            echo "landscape_viewport=1920x1080"
            echo "frames_per_viewport=2"
            echo "frame_interval_seconds=0.2"
            echo "camera_zoom=max_out"
            echo "scheduled_wait=random_15_60_seconds"
            echo "max_repository_screenshots=20"
            echo "schedule=every_30_minutes"
          } > tools/screenshots/metadata.txt

      - name: Keep newest 20 screenshots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          directory = Path("tools/screenshots")
          screenshots = list(directory.glob("*.png"))

          def capture_time(path: Path) -> tuple[float, str]:
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%ct", "--", path.as_posix()],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              value = result.stdout.strip()
              if value.isdigit():
                  return float(value), path.name
              return path.stat().st_mtime, path.name

          screenshots.sort(key=capture_time, reverse=True)
          for old_path in screenshots[20:]:
              print(f"Removing old screenshot: {old_path}")
              old_path.unlink()

          remaining = list(directory.glob("*.png"))
          if len(remaining) > 20:
              raise SystemExit(f"Retention failure: {len(remaining)} PNG screenshots remain")
          print(f"Repository screenshot count after retention: {len(remaining)}")
          PY

      - name: Publish screenshots to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- tools/screenshots
          if git diff --cached --quiet -- tools/screenshots; then
            echo "Screenshot evidence is unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "[visual-review] publish four-frame screenshot set for ${{ github.sha }}"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ github.run_id }}
          path: |
            tools/screenshots/phone-[12]-*.png
            tools/screenshots/tablet-[12]-*.png
            tools/screenshots/metadata.txt
          if-no-files-found: error
          retention-days: 30
