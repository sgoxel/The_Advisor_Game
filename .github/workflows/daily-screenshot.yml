name: Visual Review Capture

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      wait_seconds:
        required: false
        default: ""
        type: string
        description: "Optional fixed pre-capture wait; empty uses random 15-60 seconds"
      scenario:
        required: false
        default: "static"
        type: choice
        options:
          - static
          - panel-cycle
          - camera-pan
          - camera-zoom
          - camera-pan-zoom
          - responsive-cycle
          - motion-sequence
          - time-of-day
          - village-reference
          - region-transition
          - save-load
          - npc-conversation-state
          - npc-edge-crossing
        description: "Optional deterministic runtime visual-evidence scenario"
      issue_number:
        required: false
        default: ""
        type: string
        description: "Optional GitHub Issue number recorded in evidence"
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  capture:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.actor == 'sgoxel' && startsWith(github.event.comment.body, '/visual-evidence'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check selenium

      - id: settings
        shell: bash
        run: |
          set -euo pipefail
          WAIT_MIN="15"
          WAIT_MAX="60"
          SCENARIO="static"
          ISSUE_NUMBER=""
          MANUAL_WAIT="${{ inputs.wait_seconds }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SCENARIO="${{ inputs.scenario }}"
            ISSUE_NUMBER="${{ inputs.issue_number }}"
            if [[ -n "$MANUAL_WAIT" ]]; then
              [[ "$MANUAL_WAIT" =~ ^[0-9]+([.][0-9]+)?$ ]] || {
                echo "wait_seconds must be numeric" >&2
                exit 1
              }
              WAIT_MIN="$MANUAL_WAIT"
              WAIT_MAX="$MANUAL_WAIT"
            fi
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            read -r COMMAND REQUESTED_SCENARIO _ <<< "${{ github.event.comment.body }}"
            SCENARIO="${REQUESTED_SCENARIO:-static}"
            ISSUE_NUMBER="${{ github.event.issue.number }}"
            WAIT_MIN="15"
            WAIT_MAX="15"
          fi

          case "$SCENARIO" in
            static|panel-cycle|camera-pan|camera-zoom|camera-pan-zoom|responsive-cycle|motion-sequence|time-of-day|village-reference|region-transition|save-load|npc-conversation-state|npc-edge-crossing) ;;
            *)
              echo "Unsupported scenario: $SCENARIO" >&2
              exit 1
              ;;
          esac

          echo "wait_min=$WAIT_MIN" >> "$GITHUB_OUTPUT"
          echo "wait_max=$WAIT_MAX" >> "$GITHUB_OUTPUT"
          echo "scenario=$SCENARIO" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Serve exact commit
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/visual-review-http.log 2>&1 &
          for _ in {1..30}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/visual-review-http.log >&2 || true
          exit 1

      - name: Capture visual evidence
        shell: bash
        run: |
          set -euo pipefail
          WAIT_MIN="${{ steps.settings.outputs.wait_min }}"
          WAIT_MAX="${{ steps.settings.outputs.wait_max }}"
          SCENARIO="${{ steps.settings.outputs.scenario }}"
          ISSUE_NUMBER="${{ steps.settings.outputs.issue_number }}"

          EXTRA_ARGS=(--scenario "$SCENARIO")
          if [[ -n "$ISSUE_NUMBER" ]]; then
            EXTRA_ARGS+=(--issue "$ISSUE_NUMBER")
          fi
          if [[ "$SCENARIO" != "static" ]]; then
            EXTRA_ARGS+=(--evidence-json "phone-evidence-${{ github.run_id }}.json")
          fi

          python tools/screenshot_tool.py http://127.0.0.1:8000/ phone \
            --profile portrait \
            --shots 2 \
            --interval 0.2 \
            --timestamp-names \
            --wait-min "$WAIT_MIN" \
            --wait-max "$WAIT_MAX" \
            --no-publish \
            "${EXTRA_ARGS[@]}"

          EXTRA_ARGS=(--scenario "$SCENARIO")
          if [[ -n "$ISSUE_NUMBER" ]]; then
            EXTRA_ARGS+=(--issue "$ISSUE_NUMBER")
          fi
          if [[ "$SCENARIO" != "static" ]]; then
            EXTRA_ARGS+=(--evidence-json "tablet-evidence-${{ github.run_id }}.json")
          fi

          python tools/screenshot_tool.py http://127.0.0.1:8000/ tablet \
            --profile landscape \
            --shots 2 \
            --interval 0.2 \
            --timestamp-names \
            --wait-min "$WAIT_MIN" \
            --wait-max "$WAIT_MAX" \
            --no-publish \
            "${EXTRA_ARGS[@]}"

      - name: Verify new capture set
        shell: bash
        run: |
          set -euo pipefail
          PHONE_COUNT=$(find tools/screenshots -maxdepth 1 -type f -name 'phone-*.png' | wc -l)
          TABLET_COUNT=$(find tools/screenshots -maxdepth 1 -type f -name 'tablet-*.png' | wc -l)
          [[ "$PHONE_COUNT" -ge 2 ]]
          [[ "$TABLET_COUNT" -ge 2 ]]

      - name: Metadata
        shell: bash
        run: |
          {
            echo "commit_sha=${{ steps.settings.outputs.commit_sha }}"
            echo "branch=main"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "scenario=${{ steps.settings.outputs.scenario }}"
            echo "issue_number=${{ steps.settings.outputs.issue_number }}"
            echo "portrait_viewport=1080x1920"
            echo "landscape_viewport=1920x1080"
            echo "requested_frames_per_viewport=2"
            echo "frame_interval_seconds=0.2"
            echo "camera_zoom=max_out"
            echo "max_repository_screenshots=20"
            echo "schedule=every_30_minutes"
          } > tools/screenshots/metadata.txt

      - name: Keep newest 20 screenshots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          directory = Path("tools/screenshots")
          screenshots = list(directory.glob("*.png"))

          def capture_time(path: Path) -> tuple[float, str]:
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%ct", "--", path.as_posix()],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              value = result.stdout.strip()
              if value.isdigit():
                  return float(value), path.name
              return path.stat().st_mtime, path.name

          screenshots.sort(key=capture_time, reverse=True)
          for old_path in screenshots[20:]:
              print(f"Removing old screenshot: {old_path}")
              old_path.unlink()

          remaining = list(directory.glob("*.png"))
          if len(remaining) > 20:
              raise SystemExit(f"Retention failure: {len(remaining)} PNG screenshots remain")
          print(f"Repository screenshot count after retention: {len(remaining)}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ github.run_id }}
          path: |
            tools/screenshots/phone-*.png
            tools/screenshots/tablet-*.png
            tools/screenshots/*-evidence-${{ github.run_id }}.json
            tools/screenshots/metadata.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish screenshots to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- tools/screenshots
          if git diff --cached --quiet -- tools/screenshots; then
            echo "Screenshot evidence is unchanged; nothing to publish."
            exit 0
          fi

          git commit -m "[visual-review] publish screenshot evidence for ${{ steps.settings.outputs.commit_sha }}"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt raced with main; rebasing and retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::warning::Evidence artifact succeeded, but repository screenshot publication conflicted with newer main."
              exit 0
            fi
          done

          echo "::warning::Evidence artifact succeeded, but repository screenshot publication could not update main after retries."
          exit 0

      - name: Report issue evidence run
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Visual evidence run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · scenario \`${{ steps.settings.outputs.scenario }}\` · commit \`${{ steps.settings.outputs.commit_sha }}\` · job status \`${{ job.status }}\`."
