name: Visual Review Capture

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      capture_mode:
        required: true
        default: standard
        type: choice
        options: [standard, npc_action]
      wait_seconds:
        required: true
        default: "20"
        type: string

permissions:
  contents: read
  issues: write

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check selenium

      - id: settings
        shell: bash
        run: |
          MODE="standard"; WAIT="20"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.capture_mode }}"; WAIT="${{ inputs.wait_seconds }}"
          fi
          [[ "$MODE" == "standard" || "$MODE" == "npc_action" ]] || exit 1
          [[ "$WAIT" =~ ^[0-9]+([.][0-9]+)?$ ]] || exit 1
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "wait=$WAIT" >> "$GITHUB_OUTPUT"

      - name: Serve exact commit
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/visual-review-http.log 2>&1 &
          for _ in {1..30}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/visual-review-http.log >&2 || true
          exit 1

      - name: Capture
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ steps.settings.outputs.mode }}"
          WAIT="${{ steps.settings.outputs.wait }}"
          SHOTS=1; [[ "$MODE" == "npc_action" ]] && SHOTS=2
          rm -f tools/screenshots/phone*.png tools/screenshots/tablet*.png tools/screenshots/metadata.txt

          python tools/screenshot_tool.py http://127.0.0.1:8000/ phone.png \
            --profile phone --shots "$SHOTS" --interval 0.2 --wait-min "$WAIT" --wait-max "$WAIT"
          python tools/screenshot_tool.py http://127.0.0.1:8000/ tablet.png \
            --profile tablet --shots "$SHOTS" --interval 0.2 --wait-min "$WAIT" --wait-max "$WAIT"

          EXPECTED=$((SHOTS * 2))
          ACTUAL=$(find tools/screenshots -maxdepth 1 -type f \( -name 'phone*.png' -o -name 'tablet*.png' \) | wc -l)
          [[ "$ACTUAL" -eq "$EXPECTED" ]]

      - name: Metadata
        shell: bash
        run: |
          MODE="${{ steps.settings.outputs.mode }}"
          {
            echo "commit_sha=${{ github.sha }}"
            echo "branch=main"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "capture_mode=$MODE"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "phone_viewport=720x1280"
            echo "tablet_viewport=1280x800"
            [[ "$MODE" == "npc_action" ]] && echo "frames_per_viewport=2" || echo "frames_per_viewport=1"
            [[ "$MODE" == "npc_action" ]] && echo "frame_interval_seconds=0.2" || echo "frame_interval_seconds=0"
          } > tools/screenshots/metadata.txt

      - uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ github.run_id }}
          path: |
            tools/screenshots/phone*.png
            tools/screenshots/tablet*.png
            tools/screenshots/metadata.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish evidence pointer
        uses: actions/github-script@v7
        env:
          CAPTURE_MODE: ${{ steps.settings.outputs.mode }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const mode = process.env.CAPTURE_MODE;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              '<!-- non-workflow-issue -->',
              '## Automated Visual Review Evidence',
              '',
              `- Commit: \`${context.sha}\``,
              `- Run: \`${context.runId}\``,
              `- Mode: \`${mode}\``,
              `- Captured: ${new Date().toISOString()}`,
              `- Artifact: \`visual-review-${context.runId}\``,
              '- Phone: `720x1280`',
              '- Tablet: `1280x800`',
              mode === 'npc_action' ? '- Pair interval: `0.2s`' : '- Frames per viewport: `1`',
              '',
              `[Open run](${runUrl})`,
              '',
              'Only evidence matching the tested commit is valid.'
            ].join('\n');

            const title = 'Visual Review: Latest Main Branch Release Screenshot';
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find(i => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
