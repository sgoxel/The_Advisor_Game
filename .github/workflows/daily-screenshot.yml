name: Visual Review Capture

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      capture_mode:
        required: true
        default: standard
        type: choice
        options: [standard, npc_action]
      wait_seconds:
        required: true
        default: "20"
        type: string

permissions:
  contents: write

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check selenium

      - id: settings
        shell: bash
        run: |
          MODE="standard"; WAIT="20"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.capture_mode }}"; WAIT="${{ inputs.wait_seconds }}"
          fi
          [[ "$MODE" == "standard" || "$MODE" == "npc_action" ]] || exit 1
          [[ "$WAIT" =~ ^[0-9]+([.][0-9]+)?$ ]] || exit 1
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "wait=$WAIT" >> "$GITHUB_OUTPUT"

      - name: Serve exact commit
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/visual-review-http.log 2>&1 &
          for _ in {1..30}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/visual-review-http.log >&2 || true
          exit 1

      - id: capture
        name: Capture timestamped screenshots
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ steps.settings.outputs.mode }}"
          WAIT="${{ steps.settings.outputs.wait }}"
          SHOTS=1; [[ "$MODE" == "npc_action" ]] && SHOTS=2
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          PREFIX="review_${STAMP}_${GITHUB_RUN_ID}"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

          python tools/screenshot_tool.py http://127.0.0.1:8000/ "${PREFIX}_phone.png" \
            --profile phone --shots "$SHOTS" --interval 0.2 --wait-min "$WAIT" --wait-max "$WAIT" --no-publish
          python tools/screenshot_tool.py http://127.0.0.1:8000/ "${PREFIX}_tablet.png" \
            --profile tablet --shots "$SHOTS" --interval 0.2 --wait-min "$WAIT" --wait-max "$WAIT" --no-publish

          EXPECTED=$((SHOTS * 2))
          ACTUAL=$(find tools/screenshots -maxdepth 1 -type f -name "${PREFIX}_*.png" | wc -l)
          [[ "$ACTUAL" -eq "$EXPECTED" ]]
          echo "count=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Metadata
        shell: bash
        run: |
          MODE="${{ steps.settings.outputs.mode }}"
          {
            echo "commit_sha=${{ github.sha }}"
            echo "branch=main"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "capture_mode=$MODE"
            echo "capture_prefix=${{ steps.capture.outputs.prefix }}"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "phone_viewport=720x1280"
            echo "tablet_viewport=1280x800"
            echo "max_repository_screenshots=20"
            echo "schedule=every_30_minutes"
            [[ "$MODE" == "npc_action" ]] && echo "frames_per_viewport=2" || echo "frames_per_viewport=1"
            [[ "$MODE" == "npc_action" ]] && echo "frame_interval_seconds=0.2" || echo "frame_interval_seconds=0"
          } > tools/screenshots/metadata.txt

      - name: Keep newest 20 screenshots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          directory = Path("tools/screenshots")
          screenshots = list(directory.glob("*.png"))

          def capture_time(path: Path) -> tuple[float, str]:
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%ct", "--", path.as_posix()],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              value = result.stdout.strip()
              if value.isdigit():
                  return float(value), path.name
              return path.stat().st_mtime, path.name

          screenshots.sort(key=capture_time, reverse=True)
          for old_path in screenshots[20:]:
              print(f"Removing old screenshot: {old_path}")
              old_path.unlink()

          remaining = list(directory.glob("*.png"))
          if len(remaining) > 20:
              raise SystemExit(f"Retention failure: {len(remaining)} PNG screenshots remain")
          print(f"Repository screenshot count after retention: {len(remaining)}")
          PY

      - name: Publish screenshots to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- tools/screenshots
          if git diff --cached --quiet -- tools/screenshots; then
            echo "Screenshot evidence is unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "[visual-review] publish retained screenshots for ${{ github.sha }}"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ github.run_id }}
          path: |
            tools/screenshots/${{ steps.capture.outputs.prefix }}*.png
            tools/screenshots/metadata.txt
          if-no-files-found: error
          retention-days: 30

