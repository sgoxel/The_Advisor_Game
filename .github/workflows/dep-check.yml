name: Dependency Audit

on:
  issues:
    types: [closed]
  schedule:
    - cron: "30 */4 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const closed = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              per_page: 100,
            });
            const completed = new Set(
              closed
                .filter(i => !i.pull_request && i.state_reason === 'completed')
                .map(i => String(i.number))
            );

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            for (const issue of open) {
              if (issue.pull_request) continue;
              const body = issue.body || '';
              if (body.match(/^Status:\s*(.+)$/m)?.[1]?.trim() !== 'DELAYED') continue;

              const raw = body.match(/^Dependency:\s*(.+)$/m)?.[1]?.trim();
              if (!raw || raw === 'NONE') continue;
              const deps = raw.match(/\d+/g) || [];
              if (deps.length === 0 || !deps.every(n => completed.has(n))) continue;

              const marker = `<!-- dependency-audit:${deps.join(',')} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              if (comments.some(c => c.body?.includes(marker))) continue;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `${marker}\n✅ **Dependency audit:** recorded dependencies (${raw}) are completed. Audit only; Status and Claim were not changed. A routine must verify the full resume condition before reactivating this Issue.`
              });
            }
