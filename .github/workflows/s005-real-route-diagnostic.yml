name: S005 real selected-route surface diagnostic
on:
  workflow_dispatch:
  push:
    branches: ["agent1/s005-bank-bridge-profile-20261023"]
    paths: [".github/workflows/s005-real-route-diagnostic.yml"]
permissions:
  contents: read
jobs:
  selected-route:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check exact selected gate to site surface without moving an actor
        run: timeout 9m env S005_ROUTE_FULL_PROBE=1 node --experimental-strip-types --test --test-name-pattern="S005 real non-retracing gate-Y-bridge-site graph chain has exact physical endpoints" tests/transport-network.test.ts
# Candidate two: 7.8% source profile below unchanged 8% physical safety limit.
