name: R04 NPC Distribution Implementation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r04-npc-distribution-repair.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout and sync current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --rebase origin main
          git rev-parse HEAD

      - name: Apply guarded #302 product patch
        run: |
          python - <<'PY'
          from pathlib import Path

          spatial = Path('js/spatial_world.js')
          text = spatial.read_text(encoding='utf-8')
          marker = "    const usedSocialTiles = new Set();\n"
          addition = (
              marker
              + "    // Social/public destinations come from generated settlement structure rather\n"
              + "    // than the protagonist/village-center coordinate. A seed-derived rotation\n"
              + "    // spreads residents across valid building-adjacent road destinations.\n"
              + "    const socialDestinations = buildings.filter((building) => building && building.entrance);\n"
              + "    const socialOffset = socialDestinations.length\n"
              + "      ? integer(seed, 'social-destination-offset', 0, socialDestinations.length - 1)\n"
              + "      : 0;\n"
          )
          if 'social-destination-offset' in text:
              raise SystemExit('spatial_world already contains #302 distribution patch')
          if marker not in text:
              raise SystemExit('spatial_world social marker missing')
          text = text.replace(marker, addition, 1)
          old_line = "      const socialTile = nearestAvailableRoadTile(roads, CENTER, usedSocialTiles);"
          new_lines = (
              "      const socialDestination = socialDestinations.length\n"
              + "        ? socialDestinations[(socialOffset + index * 5) % socialDestinations.length]\n"
              + "        : home;\n"
              + "      const socialTile = nearestAvailableRoadTile(roads, socialDestination.entrance, usedSocialTiles);"
          )
          if old_line not in text:
              raise SystemExit('spatial_world center-biased social line missing')
          spatial.write_text(text.replace(old_line, new_lines, 1), encoding='utf-8')

          runtime = Path('js/npc_spatial_runtime.js')
          text = runtime.read_text(encoding='utf-8')
          old_header = "  function findDialoguePairTiles(village, roads, occupied) {"
          new_header = (
              "  function findDialoguePairTiles(village, roads, occupied, preferredPoints = []) {\n"
              + "    const preferred = preferredPoints.map(point).filter(inBounds);\n"
              + "    const structuralFallback = (village?.buildings || [])\n"
              + "      .map((building) => building?.entrance)\n"
              + "      .filter(Boolean)\n"
              + "      .map(point)\n"
              + "      .filter(inBounds);\n"
              + "    const anchors = preferred.length ? preferred : structuralFallback;"
          )
          if old_header not in text:
              raise SystemExit('npc_spatial dialogue selector header missing')
          text = text.replace(old_header, new_header, 1)
          center_line = "    const center = point(village?.center || { row: 50, col: 50 });\n"
          if center_line not in text:
              raise SystemExit('npc_spatial center line missing')
          text = text.replace(center_line, '', 1)
          old_sort = "    all.sort((a, b) => distance(a, center) - distance(b, center) || a.row - b.row || a.col - b.col);"
          new_sort = (
              "    const nearestAnchorDistance = (candidate) => anchors.length\n"
              + "      ? Math.min(...anchors.map((anchor) => distance(candidate, anchor)))\n"
              + "      : 0;\n"
              + "    all.sort((a, b) => nearestAnchorDistance(a) - nearestAnchorDistance(b) || a.row - b.row || a.col - b.col);"
          )
          if old_sort not in text:
              raise SystemExit('npc_spatial center-distance sort missing')
          text = text.replace(old_sort, new_sort, 1)
          old_call = "    const tiles = findDialoguePairTiles(village, roads, new Set());"
          new_call = (
              "    const preferredDialogueContext = [\n"
              + "      point(npcs[first]?.anchors?.social || npcs[first]),\n"
              + "      point(npcs[second]?.anchors?.social || npcs[second])\n"
              + "    ];\n"
              + "    const tiles = findDialoguePairTiles(village, roads, new Set(), preferredDialogueContext);"
          )
          if old_call not in text:
              raise SystemExit('npc_spatial dialogue call missing')
          runtime.write_text(text.replace(old_call, new_call, 1), encoding='utf-8')
          PY

          node --check js/spatial_world.js
          node --check js/npc_spatial_runtime.js
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependency
        run: npm install --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Coder self-check distributed destinations
        run: npx playwright test tests/browser/r04-npc-distribution.spec.mjs --project=desktop

      - name: Coder self-check occupancy and dialogue regression
        run: npx playwright test tests/browser/r04-spatial-world-100.spec.mjs --project=desktop

      - name: Coder self-check R01 browser regression
        run: npm run test:browser:r01

      - name: Commit product correction and remove one-shot implementation workflow
        run: |
          git rm .github/workflows/r04-npc-distribution-repair.yml
          git add js/spatial_world.js js/npc_spatial_runtime.js
          git diff --cached --check
          git commit -m "Distribute NPC daily-life destinations (#302)"
          git pull --rebase origin main
          git push origin HEAD:main
