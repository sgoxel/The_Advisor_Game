name: R04 NPC Distribution Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r04-npc-distribution-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync exact main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --rebase origin main

      - name: Patch center-biased NPC destinations
        run: |
          python - <<'PY'
          from pathlib import Path

          spatial = Path('js/spatial_world.js')
          text = spatial.read_text(encoding='utf-8')
          old = """    const usedWorkTiles = new Set();
    const usedSocialTiles = new Set();
    const population = OCCUPATIONS.map((occupation, index) => {
      const home = homes[index % homes.length];
      const residentSlot = Math.floor(index / homes.length);
      const workRole = workRoleForOccupation(occupation);
      const workChoices = byRole.get(workRole) || byRole.get('trade') || [buildings[0]];
      const work = workChoices[index % workChoices.length];
      const homeTile = residentHomeTile(home, residentSlot);
      const workTile = nearestAvailableRoadTile(roads, work.entrance, usedWorkTiles);
      const socialTile = nearestAvailableRoadTile(roads, CENTER, usedSocialTiles);
"""
          new = """    const usedWorkTiles = new Set();
    const usedSocialTiles = new Set();
    // Social/public destinations must come from generated world structure, not the
    // protagonist/village-center coordinate. Rotate through every seeded building
    // entrance with a seed-derived offset so the population naturally uses the full
    // settlement footprint while remaining deterministic and road-connected.
    const socialDestinations = buildings.filter((building) => building && building.entrance);
    const socialOffset = socialDestinations.length
      ? integer(seed, 'social-destination-offset', 0, socialDestinations.length - 1)
      : 0;
    const population = OCCUPATIONS.map((occupation, index) => {
      const home = homes[index % homes.length];
      const residentSlot = Math.floor(index / homes.length);
      const workRole = workRoleForOccupation(occupation);
      const workChoices = byRole.get(workRole) || byRole.get('trade') || [buildings[0]];
      const work = workChoices[index % workChoices.length];
      const homeTile = residentHomeTile(home, residentSlot);
      const workTile = nearestAvailableRoadTile(roads, work.entrance, usedWorkTiles);
      const socialDestination = socialDestinations.length
        ? socialDestinations[(socialOffset + index * 5) % socialDestinations.length]
        : home;
      const socialTile = nearestAvailableRoadTile(roads, socialDestination.entrance, usedSocialTiles);
"""
          if old not in text:
              raise SystemExit('spatial_world social destination block did not match current main')
          spatial.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime = Path('js/npc_spatial_runtime.js')
          text = runtime.read_text(encoding='utf-8')
          old = """  function findDialoguePairTiles(village, roads, occupied) {
    const center = point(village?.center || { row: 50, col: 50 });
    const all = Array.from(roads).map((text) => {
      const [r, c] = text.split(',');
      return { row: Number(r), col: Number(c) };
    });
    all.sort((a, b) => distance(a, center) - distance(b, center) || a.row - b.row || a.col - b.col);
    const dirs = [[0,1],[1,0],[0,-1],[-1,0]];
"""
          new = """  function findDialoguePairTiles(village, roads, occupied, preferredPoints = []) {
    const preferred = preferredPoints.map(point).filter(inBounds);
    const structuralFallback = (village?.buildings || [])
      .map((building) => building?.entrance)
      .filter(Boolean)
      .map(point)
      .filter(inBounds);
    const anchors = preferred.length ? preferred : structuralFallback;
    const all = Array.from(roads).map((text) => {
      const [r, c] = text.split(',');
      return { row: Number(r), col: Number(c) };
    });
    const nearestAnchorDistance = (candidate) => anchors.length
      ? Math.min(...anchors.map((anchor) => distance(candidate, anchor)))
      : 0;
    all.sort((a, b) => nearestAnchorDistance(a) - nearestAnchorDistance(b) || a.row - b.row || a.col - b.col);
    const dirs = [[0,1],[1,0],[0,-1],[-1,0]];
"""
          if old not in text:
              raise SystemExit('npc_spatial dialogue tile block did not match current main')
          text = text.replace(old, new, 1)
          old = """    const tiles = findDialoguePairTiles(village, roads, new Set());
    if (!tiles) return null;
"""
          new = """    const preferredDialogueContext = [
      point(npcs[first]?.anchors?.social || npcs[first]),
      point(npcs[second]?.anchors?.social || npcs[second])
    ];
    const tiles = findDialoguePairTiles(village, roads, new Set(), preferredDialogueContext);
    if (!tiles) return null;
"""
          if old not in text:
              raise SystemExit('npc_spatial dialogue plan call did not match current main')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify source invariants and syntax
        run: |
          node --check js/spatial_world.js
          node --check js/npc_spatial_runtime.js
          python - <<'PY'
          from pathlib import Path
          spatial = Path('js/spatial_world.js').read_text(encoding='utf-8')
          runtime = Path('js/npc_spatial_runtime.js').read_text(encoding='utf-8')
          assert "nearestAvailableRoadTile(roads, CENTER, usedSocialTiles)" not in spatial
          assert "social-destination-offset" in spatial
          assert "preferredDialogueContext" in runtime
          assert "distance(a, center) - distance(b, center)" not in runtime
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependencies
        run: npm install --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused 100x100 NPC spatial regression
        run: npx playwright test tests/browser/r04-spatial-world-100.spec.mjs --project=desktop

      - name: Commit product correction
        run: |
          git add js/spatial_world.js js/npc_spatial_runtime.js
          git diff --cached --check
          git commit -m "Distribute NPC daily-life destinations (#302)"
          git push origin main
