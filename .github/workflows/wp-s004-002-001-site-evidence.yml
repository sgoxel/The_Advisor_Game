name: WP-S004-002-001 critical-site evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  webgl2-evidence:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - name: Verify canonical site-access road metadata and bounded terrain profiles
        run: |
          node --experimental-strip-types -e 'import("./src/sites.ts").then(({siteAccessRoads,siteAcceptanceSummary})=>{const max=siteAcceptanceSummary().accessProfileSegmentMaxM;if(max!==75)throw new Error(`Unexpected site access profile segment target ${max}`);for(const road of siteAccessRoads){if(road.networkId!==road.code||road.networkKind!=="link"||road.coarseFallback!==false)throw new Error(`Invalid site access metadata ${road.code}`);const expected=Math.max(1,Math.ceil(road.surfaceLengthM/max))+1;if(road.centerline?.length!==expected)throw new Error(`Unbounded site access profile ${road.code}: ${road.centerline?.length} != ${expected}`)}})'
      - run: npm run build
      - run: npx playwright install chromium
      - name: Install Python screenshot harness
        run: |
          python3 -m venv .venv-evidence
          .venv-evidence/bin/python -m pip install playwright==1.63.0
      - name: Verify site interaction on WebGL2
        run: npx playwright test site.spec.js --config playwright.fallback.config.js
      - name: Capture WebGL2 critical-place evidence
        run: |
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          RUIN='eval:window.__wpSite=window.advisorSites.sites.find(s=>s.kind==="ruin");eval:window.advisorWorld.navigation.setFocus(window.__wpSite.canonicalPosition.lon,window.__wpSite.canonicalPosition.lat);select:#map-scale=1000;settle;eval:window.advisorSites.state.visibleCodes.includes(window.__wpSite.code)||Promise.reject(new Error("Focused ruin not visible at 1/1000"));shot:ruin-1000;select:#map-scale=20;settle;eval:window.advisorSites.state.visibleCodes.includes(window.__wpSite.code)||Promise.reject(new Error("Focused ruin not visible locally"));shot:ruin-local;eval:window.advisorSites.select(window.__wpSite.code);visible:#critical-site-panel;eval:document.getElementById("critical-site-code").textContent===window.__wpSite.code||Promise.reject(new Error("Wrong ruin inspected"));shot:ruin-inspection'
          CRITICAL='eval:window.__wpSite=[...window.advisorSites.sites].filter(s=>s.kind==="critical-place").sort((a,b)=>b.preparedHeightM-a.preparedHeightM||(a.code<b.code?-1:a.code>b.code?1:0))[0];eval:window.advisorWorld.navigation.setFocus(window.__wpSite.canonicalPosition.lon,window.__wpSite.canonicalPosition.lat);select:#map-scale=1000;settle;eval:window.advisorSites.state.visibleCodes.includes(window.__wpSite.code)||Promise.reject(new Error("Focused critical place not visible at 1/1000"));shot:critical-1000;select:#map-scale=20;settle;eval:window.advisorSites.state.visibleCodes.includes(window.__wpSite.code)||Promise.reject(new Error("Focused critical place not visible locally"));shot:critical-local;eval:window.advisorSites.select(window.__wpSite.code);visible:#critical-site-panel;eval:document.getElementById("critical-site-code").textContent===window.__wpSite.code||Promise.reject(new Error("Wrong critical place inspected"));shot:critical-inspection'
          .venv-evidence/bin/python tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp-s004-sites-webgl2 --name sites --profile fullhd-landscape,fullhd-portrait --renderer webgl2 --timeout 240 --steps "$RUIN;click:#close-critical-site;$CRITICAL"
      - name: Record acceptance telemetry
        run: |
          mkdir -p test-results
          node --experimental-strip-types -e 'import("./src/sites.ts").then(m=>console.log(JSON.stringify(m.siteAcceptanceSummary(),null,2)))' | tee test-results/wp-s004-site-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-s004-002-001-site-evidence-webgl2
          path: test-results/

  webgpu-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: python3 -m pip install playwright==1.63.0
      - name: Verify site interaction on WebGPU
        run: npx playwright test site.spec.js --config playwright.webgpu.config.js
      - name: Capture WebGPU critical-place evidence
        run: |
          npm run preview -- --port 4174 > /tmp/advisor-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          RUIN='eval:window.__wpSite=window.advisorSites.sites.find(s=>s.kind==="ruin");eval:window.advisorWorld.navigation.setFocus(window.__wpSite.canonicalPosition.lon,window.__wpSite.canonicalPosition.lat);select:#map-scale=1000;settle;eval:window.advisorSites.state.visibleCodes.includes(window.__wpSite.code)||Promise.reject(new Error("Focused ruin not visible at 1/1000"));shot:ruin-1000;select:#map-scale=20;settle;eval:window.advisorSites.state.visibleCodes.includes(window.__wpSite.code)||Promise.reject(new Error("Focused ruin not visible locally"));shot:ruin-local;eval:window.advisorSites.select(window.__wpSite.code);visible:#critical-site-panel;eval:document.getElementById("critical-site-code").textContent===window.__wpSite.code||Promise.reject(new Error("Wrong ruin inspected"));shot:ruin-inspection'
          CRITICAL='eval:window.__wpSite=[...window.advisorSites.sites].filter(s=>s.kind==="critical-place").sort((a,b)=>b.preparedHeightM-a.preparedHeightM||(a.code<b.code?-1:a.code>b.code?1:0))[0];eval:window.advisorWorld.navigation.setFocus(window.__wpSite.canonicalPosition.lon,window.__wpSite.canonicalPosition.lat);select:#map-scale=1000;settle;eval:window.advisorSites.state.visibleCodes.includes(window.__wpSite.code)||Promise.reject(new Error("Focused critical place not visible at 1/1000"));shot:critical-1000;select:#map-scale=20;settle;eval:window.advisorSites.state.visibleCodes.includes(window.__wpSite.code)||Promise.reject(new Error("Focused critical place not visible locally"));shot:critical-local;eval:window.advisorSites.select(window.__wpSite.code);visible:#critical-site-panel;eval:document.getElementById("critical-site-code").textContent===window.__wpSite.code||Promise.reject(new Error("Wrong critical place inspected"));shot:critical-inspection'
          python3 tools/screenshot_tool.py http://127.0.0.1:4174/ --out test-results/wp-s004-sites-webgpu --name sites --profile fullhd-landscape,fullhd-portrait --renderer webgpu --timeout 240 --steps "$RUIN;click:#close-critical-site;$CRITICAL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp-s004-002-001-site-evidence-webgpu
          path: test-results/

  parity-evidence:
    needs: [webgl2-evidence, webgpu-evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Download WebGL2 runtime site evidence
        uses: actions/download-artifact@v4
        with:
          name: wp-s004-002-001-site-evidence-webgl2
          path: parity/webgl2
      - name: Download WebGPU runtime site evidence
        uses: actions/download-artifact@v4
        with:
          name: wp-s004-002-001-site-evidence-webgpu
          path: parity/webgpu
      - name: Compare browser runtime site authority
        run: |
          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          webgl = json.loads(Path("parity/webgl2/wp-s004-site-parity.json").read_text())
          webgpu = json.loads(Path("parity/webgpu/wp-s004-site-parity.json").read_text())
          height_differences = []

          def compare(left, right, path="$"):
              if type(left) is not type(right):
                  raise AssertionError(f"{path}: type mismatch {type(left).__name__} != {type(right).__name__}")
              if isinstance(left, dict):
                  if left.keys() != right.keys():
                      raise AssertionError(f"{path}: different canonical fields")
                  for key in left:
                      compare(left[key], right[key], f"{path}.{key}")
              elif isinstance(left, list):
                  if len(left) != len(right):
                      raise AssertionError(f"{path}: different canonical array lengths")
                  for index, (a, b) in enumerate(zip(left, right)):
                      compare(a, b, f"{path}[{index}]")
              elif path.startswith("$.sites[") and path.endswith("].preparedHeightM"):
                  # Height is a continuous result recomputed across OS/browser
                  # maths libraries; all identity, position and topology stays exact.
                  if not math.isfinite(left) or not math.isfinite(right) or abs(left - right) > 1e-9:
                      raise AssertionError(f"{path}: prepared height differs beyond 1 nanometre")
                  if left != right:
                      height_differences.append(abs(left - right))
              elif left != right:
                  raise AssertionError(f"{path}: canonical mismatch {left!r} != {right!r}")

          compare(webgl, webgpu)
          print(f"Canonical parity PASS; {len(height_differences)} height roundoff differences; "
                f"maximum absolute delta {max(height_differences, default=0):.3g} m")
          PY
