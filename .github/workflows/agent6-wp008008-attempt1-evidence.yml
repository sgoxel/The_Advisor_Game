name: Agent6 WP008008 Attempt1 Evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent6-wp008008-attempt1-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent6-wp008008-attempt1-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Verify browser
        run: google-chrome --version || google-chrome-stable --version || chromium --version
      - name: Start local game server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/advisor-http.log 2>&1 &
          echo $! >/tmp/advisor-http.pid
          sleep 1
      - name: Run canonical Places/protagonist functional matrix and responsive captures
        run: |
          TARGET="http://127.0.0.1:8000/" OUT="tools/screenshots/wp-s003-008-008-functional" python tools/wp_s003_008_008_evidence.py
          python tools/screenshot_tool.py \
            "http://127.0.0.1:8000/" \
            "visual-wp-s003-008-008" \
            --profile landscape \
            --scenario wp-s003-008-008 \
            --shots 5 \
            --timestamp-names \
            --wait-min 1 \
            --wait-max 1 \
            --evidence-json "evidence-wp-s003-008-008-${GITHUB_RUN_ID}.json" \
            --no-publish \
            --issue 300
      - name: Upload WP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent6-wp008008-attempt1-${{ github.run_id }}
          path: tools/screenshots/
          if-no-files-found: warn
          retention-days: 14

