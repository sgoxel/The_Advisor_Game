name: WP-S005-006 Functional Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/world/character-memory.js
      - scripts/world/dialogue-context.js
      - tools/tests/wp-s005-006-recognition.test.js
      - .github/workflows/wp-s005-006-functional.yml
      - index.html

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check recognition modules
        run: |
          node --check scripts/world/character-memory.js
          node --check scripts/world/dialogue-context.js
      - name: Run recognition persistence proof
        run: node tools/tests/wp-s005-006-recognition.test.js
