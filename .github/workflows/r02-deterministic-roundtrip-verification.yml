name: R02 Deterministic Roundtrip Verification

on:
  push:
    branches: [main]
    paths:
      - 'tests/browser/r02-deterministic-roundtrip.spec.mjs'
      - '.github/workflows/r02-deterministic-roundtrip-verification.yml'
  pull_request:
    paths:
      - 'tests/browser/r02-deterministic-roundtrip.spec.mjs'
      - '.github/workflows/r02-deterministic-roundtrip-verification.yml'

permissions:
  contents: read

jobs:
  deterministic-roundtrip-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: git rev-parse HEAD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned browser test dependency
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deterministic R02 save-load roundtrip regression
        run: npx playwright test tests/browser/r02-deterministic-roundtrip.spec.mjs --project=chromium
      - name: Re-run focused R02 save-load validation
        run: npx playwright test tests/browser/r02-save-load-validation.spec.mjs --project=chromium
      - name: Run stabilized R01 browser regression
        run: npm run test:browser:r01
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r02-t08-roundtrip-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
