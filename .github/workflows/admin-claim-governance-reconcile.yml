name: Admin Claim Governance Reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-claim-governance-reconcile.yml'

permissions:
  contents: write
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply README, planning and Worker protocol reconciliation
        run: python .github/scripts/admin_claim_governance_reconcile.py apply

      - name: Validate patched files
        run: |
          python .github/scripts/admin_claim_governance_reconcile.py validate
          python -m json.tool ROADMAP.json >/dev/null
          python -m json.tool TODO.json >/dev/null
          git diff --check

      - name: Commit Admin governance policy
        id: governance_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ROADMAP.json TODO.json .github/WORKER_ROTATION.md
          if git diff --cached --quiet; then
            echo "No governance file changes were required."
          else
            git commit -m "Admin: enforce claim continuity and 3h stale expiry"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Link ROADMAP/TODO reconciliation to README governance commit
        run: |
          python .github/scripts/admin_claim_governance_reconcile.py link --commit "${{ steps.governance_commit.outputs.sha }}"
          python -m json.tool ROADMAP.json >/dev/null
          python -m json.tool TODO.json >/dev/null
          git diff --check
          git add ROADMAP.json TODO.json
          if git diff --cached --quiet; then
            echo "Planning records already reference the governance commit."
          else
            git commit -m "Planner: reconcile claim governance authority"
            git push origin HEAD:main
          fi

      - name: Reconcile governance controller issue #97
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          url = f"https://api.github.com/repos/{repo}/issues/97"
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'claim-governance-reconcile',
          }
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as r:
              issue = json.load(r)
          body = issue.get('body') or ''
          new_block = '''Strict claim invariant and continuity:
          - `WORK-CLAIM` is an exclusive collision guard only for the one concrete issue/task actively being worked.
          - Before unrelated work, a persistent Worker must inspect its own unfinished claim/responsibility history and resume any own open issue that has a safe authorized owner action. An executable own issue outranks cursor rotation, capacity expansion, easier work, or a new issue.
          - A Worker may hold at most ONE active exclusive `WORK-CLAIM` at a time.
          - A Worker may move to unrelated work only when every unfinished own issue has no safe owner action and is in a genuine evidenced mandatory wait. The Worker records blocker/evidence/resume trigger, clears exclusivity, and retains non-exclusive responsibility so required independent/external work is not blocked.
          - Difficulty, task size, investigation cost, file count, role preference, or context/tool pressure are not mandatory waits.
          - Exclusive claim protection expires automatically after **more than 3 hours** without a qualifying action by the same Worker on the exact issue. Claim creation starts the clock.
          - A qualifying action is concrete same-target progress or a material same-target decision/evidence update. Empty heartbeat/status comments, unchanged blocker repetition, re-fetch-only activity, unrelated issue activity, cursor comments, and unrelated commits do not refresh the clock.
          - Before treating an apparent claim as stale, fetch full exact-target history and timestamps, identify the most recent qualifying same-Worker action, prove >3h inactivity, record `STALE WORK-CLAIM INVALIDATED(...)`, and only then use the normal claim -> immediate re-fetch collision check.
          - A stale claim has zero collision effect and needs no consent from the inactive Worker to expire. Expiry does not erase authorship, independence restrictions, audit history, or historical responsibility.
          - Hard-limit continuation may preserve an executable claim only while this 3-hour validity window remains satisfied; if no qualifying same-target action occurs for >3h, it expires like any other claim.
          - Claim A has zero ownership effect on issue B; never pre-claim, queue-claim, batch-claim, chain-claim, sibling-claim, dependency-claim, phase-claim, role-claim, pass-claim, cycle-claim, cursor-claim, or invocation-claim.

          '''
          pattern = r"Strict claim invariant:\n.*?\nParallel ownership and dependency semantics:"
          replacement = new_block + "Parallel ownership and dependency semantics:"
          updated, count = re.subn(pattern, replacement, body, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"Expected one #97 strict-claim block, found {count}")
          payload = json.dumps({'body': updated}).encode()
          req = urllib.request.Request(url, data=payload, headers={**headers, 'Content-Type': 'application/json'}, method='PATCH')
          with urllib.request.urlopen(req) as r:
              json.load(r)
          print('Issue #97 controller reconciled.')
          PY
