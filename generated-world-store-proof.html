<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Generated World Store Browser Proof</title></head>
<body>
<pre id="status">running</pre>
<script>
window.WorldState={WORLD_GENERATOR_VERSION:"advisor-world-foundation-v1"};
const campaign=Object.freeze({
  seed:"WP_S007_009_001_BROWSER",
  realStartMs:1700000000000,
  fantasyStart:Object.freeze({year:1200,month:1,day:1,hour:8,minute:0,second:0}),
  protagonist:Object.freeze({x:"0",y:"0"}),
  restartCount:0
});
window.SeedSystem={getCampaign:()=>campaign};
window.CampaignPersistence={stored:()=>({ok:true,validation:{serializedBytes:4096}})};
</script>
<script src="scripts/world/generated-world-store.js?v=generated-world-store-v1"></script>
<script>
(async()=>{
  const phase=new URLSearchParams(location.search).get("phase")||"write";
  const status=document.getElementById("status");
  const waitDelete=()=>new Promise((resolve,reject)=>{
    const req=indexedDB.deleteDatabase(GeneratedWorldStore.DB_NAME);
    req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error||new Error("delete failed"));req.onblocked=()=>reject(new Error("delete blocked"));
  });
  try{
    if(phase==="write")await waitDelete();
    const bindStart=performance.now();
    const bound=await GeneratedWorldStore.bindCampaign(campaign,{prime:false});
    const bindMs=performance.now()-bindStart;
    if(!bound.ok||!bound.durable||bound.backend!=="indexeddb")throw new Error("IndexedDB durable backend unavailable: "+JSON.stringify(bound));
    const records=[
      ["country-profile","COUNTRY-A",{id:"COUNTRY-A",revision:"CPF-A"}],
      ["region-profile","REGION-A",{id:"REGION-A",revision:"RPF-A"}],
      ["settlement-plan","SET-A",{id:"SET-A",revision:"SET-A-R1"}],
      ["road-graph","COUNTRY-A|r4|country-partition",{signature:"WRG-A",nodes:11,edges:17}],
      ["poi-cell","12,-7",{signature:"POI-A",results:[{id:"POI-1"}]}],
      ["logical-chunk","4,9",{signature:"CHUNK-A",terrain:["grass","rock","water"]}]
    ];
    let generators=0;
    const resolved=[];
    const resolveStart=performance.now();
    for(const [family,id,value] of records){
      const out=await GeneratedWorldStore.resolve({
        seed:campaign.seed,family,recordId:id,familyVersion:1,dependencySignature:family+"-v1",
        generatorVersion:"advisor-world-foundation-v1",regenCost:5,importance:4
      },async()=>{generators++;return value});
      resolved.push({family,id,source:out.source,generated:out.generated,value:out.value});
    }
    const resolveMs=performance.now()-resolveStart;
    let flush=null;
    if(phase==="write"){
      const flushStart=performance.now();
      flush=await GeneratedWorldStore.flush({maxRecords:32});
      flush={...flush,wallMs:Number((performance.now()-flushStart).toFixed(3))};
      if(!flush.ok||flush.written!==records.length)throw new Error("write flush failed "+JSON.stringify(flush));
      if(generators!==records.length)throw new Error("first session did not generate all records");
    }else{
      if(generators!==0)throw new Error("second browser session regenerated "+generators+" persisted records");
      if(resolved.some(x=>x.generated||x.source!=="persistent"))throw new Error("second-session persistent source mismatch "+JSON.stringify(resolved));
    }
    await GeneratedWorldStore.refreshUsage();
    const telemetry=GeneratedWorldStore.telemetry();
    const evidence={
      pass:true,phase,backend:bound.backend,durable:bound.durable,generatorCalls:generators,
      bindMs:Number(bindMs.toFixed(3)),resolveMs:Number(resolveMs.toFixed(3)),flush,
      persistentCacheRecords:telemetry.persistentCacheRecords,persistentCacheBytes:telemetry.persistentCacheBytes,
      readBatchMs:telemetry.lastReadBatchMs,writeBatchMs:telemetry.lastWriteBatchMs,
      dirtyQueueDepth:telemetry.dirtyQueueDepth,
      sources:resolved.map(x=>({family:x.family,id:x.id,source:x.source,generated:x.generated})),
      signatures:Object.fromEntries(resolved.map(x=>[x.family,JSON.stringify(x.value)]))
    };
    window.__generatedStoreBrowserEvidence=evidence;
    status.textContent=JSON.stringify(evidence,null,2);
    document.documentElement.dataset.ready="true";
  }catch(error){
    const evidence={pass:false,phase,error:String(error?.stack||error)};
    window.__generatedStoreBrowserEvidence=evidence;
    status.textContent=JSON.stringify(evidence,null,2);
    document.documentElement.dataset.ready="failed";
  }
})();
</script>
</body>
</html>
