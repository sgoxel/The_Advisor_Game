<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">R02 persistence and seed-status UX prototype</title>
  <desc id="desc">Vector-only presentation prototype showing desktop normal state, import validation states, and phone layouts while preserving the living strategic map as the primary surface.</desc>
  <defs>
    <pattern id="grid" width="48" height="24" patternUnits="userSpaceOnUse" patternTransform="skewY(-26.565)">
      <path d="M48 0H0V24" fill="none" stroke="#8da08b" stroke-opacity="0.20" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1440" height="1120" fill="#171a18"/>
  <text x="56" y="58" fill="#f4f1e8" font-family="system-ui, sans-serif" font-size="28" font-weight="700">R02 — Persistence &amp; Seed-Status UX Prototype</text>
  <text x="56" y="88" fill="#b9c1b7" font-family="system-ui, sans-serif" font-size="15">Presentation-only reference for #85. Map remains primary; runtime validation remains authoritative.</text>

  <!-- Desktop normal state -->
  <g transform="translate(56 126)">
    <rect width="850" height="410" rx="18" fill="#253128" stroke="#59665b"/>
    <rect x="1" y="1" width="848" height="408" rx="17" fill="url(#grid)"/>
    <path d="M70 315 C210 210 350 360 510 205 S720 120 805 190" fill="none" stroke="#d1b988" stroke-width="10" stroke-opacity="0.35"/>
    <path d="M70 315 C210 210 350 360 510 205 S720 120 805 190" fill="none" stroke="#f0d7a0" stroke-width="3"/>
    <g transform="translate(430 236)">
      <circle r="18" fill="none" stroke="#f2ead9" stroke-width="3"/>
      <path d="M0-11 L11 0 L0 11 L-11 0Z" fill="none" stroke="#f2ead9" stroke-width="2"/>
      <circle r="3" fill="#f2ead9"/>
    </g>
    <rect x="22" y="18" width="806" height="54" rx="12" fill="#111512" fill-opacity="0.88" stroke="#4d5950"/>
    <g font-family="system-ui, sans-serif" fill="#f4f1e8">
      <text x="42" y="51" font-size="15" font-weight="600">Seed: A7K9-42QF</text>
      <rect x="193" y="30" width="30" height="30" rx="7" fill="#273229" stroke="#708075"/>
      <path d="M203 39h10v12h-10z M207 35h10v12" fill="none" stroke="#e9e3d5" stroke-width="1.7"/>
      <circle cx="300" cy="45" r="11" fill="none" stroke="#dfe9da" stroke-width="2"/>
      <path d="M294 45l4 4 8-9" fill="none" stroke="#dfe9da" stroke-width="2"/>
      <text x="320" y="51" font-size="15">Saved</text>
      <rect x="592" y="27" width="100" height="36" rx="9" fill="#37423a" stroke="#7d8b81"/>
      <text x="617" y="51" font-size="14" font-weight="600">Save</text>
      <rect x="704" y="27" width="104" height="36" rx="9" fill="#37423a" stroke="#7d8b81"/>
      <text x="723" y="51" font-size="14" font-weight="600">Import / Load</text>
    </g>
    <rect x="600" y="326" width="212" height="58" rx="10" fill="#111512" fill-opacity="0.86" stroke="#4f5c53"/>
    <text x="618" y="351" fill="#f4f1e8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Inspected: North Ford</text>
    <text x="618" y="371" fill="#bfc8bd" font-family="system-ui, sans-serif" font-size="12">Map context remains visible</text>
    <text x="22" y="438" fill="#b9c1b7" font-family="system-ui, sans-serif" font-size="14">Desktop — normal saved state / compact utility ribbon</text>
  </g>

  <!-- Import ready dialog -->
  <g transform="translate(944 126)">
    <rect width="440" height="410" rx="18" fill="#243027" stroke="#59665b"/>
    <rect width="440" height="410" rx="18" fill="url(#grid)"/>
    <rect x="28" y="48" width="384" height="314" rx="14" fill="#151a16" stroke="#667369" filter="url(#shadow)"/>
    <text x="54" y="86" fill="#f5f0e6" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Import or load campaign</text>
    <rect x="54" y="108" width="332" height="64" rx="10" fill="#222a24" stroke="#77847a" stroke-dasharray="5 4"/>
    <text x="75" y="136" fill="#e8e2d7" font-family="system-ui, sans-serif" font-size="13" font-weight="600">chosen-campaign.advisor-save</text>
    <text x="75" y="156" fill="#aeb9ad" font-family="system-ui, sans-serif" font-size="12">Version 2 · Seed A7K9-42QF</text>
    <circle cx="68" cy="207" r="12" fill="none" stroke="#dce8d8" stroke-width="2"/>
    <path d="M62 207l4 4 8-9" fill="none" stroke="#dce8d8" stroke-width="2"/>
    <text x="91" y="205" fill="#eef3eb" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Ready to load</text>
    <text x="91" y="226" fill="#b9c2b7" font-family="system-ui, sans-serif" font-size="12">Metadata shown only after runtime validation.</text>
    <rect x="54" y="285" width="148" height="44" rx="9" fill="#303932" stroke="#7c887f"/>
    <text x="102" y="313" fill="#ebe5da" font-family="system-ui, sans-serif" font-size="14">Cancel</text>
    <rect x="214" y="285" width="172" height="44" rx="9" fill="#e2d0a7"/>
    <text x="251" y="313" fill="#1c211d" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Load campaign</text>
    <text x="8" y="438" fill="#b9c1b7" font-family="system-ui, sans-serif" font-size="14">Desktop/tablet — validated import state</text>
  </g>

  <!-- Error states -->
  <g transform="translate(56 606)">
    <rect width="850" height="236" rx="18" fill="#202520" stroke="#59665b"/>
    <text x="24" y="36" fill="#f4f1e8" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Validation states — geometry + heading + explanatory text</text>

    <g transform="translate(24 62)">
      <rect width="250" height="144" rx="12" fill="#171b18" stroke="#7c7f75"/>
      <path d="M26 27 L38 7 L50 27Z" fill="none" stroke="#e0d3ad" stroke-width="2.2"/>
      <text x="62" y="26" fill="#f2ede2" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Save version not supported</text>
      <text x="20" y="58" fill="#b8c0b5" font-family="system-ui, sans-serif" font-size="12">This campaign uses an incompatible</text>
      <text x="20" y="76" fill="#b8c0b5" font-family="system-ui, sans-serif" font-size="12">save version.</text>
      <rect x="20" y="96" width="152" height="32" rx="7" fill="#303832" stroke="#758078"/>
      <text x="38" y="117" fill="#ece6dc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Choose another file</text>
    </g>

    <g transform="translate(298 62)">
      <rect width="250" height="144" rx="12" fill="#171b18" stroke="#7c7f75"/>
      <path d="M26 8h20l7 7v20l-7 7H26l-7-7V15Z" fill="none" stroke="#d8c4bc" stroke-width="2.2"/>
      <path d="M27 18l18 14M45 18L27 32" stroke="#d8c4bc" stroke-width="2"/>
      <text x="62" y="26" fill="#f2ede2" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Invalid save file</text>
      <text x="20" y="58" fill="#b8c0b5" font-family="system-ui, sans-serif" font-size="12">The file could not be validated as a</text>
      <text x="20" y="76" fill="#b8c0b5" font-family="system-ui, sans-serif" font-size="12">supported campaign save.</text>
      <rect x="20" y="96" width="152" height="32" rx="7" fill="#303832" stroke="#758078"/>
      <text x="38" y="117" fill="#ece6dc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Choose another file</text>
    </g>

    <g transform="translate(572 62)">
      <rect width="250" height="144" rx="12" fill="#171b18" stroke="#7c7f75"/>
      <circle cx="35" cy="25" r="12" fill="none" stroke="#dce8d8" stroke-width="2"/>
      <path d="M29 25l4 4 8-9" fill="none" stroke="#dce8d8" stroke-width="2"/>
      <text x="62" y="26" fill="#f2ede2" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Save exported</text>
      <text x="20" y="58" fill="#b8c0b5" font-family="system-ui, sans-serif" font-size="12">Confirmation includes text, not color</text>
      <text x="20" y="76" fill="#b8c0b5" font-family="system-ui, sans-serif" font-size="12">or icon alone.</text>
      <text x="20" y="114" fill="#9fa99e" font-family="system-ui, sans-serif" font-size="11">Status announced to assistive tech.</text>
    </g>
  </g>

  <!-- Phone portrait -->
  <g transform="translate(944 606)">
    <rect width="204" height="408" rx="24" fill="#263229" stroke="#78847a" stroke-width="2"/>
    <rect x="8" y="8" width="188" height="392" rx="18" fill="url(#grid)"/>
    <rect x="18" y="20" width="168" height="48" rx="10" fill="#111512" fill-opacity="0.9" stroke="#59665b"/>
    <text x="29" y="41" fill="#f0eadf" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Seed A7K9…42QF</text>
    <text x="29" y="57" fill="#c8d0c6" font-family="system-ui, sans-serif" font-size="10">Unsaved changes</text>
    <path d="M60 217 C94 164 130 236 169 178" fill="none" stroke="#e6cb96" stroke-width="3"/>
    <g transform="translate(104 192)">
      <circle r="15" fill="none" stroke="#f4eddf" stroke-width="2"/>
      <path d="M0-9L9 0 0 9-9 0Z" fill="none" stroke="#f4eddf" stroke-width="1.7"/>
      <circle r="2.5" fill="#f4eddf"/>
    </g>
    <rect x="8" y="266" width="188" height="134" rx="18" fill="#151a16" stroke="#677369"/>
    <rect x="80" y="276" width="44" height="4" rx="2" fill="#78847a"/>
    <text x="22" y="309" fill="#f2ece2" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Campaign</text>
    <rect x="22" y="326" width="74" height="44" rx="9" fill="#303932" stroke="#7b887e"/>
    <text x="42" y="353" fill="#ece6da" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Export</text>
    <rect x="108" y="326" width="74" height="44" rx="9" fill="#303932" stroke="#7b887e"/>
    <text x="128" y="353" fill="#ece6da" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Import</text>
    <text x="6" y="438" fill="#b9c1b7" font-family="system-ui, sans-serif" font-size="14">Phone portrait — bottom sheet</text>
  </g>

  <!-- Phone landscape -->
  <g transform="translate(1178 606)">
    <rect width="206" height="408" rx="24" fill="#263229" stroke="#78847a" stroke-width="2"/>
    <rect x="8" y="8" width="190" height="392" rx="18" fill="url(#grid)"/>
    <rect x="18" y="22" width="170" height="42" rx="10" fill="#111512" fill-opacity="0.9" stroke="#59665b"/>
    <text x="29" y="48" fill="#f0eadf" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Seed A7K9…42QF · Saved</text>
    <rect x="76" y="250" width="112" height="130" rx="12" fill="#151a16" stroke="#677369"/>
    <text x="90" y="278" fill="#f2ece2" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Import save</text>
    <text x="90" y="299" fill="#bdc5bb" font-family="system-ui, sans-serif" font-size="9">Side sheet preserves</text>
    <text x="90" y="313" fill="#bdc5bb" font-family="system-ui, sans-serif" font-size="9">vertical map area.</text>
    <rect x="90" y="328" width="84" height="36" rx="8" fill="#e2d0a7"/>
    <text x="108" y="350" fill="#1c211d" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Choose file</text>
    <g transform="translate(62 176)">
      <circle r="14" fill="none" stroke="#f4eddf" stroke-width="2"/>
      <path d="M0-8L8 0 0 8-8 0Z" fill="none" stroke="#f4eddf" stroke-width="1.5"/>
      <circle r="2.5" fill="#f4eddf"/>
    </g>
    <text x="8" y="438" fill="#b9c1b7" font-family="system-ui, sans-serif" font-size="14">Phone landscape — side sheet</text>
  </g>

  <text x="56" y="1080" fill="#8f998f" font-family="system-ui, sans-serif" font-size="13">Vector-only prototype. No embedded raster data. Status cues use icon/shape + text; colors are illustrative, not semantic authority.</text>
</svg>
