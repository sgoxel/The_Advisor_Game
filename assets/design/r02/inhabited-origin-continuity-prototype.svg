<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">R02 inhabited origin and terrain continuity visual prototype</title>
  <desc id="desc">Presentation-only prototype showing a legible medieval-fantasy origin village, readable NPC markers, softened biome transitions, and map-first responsive composition.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1d2a33"/><stop offset="1" stop-color="#101820"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#526b46"/><stop offset=".52" stop-color="#68764b"/><stop offset="1" stop-color="#5d6a42"/></linearGradient>
    <pattern id="forest" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M22 5 9 28h26Z" fill="#34513a"/><rect x="20" y="27" width="4" height="9" fill="#503c29"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#sky)"/>
  <rect x="32" y="32" width="1376" height="836" rx="24" fill="#111820" stroke="#8290a0" stroke-opacity=".35"/>
  <text x="64" y="76" fill="#eef3f5" font-family="Arial" font-size="24" font-weight="700">R02 • Inhabited Origin / Region Continuity Prototype</text>
  <text x="64" y="105" fill="#bac6ce" font-family="Arial" font-size="14">Presentation only — Simulation state remains authoritative</text>

  <g transform="translate(64 132)">
    <rect width="1060" height="690" rx="18" fill="url(#ground)" stroke="#d7dfd4" stroke-opacity=".26"/>
    <path d="M0 108 C170 52 278 136 430 105 S725 64 1060 145 V0H0Z" fill="url(#forest)" opacity=".9"/>
    <path d="M0 590 C170 520 314 608 480 562 S816 493 1060 566 V690H0Z" fill="#496947" opacity=".78"/>
    <path d="M-10 414 C160 392 292 333 449 354 S731 440 1070 382" fill="none" stroke="#467c99" stroke-width="46" opacity=".8"/>
    <path d="M-10 414 C160 392 292 333 449 354 S731 440 1070 382" fill="none" stroke="#99c6d4" stroke-width="4" stroke-dasharray="3 13" opacity=".7"/>

    <path d="M122 597 C202 522 289 465 362 405 C425 354 489 305 561 230 C646 141 751 121 940 92" fill="none" stroke="#b99b6c" stroke-width="28" stroke-linecap="round"/>
    <path d="M122 597 C202 522 289 465 362 405 C425 354 489 305 561 230 C646 141 751 121 940 92" fill="none" stroke="#705b3f" stroke-width="3" stroke-dasharray="12 10" opacity=".85"/>
    <path d="M520 330 L668 422" stroke="#a88455" stroke-width="34"/><path d="M520 330 L668 422" stroke="#59432d" stroke-width="4" stroke-dasharray="10 8"/>

    <g filter="url(#shadow)" stroke="#392f26" stroke-width="2">
      <g transform="translate(390 278)"><rect width="88" height="64" rx="5" fill="#9d7a51"/><path d="M-8 8 44-30 96 8Z" fill="#6c4937"/><rect x="37" y="34" width="16" height="30" fill="#3d3028"/></g>
      <g transform="translate(500 235)"><rect width="110" height="74" rx="5" fill="#aa8556"/><path d="M-9 10 55-35 119 10Z" fill="#704a35"/><rect x="45" y="38" width="18" height="36" fill="#3d3028"/></g>
      <g transform="translate(620 284)"><rect width="82" height="60" rx="5" fill="#9b794e"/><path d="M-7 8 41-26 89 8Z" fill="#694634"/></g>
      <g transform="translate(470 365)"><rect width="96" height="67" rx="5" fill="#b08d5d"/><path d="M-8 9 48-31 104 9Z" fill="#744e37"/></g>
      <g transform="translate(590 388)"><rect width="105" height="70" rx="5" fill="#a98355"/><path d="M-9 9 52-34 114 9Z" fill="#6d4934"/></g>
    </g>

    <ellipse cx="544" cy="351" rx="158" ry="118" fill="none" stroke="#f3d078" stroke-width="4" stroke-dasharray="12 9" opacity=".92"/>
    <rect x="420" y="170" width="250" height="44" rx="22" fill="#151b21" fill-opacity=".86" stroke="#f3d078" stroke-opacity=".6"/>
    <text x="545" y="198" text-anchor="middle" fill="#f7e4a8" font-family="Arial" font-size="16" font-weight="700">ORIGIN VILLAGE • (0,0)</text>

    <g font-family="Arial" font-size="12" text-anchor="middle">
      <g transform="translate(455 382)"><circle r="13" fill="#e5e8eb" stroke="#26333e" stroke-width="4"/><path d="M-4 -3h8M0-7v8" stroke="#26333e" stroke-width="2"/><rect x="-29" y="20" width="58" height="22" rx="11" fill="#17212a"/><text y="35" fill="#f2f5f6">Miller</text></g>
      <g transform="translate(548 470)"><circle r="13" fill="#f0c873" stroke="#26333e" stroke-width="4"/><path d="M-6 0h12" stroke="#26333e" stroke-width="2"/><rect x="-34" y="20" width="68" height="22" rx="11" fill="#17212a"/><text y="35" fill="#f2f5f6">Merchant</text></g>
      <g transform="translate(650 350)"><circle r="13" fill="#9bc6d5" stroke="#26333e" stroke-width="4"/><path d="M0-7v14M-5 2h10" stroke="#26333e" stroke-width="2"/><rect x="-27" y="20" width="54" height="22" rx="11" fill="#17212a"/><text y="35" fill="#f2f5f6">Guard</text></g>
      <g transform="translate(615 512)"><circle r="13" fill="#d4b2dc" stroke="#26333e" stroke-width="4"/><path d="M-5-5 5 5M5-5-5 5" stroke="#26333e" stroke-width="2"/><rect x="-29" y="20" width="58" height="22" rx="11" fill="#17212a"/><text y="35" fill="#f2f5f6">Farmer</text></g>
    </g>

    <g transform="translate(24 24)" font-family="Arial">
      <rect width="190" height="102" rx="12" fill="#101820" fill-opacity=".88" stroke="#dbe5e9" stroke-opacity=".3"/>
      <text x="16" y="26" fill="#eef3f5" font-size="13" font-weight="700">NON-COLOR CUES</text>
      <circle cx="24" cy="49" r="7" fill="#e5e8eb" stroke="#26333e" stroke-width="3"/><text x="42" y="54" fill="#d5dee2" font-size="12">NPC ring + role label</text>
      <path d="M17 75h18" stroke="#b99b6c" stroke-width="7"/><text x="42" y="80" fill="#d5dee2" font-size="12">Road texture/dash</text>
    </g>
  </g>

  <g transform="translate(1150 132)" font-family="Arial">
    <rect width="226" height="690" rx="18" fill="#18212b" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="18" y="34" fill="#edf2f4" font-size="15" font-weight="700">Visual priorities</text>
    <text x="18" y="68" fill="#c6d0d5" font-size="13">1. Map remains primary</text>
    <text x="18" y="96" fill="#c6d0d5" font-size="13">2. Village reads inhabited</text>
    <text x="18" y="124" fill="#c6d0d5" font-size="13">3. Soft region continuity</text>
    <text x="18" y="152" fill="#c6d0d5" font-size="13">4. NPC roles stay legible</text>
    <text x="18" y="180" fill="#c6d0d5" font-size="13">5. Color is not sole cue</text>
    <line x1="18" y1="208" x2="208" y2="208" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="18" y="238" fill="#edf2f4" font-size="14" font-weight="700">Responsive rule</text>
    <text x="18" y="268" fill="#b8c4ca" font-size="12">Desktop: full labels</text>
    <text x="18" y="292" fill="#b8c4ca" font-size="12">Tablet: priority labels</text>
    <text x="18" y="316" fill="#b8c4ca" font-size="12">Phone: icons + selected</text>
    <text x="18" y="340" fill="#b8c4ca" font-size="12">entity label only</text>
    <line x1="18" y1="368" x2="208" y2="368" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="18" y="398" fill="#edf2f4" font-size="14" font-weight="700">Performance</text>
    <text x="18" y="428" fill="#b8c4ca" font-size="12">No animated fog/shadows</text>
    <text x="18" y="452" fill="#b8c4ca" font-size="12">Reuse marker geometry</text>
    <text x="18" y="476" fill="#b8c4ca" font-size="12">Cull labels by zoom</text>
  </g>
</svg>