<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" role="img" aria-labelledby="title desc">
  <title id="title">Phase 1 campaign action icons</title>
  <desc id="desc">Vector icons for export, import, reset, success and error states.</desc>
  <defs>
    <style>.line{fill:none;stroke:#d5b782;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.seal{fill:#2a241b;stroke:#d5b782;stroke-width:1.5}.ok{stroke:#8fc79b}.bad{stroke:#e38b83}</style>
  </defs>
