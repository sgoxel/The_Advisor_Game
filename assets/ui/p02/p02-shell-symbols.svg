<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" role="img" aria-labelledby="title desc">
  <title id="title">Phase 2 shell interface symbols</title>
  <desc id="desc">Reusable vector symbols for menu, settings, log, language, mobile panel navigation, loading and information states.</desc>
  <defs>
    <style>
      .frame{fill:#2a241b;stroke:#d5b782;stroke-width:1.5}
      .line{fill:none;stroke:#d5b782;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .muted{stroke:#b8b2a7}
      .info{stroke:#8eb4cf}
    </style>
  </defs>

  <g id="menu" transform="translate(0 0)">
    <rect class="frame" x="7" y="7" width="34" height="34" rx="9"/>
    <path class="line" d="M15 17h18M15 24h18M15 31h18"/>
  </g>

  <g id="settings" transform="translate(48 0)">
    <rect class="frame" x="7" y="7" width="34" height="34" rx="9"/>
    <circle class="line" cx="24" cy="24" r="6"/>
    <path class="line" d="M24 13v4M24 31v4M13 24h4M31 24h4M16.2 16.2l2.8 2.8M29 29l2.8 2.8M31.8 16.2 29 19M19 29l-2.8 2.8"/>
  </g>

  <g id="log" transform="translate(96 0)">
    <path class="frame" d="M10 8h28v32H10z"/>
    <path class="line" d="M16 16h16M16 23h16M16 30h10"/>
    <circle cx="31" cy="30" r="2" fill="#d5b782"/>
  </g>

  <g id="language" transform="translate(144 0)">
    <circle class="frame" cx="24" cy="24" r="17"/>
    <path class="line" d="M8 24h32M24 7c5 5 8 10.5 8 17s-3 12-8 17M24 7c-5 5-8 10.5-8 17s3 12 8 17M12 15h24M12 33h24"/>
  </g>

  <g id="panel-open" transform="translate(192 0)">
    <rect class="frame" x="7" y="7" width="34" height="34" rx="17"/>
    <path class="line" d="m16 28 8-8 8 8"/>
  </g>

  <g id="panel-close" transform="translate(240 0)">
    <rect class="frame" x="7" y="7" width="34" height="34" rx="17"/>
    <path class="line" d="m16 20 8 8 8-8"/>
  </g>

  <g id="loading" transform="translate(288 0)">
    <circle class="frame" cx="24" cy="24" r="17"/>
    <path class="line muted" d="M24 12a12 12 0 0 1 10.4 6"/>
    <path class="line" d="M34.4 18 34 12m.4 6-5.7-.8"/>
    <path class="line muted" d="M24 36a12 12 0 0 1-10.4-6"/>
  </g>

  <g id="info" transform="translate(336 0)">
    <circle class="frame info" cx="24" cy="24" r="17"/>
    <path class="line info" d="M24 22v10"/>
    <circle cx="24" cy="16" r="2" fill="#8eb4cf"/>
  </g>
</svg>
