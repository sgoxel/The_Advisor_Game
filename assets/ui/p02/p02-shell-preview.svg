<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Phase 2 shell visual treatment preview</title>
  <desc id="desc">Desktop and mobile vector preview for the Phase 2 public shell using a medieval dark bronze visual hierarchy without fake authoritative values.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1813"/>
      <stop offset="1" stop-color="#12100d"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332a20"/>
      <stop offset="1" stop-color="#211b15"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a4229"/>
      <stop offset="1" stop-color="#2a221a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <style>
      .panel{fill:#201c17;stroke:#5d513e;stroke-width:1.5}
      .panel2{fill:#191612;stroke:#4e4435;stroke-width:1.2}
      .gold{fill:#d5b782}
      .text{fill:#f7f4ec;font-family:Inter,Arial,sans-serif}
      .muted{fill:#b8b2a7;font-family:Inter,Arial,sans-serif}
      .label{fill:#d5b782;font:700 12px Inter,Arial,sans-serif;letter-spacing:1.4px}
      .title{fill:#f7f4ec;font:700 22px Inter,Arial,sans-serif}
      .body{fill:#e8e2d7;font:14px Inter,Arial,sans-serif}
      .small{fill:#b8b2a7;font:12px Inter,Arial,sans-serif}
      .button{fill:#d5b782;stroke:#f1d89e;stroke-width:1}
      .button2{fill:#2b261f;stroke:#7a684c;stroke-width:1}
      .focus{fill:none;stroke:#f1d89e;stroke-width:3}
    </style>
  </defs>

  <rect width="1280" height="860" fill="#0e0c0a"/>
  <text x="52" y="42" class="label">P02 DESIGN PREVIEW · NON-AUTHORITATIVE PRESENTATION REFERENCE</text>

  <!-- Desktop shell -->
  <g transform="translate(52 68)" filter="url(#shadow)">
    <rect width="900" height="700" rx="24" fill="url(#bg)" stroke="#6f5e43" stroke-width="2"/>
    <rect width="900" height="66" rx="24" fill="url(#ribbon)"/>
    <path d="M0 66h900" stroke="#6f5e43" stroke-width="1.5"/>

    <rect x="18" y="14" width="112" height="38" rx="10" class="button2"/>
    <text x="42" y="38" class="text" font-size="14" font-weight="700">☰ Menu</text>
    <text x="154" y="28" class="label">THE ADVISOR GAME</text>
    <text x="154" y="47" class="text" font-size="15" font-weight="700">Seeded Checks</text>

    <rect x="650" y="14" width="102" height="38" rx="10" class="button2"/>
    <text x="670" y="38" class="text" font-size="13" font-weight="700">Language</text>
    <rect x="766" y="14" width="116" height="38" rx="19" fill="#2b261f" stroke="#7a684c"/>
    <circle cx="786" cy="33" r="5" fill="#8eb4cf"/>
    <text x="800" y="38" class="text" font-size="13" font-weight="700">Preview</text>

    <rect x="22" y="92" width="392" height="188" rx="18" fill="url(#hero)" stroke="#8a7049"/>
    <text x="44" y="122" class="label">CORE RULE</text>
    <text x="44" y="154" class="title">Advise. The character decides.</text>
    <text x="44" y="184" class="body">Player advises → AI Character decides →</text>
    <text x="44" y="207" class="body">Simulation validates → World reacts.</text>
    <rect x="44" y="230" width="244" height="30" rx="15" fill="#1c1915" stroke="#78684f"/>
    <text x="58" y="250" class="small">Validated state only · no direct control</text>

    <rect x="432" y="92" width="446" height="188" rx="18" class="panel"/>
    <text x="454" y="122" class="label">CAMPAIGN STATE</text>
    <text x="454" y="151" class="title">Current campaign</text>
    <text x="454" y="178" class="small">Values appear only from current simulation state.</text>
    <g transform="translate(454 198)">
      <rect width="126" height="58" rx="10" class="panel2"/><text x="12" y="20" class="small">Campaign</text><text x="12" y="43" class="text" font-size="16">—</text>
      <rect x="138" width="126" height="58" rx="10" class="panel2"/><text x="150" y="20" class="small">Seed</text><text x="150" y="43" class="text" font-size="16">—</text>
      <rect x="276" width="126" height="58" rx="10" class="panel2"/><text x="288" y="20" class="small">Turn</text><text x="288" y="43" class="text" font-size="16">—</text>
    </g>

    <rect x="22" y="300" width="856" height="178" rx="18" class="panel"/>
    <text x="44" y="330" class="label">SEEDED CHECK</text>
    <text x="44" y="359" class="title">Reproducible simulation check</text>
    <text x="44" y="386" class="small">Outcome appears after simulation validation. UI cannot select the result.</text>
    <rect x="44" y="410" width="222" height="46" rx="11" class="panel2"/>
    <text x="58" y="429" class="small">Check context</text><text x="58" y="448" class="text" font-size="14">Validated input</text>
    <rect x="280" y="410" width="222" height="46" rx="11" class="panel2"/>
    <text x="294" y="429" class="small">Result</text><text x="294" y="448" class="text" font-size="14">—</text>
    <rect x="680" y="408" width="176" height="50" rx="12" class="button"/>
    <text x="717" y="439" fill="#16120d" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">Run check</text>

    <rect x="22" y="498" width="856" height="158" rx="18" class="panel"/>
    <text x="44" y="528" class="label">SAVE / IMPORT</text>
    <text x="44" y="557" class="title">Versioned campaign JSON</text>
    <rect x="44" y="578" width="498" height="54" rx="10" class="panel2"/>
    <text x="60" y="610" class="small">Campaign JSON field / import validation feedback</text>
    <rect x="558" y="578" width="92" height="44" rx="10" class="button"/>
    <text x="580" y="606" fill="#16120d" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800">Export</text>
    <rect x="662" y="578" width="92" height="44" rx="10" class="button2"/>
    <text x="684" y="606" class="text" font-size="13" font-weight="700">Import</text>
    <rect x="766" y="578" width="90" height="44" rx="10" class="button2"/>
    <text x="790" y="606" class="text" font-size="13" font-weight="700">Reset</text>

    <rect x="22" y="672" width="856" height="10" rx="5" fill="#2d271f"/>
  </g>

  <!-- Mobile shell preview -->
  <g transform="translate(992 104)" filter="url(#shadow)">
    <rect width="236" height="548" rx="30" fill="url(#bg)" stroke="#6f5e43" stroke-width="2"/>
    <rect width="236" height="58" rx="30" fill="url(#ribbon)"/>
    <rect x="13" y="13" width="40" height="34" rx="9" class="button2"/>
    <text x="25" y="36" class="text" font-size="15">☰</text>
    <text x="66" y="25" class="label" font-size="9">ADVISOR GAME</text>
    <text x="66" y="42" class="text" font-size="12" font-weight="700">Seeded Checks</text>

    <rect x="12" y="76" width="212" height="110" rx="16" fill="url(#hero)" stroke="#8a7049"/>
    <text x="26" y="100" class="label" font-size="9">CORE RULE</text>
    <text x="26" y="125" class="text" font-size="15" font-weight="700">Advise. Character decides.</text>
    <text x="26" y="149" class="small" font-size="10">Simulation validates outcomes.</text>
    <text x="26" y="166" class="small" font-size="10">No direct-control UI.</text>

    <rect x="12" y="198" width="212" height="150" rx="16" class="panel"/>
    <text x="26" y="222" class="label" font-size="9">SEEDED CHECK</text>
    <text x="26" y="247" class="text" font-size="14" font-weight="700">Reproducible check</text>
    <rect x="26" y="265" width="184" height="34" rx="9" class="panel2"/>
    <text x="38" y="287" class="small" font-size="10">Result: —</text>
    <rect x="26" y="307" width="184" height="30" rx="9" class="button"/>
    <text x="90" y="327" fill="#16120d" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800">Run check</text>

    <rect x="12" y="360" width="212" height="114" rx="16" class="panel"/>
    <text x="26" y="384" class="label" font-size="9">STATUS</text>
    <circle cx="32" cy="410" r="5" fill="#8eb4cf"/>
    <text x="44" y="414" class="text" font-size="11" font-weight="700">UI status · text + icon</text>
    <text x="26" y="442" class="small" font-size="10">Critical state is never color-only.</text>

    <rect x="12" y="492" width="212" height="44" rx="14" fill="#211c16" stroke="#5d513e"/>
    <text x="29" y="519" class="text" font-size="10" font-weight="700">Campaign</text>
    <text x="96" y="519" class="gold" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800">Check</text>
    <text x="166" y="519" class="text" font-size="10" font-weight="700">Save</text>
  </g>

  <text x="992" y="690" class="label">MOBILE PATTERN</text>
  <text x="992" y="714" class="small">Text + icon tabs · 44px targets ·</text>
  <text x="992" y="732" class="small">no hover-only information.</text>
  <text x="52" y="815" class="small">Reference textures intentionally omitted from P02 runtime treatment; shell uses lightweight CSS surfaces + vector symbols.</text>
</svg>
