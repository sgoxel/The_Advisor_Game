<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">R04 Advisor chat and interpretation feedback prototype</title>
  <desc id="desc">Original interface prototype showing an old-school RPG Dialogue panel with non-binding Advisor input, chronological Advisor and protagonist messages, a reinterpreted influence state, and a phone layout that preserves the living map above the dialogue panel.</desc>
  <defs>
    <style>
      .bg{fill:#151711}.frame{fill:#25271f;stroke:#81775c;stroke-width:3}.inner{fill:#1b1d18;stroke:#514d3d;stroke-width:2}.map{fill:#596b47;stroke:#313b29;stroke-width:2}.road{fill:none;stroke:#aa855d;stroke-width:24;stroke-linecap:round;stroke-linejoin:round}.building{fill:#75624c;stroke:#3e342a;stroke-width:2}.roof{fill:#6c4439;stroke:#3c2621;stroke-width:2}.header{fill:#d9c79c;font:700 25px Georgia,serif}.titleText{fill:#eee4ca;font:700 31px Georgia,serif}.label{fill:#d7c59a;font:700 17px system-ui,sans-serif}.body{fill:#eee9d8;font:16px system-ui,sans-serif}.meta{fill:#bcb49d;font:14px system-ui,sans-serif}.hint{fill:#bdb79f;font:14px system-ui,sans-serif}.advisor{fill:#2d2b24;stroke:#756c55;stroke-width:1.5}.character{fill:#242b2c;stroke:#5f7477;stroke-width:1.5}.status{fill:#312d23;stroke:#9a8451;stroke-width:2}.input{fill:#11130f;stroke:#887b5e;stroke-width:2}.button{fill:#5f5239;stroke:#b69a62;stroke-width:2}.focus{fill:none;stroke:#f0d58f;stroke-width:3}.rule{stroke:#5d5746;stroke-width:1}.call{fill:none;stroke:#c4b382;stroke-width:2;stroke-dasharray:7 5}.phone{fill:#0f100d;stroke:#8c8063;stroke-width:4}.tab{fill:#24261f;stroke:#5d5846;stroke-width:1.5}.active{fill:#443c2d;stroke:#b89c65;stroke-width:2}.small{fill:#d7cfb8;font:13px system-ui,sans-serif}.note{fill:#e1c985;font:700 14px system-ui,sans-serif}
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <text class="titleText" x="54" y="55">Advisor Chat / Interpretation Feedback — R04 · #182</text>
  <text class="body" x="54" y="86">Conversation is influence, not direct control. The character decides; Simulation remains authoritative.</text>

  <!-- Desktop application frame -->
  <g transform="translate(50 120)">
    <rect class="frame" width="1000" height="770" rx="8"/>
    <rect x="18" y="18" width="964" height="438" class="map"/>
    <path class="road" d="M125 370C260 280 360 315 474 238S720 215 865 120"/>
    <g transform="translate(260 192)"><rect class="building" width="120" height="78"/><path class="roof" d="M-8 6L60-36L128 6Z"/></g>
    <g transform="translate(662 255)"><rect class="building" width="146" height="92"/><path class="roof" d="M-8 6L73-42L154 6Z"/></g>
    <circle cx="488" cy="285" r="12" fill="#d8c7a0" stroke="#263027" stroke-width="3"/>
    <text class="meta" x="36" y="52">Living map remains primary</text>

    <rect x="18" y="474" width="964" height="278" class="inner"/>
    <text class="header" x="38" y="510">Dialogue</text>
    <line class="rule" x1="38" y1="523" x2="962" y2="523"/>

    <!-- Transcript -->
    <g transform="translate(38 540)">
      <rect class="advisor" width="568" height="56" rx="5"/>
      <text class="label" x="16" y="22">Advisor</text>
      <text class="body" x="16" y="45">Be careful near the eastern road. Perhaps wait until it is safer.</text>

      <rect class="character" y="67" width="568" height="72" rx="5"/>
      <text class="label" x="16" y="90">Protagonist</text>
      <text class="body" x="16" y="115">I understand the warning. I will decide for myself when to act.</text>
      <text class="meta" x="16" y="134">Interpretation: warning about possible risk</text>

      <rect class="status" x="584" y="67" width="344" height="72" rx="5"/>
      <text class="label" x="600" y="94">↪ Reinterpreted</text>
      <text class="body" x="600" y="119">treated as advice</text>
      <text class="meta" x="600" y="137">not an action confirmation</text>
    </g>

    <!-- Composer -->
    <g transform="translate(38 690)">
      <text class="label" x="0" y="0">Advise the character</text>
      <text class="hint" x="0" y="22">Advice is non-binding. The character decides what to do.</text>
      <rect class="input" x="0" y="34" width="720" height="48" rx="4"/>
      <text class="meta" x="14" y="64">Ask a question, share a warning, or suggest what the character might consider…</text>
      <rect class="button" x="738" y="34" width="190" height="48" rx="4"/>
      <text class="label" x="779" y="65">Send advice</text>
    </g>
  </g>

  <!-- Desktop annotations -->
  <path class="call" d="M1080 250H1270V310"/>
  <text class="note" x="1110" y="238">Map is never replaced by a command modal</text>
  <text class="small" x="1100" y="332">The existing Dialogue surface expands inside the bottom ribbon.</text>

  <path class="call" d="M1025 627H1215V578"/>
  <text class="note" x="1082" y="563">Source separation</text>
  <text class="small" x="1082" y="589">Advisor message ≠ protagonist interpretation</text>
  <text class="small" x="1082" y="610">Influence state ≠ Simulation result</text>

  <path class="call" d="M1025 796H1220V755"/>
  <text class="note" x="1082" y="739">No-command composer language</text>
  <text class="small" x="1082" y="767">“Send advice” rather than Execute / Move / Order.</text>

  <!-- Phone prototype -->
  <g transform="translate(1220 120)">
    <rect class="phone" width="320" height="650" rx="25"/>
    <rect x="14" y="18" width="292" height="310" class="map" rx="8"/>
    <path d="M40 274C96 233 131 241 169 202S246 173 288 125" fill="none" stroke="#a7835b" stroke-width="14" stroke-linecap="round"/>
    <rect x="56" y="153" width="66" height="45" class="building"/><path class="roof" d="M50 157L89 130L128 157Z"/>
    <circle cx="183" cy="222" r="8" fill="#d8c7a0"/>
    <text class="small" x="26" y="45">Living map stays visible</text>

    <g transform="translate(14 338)">
      <rect class="tab" width="92" height="38" rx="4"/><text class="small" x="18" y="24">Character</text>
      <rect class="active" x="100" width="92" height="38" rx="4"/><text class="small" x="121" y="24">Dialogue</text>
      <rect class="tab" x="200" width="92" height="38" rx="4"/><text class="small" x="219" y="24">Mini Map</text>
    </g>

    <rect class="inner" x="14" y="386" width="292" height="246" rx="7"/>
    <text class="label" x="28" y="412">Dialogue</text>
    <rect class="advisor" x="26" y="425" width="268" height="42" rx="4"/>
    <text class="small" x="37" y="443">Advisor · Consider asking about work.</text>
    <text class="small" x="37" y="459"> </text>
    <rect class="character" x="26" y="474" width="268" height="52" rx="4"/>
    <text class="small" x="37" y="493">Protagonist · I will consider it.</text>
    <text class="note" x="37" y="514">✓ Accepted · considered now</text>
    <text class="small" x="28" y="546">Advise the character</text>
    <rect class="input" x="26" y="555" width="268" height="32" rx="4"/>
    <rect class="button" x="26" y="593" width="268" height="30" rx="4"/>
    <text class="small" x="118" y="613">Send advice</text>
  </g>

  <path class="call" d="M1378 792V875H1162"/>
  <text class="note" x="868" y="863">Phone: active Dialogue panel stays below a visible map region</text>
  <text class="small" x="868" y="887">Composer stacks vertically, uses full-width touch target, and avoids horizontal overflow.</text>

  <!-- State legend -->
  <g transform="translate(52 923)">
    <rect class="inner" width="1490" height="52" rx="7"/>
    <text class="label" x="18" y="32">Influence states:</text>
    <text class="body" x="170" y="32">✓ Accepted · considered now</text>
    <text class="body" x="430" y="32">× Rejected · not being followed</text>
    <text class="body" x="735" y="32">◷ Delayed · reconsider later</text>
    <text class="body" x="1010" y="32">↪ Reinterpreted · treated as advice</text>
  </g>
</svg>
