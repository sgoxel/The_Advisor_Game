<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">R04 transparent world-object composition prototype</title>
  <desc id="desc">Original project diagram showing transparent terrain composition, authoritative footprints, visual overhang, baseline depth sorting, and static versus entity object presentation.</desc>
  <defs>
    <pattern id="grid" width="64" height="32" patternUnits="userSpaceOnUse" patternTransform="skewX(-26.565)">
      <rect width="64" height="32" fill="#6f7651"/>
      <path d="M64 0H0V32" fill="none" stroke="#8d9368" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#d7c49b"/>
    </marker>
    <style>
      .bg{fill:#171914}.panel{fill:#23271f;stroke:#626950;stroke-width:2}.head{fill:#e8dfc4;font:700 28px system-ui,sans-serif}.sub{fill:#cfc5a8;font:600 18px system-ui,sans-serif}.txt{fill:#ddd5bd;font:16px system-ui,sans-serif}.small{fill:#bdb79f;font:14px system-ui,sans-serif}.note{fill:#e7c77b;font:600 15px system-ui,sans-serif}.auth{fill:none;stroke:#f1c75b;stroke-width:3;stroke-dasharray:9 7}.visual{fill:none;stroke:#8ec9d4;stroke-width:2;stroke-dasharray:5 5}.base{stroke:#ff856d;stroke-width:4}.call{stroke:#d7c49b;stroke-width:2;fill:none;marker-end:url(#arrow)}.white{fill:#f4ead0}.wood{fill:#70503a;stroke:#3f2b21;stroke-width:2}.stone{fill:#a59c88;stroke:#5e584d;stroke-width:2}.cloth{fill:#a84f44;stroke:#5d2925;stroke-width:2}.wheel{fill:#3f2e25;stroke:#1e1713;stroke-width:3}.person{fill:#586f86;stroke:#243441;stroke-width:2}.terrainDirt{fill:#806246}.legend{fill:#191c17;stroke:#535a46;stroke-width:1.5}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text class="head" x="52" y="58">Transparent World-Object Composition — R04 / #292</text>
  <text class="txt" x="52" y="88">Pixels describe appearance. Simulation descriptors own identity, position, footprint, blocking, interaction and motion.</text>

  <!-- Panel A -->
  <g transform="translate(50 125)">
    <rect class="panel" width="710" height="365" rx="14"/>
    <text class="sub" x="24" y="38">A · Terrain-neutral small prop — stone well</text>
    <rect x="34" y="68" width="380" height="245" fill="url(#grid)"/>
    <path class="terrainDirt" d="M34 210L170 136L348 225L214 300Z" opacity=".65"/>
    <ellipse class="stone" cx="225" cy="214" rx="55" ry="27"/>
    <ellipse fill="#373c39" stroke="#5e584d" stroke-width="6" cx="225" cy="206" rx="42" ry="18"/>
    <path class="wood" d="M183 204V143H192V204ZM258 204V143H267V204ZM186 145Q225 112 264 145V154Q225 124 186 154Z"/>
    <line class="base" x1="174" y1="242" x2="276" y2="242"/>
    <rect class="auth" x="180" y="178" width="90" height="72"/>
    <rect class="visual" x="161" y="108" width="128" height="142"/>
    <path class="call" d="M300 124H452V92"/>
    <text class="note" x="438" y="82">transparent visual bounds</text>
    <text class="small" x="438" y="104">same asset reveals grass/dirt below</text>
    <path class="call" d="M278 218H470V186"/>
    <text class="note" x="438" y="176">authoritative footprint</text>
    <text class="small" x="438" y="198">comes from Simulation, never alpha</text>
    <path class="call" d="M276 242H486V273"/>
    <text class="note" x="438" y="292">ground baseline</text>
    <text class="small" x="438" y="314">anchor/depth reference</text>
  </g>

  <!-- Panel B -->
  <g transform="translate(790 125)">
    <rect class="panel" width="760" height="365" rx="14"/>
    <text class="sub" x="24" y="38">B · Tall overhang — flagpole + character depth</text>
    <rect x="34" y="68" width="430" height="245" fill="url(#grid)"/>
    <line class="wood" x1="246" y1="111" x2="246" y2="272" stroke-width="11"/>
    <path class="cloth" d="M251 116Q310 128 347 105V164Q306 185 251 166Z"/>
    <ellipse fill="#454b39" cx="246" cy="270" rx="25" ry="10" opacity=".6"/>
    <rect class="auth" x="218" y="237" width="56" height="45"/>
    <rect class="visual" x="218" y="95" width="146" height="187"/>
    <g transform="translate(171 205)">
      <circle class="person" cx="20" cy="17" r="13"/><path class="person" d="M6 34Q20 25 34 34L40 81H0Z"/>
      <line class="base" x1="0" y1="82" x2="40" y2="82"/>
    </g>
    <g transform="translate(294 233)">
      <circle class="person" cx="20" cy="17" r="13"/><path class="person" d="M6 34Q20 25 34 34L40 81H0Z"/>
      <line class="base" x1="0" y1="82" x2="40" y2="82"/>
    </g>
    <path class="call" d="M364 108H510V92"/>
    <text class="note" x="497" y="82">upper pixels may overhang</text>
    <text class="small" x="497" y="104">overhang adds no occupied cells</text>
    <path class="call" d="M219 286H530V194"/>
    <text class="note" x="497" y="184">depth by ground baseline</text>
    <text class="small" x="497" y="206">behind baseline → may be occluded</text>
    <text class="small" x="497" y="226">front baseline → draws in front</text>
    <text class="note" x="497" y="275">not DOM insertion order</text>
  </g>

  <!-- Panel C -->
  <g transform="translate(50 520)">
    <rect class="panel" width="710" height="385" rx="14"/>
    <text class="sub" x="24" y="38">C · Multi-tile prop — parked wagon</text>
    <rect x="34" y="68" width="400" height="265" fill="url(#grid)"/>
    <rect class="auth" x="125" y="202" width="194" height="91"/>
    <g transform="translate(90 120)">
      <rect class="wood" x="68" y="52" width="150" height="78" rx="8"/>
      <path class="wood" d="M218 93L290 112L287 121L214 106Z"/>
      <path fill="#b7a676" stroke="#554733" stroke-width="3" d="M78 52Q143 9 208 52L202 73H85Z"/>
      <circle class="wheel" cx="100" cy="139" r="29"/><circle fill="#867057" cx="100" cy="139" r="7"/>
      <circle class="wheel" cx="197" cy="139" r="29"/><circle fill="#867057" cx="197" cy="139" r="7"/>
      <line class="base" x1="58" y1="168" x2="229" y2="168"/>
      <rect class="visual" x="45" y="7" width="255" height="162"/>
    </g>
    <path class="call" d="M325 218H480V130"/>
    <text class="note" x="470" y="120">visible wagon overhang</text>
    <text class="small" x="470" y="142">shaft/wheels/canopy may exceed cells</text>
    <path class="call" d="M318 287H506V217"/>
    <text class="note" x="470" y="207">logical footprint ≠ PNG bounds</text>
    <text class="small" x="470" y="229">collision follows descriptor footprint</text>
    <text class="small" x="470" y="249">missing art leaves gameplay intact</text>
    <text class="note" x="470" y="298">stable anchor / orientation</text>
    <text class="small" x="470" y="320">source cell size never sets occupancy</text>
  </g>

  <!-- Panel D -->
  <g transform="translate(790 520)">
    <rect class="panel" width="760" height="385" rx="14"/>
    <text class="sub" x="24" y="38">D · Same family, different authority class</text>
    <rect class="legend" x="32" y="68" width="696" height="105" rx="9"/>
    <text class="note" x="54" y="98">Parked wagon descriptor</text>
    <text class="txt" x="54" y="124">static/multi-tile presentation · authoritative footprint + state from Simulation</text>
    <text class="note" x="54" y="153">Moving wagon descriptor</text>
    <text class="txt" x="292" y="153">world-space entity · stable entity id + current authoritative position</text>

    <g transform="translate(57 205)">
      <rect class="wood" x="42" y="24" width="115" height="53" rx="6"/><circle class="wheel" cx="68" cy="88" r="20"/><circle class="wheel" cx="139" cy="88" r="20"/><line class="base" x1="38" y1="111" x2="164" y2="111"/>
      <text class="small" x="0" y="143">semantic family: wagon</text>
    </g>
    <path class="call" d="M245 272H412"/>
    <g transform="translate(442 205)">
      <rect class="wood" x="42" y="24" width="115" height="53" rx="6"/><circle class="wheel" cx="68" cy="88" r="20"/><circle class="wheel" cx="139" cy="88" r="20"/><line class="base" x1="38" y1="111" x2="164" y2="111"/>
      <path d="M170 62H220" stroke="#8ec9d4" stroke-width="5" marker-end="url(#arrow)"/>
      <text class="small" x="0" y="143">same recognizable visual family</text>
    </g>
    <text class="note" x="318" y="327">classification follows Simulation descriptor, not filename</text>
    <text class="small" x="318" y="352">moving entity is never stamped permanently into terrain</text>
  </g>

  <g transform="translate(52 935)">
    <rect class="legend" width="1496" height="42" rx="8"/>
    <line class="auth" x1="22" y1="21" x2="72" y2="21"/><text class="small" x="84" y="26">authoritative footprint</text>
    <line class="visual" x1="270" y1="21" x2="320" y2="21"/><text class="small" x="332" y="26">visual bounds / transparent PNG</text>
    <line class="base" x1="590" y1="21" x2="640" y2="21"/><text class="small" x="652" y="26">ground baseline / depth anchor</text>
    <text class="note" x="984" y="26">Layer order: terrain → object bases → depth-sorted props/entities/characters → UI</text>
  </g>
</svg>
